<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gradient Mesh</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mesh{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);width:100vw;height:100vh;position:absolute;top:0;left:0}
.cell{animation:pulse 4s ease-in-out infinite alternate;opacity:.6}
@keyframes pulse{0%{opacity:.3;transform:scale(1)}100%{opacity:.9;transform:scale(1.05)}}
.overlay{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Georgia,serif;font-size:clamp(3rem,10vw,9rem);color:#fff;text-shadow:0 0 100px rgba(0,0,0,.5);pointer-events:none;mix-blend-mode:overlay;z-index:10}
</style></head>
<body><div class="mesh"><div class="cell" style="background:#ff6b6b"></div><div class="cell" style="background:#feca57"></div><div class="cell" style="background:#48dbfb"></div><div class="cell" style="background:#ff9ff3"></div><div class="cell" style="background:#54a0ff"></div><div class="cell" style="background:#5f27cd"></div><div class="cell" style="background:#01a3a4"></div><div class="cell" style="background:#f368e0"></div><div class="cell" style="background:#ff6348"></div><div class="cell" style="background:#7bed9f"></div><div class="cell" style="background:#e056a0"></div><div class="cell" style="background:#5352ed"></div><div class="cell" style="background:#ff4757"></div><div class="cell" style="background:#2ed573"></div><div class="cell" style="background:#1e90ff"></div><div class="cell" style="background:#ffa502"></div><div class="cell" style="background:#a55eea"></div><div class="cell" style="background:#26de81"></div><div class="cell" style="background:#fd79a8"></div><div class="cell" style="background:#00b894"></div><div class="cell" style="background:#6c5ce7"></div><div class="cell" style="background:#e17055"></div><div class="cell" style="background:#0984e3"></div><div class="cell" style="background:#d63031"></div><div class="cell" style="background:#81ecec"></div><div class="cell" style="background:#fab1a0"></div><div class="cell" style="background:#dfe6e9"></div><div class="cell" style="background:#b2bec3"></div><div class="cell" style="background:#ffeaa7"></div><div class="cell" style="background:#55efc4"></div><div class="cell" style="background:#74b9ff"></div><div class="cell" style="background:#a29bfe"></div><div class="cell" style="background:#fd79a8"></div><div class="cell" style="background:#00cec9"></div><div class="cell" style="background:#e84393"></div><div class="cell" style="background:#fdcb6e"></div></div><h1 class="overlay">CHROMA</h1></body></html>
