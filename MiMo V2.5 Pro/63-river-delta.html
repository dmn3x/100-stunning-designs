<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>River Delta</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a2820}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(100,160,120,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">River Delta</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// River branches (fractal)
function drawBranch(x,y,angle,len,depth,width){
  if(depth>8||len<3||width<0.5)return;
  
  const x2=x+Math.cos(angle)*len;
  const y2=y+Math.sin(angle)*len;
  
  // Meander
  const midX=(x+x2)/2+Math.sin(depth+frame*0.003)*len*0.2;
  const midY=(y+y2)/2+Math.cos(depth+frame*0.005)*len*0.1;
  
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.quadraticCurveTo(midX,midY,x2,y2);
  const alpha=0.1+0.15*(1-depth/8);
  ctx.strokeStyle=`hsla(200,30%,40%,${alpha})`;
  ctx.lineWidth=width;
  ctx.lineCap='round';
  ctx.stroke();
  
  // Branch
  const spread=0.3+Math.random()*0.3;
  const lenFactor=0.65+Math.random()*0.1;
  
  drawBranch(x2,y2,angle-spread,len*lenFactor,depth+1,width*0.7);
  drawBranch(x2,y2,angle+spread,len*lenFactor,depth+1,width*0.7);
}

function draw(){
  frame++;
  
  // Background — satellite view
  const bg=ctx.createRadialGradient(w*0.5,h*0.1,0,w*0.5,h*0.1,Math.max(w,h)*0.8);
  bg.addColorStop(0,'#2a3828');
  bg.addColorStop(0.5,'#1e2c1a');
  bg.addColorStop(1,'#141e12');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  
  // Land texture
  ctx.fillStyle='rgba(40,60,35,0.1)';
  for(let i=0;i<100;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w,Math.random()*h,10+Math.random()*30,0,Math.PI*2);
    ctx.fill();
  }
  
  // Water body (ocean at bottom)
  const oceanY=h*0.7;
  ctx.fillStyle='rgba(20,40,60,0.3)';
  ctx.fillRect(0,oceanY,w,h-oceanY);
  
  // Delta sediment
  ctx.beginPath();
  ctx.moveTo(w*0.3,oceanY);
  ctx.quadraticCurveTo(w*0.5,oceanY-30,w*0.7,oceanY);
  ctx.lineTo(w*0.8,oceanY+30);
  ctx.quadraticCurveTo(w*0.5,oceanY+50,w*0.2,oceanY+30);
  ctx.closePath();
  ctx.fillStyle='rgba(60,80,50,0.2)';
  ctx.fill();
  
  // Main river
  drawBranch(w*0.5,h*0.05,Math.PI/2,h*0.12,0,6);
  
  // Distributary channels in delta
  for(let i=0;i<5;i++){
    const startX=w*0.35+i*w*0.07;
    drawBranch(startX,oceanY-10,Math.PI/2+Math.sin(i)*0.3,30,5,2);
  }
  
  // Sediment plumes in water
  for(let i=0;i<8;i++){
    const px=w*0.3+Math.random()*w*0.4;
    const py=oceanY+10+Math.random()*30;
    ctx.beginPath();
    ctx.arc(px,py,10+Math.random()*20,0,Math.PI*2);
    ctx.fillStyle='rgba(80,100,60,0.05)';
    ctx.fill();
  }
  
  // Scale bar
  ctx.strokeStyle='rgba(100,160,120,0.15)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(30,h-30);
  ctx.lineTo(130,h-30);
  ctx.stroke();
  ctx.font='8px "SF Mono",monospace';
  ctx.fillStyle='rgba(100,160,120,0.2)';
  ctx.textAlign='center';
  ctx.fillText('10 km',80,h-15);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
