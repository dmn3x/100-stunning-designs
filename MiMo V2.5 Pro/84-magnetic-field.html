<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Field</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:600 .6rem/1 'SF Mono',monospace;letter-spacing:.35em;text-transform:uppercase;color:rgba(140,140,200,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Magnetic Field</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Magnets
const magnets=[
  {x:0.35,y:0.5,pole:1},
  {x:0.65,y:0.5,pole:-1},
];

// Iron filings
const filings=[];
for(let i=0;i<600;i++){
  filings.push({
    x:Math.random()*w,y:Math.random()*h,
    angle:0,
    length:3+Math.random()*5,
  });
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(10,10,20,0.95)';
  ctx.fillRect(0,0,w,h);
  
  // Update and draw filings
  for(const f of filings){
    // Calculate field at this point
    let bx=0,by=0;
    for(const m of magnets){
      const mx=m.x*w,my=m.y*h;
      const dx=f.x-mx,dy=f.y-my;
      const dist=Math.sqrt(dx*dx+dy*dy)+10;
      const strength=m.pole*5000/(dist*dist);
      bx+=dx/dist*strength;
      by+=dy/dist*strength;
    }
    
    f.angle=Math.atan2(by,bx);
    
    // Draw filing
    const x1=f.x-Math.cos(f.angle)*f.length/2;
    const y1=f.y-Math.sin(f.angle)*f.length/2;
    const x2=f.x+Math.cos(f.angle)*f.length/2;
    const y2=f.y+Math.sin(f.angle)*f.length/2;
    
    const fieldStr=Math.sqrt(bx*bx+by*by);
    const alpha=Math.min(0.4,fieldStr*0.05);
    
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle=`rgba(160,160,200,${alpha})`;
    ctx.lineWidth=1;
    ctx.stroke();
  }
  
  // Field lines
  for(let i=0;i<12;i++){
    const startAngle=(i/12)*Math.PI*2;
    const startR=20;
    const m=magnets[0];
    let x=m.x*w+Math.cos(startAngle)*startR;
    let y=m.y*h+Math.sin(startAngle)*startR;
    
    ctx.beginPath();
    ctx.moveTo(x,y);
    
    for(let step=0;step<200;step++){
      let bx=0,by=0;
      for(const mag of magnets){
        const mx=mag.x*w,my=mag.y*h;
        const dx=x-mx,dy=y-my;
        const dist=Math.sqrt(dx*dx+dy*dy)+5;
        const strength=mag.pole*100/(dist*dist);
        bx+=dx/dist*strength;
        by+=dy/dist*strength;
      }
      const bLen=Math.sqrt(bx*bx+by*by)+0.001;
      x+=bx/bLen*3;
      y+=by/bLen*3;
      ctx.lineTo(x,y);
      
      if(x<0||x>w||y<0||y>h)break;
    }
    
    ctx.strokeStyle=`rgba(100,100,180,0.06)`;
    ctx.lineWidth=1;
    ctx.stroke();
  }
  
  // Draw magnets
  for(const m of magnets){
    const mx=m.x*w,my=m.y*h;
    ctx.beginPath();
    ctx.arc(mx,my,12,0,Math.PI*2);
    ctx.fillStyle=m.pole>0?'rgba(200,60,60,0.4)':'rgba(60,60,200,0.4)';
    ctx.fill();
    ctx.strokeStyle=m.pole>0?'rgba(255,80,80,0.3)':'rgba(80,80,255,0.3)';
    ctx.lineWidth=2;
    ctx.stroke();
    
    ctx.font='bold 10px "SF Mono",monospace';
    ctx.fillStyle=m.pole>0?'rgba(255,100,100,0.5)':'rgba(100,100,255,0.5)';
    ctx.textAlign='center';
    ctx.fillText(m.pole>0?'N':'S',mx,my+4);
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
