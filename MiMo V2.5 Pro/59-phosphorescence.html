<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phosphorescence</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06080e}
canvas{display:block;cursor:none}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(80,200,160,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Phosphorescence</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0,mx=w/2,my=h/2;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});

// Glowing particles
const particles=[];
for(let i=0;i<100;i++){
  particles.push({
    x:Math.random()*w,y:Math.random()*h,
    baseX:0,baseY:0,
    r:2+Math.random()*4,
    hue:160+Math.random()*40,
    phase:Math.random()*Math.PI*2,
    glow:0,
  });
}

// Trail
const trail=[];

function draw(){
  frame++;
  ctx.fillStyle='rgba(6,8,14,0.92)';
  ctx.fillRect(0,0,w,h);
  
  // Mouse trail glow
  trail.push({x:mx,y:my,life:1});
  while(trail.length>50)trail.shift();
  
  for(const t of trail){
    t.life-=0.02;
    if(t.life<=0)continue;
    const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,30);
    g.addColorStop(0,`rgba(80,200,160,${t.life*0.05})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(t.x,t.y,30,0,Math.PI*2);
    ctx.fill();
  }
  
  // Particles
  for(const p of particles){
    const dx=mx-p.x,dy=my-p.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    
    // Excite near mouse
    if(dist<100){
      p.glow=Math.min(1,p.glow+0.05*(1-dist/100));
    }else{
      p.glow*=0.98;
    }
    
    // Drift
    p.x+=Math.sin(frame*0.005+p.phase)*0.3;
    p.y+=Math.cos(frame*0.007+p.phase)*0.2;
    if(p.x<-20)p.x=w+20;if(p.x>w+20)p.x=-20;
    if(p.y<-20)p.y=h+20;if(p.y>h+20)p.y=-20;
    
    const brightness=p.glow;
    const baseAlpha=0.03+Math.sin(frame*0.01+p.phase)*0.02;
    
    // Glow
    if(brightness>0.01){
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
      g.addColorStop(0,`hsla(${p.hue},70%,60%,${brightness*0.15})`);
      g.addColorStop(1,'transparent');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
      ctx.fill();
    }
    
    // Core
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*(0.5+brightness*0.5),0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},60%,${50+brightness*30}%,${baseAlpha+brightness*0.4})`;
    ctx.fill();
  }
  
  // Water surface (top)
  ctx.strokeStyle='rgba(80,200,160,0.02)';
  ctx.lineWidth=1;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    const wy=h*0.1+i*10;
    for(let x=0;x<=w;x+=3){
      const y=wy+Math.sin(x*0.01+frame*0.01+i)*3;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
