<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firefly Swarm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0e140a}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,220,80,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Firefly Swarm</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Fireflies
const flies=[];
for(let i=0;i<60;i++){
  flies.push({
    x:Math.random()*w,y:Math.random()*h,
    vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,
    phase:Math.random()*Math.PI*2,
    blinkSpeed:0.02+Math.random()*0.03,
    blinkPhase:Math.random()*Math.PI*2,
    size:1.5+Math.random()*1.5,
    hue:60+Math.random()*20,
  });
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(14,20,10,0.15)';
  ctx.fillRect(0,0,w,h);
  
  // Grass silhouettes (background, drawn once)
  if(frame===1){
    ctx.fillStyle='rgba(20,30,15,0.5)';
    for(let i=0;i<30;i++){
      const gx=i*w/30;
      ctx.beginPath();
      ctx.moveTo(gx,h);
      ctx.lineTo(gx+3,h-20-Math.random()*30);
      ctx.lineTo(gx+6,h);
      ctx.fill();
    }
    // Trees
    for(let i=0;i<5;i++){
      const tx=w*0.1+i*w*0.2;
      ctx.fillStyle='rgba(15,25,10,0.4)';
      ctx.beginPath();
      ctx.arc(tx,h*0.5,40+Math.random()*30,0,Math.PI*2);
      ctx.fill();
      ctx.fillRect(tx-3,h*0.5,6,h*0.3);
    }
  }
  
  // Moon glow
  const moonG=ctx.createRadialGradient(w*0.8,h*0.1,5,w*0.8,h*0.1,100);
  moonG.addColorStop(0,'rgba(200,210,180,0.02)');
  moonG.addColorStop(1,'transparent');
  ctx.fillStyle=moonG;
  ctx.fillRect(0,0,w,h);
  
  // Fireflies
  for(const f of flies){
    // Boid-like movement
    f.vx+=(Math.random()-0.5)*0.05;
    f.vy+=(Math.random()-0.5)*0.05;
    
    // Attract to center slightly
    f.vx+=(w/2-f.x)*0.00005;
    f.vy+=(h/2-f.y)*0.00005;
    
    f.vx*=0.99;
    f.vy*=0.99;
    f.x+=f.vx;
    f.y+=f.vy;
    
    if(f.x<0)f.x=w;if(f.x>w)f.x=0;
    if(f.y<0)f.y=h;if(f.y>h)f.y=0;
    
    // Blink
    f.blinkPhase+=f.blinkSpeed;
    const blink=Math.sin(f.blinkPhase)*0.5+0.5;
    const isOn=blink>0.3;
    
    if(isOn){
      const brightness=(blink-0.3)/0.7;
      
      // Large glow
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,20*f.size);
      g.addColorStop(0,`hsla(${f.hue},80%,60%,${brightness*0.08})`);
      g.addColorStop(0.5,`hsla(${f.hue},70%,50%,${brightness*0.03})`);
      g.addColorStop(1,'transparent');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.arc(f.x,f.y,20*f.size,0,Math.PI*2);
      ctx.fill();
      
      // Core
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.size,0,Math.PI*2);
      ctx.fillStyle=`hsla(${f.hue},80%,70%,${brightness*0.8})`;
      ctx.fill();
    }else{
      // Dim dot when off
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.size*0.3,0,Math.PI*2);
      ctx.fillStyle='rgba(60,80,30,0.1)';
      ctx.fill();
    }
  }
  
  // Stars
  ctx.fillStyle='rgba(200,200,220,0.05)';
  for(let i=0;i<30;i++){
    ctx.fillRect((i*137.5)%w,(i*97.3)%h*0.5,1,1);
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
