<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patchwork Quilt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f0e8d8}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(120,100,70,.3);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Patchwork Quilt</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight;draw()}
resize();addEventListener('resize',resize);

// Quilt palette — warm, muted
const palettes=[
  ['#c44b3f','#d4735e','#e8a87c','#c49a6c','#8b5e3c'],
  ['#4a7c59','#6b9b7a','#a4c3b2','#c8d8c0','#e0e8d8'],
  ['#3a5a8c','#5a7cac','#8aaed0','#b0c8e0','#d0e0f0'],
  ['#8c4a6a','#ac6a8a','#cc8aaa','#e0b0c8','#f0d0e0'],
  ['#8c7a3a','#ac9a5a','#ccba7a','#e0d8a0','#f0e8c0'],
];

function draw(){
  const cellSize=Math.min(w,h)/12;
  const cols=Math.ceil(w/cellSize)+1;
  const rows=Math.ceil(h/cellSize)+1;
  
  // Background
  ctx.fillStyle='#e8e0d0';
  ctx.fillRect(0,0,w,h);
  
  // Quilt patches
  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const x=col*cellSize;
      const y=row*cellSize;
      const palette=palettes[(row*cols+col)%palettes.length];
      const patternType=(row*3+col*7)%5;
      
      // Patch background
      ctx.fillStyle=palette[0];
      ctx.fillRect(x+1,y+1,cellSize-2,cellSize-2);
      
      ctx.save();
      ctx.beginPath();
      ctx.rect(x+1,y+1,cellSize-2,cellSize-2);
      ctx.clip();
      
      switch(patternType){
        case 0: // Half-square triangle
          ctx.beginPath();
          ctx.moveTo(x,y);
          ctx.lineTo(x+cellSize,y);
          ctx.lineTo(x,y+cellSize);
          ctx.closePath();
          ctx.fillStyle=palette[1];
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(x+cellSize,y+cellSize);
          ctx.lineTo(x+cellSize,y);
          ctx.lineTo(x,y+cellSize);
          ctx.closePath();
          ctx.fillStyle=palette[2];
          ctx.fill();
          break;
        case 1: // Nine-patch
          const s3=cellSize/3;
          for(let r=0;r<3;r++){
            for(let c2=0;c2<3;c2++){
              ctx.fillStyle=palette[(r+c2)%2===0?1:3];
              ctx.fillRect(x+c2*s3,y+r*s3,s3,s3);
            }
          }
          break;
        case 2: // Pinwheel
          ctx.beginPath();
          ctx.moveTo(x+cellSize/2,y);
          ctx.lineTo(x+cellSize,y+cellSize/2);
          ctx.lineTo(x+cellSize/2,y+cellSize);
          ctx.lineTo(x,y+cellSize/2);
          ctx.closePath();
          ctx.fillStyle=palette[2];
          ctx.fill();
          // Triangles
          ctx.fillStyle=palette[3];
          ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+cellSize/2,y);ctx.lineTo(x,y+cellSize/2);ctx.fill();
          ctx.beginPath();ctx.moveTo(x+cellSize,y);ctx.lineTo(x+cellSize,y+cellSize/2);ctx.lineTo(x+cellSize/2,y);ctx.fill();
          ctx.beginPath();ctx.moveTo(x+cellSize,y+cellSize);ctx.lineTo(x+cellSize/2,y+cellSize);ctx.lineTo(x+cellSize,y+cellSize/2);ctx.fill();
          ctx.beginPath();ctx.moveTo(x,y+cellSize);ctx.lineTo(x,y+cellSize/2);ctx.lineTo(x+cellSize/2,y+cellSize);ctx.fill();
          break;
        case 3: // Diamond in square
          ctx.fillStyle=palette[1];
          ctx.fillRect(x,y,cellSize,cellSize);
          ctx.fillStyle=palette[3];
          ctx.beginPath();
          ctx.moveTo(x+cellSize/2,y+cellSize*0.1);
          ctx.lineTo(x+cellSize*0.9,y+cellSize/2);
          ctx.lineTo(x+cellSize/2,y+cellSize*0.9);
          ctx.lineTo(x+cellSize*0.1,y+cellSize/2);
          ctx.closePath();
          ctx.fill();
          break;
        case 4: // Log cabin (simplified)
          ctx.fillStyle=palette[4];
          ctx.fillRect(x,y,cellSize,cellSize);
          const cw=cellSize*0.15;
          for(let i=0;i<4;i++){
            ctx.fillStyle=palette[i%2===0?1:2];
            if(i===0)ctx.fillRect(x,y,cellSize,cw);
            if(i===1)ctx.fillRect(x+cellSize-cw,y,cw,cellSize);
            if(i===2)ctx.fillRect(x,y+cellSize-cw,cellSize,cw);
            if(i===3)ctx.fillRect(x,y,cw,cellSize);
          }
          ctx.fillStyle=palette[0];
          ctx.fillRect(x+cellSize*0.35,y+cellSize*0.35,cellSize*0.3,cellSize*0.3);
          break;
      }
      
      ctx.restore();
      
      // Stitching
      ctx.strokeStyle='rgba(100,80,60,0.15)';
      ctx.lineWidth=0.5;
      ctx.setLineDash([2,3]);
      ctx.strokeRect(x+2,y+2,cellSize-4,cellSize-4);
      ctx.setLineDash([]);
    }
  }
  
  // Quilt border
  ctx.strokeStyle='rgba(100,80,60,0.2)';
  ctx.lineWidth=3;
  ctx.strokeRect(0,0,w,h);
  
  // Fabric texture overlay
  ctx.fillStyle='rgba(180,160,130,0.03)';
  for(let i=0;i<300;i++){
    ctx.fillRect(Math.random()*w,Math.random()*h,1,1);
  }
}

draw();
</script>
</body>
</html>
