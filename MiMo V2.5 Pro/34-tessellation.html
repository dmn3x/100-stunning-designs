<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessellation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0c0c14}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,180,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Tessellation</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function drawHex(x,y,r,hue,phase){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2-Math.PI/6;
    const wobble=1+Math.sin(frame*0.01+phase)*0.03;
    const px=x+Math.cos(a)*r*wobble;
    const py=y+Math.sin(a)*r*wobble;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  
  const pulse=Math.sin(frame*0.015+phase)*0.5+0.5;
  ctx.fillStyle=`hsla(${hue},50%,${20+pulse*15}%,0.3)`;
  ctx.fill();
  ctx.strokeStyle=`hsla(${hue},40%,${40+pulse*20}%,0.2)`;
  ctx.lineWidth=1;
  ctx.stroke();
  
  // Inner pattern
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2-Math.PI/6;
    const px=x+Math.cos(a)*r*0.5;
    const py=y+Math.sin(a)*r*0.5;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.strokeStyle=`hsla(${hue},40%,50%,${0.08+pulse*0.05})`;
  ctx.lineWidth=0.5;
  ctx.stroke();
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(12,12,20,0.95)';
  ctx.fillRect(0,0,w,h);
  
  const r=30;
  const dx=r*Math.sqrt(3);
  const dy=r*1.5;
  
  const cols=Math.ceil(w/dx)+2;
  const rows=Math.ceil(h/dy)+2;
  
  for(let row=-1;row<rows;row++){
    for(let col=-1;col<cols;col++){
      const x=col*dx+(row%2)*dx/2;
      const y=row*dy;
      
      const dist=Math.sqrt((x-w/2)**2+(y-h/2)**2);
      const hue=(dist*0.1+frame*0.3)%360;
      const phase=col*0.3+row*0.5;
      
      drawHex(x,y,r-1,hue,phase);
    }
  }
  
  // Central glow
  const cg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,200);
  cg.addColorStop(0,'rgba(100,80,200,0.05)');
  cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg;
  ctx.fillRect(0,0,w,h);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
