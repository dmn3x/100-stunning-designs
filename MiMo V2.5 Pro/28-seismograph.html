<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seismograph</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a20}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:2rem;font:600 .6rem/1 'SF Mono',monospace;letter-spacing:.35em;text-transform:uppercase;color:rgba(180,180,200,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Seismograph</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Seismic traces
const traces=3;
const traceBuffers=[];
for(let t=0;t<traces;t++){
  traceBuffers.push([]);
}

// Generate seismic data
function seismicNoise(t,channel){
  // Normal background noise
  let v=Math.sin(t*0.1+channel*10)*0.1+Math.sin(t*0.23+channel*5)*0.05+(Math.random()-0.5)*0.15;
  
  // Earthquake events
  const eventTime=frame*0.01;
  const pWave=Math.sin((t-eventTime*50)*0.3)*Math.exp(-Math.abs(t-eventTime*50)*0.01)*0.8;
  const sWave=Math.sin((t-eventTime*50-20)*0.15)*Math.exp(-Math.abs(t-eventTime*50-20)*0.005)*1.2;
  const surface=Math.sin((t-eventTime*50-60)*0.08)*Math.exp(-Math.abs(t-eventTime*50-60)*0.003)*0.6;
  
  // Periodic quakes
  const quakeCycle=Math.sin(frame*0.0005+channel)*0.5+0.5;
  if(quakeCycle>0.95){
    v+=Math.sin(t*0.5)*quakeCycle*2*Math.exp(-Math.abs(t%200-100)*0.02);
  }
  
  return v;
}

// Station data
const stations=[
  {name:'TOK',lat:35.6,lon:139.7,color:'#ff6060'},
  {name:'SFO',lat:37.7,lon:-122.4,color:'#60ff60'},
  {name:'REK',lat:64.1,lon:-21.9,color:'#6060ff'},
];

function draw(){
  frame++;
  ctx.fillStyle='rgba(26,26,32,0.95)';
  ctx.fillRect(0,0,w,h);
  
  // Grid
  ctx.strokeStyle='rgba(100,100,120,0.05)';
  ctx.lineWidth=0.5;
  const gridX=40,gridY=30;
  for(let x=0;x<w;x+=gridX){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=gridY){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  
  // Draw each trace
  const traceH=h/(traces+1);
  
  for(let t=0;t<traces;t++){
    const station=stations[t];
    const cy=traceH*(t+1);
    
    // Station label
    ctx.font='bold 11px "SF Mono",monospace';
    ctx.fillStyle=station.color+'60';
    ctx.textAlign='left';
    ctx.fillText(station.name,10,cy-8);
    ctx.font='9px "SF Mono",monospace';
    ctx.fillStyle='rgba(160,160,180,0.2)';
    ctx.fillText(`${station.lat.toFixed(1)}° ${station.lon>0?'N':'S'}  ${Math.abs(station.lon).toFixed(1)}° ${station.lon>0?'E':'W'}`,10,cy+12);
    
    // Baseline
    ctx.beginPath();
    ctx.moveTo(60,cy);
    ctx.lineTo(w,cy);
    ctx.strokeStyle='rgba(100,100,120,0.08)';
    ctx.lineWidth=0.5;
    ctx.stroke();
    
    // Trace
    ctx.beginPath();
    const startX=60;
    for(let x=startX;x<w;x++){
      const t2=(x-startX)+frame*2;
      const v=seismicNoise(t2,t);
      const y=cy+v*traceH*0.4;
      if(x===startX)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=station.color+'90';
    ctx.lineWidth=1.2;
    ctx.stroke();
    
    // Glow
    ctx.strokeStyle=station.color+'15';
    ctx.lineWidth=4;
    ctx.stroke();
    
    // Scale bar
    ctx.strokeStyle=station.color+'30';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(w-40,cy-traceH*0.2);
    ctx.lineTo(w-40,cy+traceH*0.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w-43,cy-traceH*0.2);
    ctx.lineTo(w-37,cy-traceH*0.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w-43,cy+traceH*0.2);
    ctx.lineTo(w-37,cy+traceH*0.2);
    ctx.stroke();
  }
  
  // Time axis
  ctx.font='8px "SF Mono",monospace';
  ctx.fillStyle='rgba(160,160,180,0.15)';
  ctx.textAlign='center';
  const timeStep=100;
  for(let x=60;x<w;x+=timeStep){
    const t=Math.floor((x-60+frame*2)/10);
    ctx.fillText(`${t}s`,x,h-10);
  }
  
  // Magnitude indicator
  const mag=2+Math.abs(Math.sin(frame*0.001))*6;
  ctx.font='bold 14px "SF Mono",monospace';
  ctx.fillStyle=`rgba(${mag>5?255:180},${mag>5?100:180},${mag>5?100:200},${0.3})`;
  ctx.textAlign='right';
  ctx.fillText(`M ${mag.toFixed(1)}`,w-20,30);
  
  // Status
  ctx.font='9px "SF Mono",monospace';
  ctx.fillStyle='rgba(100,200,100,0.3)';
  ctx.textAlign='left';
  ctx.fillText('● LIVE',10,20);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
