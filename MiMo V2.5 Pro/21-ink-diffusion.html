<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Diffusion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f8f4ec}
canvas{display:block;cursor:crosshair}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(100,80,60,.25);pointer-events:none;z-index:10}
.hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);font:10px Georgia,serif;color:rgba(100,80,60,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Ink Diffusion</div>
<div class="hint">Click to drop ink</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Ink particles
const particles=[];

function addInkDrop(x,y,count=80){
  const hue=Math.random()*360;
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=0.5+Math.random()*2;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      r:2+Math.random()*4,
      alpha:0.3+Math.random()*0.4,
      hue,
      life:200+Math.random()*300,
      maxLife:200+Math.random()*300,
      drag:0.98+Math.random()*0.015,
    });
  }
}

// Initial drops
addInkDrop(w*0.3,h*0.4,60);
addInkDrop(w*0.7,h*0.6,60);

c.addEventListener('click',e=>addInkDrop(e.clientX,e.clientY));
c.addEventListener('touchstart',e=>{addInkDrop(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault()},{passive:false});

function draw(){
  frame++;
  
  // Paper background with texture
  ctx.fillStyle='#f8f4ec';
  ctx.fillRect(0,0,w,h);
  
  // Paper fibers (subtle)
  if(frame===1){
    ctx.strokeStyle='rgba(200,180,150,0.05)';
    ctx.lineWidth=0.5;
    for(let i=0;i<400;i++){
      const x=Math.random()*w,y=Math.random()*h;
      const len=5+Math.random()*15;
      const angle=Math.random()*Math.PI;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(angle)*len,y+Math.sin(angle)*len);
      ctx.stroke();
    }
  }
  
  // Update and draw particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life--;
    if(p.life<=0){particles.splice(i,1);continue;}
    
    // Diffusion — Brownian motion
    p.vx+=(Math.random()-0.5)*0.1;
    p.vy+=(Math.random()-0.5)*0.1;
    
    // Slight gravity (ink settling)
    p.vy+=0.002;
    
    p.vx*=p.drag;
    p.vy*=p.drag;
    p.x+=p.vx;
    p.y+=p.vy;
    
    // Fade
    const lifeRatio=p.life/p.maxLife;
    const alpha=p.alpha*lifeRatio;
    
    // Draw ink blob
    ctx.beginPath();
    // Irregular blob shape
    const points=6;
    for(let j=0;j<=points;j++){
      const a=(j/points)*Math.PI*2;
      const wobble=1+Math.sin(frame*0.02+a*3+p.x*0.01)*0.2;
      const px=p.x+Math.cos(a)*p.r*wobble;
      const py=p.y+Math.sin(a)*p.r*wobble;
      if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=`hsla(${p.hue},60%,25%,${alpha*0.5})`;
    ctx.fill();
    
    // Center darker
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*0.5,0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},70%,15%,${alpha*0.3})`;
    ctx.fill();
  }
  
  // Paper water stain effect around drops
  for(const p of particles){
    if(p.life>p.maxLife*0.8){
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.hue},20%,85%,${0.02*(p.life/p.maxLife)})`;
      ctx.fill();
    }
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
