<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frost Patterns</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e16}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,200,240,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Frost Patterns</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight;initFrost()}
resize();addEventListener('resize',resize);

// Frost crystal seeds
const crystals=[];
function initFrost(){
  crystals.length=0;
  const count=Math.floor(Math.min(w,h)/80);
  for(let i=0;i<count;i++){
    crystals.push({
      x:w*0.1+Math.random()*w*0.8,
      y:h*0.1+Math.random()*h*0.8,
      branches:6,
      maxDepth:4+Math.floor(Math.random()*3),
      angle:Math.random()*Math.PI*2,
    });
  }
}
initFrost();

function drawBranch(x,y,angle,len,depth,maxDepth,hue){
  if(depth>maxDepth||len<2)return;
  
  const x2=x+Math.cos(angle)*len;
  const y2=y+Math.sin(angle)*len;
  
  const alpha=0.15+0.15*(1-depth/maxDepth);
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x2,y2);
  ctx.strokeStyle=`hsla(${hue},40%,75%,${alpha})`;
  ctx.lineWidth=Math.max(0.5,2-depth*0.3);
  ctx.stroke();
  
  // Sub-branches
  const branchAngle=0.4+Math.random()*0.3;
  const lenFactor=0.6+Math.random()*0.2;
  
  drawBranch(x2,y2,angle-branchAngle,len*lenFactor,depth+1,maxDepth,hue);
  drawBranch(x2,y2,angle+branchAngle,len*lenFactor,depth+1,maxDepth,hue);
  
  // Occasional extra branch
  if(Math.random()>0.6&&depth<maxDepth-1){
    drawBranch(x2,y2,angle,len*0.5,depth+2,maxDepth,hue);
  }
}

function draw(){
  frame++;
  
  // Background — dark cold
  const bg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.6);
  bg.addColorStop(0,'#0e1420');
  bg.addColorStop(1,'#080a10');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  
  // Window glass effect
  ctx.fillStyle='rgba(100,140,200,0.02)';
  ctx.fillRect(0,0,w,h);
  
  // Frost crystals
  for(const crystal of crystals){
    ctx.save();
    ctx.translate(crystal.x,crystal.y);
    
    // Draw each branch of the crystal (6-fold symmetry)
    for(let b=0;b<crystal.branches;b++){
      const angle=crystal.angle+(b/crystal.branches)*Math.PI*2;
      const len=30+Math.random()*20;
      drawBranch(0,0,angle,len,0,crystal.maxDepth,200+Math.random()*40);
    }
    
    // Center dot
    ctx.beginPath();
    ctx.arc(0,0,2,0,Math.PI*2);
    ctx.fillStyle='rgba(180,200,240,0.2)';
    ctx.fill();
    
    ctx.restore();
  }
  
  // Ice fog
  for(let i=0;i<5;i++){
    const fx=w*0.2+Math.sin(frame*0.001+i*2)*w*0.3;
    const fy=h*0.3+Math.cos(frame*0.0015+i*1.5)*h*0.3;
    const fg=ctx.createRadialGradient(fx,fy,0,fx,fy,150);
    fg.addColorStop(0,'rgba(100,140,200,0.015)');
    fg.addColorStop(1,'transparent');
    ctx.fillStyle=fg;
    ctx.fillRect(0,0,w,h);
  }
  
  // Condensation droplets
  for(let i=0;i<20;i++){
    const dx=(i*137.5+frame*0.02)%w;
    const dy=(i*97.3)%h;
    ctx.beginPath();
    ctx.arc(dx,dy,1+Math.random()*2,0,Math.PI*2);
    ctx.fillStyle='rgba(150,180,220,0.05)';
    ctx.fill();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
