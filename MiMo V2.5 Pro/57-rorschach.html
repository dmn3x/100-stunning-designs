<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rorschach</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f0ece4}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(100,80,60,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Rorschach</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight;generate()}
resize();addEventListener('resize',resize);

function generate(){
  ctx.fillStyle='#f0ece4';
  ctx.fillRect(0,0,w,h);
  
  // Paper texture
  ctx.fillStyle='rgba(180,160,130,0.03)';
  for(let i=0;i<200;i++)ctx.fillRect(Math.random()*w,Math.random()*h,Math.random()*3,1);
  
  const cx=w/2,cy=h/2;
  
  // Generate random blobs on left side
  const blobs=[];
  const count=15+Math.floor(Math.random()*10);
  for(let i=0;i<count;i++){
    blobs.push({
      x:Math.random()*w*0.35+w*0.05,
      y:Math.random()*h*0.8+h*0.1,
      r:10+Math.random()*40,
      points:6+Math.floor(Math.random()*6),
    });
  }
  
  // Draw left side
  for(const blob of blobs){
    ctx.beginPath();
    for(let i=0;i<=blob.points;i++){
      const a=(i/blob.points)*Math.PI*2;
      const wobble=0.7+Math.random()*0.6;
      const px=blob.x+Math.cos(a)*blob.r*wobble;
      const py=blob.y+Math.sin(a)*blob.r*wobble;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=`rgba(30,25,20,${0.08+Math.random()*0.12})`;
    ctx.fill();
  }
  
  // Mirror to right side
  for(const blob of blobs){
    const mirrorX=w-blob.x;
    ctx.beginPath();
    for(let i=0;i<=blob.points;i++){
      const a=(i/blob.points)*Math.PI*2;
      const wobble=0.7+Math.random()*0.6;
      const px=mirrorX+Math.cos(a)*blob.r*wobble;
      const py=blob.y+Math.sin(a)*blob.r*wobble;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=`rgba(30,25,20,${0.08+Math.random()*0.12})`;
    ctx.fill();
  }
  
  // Central smudge
  ctx.beginPath();
  for(let i=0;i<=20;i++){
    const a=(i/20)*Math.PI*2;
    const r=5+Math.random()*15;
    const px=cx+Math.cos(a)*r;
    const py=cy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(30,25,20,0.05)';
  ctx.fill();
  
  // Fold line
  ctx.beginPath();
  ctx.moveTo(cx,0);
  ctx.lineTo(cx,h);
  ctx.strokeStyle='rgba(100,80,60,0.05)';
  ctx.lineWidth=1;
  ctx.stroke();
}

c.addEventListener('click',generate);

function draw(){
  frame++;
  requestAnimationFrame(draw);
}
generate();
draw();
</script>
</body>
</html>
