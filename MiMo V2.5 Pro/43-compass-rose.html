<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compass Rose</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0c1018}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(160,180,200,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Compass Rose</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function draw(){
  frame++;
  
  // Background — aged map
  const bg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.6);
  bg.addColorStop(0,'#141820');
  bg.addColorStop(1,'#0a0e14');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  
  // Sea texture
  ctx.strokeStyle='rgba(80,120,160,0.02)';
  ctx.lineWidth=0.5;
  for(let i=0;i<60;i++){
    const y=h*0.1+i*h*0.015;
    ctx.beginPath();
    for(let x=0;x<w;x+=3){
      const yy=y+Math.sin(x*0.01+i*0.5)*5;
      if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  
  const cx=w/2,cy=h/2;
  const R=Math.min(w,h)*0.38;
  
  // Outer circle
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(180,160,120,0.15)';
  ctx.lineWidth=2;
  ctx.stroke();
  
  // Degree marks
  for(let d=0;d<360;d++){
    const a=d*Math.PI/180-Math.PI/2;
    const inner=d%10===0?R*0.9:d%5===0?R*0.93:R*0.96;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*inner,cy+Math.sin(a)*inner);
    ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
    ctx.strokeStyle=`rgba(180,160,120,${d%10===0?0.15:0.06})`;
    ctx.lineWidth=d%10===0?1:0.5;
    ctx.stroke();
  }
  
  // Cardinal directions
  const cardinals=['N','E','S','W'];
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2-Math.PI/2;
    const lx=cx+Math.cos(a)*(R+20);
    const ly=cy+Math.sin(a)*(R+20);
    ctx.font='bold 14px Georgia';
    ctx.fillStyle=i===0?'rgba(200,80,60,0.4)':'rgba(180,160,120,0.3)';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(cardinals[i],lx,ly);
  }
  
  // Intercardinal
  const inter=['NE','SE','SW','NW'];
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+Math.PI/4-Math.PI/2;
    const lx=cx+Math.cos(a)*(R+15);
    const ly=cy+Math.sin(a)*(R+15);
    ctx.font='9px "SF Mono",monospace';
    ctx.fillStyle='rgba(180,160,120,0.15)';
    ctx.textAlign='center';
    ctx.fillText(inter[i],lx,ly);
  }
  
  // Compass needle — slowly rotating
  const needleAngle=frame*0.002+Math.sin(frame*0.001)*0.3;
  
  // Rose pattern (8-pointed star)
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2+needleAngle;
    const isCardinal=i%2===0;
    const len=isCardinal?R*0.85:R*0.6;
    const width=isCardinal?R*0.12:R*0.08;
    
    // Main point
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a-0.03)*width,cy+Math.sin(a-0.03)*width);
    ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);
    ctx.lineTo(cx+Math.cos(a+0.03)*width,cy+Math.sin(a+0.03)*width);
    ctx.closePath();
    
    const side=a>Math.PI&&a<Math.PI*2;
    ctx.fillStyle=side?'rgba(180,60,40,0.3)':'rgba(180,160,120,0.25)';
    ctx.fill();
    ctx.strokeStyle='rgba(200,180,140,0.15)';
    ctx.lineWidth=0.5;
    ctx.stroke();
  }
  
  // Center ornament
  ctx.beginPath();
  ctx.arc(cx,cy,R*0.05,0,Math.PI*2);
  ctx.fillStyle='rgba(200,180,140,0.3)';
  ctx.fill();
  ctx.strokeStyle='rgba(200,180,140,0.2)';
  ctx.lineWidth=1;
  ctx.stroke();
  
  // Inner decorative circles
  ctx.beginPath();
  ctx.arc(cx,cy,R*0.3,0,Math.PI*2);
  ctx.strokeStyle='rgba(180,160,120,0.06)';
  ctx.lineWidth=0.5;
  ctx.stroke();
  
  ctx.beginPath();
  ctx.arc(cx,cy,R*0.6,0,Math.PI*2);
  ctx.stroke();
  
  // Wind rose lines (fleur-de-lis style decorations)
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2+needleAngle;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*R*0.15,cy+Math.sin(a)*R*0.15);
    ctx.lineTo(cx+Math.cos(a)*R*0.3,cy+Math.sin(a)*R*0.3);
    ctx.strokeStyle='rgba(180,160,120,0.06)';
    ctx.lineWidth=0.5;
    ctx.stroke();
  }
  
  // Magnetic variation indicator
  ctx.font='8px "SF Mono",monospace';
  ctx.fillStyle='rgba(180,160,120,0.15)';
  ctx.textAlign='center';
  ctx.fillText('MAGNETIC NORTH',cx,cy+R+40);
  ctx.fillText(`VAR ${(Math.sin(frame*0.001)*5).toFixed(1)}°E`,cx,cy+R+55);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
