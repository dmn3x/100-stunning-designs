<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mosaic Tiles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a160e}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(200,180,130,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Mosaic Tiles</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function draw(){
  frame++;
  
  // Aged wall background
  ctx.fillStyle='#2a2418';
  ctx.fillRect(0,0,w,h);
  
  // Mosaic grid
  const tileSize=16;
  const cols=Math.ceil(w/tileSize);
  const rows=Math.ceil(h/tileSize);
  const cx=w/2,cy=h/2;
  
  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const x=col*tileSize;
      const y=row*tileSize;
      const dist=Math.sqrt((x-cx)**2+(y-cy)**2);
      const angle=Math.atan2(y-cy,x-cx);
      
      // Roman mosaic palette
      const patterns=[
        {h:20,s:30,l:45},  // terracotta
        {h:40,s:25,l:55},  // sand
        {h:30,s:20,l:35},  // brown
        {h:200,s:15,l:40}, // blue-gray
        {h:120,s:20,l:35}, // olive
        {h:50,s:30,l:50},  // gold
        {h:0,s:10,l:30},   // dark
      ];
      
      // Create geometric pattern
      const ring=Math.floor(dist/tileSize/3);
      const inPattern=ring%3!==0;
      const patternIdx=(ring+Math.floor(angle/Math.PI*4))%patterns.length;
      
      // Border pattern
      const isBorder=(row===0||row===rows-1||col===0||col===cols-1)||
                     (row===2||row===rows-3)&&(col>=2&&col<=cols-3)||
                     (col===2||col===cols-3)&&(row>=2&&row<=rows-3);
      
      let hue,sat,lum;
      if(isBorder){
        hue=30;sat=25;lum=30;
      }else if(inPattern){
        const p=patterns[patternIdx];
        hue=p.h;sat=p.s;lum=p.l;
        // Subtle animation
        lum+=Math.sin(frame*0.01+dist*0.01)*3;
      }else{
        // Fill
        hue=40;sat=15;lum=40+Math.sin(frame*0.005+col*0.5+row*0.3)*3;
      }
      
      // Grout gap
      ctx.fillStyle=`hsla(${hue},${sat}%,${lum}%,0.7)`;
      ctx.fillRect(x+1,y+1,tileSize-2,tileSize-2);
      
      // Tessera highlight
      if(Math.random()>0.95){
        ctx.fillStyle='rgba(255,250,230,0.05)';
        ctx.fillRect(x+2,y+2,tileSize-4,tileSize-4);
      }
    }
  }
  
  // Central medallion
  const medR=Math.min(w,h)*0.2;
  ctx.beginPath();
  ctx.arc(cx,cy,medR,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,170,100,0.2)';
  ctx.lineWidth=3;
  ctx.stroke();
  
  // Medallion inner pattern
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2+frame*0.001;
    const x1=cx+Math.cos(a)*medR*0.3;
    const y1=cy+Math.sin(a)*medR*0.3;
    const x2=cx+Math.cos(a)*medR*0.9;
    const y2=cy+Math.sin(a)*medR*0.9;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle='rgba(200,170,100,0.1)';
    ctx.lineWidth=1;
    ctx.stroke();
  }
  
  // Grout lines overlay
  ctx.strokeStyle='rgba(40,35,25,0.15)';
  ctx.lineWidth=0.5;
  for(let x=0;x<w;x+=tileSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=tileSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  
  // Aging effects
  ctx.fillStyle='rgba(60,50,30,0.05)';
  for(let i=0;i<30;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w,Math.random()*h,5+Math.random()*15,0,Math.PI*2);
    ctx.fill();
  }
  
  // Vignette
  const vg=ctx.createRadialGradient(cx,cy,medR,cx,cy,Math.max(w,h)*0.6);
  vg.addColorStop(0,'transparent');
  vg.addColorStop(1,'rgba(10,8,5,0.3)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,w,h);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
