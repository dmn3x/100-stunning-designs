<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometric Mandala</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,160,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Geometric Mandala</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function draw(){
  frame++;
  ctx.fillStyle='rgba(10,10,18,0.05)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  const R=Math.min(w,h)*0.4;
  const symmetry=8;
  const t=frame*0.003;
  
  // Multiple layers
  for(let layer=0;layer<5;layer++){
    const layerR=R*(0.3+layer*0.15);
    const rot=t*(layer%2===0?1:-1)*0.5;
    
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot);
    
    for(let s=0;s<symmetry;s++){
      const angle=(s/symmetry)*Math.PI*2;
      
      ctx.save();
      ctx.rotate(angle);
      
      // Draw pattern element
      const hue=(layer*60+frame*0.3)%360;
      const alpha=0.08-layer*0.01;
      
      // Petals
      ctx.beginPath();
      ctx.ellipse(layerR*0.5,0,layerR*0.3,layerR*0.08,0,0,Math.PI*2);
      ctx.strokeStyle=`hsla(${hue},50%,55%,${alpha})`;
      ctx.lineWidth=1;
      ctx.stroke();
      
      // Dots
      const dotR=layerR*0.8;
      ctx.beginPath();
      ctx.arc(dotR,0,2+Math.sin(frame*0.01+layer+s)*1,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue+30},60%,65%,${alpha*1.5})`;
      ctx.fill();
      
      // Lines to center
      ctx.beginPath();
      ctx.moveTo(layerR*0.2,0);
      ctx.lineTo(layerR*0.9,0);
      ctx.strokeStyle=`hsla(${hue},30%,50%,${alpha*0.5})`;
      ctx.lineWidth=0.5;
      ctx.stroke();
      
      ctx.restore();
    }
    
    // Ring
    ctx.beginPath();
    ctx.arc(0,0,layerR,0,Math.PI*2);
    ctx.strokeStyle=`hsla(${layer*60+frame*0.2},30%,40%,0.04)`;
    ctx.lineWidth=0.5;
    ctx.stroke();
    
    ctx.restore();
  }
  
  // Center point
  ctx.beginPath();
  ctx.arc(cx,cy,3,0,Math.PI*2);
  ctx.fillStyle='rgba(200,180,255,0.15)';
  ctx.fill();
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
