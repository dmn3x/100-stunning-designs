<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wind Carved</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2a}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(160,160,200,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Wind Carved</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function noise(x,y){
  return Math.sin(x*0.5+y*0.3)*0.4+Math.cos(y*0.7+x*0.2)*0.3+Math.sin(x*1.3+y*0.8)*0.2+Math.cos(x*0.1+y*0.15)*0.3;
}

function draw(){
  frame++;
  
  // Dark sky
  const sky=ctx.createLinearGradient(0,0,0,h*0.4);
  sky.addColorStop(0,'#1a1a2a');
  sky.addColorStop(1,'#2a2a3a');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,w,h);
  
  // Stars
  for(let i=0;i<60;i++){
    ctx.beginPath();
    ctx.arc((i*137.5)%w,(i*97.3)%h*0.3,0.5+Math.random()*0.3,0,Math.PI*2);
    ctx.fillStyle='rgba(200,200,220,0.1)';
    ctx.fill();
  }
  
  // Rock formations (hoodoos)
  const formations=8;
  for(let f=0;f<formations;f++){
    const baseX=w*0.05+f*w*0.12;
    const baseY=h*0.85;
    const height=h*0.3+Math.random()*h*0.25;
    const width=30+Math.random()*40;
    
    // Column
    const segments=15;
    for(let s=0;s<segments;s++){
      const t=s/segments;
      const y=baseY-height*t;
      const narrowing=1-t*0.4;
      const erosion=noise(baseX*0.01+t*3,f*10)*15*narrowing;
      const segW=width*narrowing+erosion;
      
      const hue=20+noise(baseX*0.01,f)*10;
      const sat=15+noise(f*10,baseX*0.01)*10;
      const lum=25+t*15+noise(baseX*0.01+t,f*5)*5;
      
      ctx.beginPath();
      ctx.ellipse(baseX+erosion*0.3,y,segW/2,height/segments*0.6,0,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue},${sat}%,${lum}%,0.7)`;
      ctx.fill();
      
      // Horizontal striations
      if(s%3===0){
        ctx.beginPath();
        ctx.moveTo(baseX-segW/2,y);
        ctx.lineTo(baseX+segW/2,y);
        ctx.strokeStyle=`rgba(60,50,40,${0.1+noise(s,f)*0.05})`;
        ctx.lineWidth=1;
        ctx.stroke();
      }
    }
    
    // Cap rock
    const capY=baseY-height;
    const capW=width*1.2;
    ctx.beginPath();
    ctx.ellipse(baseX,capY,capW/2,8,0,0,Math.PI*2);
    ctx.fillStyle=`hsla(${20+noise(f*20,0)*10},20%,35%,0.8)`;
    ctx.fill();
  }
  
  // Wind particles
  ctx.fillStyle='rgba(180,170,150,0.08)';
  for(let i=0;i<40;i++){
    const px=((frame*2+i*30)%w);
    const py=h*0.3+Math.sin(frame*0.01+i*2)*h*0.2;
    ctx.fillRect(px,py,3+Math.random()*5,1);
  }
  
  // Ground
  ctx.fillStyle='rgba(40,35,30,0.8)';
  ctx.fillRect(0,h*0.85,w,h*0.15);
  
  // Sand ripples
  ctx.strokeStyle='rgba(80,70,55,0.15)';
  ctx.lineWidth=0.5;
  for(let i=0;i<20;i++){
    const y=h*0.87+i*3;
    ctx.beginPath();
    for(let x=0;x<=w;x+=3){
      const yy=y+Math.sin(x*0.02+i+frame*0.003)*2;
      if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  
  // Desert haze
  const haze=ctx.createLinearGradient(0,h*0.6,0,h*0.85);
  haze.addColorStop(0,'transparent');
  haze.addColorStop(1,'rgba(60,50,40,0.15)');
  ctx.fillStyle=haze;
  ctx.fillRect(0,h*0.6,w,h*0.25);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
