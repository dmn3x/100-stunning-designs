<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Crystals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f8f0e0}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,140,100,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Sugar Crystals</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

const crystals=[];
for(let i=0;i<25;i++){
  crystals.push({
    x:Math.random()*w,y:Math.random()*h,
    size:5+Math.random()*25,
    rot:Math.random()*Math.PI,
    rotSpeed:(Math.random()-0.5)*0.002,
    sides:6,grow:0,growSpeed:0.003+Math.random()*0.005,
    hue:40+Math.random()*20,sat:15+Math.random()*10,
  });
}

function draw(){
  frame++;
  ctx.fillStyle='#f8f0e0';
  ctx.fillRect(0,0,w,h);
  
  // Solution background
  ctx.fillStyle='rgba(220,200,160,0.1)';
  for(let i=0;i<30;i++){
    ctx.beginPath();
    ctx.arc(Math.random()*w,Math.random()*h,20+Math.random()*40,0,Math.PI*2);
    ctx.fill();
  }
  
  // String/thread
  ctx.strokeStyle='rgba(150,130,100,0.15)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(w*0.3,0);
  ctx.quadraticCurveTo(w*0.4,h*0.3,w*0.35,h*0.6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(w*0.7,0);
  ctx.quadraticCurveTo(w*0.6,h*0.4,w*0.65,h*0.7);
  ctx.stroke();
  
  // Growing crystals on strings
  for(const crystal of crystals){
    crystal.grow=Math.min(1,crystal.grow+crystal.growSpeed);
    crystal.rot+=crystal.rotSpeed;
    
    const s=crystal.size*crystal.grow;
    if(s<1)continue;
    
    ctx.save();
    ctx.translate(crystal.x,crystal.y);
    ctx.rotate(crystal.rot);
    
    // Crystal body (hexagonal)
    ctx.beginPath();
    for(let i=0;i<crystal.sides;i++){
      const a=(i/crystal.sides)*Math.PI*2;
      const px=Math.cos(a)*s;
      const py=Math.sin(a)*s;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    
    // Glass-like fill
    const cg=ctx.createRadialGradient(-s*0.3,-s*0.3,0,0,0,s);
    cg.addColorStop(0,`hsla(${crystal.hue},${crystal.sat}%,85%,0.4)`);
    cg.addColorStop(0.5,`hsla(${crystal.hue},${crystal.sat}%,75%,0.3)`);
    cg.addColorStop(1,`hsla(${crystal.hue},${crystal.sat}%,65%,0.2)`);
    ctx.fillStyle=cg;
    ctx.fill();
    
    // Edges
    ctx.strokeStyle=`hsla(${crystal.hue},${crystal.sat}%,70%,0.3)`;
    ctx.lineWidth=1;
    ctx.stroke();
    
    // Internal refraction
    for(let i=0;i<crystal.sides;i++){
      const a=(i/crystal.sides)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*s*0.9,Math.sin(a)*s*0.9);
      ctx.strokeStyle=`hsla(${crystal.hue},${crystal.sat-5}%,80%,0.1)`;
      ctx.lineWidth=0.5;
      ctx.stroke();
    }
    
    // Highlight
    ctx.beginPath();
    ctx.arc(-s*0.2,-s*0.2,s*0.15,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.fill();
    
    ctx.restore();
  }
  
  // Floating sugar dust
  ctx.fillStyle='rgba(220,200,170,0.15)';
  for(let i=0;i<20;i++){
    const dx=(i*97.3+frame*0.1)%w;
    const dy=(i*73.7+frame*0.05)%h;
    ctx.fillRect(dx,dy,1,1);
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
