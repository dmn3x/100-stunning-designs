<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geode</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1612}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(160,120,200,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Geode</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function draw(){
  frame++;
  ctx.fillStyle='#1a1612';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  const R=Math.min(w,h)*0.38;
  
  // Outer rock shell
  ctx.beginPath();
  for(let a=0;a<=Math.PI*2;a+=0.02){
    const wobble=1+Math.sin(a*5)*0.03+Math.sin(a*11)*0.02;
    const r=R*wobble;
    const x=cx+Math.cos(a)*r;
    const y=cy+Math.sin(a)*r;
    if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle='#3a3028';
  ctx.fill();
  ctx.strokeStyle='rgba(60,50,40,0.5)';
  ctx.lineWidth=2;
  ctx.stroke();
  
  // Rough outer texture
  ctx.fillStyle='rgba(50,40,30,0.3)';
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2;
    const r=R*(0.9+Math.random()*0.15);
    ctx.beginPath();
    ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2+Math.random()*4,0,Math.PI*2);
    ctx.fill();
  }
  
  // Inner cavity (crystal-lined)
  ctx.save();
  ctx.beginPath();
  for(let a=0;a<=Math.PI*2;a+=0.02){
    const wobble=1+Math.sin(a*7+1)*0.05+Math.sin(a*13+2)*0.03;
    const r=R*0.7*wobble;
    const x=cx+Math.cos(a)*r;
    const y=cy+Math.sin(a)*r;
    if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.clip();
  
  // Dark interior
  const innerG=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.7);
  innerG.addColorStop(0,'#1a1620');
  innerG.addColorStop(0.5,'#201828');
  innerG.addColorStop(1,'#2a2030');
  ctx.fillStyle=innerG;
  ctx.fillRect(cx-R,cy-R,R*2,R*2);
  
  // Crystal formations pointing inward
  for(let i=0;i<30;i++){
    const angle=(i/30)*Math.PI*2;
    const baseR=R*0.65;
    const bx=cx+Math.cos(angle)*baseR;
    const by=cy+Math.sin(angle)*baseR;
    const len=20+Math.random()*40;
    const crystalAngle=angle+Math.PI; // Point inward
    
    const tipX=bx+Math.cos(crystalAngle)*len;
    const tipY=by+Math.sin(crystalAngle)*len;
    const width=4+Math.random()*6;
    
    const hue=260+Math.random()*60;
    const sat=30+Math.random()*30;
    const lum=40+Math.random()*25;
    
    // Crystal body
    ctx.beginPath();
    const perpAngle=crystalAngle+Math.PI/2;
    ctx.moveTo(bx+Math.cos(perpAngle)*width,by+Math.sin(perpAngle)*width);
    ctx.lineTo(tipX,tipY);
    ctx.lineTo(bx-Math.cos(perpAngle)*width,by-Math.sin(perpAngle)*width);
    ctx.closePath();
    
    const cg=ctx.createLinearGradient(bx,by,tipX,tipY);
    cg.addColorStop(0,`hsla(${hue},${sat}%,${lum}%,0.6)`);
    cg.addColorStop(0.5,`hsla(${hue+10},${sat+10}%,${lum+10}%,0.5)`);
    cg.addColorStop(1,`hsla(${hue+20},${sat-10}%,${lum+15}%,0.3)`);
    ctx.fillStyle=cg;
    ctx.fill();
    
    // Crystal edge
    ctx.strokeStyle=`hsla(${hue},${sat-10}%,${lum+20}%,0.2)`;
    ctx.lineWidth=0.5;
    ctx.stroke();
    
    // Highlight
    ctx.beginPath();
    ctx.moveTo(bx+Math.cos(perpAngle)*width*0.3,by+Math.sin(perpAngle)*width*0.3);
    ctx.lineTo(tipX,tipY);
    ctx.strokeStyle=`hsla(${hue},20%,80%,${0.1+Math.sin(frame*0.01+i)*0.05})`;
    ctx.lineWidth=0.5;
    ctx.stroke();
  }
  
  // Sparkles
  for(let i=0;i<10;i++){
    const sparkle=Math.sin(frame*0.02+i*3)*0.5+0.5;
    if(sparkle>0.7){
      const a=i*0.6+frame*0.001;
      const r=R*0.3+Math.sin(i*2)*R*0.2;
      const sx=cx+Math.cos(a)*r;
      const sy=cy+Math.sin(a)*r;
      ctx.beginPath();
      ctx.arc(sx,sy,2,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${sparkle*0.2})`;
      ctx.fill();
    }
  }
  
  ctx.restore();
  
  // Rock edge highlight
  ctx.strokeStyle='rgba(100,80,60,0.1)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let a=0;a<=Math.PI*2;a+=0.02){
    const wobble=1+Math.sin(a*5)*0.03;
    const r=R*wobble;
    const x=cx+Math.cos(a)*r;
    const y=cy+Math.sin(a)*r;
    if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.stroke();
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
