<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volcanic Glass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0e}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(160,140,180,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Volcanic Glass</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Glass shards
const shards=[];
for(let i=0;i<40;i++){
  shards.push({
    x:Math.random()*w,y:Math.random()*h,
    size:20+Math.random()*60,
    rot:Math.random()*Math.PI,
    rotSpeed:(Math.random()-0.5)*0.001,
    sides:3+Math.floor(Math.random()*3),
    hue:260+Math.random()*40,
    reflectAngle:Math.random()*Math.PI*2,
  });
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(10,10,14,0.95)';
  ctx.fillRect(0,0,w,h);
  
  // Background light sources
  const lights=[
    {x:w*0.3,y:h*0.2,hue:280,r:200},
    {x:w*0.7,y:h*0.4,hue:320,r:150},
    {x:w*0.5,y:h*0.7,hue:260,r:180},
  ];
  
  for(const l of lights){
    const g=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);
    g.addColorStop(0,`hsla(${l.hue},30%,30%,0.03)`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);
  }
  
  // Glass shards
  for(const shard of shards){
    shard.rot+=shard.rotSpeed;
    
    ctx.save();
    ctx.translate(shard.x,shard.y);
    ctx.rotate(shard.rot);
    
    // Shard shape
    ctx.beginPath();
    for(let i=0;i<shard.sides;i++){
      const a=(i/shard.sides)*Math.PI*2;
      const r=shard.size*(0.7+Math.sin(i*2)*0.3);
      const px=Math.cos(a)*r;
      const py=Math.sin(a)*r;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    
    // Glass fill — transparent with refraction
    ctx.fillStyle=`hsla(${shard.hue},20%,15%,0.15)`;
    ctx.fill();
    
    // Edge highlight
    ctx.strokeStyle=`hsla(${shard.hue},30%,50%,0.15)`;
    ctx.lineWidth=1;
    ctx.stroke();
    
    // Internal reflection
    const reflAngle=shard.reflectAngle+frame*0.002;
    const reflX=Math.cos(reflAngle)*shard.size*0.3;
    const reflY=Math.sin(reflAngle)*shard.size*0.3;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(reflX,reflY);
    ctx.strokeStyle=`hsla(${shard.hue},40%,70%,0.1)`;
    ctx.lineWidth=2;
    ctx.stroke();
    
    // Specular highlight
    const specX=-shard.size*0.2+Math.cos(frame*0.005+shard.x)*5;
    const specY=-shard.size*0.2+Math.sin(frame*0.003+shard.y)*5;
    ctx.beginPath();
    ctx.arc(specX,specY,3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fill();
    
    ctx.restore();
  }
  
  // Caustic light patterns
  for(let i=0;i<5;i++){
    const cx2=w*0.2+Math.sin(frame*0.003+i*2)*w*0.3;
    const cy2=h*0.2+Math.cos(frame*0.004+i*1.5)*h*0.3;
    const cr=30+Math.sin(frame*0.01+i)*15;
    ctx.beginPath();
    ctx.arc(cx2,cy2,cr,0,Math.PI*2);
    ctx.fillStyle='rgba(160,140,200,0.01)';
    ctx.fill();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
