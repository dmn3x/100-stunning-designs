<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cymatics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:600 .6rem/1 'SF Mono',monospace;letter-spacing:.35em;text-transform:uppercase;color:rgba(180,180,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Cymatics</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Particles arranged in cymatics patterns
const particleCount=2000;
const particles=[];
for(let i=0;i<particleCount;i++){
  const angle=Math.random()*Math.PI*2;
  const r=Math.random()*Math.min(w,h)*0.4;
  particles.push({
    baseX:Math.cos(angle)*r,
    baseY:Math.sin(angle)*r,
    x:0,y:0,
    r:1+Math.random()*1.5,
    phase:Math.random()*Math.PI*2,
    hue:200+Math.random()*80,
  });
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(10,10,15,0.95)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  const t=frame*0.005;
  
  // Chladni plate vibration modes
  const n=3+Math.floor(Math.sin(t*0.3)*2);
  const m=2+Math.floor(Math.cos(t*0.2)*1.5);
  
  // Update particles based on standing wave pattern
  for(const p of particles){
    const nx=p.baseX/(Math.min(w,h)*0.4);
    const ny=p.baseY/(Math.min(w,h)*0.4);
    
    // Chladni pattern — cos(n*pi*x)*cos(m*pi*y) + cos(m*pi*x)*cos(n*pi*y) = 0
    const pattern=Math.cos(n*Math.PI*nx)*Math.cos(m*Math.PI*ny)+
                  Math.cos(m*Math.PI*nx)*Math.cos(n*Math.PI*ny);
    
    // Displacement based on pattern
    const displace=pattern*20;
    const displaceAngle=Math.atan2(p.baseY,p.baseX)+pattern*0.5;
    
    p.x=cx+p.baseX+Math.cos(displaceAngle)*displace;
    p.y=cy+p.baseY+Math.sin(displaceAngle)*displace;
    
    // Pattern proximity (for coloring)
    const patternVal=Math.abs(pattern);
    
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*(0.5+patternVal*0.5),0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue+patternVal*40},50%,${40+patternVal*30}%,${0.1+patternVal*0.3})`;
    ctx.fill();
  }
  
  // Pattern lines (nodal lines)
  ctx.strokeStyle='rgba(150,160,220,0.05)';
  ctx.lineWidth=0.5;
  const step=5;
  for(let x=-Math.min(w,h)*0.4;x<Math.min(w,h)*0.4;x+=step){
    for(let y=-Math.min(w,h)*0.4;y<Math.min(w,h)*0.4;y+=step){
      const nx=x/(Math.min(w,h)*0.4);
      const ny=y/(Math.min(w,h)*0.4);
      const val=Math.cos(n*Math.PI*nx)*Math.cos(m*Math.PI*ny)+
                Math.cos(m*Math.PI*nx)*Math.cos(n*Math.PI*ny);
      if(Math.abs(val)<0.15){
        ctx.fillStyle=`rgba(150,160,220,${0.02*(1-Math.abs(val)/0.15)})`;
        ctx.fillRect(cx+x-1,cy+y-1,2,2);
      }
    }
  }
  
  // Mode label
  ctx.font='10px "SF Mono",monospace';
  ctx.fillStyle='rgba(180,180,220,0.2)';
  ctx.textAlign='center';
  ctx.fillText(`Mode (${n},${m})`,cx,h-30);
  ctx.fillText(`f = ${(n*100+m*50).toFixed(0)} Hz`,cx,h-15);
  
  // Circular boundary
  ctx.beginPath();
  ctx.arc(cx,cy,Math.min(w,h)*0.4,0,Math.PI*2);
  ctx.strokeStyle='rgba(150,160,220,0.06)';
  ctx.lineWidth=1;
  ctx.stroke();
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
