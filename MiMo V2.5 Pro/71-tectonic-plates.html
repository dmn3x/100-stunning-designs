<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tectonic Plates</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e14}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:600 .6rem/1 'SF Mono',monospace;letter-spacing:.35em;text-transform:uppercase;color:rgba(120,180,160,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Tectonic Plates</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Plates
const plates=[
  {x:0.3,y:0.4,vx:0.0003,vy:0,w:0.4,h:0.35,hue:120,name:'Plate A'},
  {x:0.6,y:0.45,vx:-0.0002,vy:0.0001,w:0.35,h:0.3,hue:200,name:'Plate B'},
  {x:0.2,y:0.7,vx:0.0001,vy:-0.0002,w:0.5,h:0.25,hue:30,name:'Plate C'},
  {x:0.7,y:0.2,vx:0,vy:0.0002,w:0.25,h:0.4,hue:280,name:'Plate D'},
];

function draw(){
  frame++;
  ctx.fillStyle='#0a0e14';
  ctx.fillRect(0,0,w,h);
  
  // Grid
  ctx.strokeStyle='rgba(80,120,140,0.03)';
  ctx.lineWidth=0.5;
  for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  
  // Update plates
  for(const p of plates){
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<0||p.x+p.w>1)p.vx*=-1;
    if(p.y<0||p.y+p.h>1)p.vy*=-1;
  }
  
  // Draw plate boundaries
  for(let i=0;i<plates.length;i++){
    for(let j=i+1;j<plates.length;j++){
      const a=plates[i],b=plates[j];
      // Check proximity
      const ax=a.x*w+a.w*w/2,ay=a.y*h+a.h*h/2;
      const bx=b.x*w+b.w*w/2,by=b.y*h+b.h*h/2;
      const dist=Math.sqrt((ax-bx)**2+(ay-by)**2);
      
      if(dist<Math.min(a.w,b.w)*w*0.8){
        // Boundary zone
        const midX=(ax+bx)/2,midY=(ay+by)/2;
        
        // Stress visualization
        ctx.beginPath();
        ctx.moveTo(ax,ay);
        ctx.lineTo(bx,by);
        ctx.strokeStyle=`rgba(200,100,50,${0.1+Math.sin(frame*0.02)*0.05})`;
        ctx.lineWidth=3;
        ctx.setLineDash([4,4]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Earthquake dots
        for(let e=0;e<3;e++){
          const ex=midX+(Math.random()-0.5)*30;
          const ey=midY+(Math.random()-0.5)*30;
          ctx.beginPath();
          ctx.arc(ex,ey,2,0,Math.PI*2);
          ctx.fillStyle='rgba(255,100,50,0.2)';
          ctx.fill();
        }
      }
    }
  }
  
  // Draw plates
  for(const p of plates){
    const px=p.x*w,py=p.y*h,pw=p.w*w,ph=p.h*h;
    
    // Plate body
    ctx.fillStyle=`hsla(${p.hue},30%,25%,0.3)`;
    ctx.fillRect(px,py,pw,ph);
    ctx.strokeStyle=`hsla(${p.hue},40%,40%,0.2)`;
    ctx.lineWidth=1;
    ctx.strokeRect(px,py,pw,ph);
    
    // Direction arrow
    const cx2=px+pw/2,cy2=py+ph/2;
    const arrowLen=20;
    const angle=Math.atan2(p.vy,p.vx);
    ctx.beginPath();
    ctx.moveTo(cx2,cy2);
    ctx.lineTo(cx2+Math.cos(angle)*arrowLen,cy2+Math.sin(angle)*arrowLen);
    ctx.strokeStyle=`hsla(${p.hue},50%,50%,0.3)`;
    ctx.lineWidth=2;
    ctx.stroke();
    // Arrowhead
    ctx.beginPath();
    ctx.moveTo(cx2+Math.cos(angle)*arrowLen,cy2+Math.sin(angle)*arrowLen);
    ctx.lineTo(cx2+Math.cos(angle-0.5)*(arrowLen-5),cy2+Math.sin(angle-0.5)*(arrowLen-5));
    ctx.moveTo(cx2+Math.cos(angle)*arrowLen,cy2+Math.sin(angle)*arrowLen);
    ctx.lineTo(cx2+Math.cos(angle+0.5)*(arrowLen-5),cy2+Math.sin(angle+0.5)*(arrowLen-5));
    ctx.stroke();
    
    // Label
    ctx.font='9px "SF Mono",monospace';
    ctx.fillStyle=`hsla(${p.hue},40%,50%,0.3)`;
    ctx.textAlign='center';
    ctx.fillText(p.name,cx2,cy2+5);
  }
  
  // Legend
  ctx.font='8px "SF Mono",monospace';
  ctx.fillStyle='rgba(120,180,160,0.15)';
  ctx.textAlign='left';
  ctx.fillText('PLATE VELOCITY: ~cm/yr',20,h-20);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
