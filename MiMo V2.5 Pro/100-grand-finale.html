<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Finale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04040a}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Grand Finale</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Multi-layered particles
const layers=[
  {particles:[],count:200,hue:280,speed:0.5,size:1},
  {particles:[],count:150,hue:200,speed:1,size:1.5},
  {particles:[],count:100,hue:320,speed:1.5,size:2},
  {particles:[],count:50,hue:160,speed:2,size:2.5},
];

for(const layer of layers){
  for(let i=0;i<layer.count;i++){
    layer.particles.push({
      x:Math.random()*2-1,
      y:Math.random()*2-1,
      z:Math.random(),
      vx:(Math.random()-0.5)*0.002,
      vy:(Math.random()-0.5)*0.002,
    });
  }
}

// Firework bursts
const bursts=[];
function addBurst(x,y){
  const hue=Math.random()*360;
  for(let i=0;i<50;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=1+Math.random()*4;
    bursts.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,
      decay:0.008+Math.random()*0.01,
      hue,
      size:1+Math.random()*2,
    });
  }
}

// Auto fireworks
setInterval(()=>{
  addBurst(w*0.2+Math.random()*w*0.6,h*0.2+Math.random()*h*0.4);
},3000);

c.addEventListener('click',e=>addBurst(e.clientX,e.clientY));

function draw(){
  frame++;
  ctx.fillStyle='rgba(4,4,10,0.1)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  
  // Deep space layers
  for(const layer of layers){
    for(const p of layer.particles){
      p.z-=layer.speed*0.0005;
      p.x+=p.vx;
      p.y+=p.vy;
      if(p.z<=0){p.x=Math.random()*2-1;p.y=Math.random()*2-1;p.z=1;}
      if(p.x<-1)p.x=1;if(p.x>1)p.x=-1;
      if(p.y<-1)p.y=1;if(p.y>1)p.y=-1;
      
      const sx=cx+p.x*w/p.z*0.5;
      const sy=cy+p.y*h/p.z*0.5;
      const size=layer.size/p.z;
      const alpha=(1-p.z)*0.5;
      
      if(sx<0||sx>w||sy<0||sy>h)continue;
      
      ctx.beginPath();
      ctx.arc(sx,sy,size,0,Math.PI*2);
      ctx.fillStyle=`hsla(${layer.hue},60%,60%,${alpha})`;
      ctx.fill();
    }
  }
  
  // Spiral galaxy overlay
  for(let arm=0;arm<3;arm++){
    ctx.beginPath();
    for(let i=0;i<200;i++){
      const t=i/200;
      const angle=t*Math.PI*4+arm*Math.PI*2/3+frame*0.002;
      const r=t*Math.min(w,h)*0.35;
      const x=cx+Math.cos(angle)*r;
      const y=cy+Math.sin(angle)*r*0.6;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=`hsla(${280+arm*40},50%,40%,0.02)`;
    ctx.lineWidth=10;
    ctx.stroke();
  }
  
  // Firework bursts
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];
    b.x+=b.vx;
    b.y+=b.vy;
    b.vy+=0.02;
    b.vx*=0.99;
    b.vy*=0.99;
    b.life-=b.decay;
    
    if(b.life<=0){bursts.splice(i,1);continue;}
    
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.size*b.life,0,Math.PI*2);
    ctx.fillStyle=`hsla(${b.hue},80%,60%,${b.life*0.5})`;
    ctx.fill();
    
    // Glow
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.size*b.life*3,0,Math.PI*2);
    ctx.fillStyle=`hsla(${b.hue},70%,50%,${b.life*0.08})`;
    ctx.fill();
  }
  
  // Center glow
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,150);
  cg.addColorStop(0,'rgba(200,180,255,0.03)');
  cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg;
  ctx.fillRect(0,0,w,h);
  
  // 100th file celebration text
  if(frame<300){
    const textAlpha=frame<60?frame/60:frame>240?(300-frame)/60:1;
    ctx.font='bold 24px Georgia';
    ctx.fillStyle=`rgba(255,255,255,${textAlpha*0.15})`;
    ctx.textAlign='center';
    ctx.fillText('100',cx,cy-10);
    ctx.font='12px "SF Mono",monospace';
    ctx.fillStyle=`rgba(200,200,220,${textAlpha*0.1})`;
    ctx.fillText('DESIGNS COMPLETE',cx,cy+15);
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
