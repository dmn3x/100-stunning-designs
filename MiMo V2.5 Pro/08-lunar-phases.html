<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Phases</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14}
canvas{display:block}
.label{position:fixed;top:1.5rem;width:100%;text-align:center;font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.5em;text-transform:uppercase;color:rgba(180,180,200,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Lunar Phases</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Stars
const stars=[];
for(let i=0;i<200;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+0.3,b:Math.random()});

function drawMoon(x,y,r,phase){
  // phase: 0=new, 0.25=first quarter, 0.5=full, 0.75=last quarter
  
  // Glow
  const glow=ctx.createRadialGradient(x,y,r*0.8,x,y,r*2.5);
  const glowIntensity=0.1+Math.sin(phase*Math.PI*2)*0.05;
  glow.addColorStop(0,`rgba(200,210,230,${glowIntensity})`);
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(x,y,r*2.5,0,Math.PI*2);
  ctx.fill();
  
  // Moon base (bright side)
  ctx.save();
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.clip();
  
  // Surface texture
  const surf=ctx.createRadialGradient(x-r*0.2,y-r*0.2,0,x,y,r);
  surf.addColorStop(0,'#e8e4d8');
  surf.addColorStop(0.5,'#d4d0c4');
  surf.addColorStop(1,'#b8b4a8');
  ctx.fillStyle=surf;
  ctx.fillRect(x-r,y-r,r*2,r*2);
  
  // Craters
  const craters=[
    {cx:-0.25,cy:-0.15,cr:0.12},{cx:0.1,cy:0.2,cr:0.08},
    {cx:-0.1,cy:0.3,cr:0.06},{cx:0.25,cy:-0.25,cr:0.1},
    {cx:0.05,cy:-0.05,cr:0.05},{cx:-0.3,cy:0.1,cr:0.07},
  ];
  for(const cr of craters){
    ctx.beginPath();
    ctx.arc(x+cr.cx*r,y+cr.cy*r,cr.cr*r,0,Math.PI*2);
    ctx.fillStyle='rgba(160,156,146,0.4)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x+cr.cx*r+cr.cr*r*0.2,y+cr.cy*r-cr.cr*r*0.2,cr.cr*r*0.7,0,Math.PI*2);
    ctx.fillStyle='rgba(200,196,186,0.2)';
    ctx.fill();
  }
  
  // Shadow
  const shadowX=x+Math.cos(phase*Math.PI*2)*r*0.5;
  const shadowPhase=phase*Math.PI*2;
  ctx.beginPath();
  if(phase<0.5){
    // Shadow on left side, shrinking
    const shadowExtent=r*Math.cos(shadowPhase);
    ctx.ellipse(x-shadowExtent*0.5,y,Math.abs(shadowExtent),r,0,0,Math.PI*2);
  }else{
    // Shadow on right side, growing
    const shadowExtent=r*Math.cos(shadowPhase);
    ctx.ellipse(x+shadowExtent*0.5,y,Math.abs(shadowExtent),r,0,0,Math.PI*2);
  }
  ctx.fillStyle='rgba(10,10,20,0.85)';
  ctx.fill();
  
  ctx.restore();
}

function draw(){
  frame++;
  ctx.fillStyle='#0a0a14';
  ctx.fillRect(0,0,w,h);
  
  // Stars
  for(const s of stars){
    const twinkle=0.5+Math.sin(frame*0.03+s.x*100)*0.5;
    ctx.beginPath();
    ctx.arc(s.x*w,s.y*h,s.r*twinkle,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,200,220,${0.3+s.b*0.5*twinkle})`;
    ctx.fill();
  }
  
  // 8 moons across the screen showing phases
  const count=8;
  const margin=Math.min(w,h)*0.12;
  const availW=w-margin*2;
  const moonR=Math.min(availW/(count*2.5),h*0.12);
  const cy=h*0.42;
  
  const phaseNames=['New','Waxing Crescent','First Quarter','Waxing Gibbous','Full','Waning Gibbous','Last Quarter','Waning Crescent'];
  
  for(let i=0;i<count;i++){
    const x=margin+(availW/(count-1))*i;
    const phase=i/count;
    drawMoon(x,cy,moonR,phase);
    
    // Label
    ctx.font=`${Math.max(9,moonR*0.28)}px Georgia`;
    ctx.fillStyle='rgba(180,180,200,0.3)';
    ctx.textAlign='center';
    ctx.fillText(phaseNames[i],x,cy+moonR+moonR*0.6);
  }
  
  // Orbiting satellite around center moon
  const centerX=margin+(availW/(count-1))*4;
  const orbitR=moonR*1.8;
  const angle=frame*0.01;
  const satX=centerX+Math.cos(angle)*orbitR;
  const satY=cy+Math.sin(angle)*orbitR;
  
  ctx.beginPath();
  ctx.arc(satX,satY,2,0,Math.PI*2);
  ctx.fillStyle='rgba(200,200,220,0.5)';
  ctx.fill();
  
  // Orbit ring
  ctx.beginPath();
  ctx.arc(centerX,cy,orbitR,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,200,220,0.06)';
  ctx.lineWidth=0.5;
  ctx.stroke();
  
  // Current date display
  const now=new Date();
  const dateStr=now.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  ctx.font='11px "SF Mono",monospace';
  ctx.fillStyle='rgba(180,180,200,0.2)';
  ctx.textAlign='center';
  ctx.fillText(dateStr,w/2,h*0.75);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
