<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism Garden</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,180,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Prism Garden</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Prisms
const prisms=[];
for(let i=0;i<5;i++){
  prisms.push({
    x:w*(0.15+i*0.18),y:h*0.5+Math.sin(i*1.5)*h*0.15,
    size:40+Math.random()*30,
    rot:Math.random()*Math.PI,
    rotSpeed:0.003+Math.random()*0.005,
    hue:i*60,
  });
}

// Light beams
const beams=[];
function generateBeams(){
  beams.length=0;
  for(const prism of prisms){
    const count=5;
    for(let i=0;i<count;i++){
      const angle=prism.rot+(i/(count-1)-0.5)*0.8;
      const hue=prism.hue+i*30;
      beams.push({
        x:prism.x,y:prism.y,
        angle,
        length:200+Math.random()*200,
        hue,
        alpha:0.15+Math.random()*0.1,
        width:2+Math.random()*3,
        prism,
      });
    }
  }
}

function drawTriangle(x,y,size,rot,hue,alpha){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2-Math.PI/2;
    const px=Math.cos(a)*size;
    const py=Math.sin(a)*size;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
  
  // Glass fill
  ctx.fillStyle=`hsla(${hue},30%,50%,${alpha*0.15})`;
  ctx.fill();
  ctx.strokeStyle=`hsla(${hue},40%,60%,${alpha*0.3})`;
  ctx.lineWidth=1.5;
  ctx.stroke();
  
  // Internal reflection
  ctx.beginPath();
  ctx.moveTo(0,-size*0.6);
  ctx.lineTo(-size*0.3,size*0.3);
  ctx.lineTo(size*0.3,size*0.3);
  ctx.closePath();
  ctx.fillStyle=`hsla(${hue},20%,80%,${alpha*0.08})`;
  ctx.fill();
  
  ctx.restore();
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(10,10,18,0.95)';
  ctx.fillRect(0,0,w,h);
  
  // Update prism positions
  for(const p of prisms){
    p.rot+=p.rotSpeed;
    p.y+=Math.sin(frame*0.005+p.x*0.01)*0.2;
  }
  
  generateBeams();
  
  // Light beams (background)
  for(const beam of beams){
    const ex=beam.x+Math.cos(beam.angle)*beam.length;
    const ey=beam.y+Math.sin(beam.angle)*beam.length;
    
    // Beam glow
    const g=ctx.createLinearGradient(beam.x,beam.y,ex,ey);
    g.addColorStop(0,`hsla(${beam.hue},80%,60%,${beam.alpha})`);
    g.addColorStop(0.5,`hsla(${beam.hue},70%,50%,${beam.alpha*0.5})`);
    g.addColorStop(1,`hsla(${beam.hue},60%,40%,0)`);
    
    ctx.beginPath();
    ctx.moveTo(beam.x,beam.y);
    ctx.lineTo(ex,ey);
    ctx.strokeStyle=g;
    ctx.lineWidth=beam.width;
    ctx.stroke();
    
    // Glow
    ctx.strokeStyle=`hsla(${beam.hue},80%,60%,${beam.alpha*0.1})`;
    ctx.lineWidth=beam.width*4;
    ctx.stroke();
  }
  
  // Prisms
  for(const p of prisms){
    drawTriangle(p.x,p.y,p.size,p.rot,p.hue,0.5);
  }
  
  // Caustic patterns on "floor"
  const floorY=h*0.85;
  for(let x=0;x<w;x+=3){
    let intensity=0;
    for(const beam of beams){
      const bx=beam.x+Math.cos(beam.angle)*beam.length;
      const dist=Math.abs(x-bx);
      intensity+=Math.max(0,1-dist/100)*beam.alpha;
    }
    const hue=(x/w)*360;
    ctx.fillStyle=`hsla(${hue},70%,50%,${intensity*0.3})`;
    ctx.fillRect(x,floorY,3,h-floorY);
  }
  
  // Rainbow spectrum bar
  for(let x=0;x<w;x++){
    const hue=(x/w)*360;
    ctx.fillStyle=`hsla(${hue},80%,50%,0.08)`;
    ctx.fillRect(x,floorY-3,1,3);
  }
  
  // Floating particles
  for(let i=0;i<20;i++){
    const px=w*0.1+Math.sin(frame*0.003+i*1.7)*w*0.4;
    const py=h*0.1+Math.cos(frame*0.004+i*2.3)*h*0.4;
    const hue=(frame+i*60)%360;
    ctx.beginPath();
    ctx.arc(px,py,1+Math.sin(frame*0.02+i)*0.5,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue},60%,60%,0.15)`;
    ctx.fill();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
