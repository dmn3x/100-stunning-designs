<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canyon Layers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#c8a878}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(100,70,40,.3);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Canyon Layers</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight;draw()}
resize();addEventListener('resize',resize);

function noise(x,seed){
  return Math.sin(x*0.8+seed)*0.5+Math.sin(x*1.7+seed*2)*0.3+Math.sin(x*3.1+seed*0.5)*0.2;
}

function draw(){
  // Sky
  const sky=ctx.createLinearGradient(0,0,0,h*0.4);
  sky.addColorStop(0,'#d8a868');
  sky.addColorStop(1,'#e8c088');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,w,h);
  
  // Canyon layers (geological strata)
  const layers=[
    {y:0.2,color:'#d4a060',shadow:'#c08840',name:'Kaibab Limestone'},
    {y:0.28,color:'#c89048',shadow:'#b07830',name:'Toroweap Formation'},
    {y:0.35,color:'#b87838',shadow:'#a06020',name:'Coconino Sandstone'},
    {y:0.42,color:'#a86828',shadow:'#905010',name:'Hermit Shale'},
    {y:0.48,color:'#985820',shadow:'#804008',name:'Supai Group'},
    {y:0.55,color:'#884818',shadow:'#703008',name:'Redwall Limestone'},
    {y:0.62,color:'#784010',shadow:'#602808',name:'Muav Limestone'},
    {y:0.68,color:'#683808',shadow:'#502008',name:'Bright Angel Shale'},
    {y:0.75,color:'#583008',shadow:'#401808',name:'Tapeats Sandstone'},
    {y:0.82,color:'#482808',shadow:'#301008',name:'Vishnu Schist'},
  ];
  
  // Canyon cut
  const canyonCenter=w*0.5;
  const canyonWidth=w*0.25;
  
  for(let l=layers.length-1;l>=0;l--){
    const layer=layers[l];
    const layerY=h*layer.y;
    const depthFactor=1-layer.y;
    
    // Canyon narrows at bottom
    const narrowing=depthFactor*0.3;
    const leftEdge=canyonCenter-canyonWidth*(1-narrowing);
    const rightEdge=canyonCenter+canyonWidth*(1-narrowing);
    
    // Left wall
    ctx.beginPath();
    ctx.moveTo(0,layerY);
    for(let x=0;x<=leftEdge;x+=3){
      const y=layerY+noise(x*0.005,l)*8;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(leftEdge,layerY+h*0.08);
    ctx.lineTo(0,layerY+h*0.08);
    ctx.closePath();
    
    const lg=ctx.createLinearGradient(0,layerY,0,layerY+h*0.08);
    lg.addColorStop(0,layer.color);
    lg.addColorStop(1,layer.shadow);
    ctx.fillStyle=lg;
    ctx.fill();
    
    // Right wall
    ctx.beginPath();
    ctx.moveTo(w,layerY);
    for(let x=w;x>=rightEdge;x-=3){
      const y=layerY+noise(x*0.005+100,l)*8;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(rightEdge,layerY+h*0.08);
    ctx.lineTo(w,layerY+h*0.08);
    ctx.closePath();
    ctx.fillStyle=lg;
    ctx.fill();
    
    // Layer line
    ctx.beginPath();
    for(let x=0;x<=w;x+=3){
      if(x>leftEdge&&x<rightEdge)continue;
      const y=layerY+noise(x*0.005,l)*8;
      if(x===0||x===rightEdge+3)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(0,0,0,0.08)';
    ctx.lineWidth=0.5;
    ctx.stroke();
    
    // Layer label
    ctx.font='7px "SF Mono",monospace';
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.textAlign='right';
    ctx.fillText(layer.name,15,layerY+10);
  }
  
  // Canyon floor (dark)
  ctx.fillStyle='rgba(40,25,10,0.8)';
  ctx.fillRect(0,h*0.9,w,h*0.1);
  
  // River at bottom
  ctx.beginPath();
  for(let x=canyonCenter-canyonWidth*0.3;x<=canyonCenter+canyonWidth*0.3;x+=3){
    const y=h*0.92+Math.sin(x*0.02)*3;
    if(x===canyonCenter-canyonWidth*0.3)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.strokeStyle='rgba(80,120,160,0.15)';
  ctx.lineWidth=3;
  ctx.stroke();
  
  // Shadow in canyon
  const cShadow=ctx.createLinearGradient(leftEdge,0,rightEdge,0);
  cShadow.addColorStop(0,'rgba(0,0,0,0.3)');
  cShadow.addColorStop(0.3,'rgba(0,0,0,0)');
  cShadow.addColorStop(0.7,'rgba(0,0,0,0)');
  cShadow.addColorStop(1,'rgba(0,0,0,0.3)');
  ctx.fillStyle=cShadow;
  ctx.fillRect(canyonCenter-canyonWidth,h*0.2,canyonWidth*2,h*0.7);
  
  // Sun
  ctx.beginPath();
  ctx.arc(w*0.8,h*0.1,20,0,Math.PI*2);
  ctx.fillStyle='rgba(255,230,180,0.4)';
  ctx.fill();
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
