<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soap Bubble</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2a}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,180,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Soap Bubble</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Floating bubbles
const bubbles=[];
for(let i=0;i<8;i++){
  bubbles.push({
    x:Math.random(),y:Math.random(),
    r:30+Math.random()*80,
    vx:(Math.random()-0.5)*0.001,
    vy:-0.0005-Math.random()*0.001,
    wobblePhase:Math.random()*Math.PI*2,
    hueOffset:Math.random()*360,
  });
}

function draw(){
  frame++;
  
  // Background
  const bg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.6);
  bg.addColorStop(0,'#2a2a3a');
  bg.addColorStop(1,'#12121a');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  
  // Subtle light source
  const lightX=w*0.3,lightY=h*0.2;
  const lg=ctx.createRadialGradient(lightX,lightY,0,lightX,lightY,300);
  lg.addColorStop(0,'rgba(200,200,255,0.05)');
  lg.addColorStop(1,'transparent');
  ctx.fillStyle=lg;
  ctx.fillRect(0,0,w,h);
  
  for(const b of bubbles){
    // Movement
    b.x+=b.vx+Math.sin(frame*0.005+b.wobblePhase)*0.0003;
    b.y+=b.vy;
    b.wobblePhase+=0.01;
    
    // Wrap
    if(b.y<-0.2)b.y=1.2;
    if(b.x<-0.2)b.x=1.2;
    if(b.x>1.2)b.x=-0.2;
    
    const bx=b.x*w,by=b.y*h;
    const r=b.r;
    
    // Bubble surface — iridescent thin film interference
    for(let ring=20;ring>=0;ring--){
      const t=ring/20;
      const rr=r*t;
      
      // Interference color based on viewing angle
      const angle=Math.atan2(by-h/2,bx-w/2);
      const interference=Math.sin(t*8+frame*0.01+b.hueOffset*0.01)*0.5+0.5;
      const hue=(b.hueOffset+interference*120+frame*0.3)%360;
      const sat=40+interference*30;
      const lum=30+t*25;
      const alpha=0.03+t*0.02;
      
      ctx.beginPath();
      ctx.arc(bx,by,rr,0,Math.PI*2);
      ctx.strokeStyle=`hsla(${hue},${sat}%,${lum}%,${alpha})`;
      ctx.lineWidth=r*0.05;
      ctx.stroke();
    }
    
    // Main bubble surface
    const surfaceG=ctx.createRadialGradient(bx-r*0.3,by-r*0.3,r*0.1,bx,by,r);
    surfaceG.addColorStop(0,'rgba(200,220,255,0.05)');
    surfaceG.addColorStop(0.5,'rgba(150,180,220,0.02)');
    surfaceG.addColorStop(0.9,'rgba(100,120,180,0.04)');
    surfaceG.addColorStop(1,'rgba(80,100,160,0.01)');
    ctx.beginPath();
    ctx.arc(bx,by,r,0,Math.PI*2);
    ctx.fillStyle=surfaceG;
    ctx.fill();
    
    // Highlight (main specular)
    ctx.beginPath();
    ctx.ellipse(bx-r*0.3,by-r*0.3,r*0.15,r*0.08,-0.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.fill();
    
    // Secondary highlight
    ctx.beginPath();
    ctx.ellipse(bx+r*0.2,by+r*0.25,r*0.08,r*0.04,0.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fill();
    
    // Edge rim
    ctx.beginPath();
    ctx.arc(bx,by,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(200,220,255,0.06)';
    ctx.lineWidth=1;
    ctx.stroke();
    
    // Rainbow shimmer
    for(let s=0;s<5;s++){
      const sa=(s/5)*Math.PI*2+frame*0.005;
      const sx=bx+Math.cos(sa)*r*0.7;
      const sy=by+Math.sin(sa)*r*0.7;
      const hue=(s*72+frame*0.5)%360;
      ctx.beginPath();
      ctx.arc(sx,sy,3,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue},60%,60%,0.04)`;
      ctx.fill();
    }
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
