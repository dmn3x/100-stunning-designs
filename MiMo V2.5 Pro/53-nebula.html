<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04040a}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,140,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Nebula</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Gas cloud particles
const particles=[];
for(let i=0;i<1500;i++){
  const angle=Math.random()*Math.PI*2;
  const r=Math.random()*Math.random();
  particles.push({
    x:Math.cos(angle)*r,
    y:Math.sin(angle)*r*0.6,
    r:3+Math.random()*8,
    hue:Math.random()*360,
    alpha:0.01+Math.random()*0.03,
    speed:0.0001+Math.random()*0.0003,
    orbitAngle:angle,
    orbitR:r,
  });
}

// Stars within nebula
const nebulaStars=[];
for(let i=0;i<100;i++){
  nebulaStars.push({
    x:Math.random()-0.5,y:(Math.random()-0.5)*0.6,
    r:Math.random()*1.5+0.3,b:Math.random(),
    twinkleSpeed:0.02+Math.random()*0.05,
  });
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(4,4,10,0.92)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  const scale=Math.min(w,h)*0.4;
  
  // Background stars
  for(let i=0;i<80;i++){
    const sx=(i*137.5)%w;
    const sy=(i*97.3)%h;
    ctx.beginPath();
    ctx.arc(sx,sy,0.3+Math.random()*0.3,0,Math.PI*2);
    ctx.fillStyle='rgba(200,200,220,0.08)';
    ctx.fill();
  }
  
  // Nebula gas clouds
  for(const p of particles){
    p.orbitAngle+=p.speed;
    const x=cx+(p.x+Math.cos(p.orbitAngle)*0.02)*scale;
    const y=cy+(p.y+Math.sin(p.orbitAngle)*0.015)*scale;
    
    const dist=Math.sqrt(p.x*p.x+p.y*p.y);
    const hue=(p.hue+frame*0.1+dist*100)%360;
    
    ctx.beginPath();
    ctx.arc(x,y,p.r*(1+Math.sin(frame*0.005+p.hue)*0.1),0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue},60%,40%,${p.alpha})`;
    ctx.fill();
  }
  
  // Bright central region
  for(let i=0;i<10;i++){
    const r=scale*(0.1+i*0.05);
    const intensity=0.03-i*0.002;
    const hue=280+Math.sin(frame*0.003+i)*20;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue},50%,50%,${intensity})`;
    ctx.fill();
  }
  
  // Pillars of creation (dense regions)
  for(let p=0;p<3;p++){
    const pAngle=p*2.1+frame*0.0005;
    const pDist=scale*0.3;
    const px=cx+Math.cos(pAngle)*pDist;
    const py=cy+Math.sin(pAngle)*pDist*0.6;
    
    for(let i=0;i<30;i++){
      const d=Math.random()*30;
      const a=Math.random()*Math.PI*2;
      const ix=px+Math.cos(a)*d;
      const iy=py+Math.sin(a)*d;
      ctx.beginPath();
      ctx.arc(ix,iy,2+Math.random()*5,0,Math.PI*2);
      const hue=300+p*40;
      ctx.fillStyle=`hsla(${hue},40%,35%,${0.02+Math.random()*0.02})`;
      ctx.fill();
    }
  }
  
  // Stars within nebula
  for(const s of nebulaStars){
    const sx=cx+s.x*scale;
    const sy=cy+s.y*scale;
    const twinkle=0.3+Math.sin(frame*s.twinkleSpeed+s.x*100)*0.7;
    
    ctx.beginPath();
    ctx.arc(sx,sy,s.r*twinkle,0,Math.PI*2);
    ctx.fillStyle=`rgba(220,220,255,${0.15+s.b*0.3*twinkle})`;
    ctx.fill();
    
    // Diffraction spikes
    if(s.r>1){
      const spikeLen=s.r*3*twinkle;
      ctx.strokeStyle=`rgba(200,200,255,${0.03*twinkle})`;
      ctx.lineWidth=0.5;
      ctx.beginPath();
      ctx.moveTo(sx-spikeLen,sy);ctx.lineTo(sx+spikeLen,sy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx,sy-spikeLen);ctx.lineTo(sx,sy+spikeLen);
      ctx.stroke();
    }
  }
  
  // Dust lanes
  for(let i=0;i<5;i++){
    ctx.beginPath();
    const startAngle=i*1.3+frame*0.0003;
    for(let a=0;a<Math.PI;a+=0.05){
      const r=scale*(0.2+a*0.15);
      const x=cx+Math.cos(startAngle+a)*r;
      const y=cy+Math.sin(startAngle+a)*r*0.6;
      if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(40,20,60,0.04)';
    ctx.lineWidth=10;
    ctx.stroke();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
