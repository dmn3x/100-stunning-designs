<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lava Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0808}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(220,100,40,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Lava Flow</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Lava particles
const lava=[];
for(let i=0;i<200;i++){
  lava.push({
    x:Math.random()*w,y:h*0.3+Math.random()*h*0.7,
    vx:(Math.random()-0.5)*0.5,vy:0.2+Math.random()*0.5,
    r:2+Math.random()*5,
    hue:Math.random()*30,
    heat:0.5+Math.random()*0.5,
  });
}

function draw(){
  frame++;
  
  // Background
  ctx.fillStyle='#1a0808';
  ctx.fillRect(0,0,w,h);
  
  // Volcanic glow from top
  const topGlow=ctx.createRadialGradient(w*0.5,h*0.1,10,w*0.5,h*0.1,300);
  topGlow.addColorStop(0,'rgba(255,120,20,0.1)');
  topGlow.addColorStop(0.5,'rgba(200,60,10,0.04)');
  topGlow.addColorStop(1,'transparent');
  ctx.fillStyle=topGlow;
  ctx.fillRect(0,0,w,h);
  
  // Lava channels
  for(let ch=0;ch<3;ch++){
    ctx.beginPath();
    const startX=w*0.3+ch*w*0.2;
    ctx.moveTo(startX,h*0.2);
    for(let y=h*0.2;y<h;y+=5){
      const x=startX+Math.sin(y*0.01+ch+frame*0.005)*40+Math.sin(y*0.03+ch*2)*15;
      ctx.lineTo(x,y);
    }
    const lg=ctx.createLinearGradient(0,h*0.2,0,h);
    lg.addColorStop(0,'rgba(255,100,20,0.15)');
    lg.addColorStop(0.5,'rgba(200,50,10,0.1)');
    lg.addColorStop(1,'rgba(150,30,5,0.05)');
    ctx.strokeStyle=lg;
    ctx.lineWidth=20+Math.sin(frame*0.02+ch)*5;
    ctx.stroke();
    
    // Bright center
    ctx.strokeStyle='rgba(255,180,60,0.08)';
    ctx.lineWidth=5;
    ctx.stroke();
  }
  
  // Lava blobs
  for(const p of lava){
    p.x+=p.vx+Math.sin(frame*0.01+p.x*0.01)*0.3;
    p.y+=p.vy;
    if(p.y>h+10){p.y=h*0.2;p.x=w*0.2+Math.random()*w*0.6;}
    
    const heat=p.heat*(0.7+Math.sin(frame*0.02+p.x*0.05)*0.3);
    
    // Glow
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
    g.addColorStop(0,`rgba(255,${100+heat*100},20,${heat*0.15})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
    ctx.fill();
    
    // Core
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${150+heat*100},${50+heat*50},${heat*0.4})`;
    ctx.fill();
  }
  
  // Cooling crust (dark patches)
  for(let i=0;i<20;i++){
    const cx2=w*0.1+i*w*0.04;
    const cy2=h*0.5+Math.sin(i*3)*h*0.2;
    ctx.beginPath();
    ctx.arc(cx2,cy2,15+Math.sin(frame*0.01+i)*5,0,Math.PI*2);
    ctx.fillStyle='rgba(20,8,5,0.3)';
    ctx.fill();
  }
  
  // Smoke
  for(let i=0;i<5;i++){
    const sx=w*0.3+Math.sin(frame*0.002+i*2)*w*0.2;
    const sy=h*0.1+Math.cos(frame*0.003+i)*30;
    ctx.beginPath();
    ctx.arc(sx,sy,30+Math.sin(frame*0.005+i)*10,0,Math.PI*2);
    ctx.fillStyle='rgba(60,50,40,0.03)';
    ctx.fill();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
