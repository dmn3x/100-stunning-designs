<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0806}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(200,140,60,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Embers</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

const embers=[];
for(let i=0;i<150;i++){
  embers.push({
    x:Math.random()*w,y:h-Math.random()*h*0.3,
    vx:(Math.random()-0.5)*0.3,vy:-(0.2+Math.random()*0.8),
    r:1+Math.random()*3,
    heat:Math.random(),
    life:100+Math.random()*200,
    maxLife:100+Math.random()*200,
    wobble:Math.random()*Math.PI*2,
  });
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(10,8,6,0.15)';
  ctx.fillRect(0,0,w,h);
  
  // Ground glow
  const groundG=ctx.createLinearGradient(0,h*0.7,0,h);
  groundG.addColorStop(0,'transparent');
  groundG.addColorStop(1,'rgba(100,40,10,0.03)');
  ctx.fillStyle=groundG;
  ctx.fillRect(0,0,w,h);
  
  // Embers
  for(let i=embers.length-1;i>=0;i--){
    const e=embers[i];
    e.life--;
    if(e.life<=0){
      e.x=w*0.3+Math.random()*w*0.4;
      e.y=h*0.8+Math.random()*h*0.2;
      e.life=e.maxLife;
      e.heat=Math.random();
    }
    
    e.wobble+=0.02;
    e.vx+=Math.sin(e.wobble)*0.02;
    e.vy-=0.001;
    e.vx*=0.99;
    e.vy*=0.999;
    e.x+=e.vx;
    e.y+=e.vy;
    
    if(e.y<-20||e.x<-20||e.x>w+20){
      e.y=h+10;
      e.x=w*0.3+Math.random()*w*0.4;
    }
    
    const lifeRatio=e.life/e.maxLife;
    const brightness=e.heat*lifeRatio;
    
    // Glow
    const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*4);
    g.addColorStop(0,`rgba(255,${100+brightness*100},${20+brightness*30},${brightness*0.1})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r*4,0,Math.PI*2);
    ctx.fill();
    
    // Core
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r*brightness,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${150+brightness*100},${50+brightness*50},${brightness*0.6})`;
    ctx.fill();
  }
  
  while(embers.length>200)embers.shift();
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
