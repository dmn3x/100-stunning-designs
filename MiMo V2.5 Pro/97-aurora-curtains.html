<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Curtains</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06080e}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(100,220,160,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Aurora Curtains</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function draw(){
  frame++;
  ctx.fillStyle='rgba(6,8,14,0.9)';
  ctx.fillRect(0,0,w,h);
  
  // Stars
  for(let i=0;i<80;i++){
    const twinkle=0.3+Math.sin(frame*0.03+i*7)*0.7;
    ctx.beginPath();
    ctx.arc((i*137.5)%w,(i*97.3)%h*0.5,0.5*twinkle,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,200,220,${0.1+twinkle*0.15})`;
    ctx.fill();
  }
  
  // Aurora curtains
  for(let c2=0;c2<8;c2++){
    ctx.beginPath();
    const baseY=h*0.08+c2*h*0.04;
    
    for(let x=0;x<=w;x+=2){
      const wave1=Math.sin(x*0.004+frame*0.006+c2*1.2)*h*0.12;
      const wave2=Math.sin(x*0.009+frame*0.01+c2*1.8)*h*0.05;
      const wave3=Math.sin(x*0.002+frame*0.004)*h*0.08;
      const y=baseY+wave1+wave2+wave3;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    
    ctx.lineTo(w,baseY+h*0.3);
    ctx.lineTo(0,baseY+h*0.3);
    ctx.closePath();
    
    const hue=120+c2*25+Math.sin(frame*0.005)*15;
    const alpha=0.04-c2*0.004;
    
    const g=ctx.createLinearGradient(0,baseY-h*0.05,0,baseY+h*0.3);
    g.addColorStop(0,`hsla(${hue},80%,50%,0)`);
    g.addColorStop(0.2,`hsla(${hue},80%,50%,${alpha})`);
    g.addColorStop(0.5,`hsla(${hue+20},70%,45%,${alpha*0.7})`);
    g.addColorStop(0.8,`hsla(${hue+40},60%,40%,${alpha*0.3})`);
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.fill();
  }
  
  // Vertical rays
  for(let i=0;i<12;i++){
    const rx=w*0.05+Math.sin(frame*0.002+i*1.3)*w*0.4+w*0.25;
    const rayH=h*0.25+Math.sin(frame*0.008+i*2)*h*0.1;
    const hue=140+i*15;
    
    ctx.beginPath();
    ctx.moveTo(rx-2,h*0.05);
    ctx.lineTo(rx+2,h*0.05);
    ctx.lineTo(rx+1+Math.sin(frame*0.01+i)*3,h*0.05+rayH);
    ctx.lineTo(rx-1-Math.sin(frame*0.01+i)*3,h*0.05+rayH);
    ctx.closePath();
    ctx.fillStyle=`hsla(${hue},70%,50%,${0.015+Math.sin(frame*0.02+i)*0.01})`;
    ctx.fill();
  }
  
  // Ground
  ctx.fillStyle='#0a0e14';
  ctx.beginPath();
  ctx.moveTo(0,h*0.85);
  for(let x=0;x<=w;x+=5){
    ctx.lineTo(x,h*0.85-Math.sin(x*0.005)*h*0.03-Math.abs(Math.sin(x*0.001))*h*0.04);
  }
  ctx.lineTo(w,h);
  ctx.lineTo(0,h);
  ctx.fill();
  
  // Trees
  for(let i=0;i<12;i++){
    const tx=w*0.05+i*w*0.08;
    const ty=h*0.83-Math.sin(tx*0.005)*h*0.03;
    ctx.fillStyle='#0a0e14';
    ctx.beginPath();
    ctx.moveTo(tx,ty);
    ctx.lineTo(tx-4,ty);
    ctx.lineTo(tx,ty-15-Math.random()*15);
    ctx.lineTo(tx+4,ty);
    ctx.fill();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
