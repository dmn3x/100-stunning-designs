<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hourglass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1610}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(200,180,130,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Hourglass</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Sand particles
const grains=[];
const maxGrains=200;
let topGrains=150,bottomGrains=0;

for(let i=0;i<maxGrains;i++){
  grains.push({
    x:0,y:0,vx:0,vy:0,
    phase:Math.random()*Math.PI*2,
    size:1+Math.random()*2,
    inTop:i<150,
    settled:false,
    settleY:0,
  });
}

function draw(){
  frame++;
  
  const bg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.6);
  bg.addColorStop(0,'#1e1a14');
  bg.addColorStop(1,'#12100c');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  const bulbH=Math.min(w,h)*0.35;
  const bulbW=bulbH*0.5;
  const neckW=5;
  const frameH=bulbH*2+20;
  
  // Frame
  ctx.strokeStyle='rgba(180,160,120,0.3)';
  ctx.lineWidth=3;
  // Top plate
  ctx.beginPath();
  ctx.moveTo(cx-bulbW*1.1,cy-bulbH-10);
  ctx.lineTo(cx+bulbW*1.1,cy-bulbH-10);
  ctx.stroke();
  // Bottom plate
  ctx.beginPath();
  ctx.moveTo(cx-bulbW*1.1,cy+bulbH+10);
  ctx.lineTo(cx+bulbW*1.1,cy+bulbH+10);
  ctx.stroke();
  // Pillars
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-bulbW*1.1,cy-bulbH-10);
  ctx.lineTo(cx-bulbW*1.1,cy+bulbH+10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+bulbW*1.1,cy-bulbH-10);
  ctx.lineTo(cx+bulbW*1.1,cy+bulbH+10);
  ctx.stroke();
  
  // Glass bulb outlines
  ctx.strokeStyle='rgba(200,190,160,0.15)';
  ctx.lineWidth=1.5;
  
  // Top bulb
  ctx.beginPath();
  ctx.moveTo(cx-bulbW,cy-bulbH);
  ctx.quadraticCurveTo(cx-bulbW,cy-neckW,cx-neckW,cy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+bulbW,cy-bulbH);
  ctx.quadraticCurveTo(cx+bulbW,cy-neckW,cx+neckW,cy);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx,cy-bulbH,bulbW,0,Math.PI,true);
  ctx.stroke();
  
  // Bottom bulb
  ctx.beginPath();
  ctx.moveTo(cx-neckW,cy);
  ctx.quadraticCurveTo(cx-bulbW,cy+neckW,cx-bulbW,cy+bulbH);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+neckW,cy);
  ctx.quadraticCurveTo(cx+bulbW,cy+neckW,cx+bulbW,cy+bulbH);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx,cy+bulbH,bulbW,Math.PI,0,true);
  ctx.stroke();
  
  // Glass tint
  ctx.fillStyle='rgba(200,190,160,0.02)';
  ctx.beginPath();
  ctx.moveTo(cx-bulbW,cy-bulbH);
  ctx.quadraticCurveTo(cx-bulbW,cy-neckW,cx-neckW,cy);
  ctx.quadraticCurveTo(cx-bulbW,cy+neckW,cx-bulbW,cy+bulbH);
  ctx.arc(cx,cy+bulbH,bulbW,Math.PI,0,true);
  ctx.quadraticCurveTo(cx+bulbW,cy+neckW,cx+neckW,cy);
  ctx.quadraticCurveTo(cx+bulbW,cy-neckW,cx+bulbW,cy-bulbH);
  ctx.arc(cx,cy-bulbH,bulbW,0,Math.PI,true);
  ctx.fill();
  
  // Sand stream through neck
  ctx.fillStyle='rgba(200,170,100,0.4)';
  for(let i=0;i<3;i++){
    const sx=cx+(Math.random()-0.5)*3;
    const sy=cy+Math.random()*10;
    ctx.fillRect(sx,sy,1,2);
  }
  
  // Update grains
  let topCount=0,botCount=0;
  for(const g of grains){
    if(g.inTop){
      topCount++;
      if(!g.settled){
        // Falling through neck
        g.vy+=0.02;
        g.y+=g.vy;
        g.x+=(Math.random()-0.5)*0.5;
        
        // Check if passed through neck
        if(g.y>0){
          g.inTop=false;
          g.y=0;
          g.vy=0.5;
          g.x=(Math.random()-0.5)*5;
        }
      }else{
        // Sitting in top bulb
        g.x+=Math.sin(frame*0.01+g.phase)*0.05;
      }
    }else{
      botCount++;
      if(!g.settled){
        g.vy+=0.01;
        g.y+=g.vy;
        g.x+=(Math.random()-0.5)*0.3;
        
        // Settle at bottom
        const settleLevel=bulbH*0.8-botCount*0.3;
        if(g.y>settleLevel){
          g.settled=true;
          g.y=settleLevel;
          g.settleY=settleLevel;
        }
      }else{
        g.x+=Math.sin(frame*0.008+g.phase)*0.02;
      }
    }
    
    // Draw grain
    let gx,gy;
    if(g.inTop){
      gx=cx+g.x*8;
      gy=cy-bulbH*0.3+g.y;
    }else{
      gx=cx+g.x*8;
      gy=cy+20+g.y;
    }
    
    // Keep within bulb bounds
    const topBound=cy-bulbH;
    const botBound=cy+bulbH;
    
    ctx.beginPath();
    ctx.arc(gx,gy,g.size,0,Math.PI*2);
    ctx.fillStyle='rgba(200,170,100,0.4)';
    ctx.fill();
  }
  
  // Sand surface in top (curved)
  const topSandH=Math.max(0,topCount*0.4);
  if(topSandH>0){
    ctx.beginPath();
    ctx.moveTo(cx-bulbW*0.8,cy-bulbH*0.3+topSandH);
    ctx.quadraticCurveTo(cx,cy-bulbH*0.3+topSandH-5,cx+bulbW*0.8,cy-bulbH*0.3+topSandH);
    ctx.lineTo(cx+bulbW*0.8,cy);
    ctx.lineTo(cx-bulbW*0.8,cy);
    ctx.closePath();
    ctx.fillStyle='rgba(200,170,100,0.15)';
    ctx.fill();
  }
  
  // Sand surface in bottom
  const botSandH=Math.min(bulbH*0.8,botCount*0.4);
  if(botSandH>0){
    ctx.beginPath();
    ctx.moveTo(cx-bulbW*0.8,cy+bulbH*0.8-botSandH);
    ctx.quadraticCurveTo(cx,cy+bulbH*0.8-botSandH+5,cx+bulbW*0.8,cy+bulbH*0.8-botSandH);
    ctx.lineTo(cx+bulbW*0.8,cy+bulbH);
    ctx.quadraticCurveTo(cx,cy+bulbH+bulbW,cx-bulbW*0.8,cy+bulbH);
    ctx.closePath();
    ctx.fillStyle='rgba(200,170,100,0.2)';
    ctx.fill();
  }
  
  // Refill cycle
  if(topCount<5){
    for(const g of grains){
      if(!g.inTop){
        g.inTop=true;
        g.settled=false;
        g.y=-bulbH*0.5+Math.random()*bulbH*0.3;
        g.vy=0;
        g.x=(Math.random()-0.5)*bulbW*0.5;
      }
    }
  }
  
  // Ambient light
  const ambG=ctx.createRadialGradient(cx-bulbW*0.3,cy-bulbH*0.3,0,cx,cy,frameH*0.6);
  ambG.addColorStop(0,'rgba(255,240,200,0.02)');
  ambG.addColorStop(1,'transparent');
  ctx.fillStyle=ambG;
  ctx.fillRect(0,0,w,h);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
