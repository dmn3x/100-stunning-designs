<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Loom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1612}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:2rem;font:600 .6rem/1 'SF Mono',monospace;letter-spacing:.35em;text-transform:uppercase;color:rgba(200,180,150,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Digital Loom</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

const ROWS=40,COLS=60;
const pattern=[];
for(let j=0;j<ROWS;j++){
  pattern[j]=[];
  for(let i=0;i<COLS;i++){
    pattern[j][i]=(i+j)%3===0?1:(i*3+j*7)%5===0?2:0;
  }
}

function draw(){
  frame++;
  ctx.fillStyle='#1a1612';
  ctx.fillRect(0,0,w,h);
  
  const gapX=w/(COLS+1);
  const gapY=h/(ROWS+1);
  const offX=gapX;
  const offY=gapY;
  
  // Warp threads (vertical)
  for(let i=0;i<COLS;i++){
    const x=offX+i*gapX;
    ctx.beginPath();
    ctx.moveTo(x,0);
    for(let j=0;j<=ROWS;j++){
      const y=offY+j*gapY;
      const wave=Math.sin(frame*0.015+i*0.3+j*0.1)*2;
      ctx.lineTo(x+wave,y);
    }
    ctx.strokeStyle=`hsla(${30+i*2},40%,35%,0.4)`;
    ctx.lineWidth=1.5;
    ctx.stroke();
  }
  
  // Weft threads (horizontal)
  for(let j=0;j<ROWS;j++){
    const y=offY+j*gapY;
    ctx.beginPath();
    ctx.moveTo(0,y);
    for(let i=0;i<=COLS;i++){
      const x=offX+i*gapX;
      const over=pattern[j][i%COLS]>0;
      const wave=Math.sin(frame*0.02+j*0.4+i*0.1)*(over?3:1);
      ctx.lineTo(x,y+wave);
    }
    ctx.strokeStyle=`hsla(${120+j*4},30%,45%,0.5)`;
    ctx.lineWidth=2;
    ctx.stroke();
  }
  
  // Knot intersections
  for(let j=0;j<ROWS;j++){
    for(let i=0;i<COLS;i++){
      if(pattern[j][i]>0){
        const x=offX+i*gapX;
        const y=offY+j*gapY;
        const pulse=Math.sin(frame*0.03+i+j)*0.5+0.5;
        ctx.beginPath();
        ctx.arc(x,y,2+pulse*2,0,Math.PI*2);
        const hue=pattern[j][i]===1?30+Math.sin(frame*0.01)*20:160+Math.cos(frame*0.01)*20;
        ctx.fillStyle=`hsla(${hue},60%,55%,${0.3+pulse*0.3})`;
        ctx.fill();
      }
    }
  }
  
  // Shuttle animation
  const shuttleY=offY+((frame*0.5)%((ROWS)*gapY));
  const rowIdx=Math.floor(shuttleY/gapY)%ROWS;
  ctx.beginPath();
  ctx.moveTo(0,shuttleY);
  ctx.lineTo(w,shuttleY);
  ctx.strokeStyle='rgba(220,180,100,0.15)';
  ctx.lineWidth=gapY*0.6;
  ctx.stroke();
  
  // Frame border
  ctx.strokeStyle='rgba(200,180,150,0.1)';
  ctx.lineWidth=2;
  ctx.strokeRect(gapX*0.5,gapY*0.5,w-gapX,h-gapY);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
