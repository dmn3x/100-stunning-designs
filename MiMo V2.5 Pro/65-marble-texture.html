<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Texture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f0ece4}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(100,90,70,.3);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Marble Texture</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight;draw()}
resize();addEventListener('resize',resize);

function noise(x,y,seed){
  return Math.sin(x*0.01+seed)*Math.cos(y*0.013+seed*2)*0.5+
         Math.sin(x*0.02+y*0.017+seed*3)*0.3+
         Math.cos(x*0.005-y*0.008+seed)*0.4;
}

function draw(){
  // Base marble color
  ctx.fillStyle='#e8e0d0';
  ctx.fillRect(0,0,w,h);
  
  // Marble veins
  const imageData=ctx.getImageData(0,0,w,h);
  const data=imageData.data;
  
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx=(y*w+x)*4;
      
      // Multi-octave vein noise
      let vein=0;
      vein+=noise(x,y,0)*0.5;
      vein+=noise(x*2,y*2,10)*0.25;
      vein+=noise(x*4,y*4,20)*0.125;
      vein+=noise(x*8,y*8,30)*0.0625;
      
      // Vein threshold
      const veinVal=Math.abs(vein);
      const veinLine=1-Math.min(1,Math.max(0,(veinVal-0.1)*10));
      
      // Color
      const baseR=232,baseG=224,baseB=208;
      const veinR=180,veinG=170,veinB=160;
      const darkR=120,darkG=110,darkB=100;
      
      let r=baseR,g=baseG,b=baseB;
      
      // Apply veins
      r=r+(veinR-r)*veinLine*0.4;
      g=g+(veinG-g)*veinLine*0.4;
      b=b+(veinB-b)*veinLine*0.4;
      
      // Dark veins
      if(veinVal<0.05){
        const darkFactor=1-veinVal/0.05;
        r=r+(darkR-r)*darkFactor*0.3;
        g=g+(darkG-g)*darkFactor*0.3;
        b=b+(darkB-b)*darkFactor*0.3;
      }
      
      // Subtle variation
      const micro=noise(x*10,y*10,50)*5;
      r+=micro;g+=micro;b+=micro;
      
      data[idx]=Math.max(0,Math.min(255,r));
      data[idx+1]=Math.max(0,Math.min(255,g));
      data[idx+2]=Math.max(0,Math.min(255,b));
    }
  }
  
  ctx.putImageData(imageData,0,0);
  
  // Polish shine
  const shine=ctx.createRadialGradient(w*0.3,h*0.3,0,w*0.5,h*0.5,Math.max(w,h)*0.5);
  shine.addColorStop(0,'rgba(255,255,250,0.08)');
  shine.addColorStop(0.5,'rgba(255,255,250,0.02)');
  shine.addColorStop(1,'transparent');
  ctx.fillStyle=shine;
  ctx.fillRect(0,0,w,h);
}

draw();
</script>
</body>
</html>
