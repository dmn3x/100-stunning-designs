<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Helix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:600 .6rem/1 'SF Mono',monospace;letter-spacing:.35em;text-transform:uppercase;color:rgba(140,180,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">DNA Helix</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function draw(){
  frame++;
  ctx.fillStyle='rgba(10,10,20,0.95)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2;
  const amplitude=Math.min(w,h)*0.15;
  const steps=60;
  const twist=frame*0.01;
  
  // Draw helix
  const points1=[];
  const points2=[];
  
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const y=t*h;
    const angle=t*Math.PI*6+twist;
    
    const x1=cx+Math.sin(angle)*amplitude;
    const x2=cx+Math.sin(angle+Math.PI)*amplitude;
    const z1=Math.cos(angle);
    const z2=Math.cos(angle+Math.PI);
    
    points1.push({x:x1,y,y,z:z1});
    points2.push({x:x2,y,z:z2});
  }
  
  // Draw backbone strands
  for(let strand=0;strand<2;strand++){
    const points=strand===0?points1:points2;
    const hue=strand===0?200:340;
    
    ctx.beginPath();
    for(let i=0;i<points.length;i++){
      const p=points[i];
      if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle=`hsla(${hue},60%,55%,0.4)`;
    ctx.lineWidth=3;
    ctx.stroke();
    
    // Nucleotide dots
    for(let i=0;i<points.length;i+=3){
      const p=points[i];
      const size=2+Math.abs(p.z)*2;
      ctx.beginPath();
      ctx.arc(p.x,p.y,size,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue},70%,65%,${0.3+Math.abs(p.z)*0.3})`;
      ctx.fill();
    }
  }
  
  // Base pairs (connecting rungs)
  for(let i=0;i<points1.length;i+=3){
    const p1=points1[i];
    const p2=points2[i];
    const avgZ=(p1.z+p2.z)/2;
    
    // Rung
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.strokeStyle=`rgba(180,200,220,${0.08+Math.abs(avgZ)*0.08})`;
    ctx.lineWidth=1.5;
    ctx.stroke();
    
    // Base pair colors (A-T, G-C)
    const baseType=i%6;
    const colors=[[200,80,80],[80,200,80],[80,80,200],[200,200,80]];
    const color=colors[baseType/3|0];
    const midX=(p1.x+p2.x)/2;
    const midY=(p1.y+p2.y)/2;
    
    ctx.beginPath();
    ctx.arc(midX,midY,2,0,Math.PI*2);
    ctx.fillStyle=`rgba(${color[0]},${color[1]},${color[2]},${0.15+Math.abs(avgZ)*0.1})`;
    ctx.fill();
  }
  
  // Glow along backbone
  for(let i=0;i<points1.length;i++){
    const p=points1[i];
    if(Math.abs(p.z)>0.8){
      ctx.beginPath();
      ctx.arc(p.x,p.y,5,0,Math.PI*2);
      ctx.fillStyle='rgba(100,160,255,0.03)';
      ctx.fill();
    }
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
