<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underwater Caustics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a2a3a}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(80,180,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Underwater Caustics</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Caustic grid points
const gridSize=30;

function draw(){
  frame++;
  
  // Deep water gradient
  const bg=ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#1a4a5a');
  bg.addColorStop(0.3,'#0e3a4a');
  bg.addColorStop(0.7,'#082a3a');
  bg.addColorStop(1,'#041a28');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  
  // Caustic light patterns
  const t=frame*0.01;
  
  for(let y=0;y<h;y+=gridSize){
    for(let x=0;x<w;x+=gridSize){
      // Multiple wave sources for caustic interference
      let val=0;
      val+=Math.sin(x*0.02+y*0.015+t)*0.5;
      val+=Math.sin(x*0.015-y*0.02+t*1.3)*0.3;
      val+=Math.cos(x*0.025+y*0.02+t*0.7)*0.4;
      val+=Math.sin((x+y)*0.01+t*1.1)*0.2;
      
      // Caustic effect — sharp bright lines where waves focus
      const caustic=Math.pow(Math.max(0,val),3);
      
      if(caustic>0.01){
        ctx.fillStyle=`rgba(100,200,220,${caustic*0.15})`;
        ctx.fillRect(x,y,gridSize,gridSize);
      }
    }
  }
  
  // Light rays from surface
  for(let i=0;i<8;i++){
    const rx=w*0.1+i*w*0.1+Math.sin(frame*0.003+i*1.5)*30;
    const rayW=15+Math.sin(frame*0.005+i)*5;
    
    ctx.beginPath();
    ctx.moveTo(rx-rayW,0);
    ctx.lineTo(rx+rayW,0);
    ctx.lineTo(rx+rayW*0.3+Math.sin(frame*0.008+i)*10,h);
    ctx.lineTo(rx-rayW*0.3+Math.sin(frame*0.008+i)*10,h);
    ctx.closePath();
    
    const rg=ctx.createLinearGradient(0,0,0,h);
    rg.addColorStop(0,`rgba(80,180,200,${0.04+Math.sin(frame*0.01+i)*0.02})`);
    rg.addColorStop(0.5,'rgba(60,140,180,0.01)');
    rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg;
    ctx.fill();
  }
  
  // Particles (marine snow)
  for(let i=0;i<30;i++){
    const px=(i*137.5+frame*0.2)%w;
    const py=(i*97.3+frame*0.3)%h;
    const drift=Math.sin(frame*0.005+i)*0.5;
    ctx.beginPath();
    ctx.arc(px+drift,py,0.5+Math.random()*1,0,Math.PI*2);
    ctx.fillStyle='rgba(150,200,220,0.08)';
    ctx.fill();
  }
  
  // Kelp
  for(let i=0;i<5;i++){
    const kx=w*0.1+i*w*0.2;
    ctx.beginPath();
    ctx.moveTo(kx,h);
    for(let j=0;j<10;j++){
      const t2=j/10;
      const sway=Math.sin(frame*0.01+i+j*0.3)*15*t2;
      ctx.lineTo(kx+sway,h-h*0.4*t2);
    }
    ctx.strokeStyle='rgba(30,80,50,0.15)';
    ctx.lineWidth=3;
    ctx.stroke();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
