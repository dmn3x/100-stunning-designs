<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoke Wisps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1816}
canvas{display:block;cursor:crosshair}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,160,140,.2);pointer-events:none;z-index:10}
.hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);font:10px Georgia,serif;color:rgba(180,160,140,.15);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Smoke Wisps</div>
<div class="hint">Click to add smoke</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0,mx=w/2,my=h/2;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
c.addEventListener('click',e=>{for(let i=0;i<20;i++)addSmoke(e.clientX,e.clientY)});

// Smoke particles
const smoke=[];

function addSmoke(x,y){
  smoke.push({
    x:x+(Math.random()-0.5)*10,
    y:y+(Math.random()-0.5)*10,
    vx:(Math.random()-0.5)*0.5,
    vy:-(0.5+Math.random()*1),
    r:5+Math.random()*15,
    alpha:0.15+Math.random()*0.15,
    life:150+Math.random()*200,
    maxLife:150+Math.random()*200,
    rot:Math.random()*Math.PI*2,
    rotSpeed:(Math.random()-0.5)*0.01,
  });
}

// Initial smoke source
for(let i=0;i<30;i++)addSmoke(w*0.5,h*0.8);

function noise2d(x,y){
  return Math.sin(x*0.01+y*0.013)*0.5+Math.cos(y*0.009-x*0.007)*0.3;
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(26,24,22,0.92)';
  ctx.fillRect(0,0,w,h);
  
  // Subtle background light
  const bgLight=ctx.createRadialGradient(w*0.5,h*0.9,10,w*0.5,h*0.9,200);
  bgLight.addColorStop(0,'rgba(200,150,80,0.03)');
  bgLight.addColorStop(1,'transparent');
  ctx.fillStyle=bgLight;
  ctx.fillRect(0,0,w,h);
  
  // Continuously add smoke
  if(frame%3===0){
    addSmoke(w*0.5+Math.sin(frame*0.01)*20,h*0.8);
  }
  
  // Mouse trail smoke
  if(frame%5===0){
    addSmoke(mx+(Math.random()-0.5)*20,my+(Math.random()-0.5)*20);
  }
  
  // Update and draw smoke
  for(let i=smoke.length-1;i>=0;i--){
    const s=smoke[i];
    s.life--;
    if(s.life<=0){smoke.splice(i,1);continue;}
    
    // Wind and turbulence
    const nx=noise2d(s.x+frame*0.5,s.y+frame*0.3)*0.15;
    const ny=noise2d(s.y+frame*0.3,s.x+frame*0.5)*0.05;
    s.vx+=nx;
    s.vy+=ny-0.005; // buoyancy
    
    // Mouse influence
    const dx=mx-s.x,dy=my-s.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<100){
      const f=(100-dist)/100*0.002;
      s.vx-=dx*f;
      s.vy-=dy*f;
    }
    
    s.vx*=0.99;
    s.vy*=0.99;
    s.x+=s.vx;
    s.y+=s.vy;
    s.rot+=s.rotSpeed;
    s.r+=0.05; // expand
    s.alpha*=0.998; // fade
    
    const lifeRatio=s.life/s.maxLife;
    const alpha=s.alpha*lifeRatio;
    
    if(alpha<0.005)continue;
    
    // Draw smoke blob
    ctx.save();
    ctx.translate(s.x,s.y);
    ctx.rotate(s.rot);
    
    // Multiple overlapping circles for soft look
    for(let j=0;j<3;j++){
      const ox=Math.sin(j*2.1)*s.r*0.2;
      const oy=Math.cos(j*2.1)*s.r*0.2;
      ctx.beginPath();
      ctx.arc(ox,oy,s.r*(1+j*0.2),0,Math.PI*2);
      const g=ctx.createRadialGradient(ox,oy,0,ox,oy,s.r*(1+j*0.2));
      g.addColorStop(0,`rgba(180,170,160,${alpha*0.3/(j+1)})`);
      g.addColorStop(0.5,`rgba(160,150,140,${alpha*0.15/(j+1)})`);
      g.addColorStop(1,`rgba(140,130,120,0)`);
      ctx.fillStyle=g;
      ctx.fill();
    }
    
    ctx.restore();
  }
  
  // Limit particle count
  while(smoke.length>500)smoke.shift();
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
