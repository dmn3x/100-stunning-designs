<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wood Grain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#8a7050}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(100,80,50,.3);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Wood Grain</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight;draw()}
resize();addEventListener('resize',resize);

function noise(x,y,seed){
  return Math.sin(x*0.5+seed)*Math.cos(y*0.3+seed*2)*0.5+
         Math.sin(x*1.3+y*0.7+seed*3)*0.3+
         Math.cos(x*0.2-y*0.15+seed)*0.4;
}

function draw(){
  const imageData=ctx.createImageData(w,h);
  const data=imageData.data;
  
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx=(y*w+x)*4;
      
      // Wood grain — rings
      const cx=w/2,cy=h/2;
      const dist=Math.sqrt((x-cx)**2+(y-cy)*0.3**2);
      const ring=dist*0.1+noise(x*0.02,y*0.02,0)*5;
      const grain=Math.sin(ring)*0.5+0.5;
      
      // Knot
      const knotX=w*0.3,knotY=h*0.4;
      const knotDist=Math.sqrt((x-knotX)**2+(y-knotY)**2);
      const knotInfluence=Math.exp(-knotDist*knotDist*0.0001)*2;
      const knotRing=(knotDist*0.2+knotInfluence);
      const knotGrain=Math.sin(knotRing)*0.5+0.5;
      
      const finalGrain=grain*(1-knotInfluence*0.3)+knotGrain*knotInfluence*0.3;
      
      // Color
      const baseR=160,baseG=120,baseB=75;
      const darkR=110,darkG=75,darkB=45;
      const lightR=190,lightG=150,lightB=100;
      
      let r=baseR+(lightR-baseR)*finalGrain*0.3-(baseR-darkR)*(1-finalGrain)*0.2;
      let g=baseG+(lightG-baseG)*finalGrain*0.3-(baseG-darkG)*(1-finalGrain)*0.2;
      let b=baseB+(lightB-baseB)*finalGrain*0.3-(baseB-darkB)*(1-finalGrain)*0.2;
      
      // Micro grain noise
      const micro=noise(x*0.5,y*0.5,10)*8;
      r+=micro;g+=micro*0.8;b+=micro*0.5;
      
      // Dark grain lines
      if(grain<0.15){
        const lineDark=1-grain/0.15;
        r-=lineDark*20;g-=lineDark*15;b-=lineDark*10;
      }
      
      data[idx]=Math.max(0,Math.min(255,r));
      data[idx+1]=Math.max(0,Math.min(255,g));
      data[idx+2]=Math.max(0,Math.min(255,b));
      data[idx+3]=255;
    }
  }
  
  ctx.putImageData(imageData,0,0);
  
  // Polish/lacquer shine
  const shine=ctx.createLinearGradient(0,0,w,h);
  shine.addColorStop(0,'rgba(255,250,230,0.05)');
  shine.addColorStop(0.5,'rgba(255,250,230,0)');
  shine.addColorStop(1,'rgba(255,250,230,0.03)');
  ctx.fillStyle=shine;
  ctx.fillRect(0,0,w,h);
}

draw();
</script>
</body>
</html>
