<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copper Patina</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1e1a}
canvas{display:block;cursor:crosshair}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(120,180,140,.25);pointer-events:none;z-index:10}
.hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);font:10px Georgia,serif;color:rgba(120,180,140,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Copper Patina</div>
<div class="hint">Click to add verdigris</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Patina spots
const patinaSpots=[];
for(let i=0;i<40;i++){
  patinaSpots.push({
    x:Math.random(),y:Math.random(),
    r:20+Math.random()*60,
    hue:150+Math.random()*40,
    sat:30+Math.random()*30,
    lum:35+Math.random()*20,
    age:0,maxAge:200+Math.random()*300,
  });
}

c.addEventListener('click',e=>{
  for(let i=0;i<5;i++){
    patinaSpots.push({
      x:e.clientX/w+(Math.random()-0.5)*0.1,
      y:e.clientY/h+(Math.random()-0.5)*0.1,
      r:15+Math.random()*40,
      hue:150+Math.random()*40,
      sat:30+Math.random()*30,
      lum:35+Math.random()*20,
      age:0,maxAge:200+Math.random()*300,
    });
  }
});

function draw(){
  frame++;
  
  // Copper base
  ctx.fillStyle='#b87333';
  ctx.fillRect(0,0,w,h);
  
  // Copper texture — hammered surface
  for(let i=0;i<200;i++){
    const tx=(i*73.7)%w;
    const ty=(i*97.3)%h;
    const size=5+Math.random()*20;
    ctx.beginPath();
    ctx.arc(tx,ty,size,0,Math.PI*2);
    ctx.fillStyle=`rgba(${160+Math.random()*40},${90+Math.random()*30},${40+Math.random()*20},0.1)`;
    ctx.fill();
  }
  
  // Brushed metal lines
  ctx.strokeStyle='rgba(200,150,80,0.03)';
  ctx.lineWidth=0.5;
  for(let i=0;i<100;i++){
    const y=Math.random()*h;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y+Math.sin(i)*3);
    ctx.stroke();
  }
  
  // Oxidation/patina patches
  for(const spot of patinaSpots){
    spot.age++;
    
    // Grow
    const growFactor=Math.min(1,spot.age/50);
    const r=spot.r*growFactor;
    
    // Organic blob shape
    ctx.beginPath();
    const points=12;
    for(let i=0;i<=points;i++){
      const a=(i/points)*Math.PI*2;
      const wobble=1+Math.sin(a*3+frame*0.01+spot.x*10)*0.2+Math.sin(a*7+spot.y*10)*0.1;
      const px=spot.x*w+Math.cos(a)*r*wobble;
      const py=spot.y*h+Math.sin(a)*r*wobble;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    
    // Patina gradient
    const pg=ctx.createRadialGradient(spot.x*w,spot.y*h,0,spot.x*w,spot.y*h,r);
    pg.addColorStop(0,`hsla(${spot.hue},${spot.sat}%,${spot.lum}%,0.4)`);
    pg.addColorStop(0.5,`hsla(${spot.hue+10},${spot.sat-5}%,${spot.lum+5}%,0.3)`);
    pg.addColorStop(0.8,`hsla(${spot.hue-10},${spot.sat-10}%,${spot.lum+10}%,0.15)`);
    pg.addColorStop(1,`hsla(${spot.hue},${spot.sat}%,${spot.lum}%,0)`);
    ctx.fillStyle=pg;
    ctx.fill();
    
    // Speckles within patina
    for(let s=0;s<3;s++){
      const sx=spot.x*w+(Math.random()-0.5)*r;
      const sy=spot.y*h+(Math.random()-0.5)*r;
      ctx.beginPath();
      ctx.arc(sx,sy,1+Math.random()*2,0,Math.PI*2);
      ctx.fillStyle=`hsla(${spot.hue+Math.random()*20},${spot.sat+10}%,${spot.lum-5}%,${0.2*growFactor})`;
      ctx.fill();
    }
  }
  
  // Copper highlights
  ctx.fillStyle='rgba(220,180,120,0.03)';
  for(let i=0;i<30;i++){
    const hx=Math.random()*w;
    const hy=Math.random()*h;
    ctx.beginPath();
    ctx.arc(hx,hy,10+Math.random()*30,0,Math.PI*2);
    ctx.fill();
  }
  
  // Edge darkening (tarnish)
  const edgeG=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.3,w/2,h/2,Math.max(w,h)*0.7);
  edgeG.addColorStop(0,'transparent');
  edgeG.addColorStop(1,'rgba(30,20,10,0.3)');
  ctx.fillStyle=edgeG;
  ctx.fillRect(0,0,w,h);
  
  // Drip marks (moisture)
  for(let i=0;i<8;i++){
    const dx=w*0.1+i*w*0.1+Math.sin(i*2)*20;
    const dripLen=30+Math.sin(frame*0.01+i)*20;
    ctx.beginPath();
    ctx.moveTo(dx,h*0.2);
    ctx.quadraticCurveTo(dx+Math.sin(i)*5,h*0.2+dripLen/2,dx+Math.sin(i)*3,h*0.2+dripLen);
    ctx.strokeStyle=`rgba(80,140,100,${0.05+Math.sin(frame*0.005+i)*0.02})`;
    ctx.lineWidth=2;
    ctx.stroke();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
