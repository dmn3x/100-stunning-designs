<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dendrite Growth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(140,180,220,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Dendrite Growth</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Growing dendrite branches
const branches=[];
const tips=[];

function addBranch(x,y,angle,len,hue,depth){
  const x2=x+Math.cos(angle)*len;
  const y2=y+Math.sin(angle)*len;
  branches.push({x1:x,y1:y,x2,y2,hue,depth,alpha:0});
  if(depth<8){
    tips.push({x:x2,y:y2,angle,len,hue,depth,age:0});
  }
}

// Seed from center
addBranch(w/2,h/2,-Math.PI/2,20,220,0);

function draw(){
  frame++;
  ctx.fillStyle='rgba(10,10,20,0.05)';
  ctx.fillRect(0,0,w,h);
  
  // Grow from tips
  for(let i=tips.length-1;i>=0;i--){
    const tip=tips[i];
    tip.age++;
    
    if(tip.age>5){
      const spread=0.4+Math.random()*0.3;
      const newLen=tip.len*0.75;
      const newHue=tip.hue+Math.random()*20-10;
      
      addBranch(tip.x,tip.y,tip.angle-spread,newLen,newHue,tip.depth+1);
      addBranch(tip.x,tip.y,tip.angle+spread,newLen,newHue,tip.depth+1);
      
      if(Math.random()>0.6){
        addBranch(tip.x,tip.y,tip.angle,newLen*0.5,newHue,tip.depth+2);
      }
      
      tips.splice(i,1);
    }
  }
  
  // Draw branches
  for(const b of branches){
    b.alpha=Math.min(0.4,b.alpha+0.01);
    
    const thickness=Math.max(0.5,3-b.depth*0.3);
    
    // Glow
    ctx.beginPath();
    ctx.moveTo(b.x1,b.y1);
    ctx.lineTo(b.x2,b.y2);
    ctx.strokeStyle=`hsla(${b.hue},50%,50%,${b.alpha*0.15})`;
    ctx.lineWidth=thickness*3;
    ctx.stroke();
    
    // Core
    ctx.beginPath();
    ctx.moveTo(b.x1,b.y1);
    ctx.lineTo(b.x2,b.y2);
    ctx.strokeStyle=`hsla(${b.hue},60%,65%,${b.alpha})`;
    ctx.lineWidth=thickness;
    ctx.stroke();
  }
  
  // Tips glow
  for(const tip of tips){
    ctx.beginPath();
    ctx.arc(tip.x,tip.y,3,0,Math.PI*2);
    ctx.fillStyle=`hsla(${tip.hue},70%,70%,0.2)`;
    ctx.fill();
  }
  
  // Reset when too many branches
  if(branches.length>2000){
    branches.length=0;
    tips.length=0;
    addBranch(w/2,h/2,-Math.PI/2,20,220+Math.random()*60,0);
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
