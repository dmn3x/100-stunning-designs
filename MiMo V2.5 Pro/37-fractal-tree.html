<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Tree</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0e16}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(120,160,100,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Fractal Tree</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

function drawBranch(x,y,angle,len,depth,maxDepth,hue,wind){
  if(depth>maxDepth||len<3)return;
  
  const sway=wind*Math.sin(frame*0.005+depth*0.5)*depth*0.3;
  const x2=x+Math.cos(angle+sway*0.01)*len;
  const y2=y+Math.sin(angle+sway*0.01)*len;
  
  const thickness=Math.max(0.5,(maxDepth-depth)*0.8);
  const alpha=0.3+0.3*(1-depth/maxDepth);
  
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x2,y2);
  
  if(depth>maxDepth*0.6){
    // Leaf branches
    ctx.strokeStyle=`hsla(${hue+depth*5},50%,${40+depth*3}%,${alpha})`;
    ctx.lineWidth=thickness;
    ctx.stroke();
    
    // Leaves at tips
    if(depth>=maxDepth-1){
      const leafSize=3+Math.sin(frame*0.02+depth)*1;
      ctx.beginPath();
      ctx.ellipse(x2,y2,leafSize,leafSize*0.4,angle,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue+20},55%,45%,${0.15+Math.sin(frame*0.01+depth)*0.05})`;
      ctx.fill();
    }
  }else{
    // Trunk/branch
    ctx.strokeStyle=`hsla(30,30%,${25+depth*3}%,${alpha})`;
    ctx.lineWidth=thickness;
    ctx.stroke();
  }
  
  const spread=0.4+Math.sin(frame*0.003)*0.1;
  const lenFactor=0.68+Math.random()*0.05;
  
  drawBranch(x2,y2,angle-spread,len*lenFactor,depth+1,maxDepth,hue,wind);
  drawBranch(x2,y2,angle+spread,len*lenFactor,depth+1,maxDepth,hue,wind);
  
  if(Math.random()>0.7&&depth<maxDepth*0.5){
    drawBranch(x2,y2,angle,len*0.5,depth+2,maxDepth,hue,wind);
  }
}

function draw(){
  frame++;
  
  const bg=ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#0e0e16');
  bg.addColorStop(0.6,'#141820');
  bg.addColorStop(1,'#0a0e12');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  
  // Ground
  ctx.fillStyle='rgba(30,40,25,0.3)';
  ctx.fillRect(0,h*0.85,w,h*0.15);
  
  // Moon
  const moonX=w*0.8,moonY=h*0.12;
  ctx.beginPath();
  ctx.arc(moonX,moonY,25,0,Math.PI*2);
  ctx.fillStyle='rgba(220,220,230,0.6)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(moonX+8,moonY-3,22,0,Math.PI*2);
  ctx.fillStyle='#0e0e16';
  ctx.fill();
  
  // Stars
  for(let i=0;i<80;i++){
    const sx=(i*137.5)%w;
    const sy=(i*97.3)%h*0.5;
    ctx.beginPath();
    ctx.arc(sx,sy,0.5+Math.random()*0.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(200,200,220,${0.1+Math.random()*0.2})`;
    ctx.fill();
  }
  
  // Wind
  const wind=Math.sin(frame*0.003)*3+Math.sin(frame*0.007)*1.5;
  
  // Main tree
  drawBranch(w*0.45,h*0.85,-Math.PI/2,h*0.25,0,12,120,wind);
  
  // Second smaller tree
  drawBranch(w*0.7,h*0.85,-Math.PI/2-0.1,h*0.15,0,10,140,wind*0.7);
  
  // Ground mist
  for(let i=0;i<4;i++){
    const mx=w*0.2+Math.sin(frame*0.001+i*2)*w*0.3;
    const my=h*0.88+Math.cos(frame*0.002+i)*10;
    const mg=ctx.createRadialGradient(mx,my,0,mx,my,100);
    mg.addColorStop(0,'rgba(80,100,70,0.03)');
    mg.addColorStop(1,'transparent');
    ctx.fillStyle=mg;
    ctx.fillRect(0,0,w,h);
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
