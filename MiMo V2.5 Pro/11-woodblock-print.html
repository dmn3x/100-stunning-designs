<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woodblock Print</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f0e8d8}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.5em;text-transform:uppercase;color:rgba(120,90,60,.3);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Woodblock Print</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight;draw()}
resize();addEventListener('resize',resize);

function draw(){
  // Washi paper texture
  ctx.fillStyle='#f0e8d8';
  ctx.fillRect(0,0,w,h);
  
  // Paper fibers
  ctx.strokeStyle='rgba(180,160,130,0.08)';
  ctx.lineWidth=0.5;
  for(let i=0;i<300;i++){
    const x=Math.random()*w,y=Math.random()*h;
    const len=5+Math.random()*20;
    const angle=Math.random()*Math.PI;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(angle)*len,y+Math.sin(angle)*len);
    ctx.stroke();
  }
  
  const cx=w/2,cy=h/2;
  const scale=Math.min(w,h)*0.4;
  
  // Mountains (layered - farther = lighter)
  const mtLayers=[
    {y:0.35,color:'rgba(80,100,130,0.25)',peaks:[0.3,0.5,0.7,0.9]},
    {y:0.4,color:'rgba(70,90,120,0.35)',peaks:[0.2,0.45,0.65,0.85]},
    {y:0.48,color:'rgba(60,80,110,0.45)',peaks:[0.15,0.4,0.6,0.8]},
  ];
  
  for(const layer of mtLayers){
    ctx.beginPath();
    ctx.moveTo(0,h);
    for(let x=0;x<=w;x+=3){
      let y=h*layer.y;
      for(const p of layer.peaks){
        const px=w*p;
        const dist=Math.abs(x-px);
        const peakH=scale*(0.2+Math.sin(p*7)*0.1);
        y-=Math.max(0,peakH*(1-dist/(w*0.2)));
      }
      // Noise
      y+=Math.sin(x*0.02)*5+Math.sin(x*0.05)*3;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(w,h);
    ctx.closePath();
    ctx.fillStyle=layer.color;
    ctx.fill();
  }
  
  // Sun/moon
  const sunX=w*0.75,sunY=h*0.2;
  ctx.beginPath();
  ctx.arc(sunX,sunY,scale*0.12,0,Math.PI*2);
  ctx.fillStyle='rgba(200,80,60,0.3)';
  ctx.fill();
  // Glow
  const sg=ctx.createRadialGradient(sunX,sunY,scale*0.1,sunX,sunY,scale*0.3);
  sg.addColorStop(0,'rgba(220,180,100,0.1)');
  sg.addColorStop(1,'transparent');
  ctx.fillStyle=sg;
  ctx.fillRect(0,0,w,h);
  
  // Water
  ctx.fillStyle='rgba(50,70,100,0.15)';
  ctx.fillRect(0,h*0.65,w,h*0.35);
  // Reflection lines
  ctx.strokeStyle='rgba(50,70,100,0.08)';
  ctx.lineWidth=1;
  for(let i=0;i<15;i++){
    const y=h*0.67+i*h*0.02;
    const xOff=Math.sin(i*0.7)*30;
    ctx.beginPath();
    ctx.moveTo(w*0.1+xOff,y);
    ctx.lineTo(w*0.9+xOff,y);
    ctx.stroke();
  }
  
  // Cherry blossom tree
  // Trunk
  ctx.strokeStyle='rgba(50,30,20,0.5)';
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.moveTo(w*0.25,h*0.65);
  ctx.quadraticCurveTo(w*0.22,h*0.5,w*0.28,h*0.35);
  ctx.stroke();
  
  // Branches
  const branches=[
    {x1:0.25,y1:0.45,x2:0.15,y2:0.3,cx:0.2,cy:0.35},
    {x1:0.26,y1:0.4,x2:0.38,y2:0.28,cx:0.32,cy:0.32},
    {x1:0.27,y1:0.37,x2:0.18,y2:0.22,cx:0.22,cy:0.28},
    {x1:0.28,y1:0.35,x2:0.4,y2:0.2,cx:0.34,cy:0.26},
  ];
  ctx.lineWidth=2;
  ctx.strokeStyle='rgba(50,30,20,0.4)';
  for(const b of branches){
    ctx.beginPath();
    ctx.moveTo(b.x1*w,b.y1*h);
    ctx.quadraticCurveTo(b.cx*w,b.cy*h,b.x2*w,b.y2*h);
    ctx.stroke();
  }
  
  // Blossoms
  for(let i=0;i<60;i++){
    const bx=w*0.12+Math.random()*w*0.32;
    const by=h*0.15+Math.random()*h*0.25;
    const br=3+Math.random()*6;
    const hue=340+Math.random()*20;
    const alpha=0.15+Math.random()*0.25;
    
    // Petal
    for(let p=0;p<5;p++){
      const pa=(p/5)*Math.PI*2+Math.random()*0.3;
      ctx.beginPath();
      ctx.ellipse(bx+Math.cos(pa)*br*0.5,by+Math.sin(pa)*br*0.5,br,br*0.5,pa,0,Math.PI*2);
      ctx.fillStyle=`hsla(${hue},50%,75%,${alpha})`;
      ctx.fill();
    }
    // Center
    ctx.beginPath();
    ctx.arc(bx,by,br*0.2,0,Math.PI*2);
    ctx.fillStyle=`hsla(${hue+20},40%,65%,${alpha*1.5})`;
    ctx.fill();
  }
  
  // Falling petals
  for(let i=0;i<15;i++){
    const px=w*0.1+Math.random()*w*0.8;
    const py=h*0.3+Math.random()*h*0.4;
    ctx.save();
    ctx.translate(px,py);
    ctx.rotate(Math.random()*Math.PI);
    ctx.beginPath();
    ctx.ellipse(0,0,3+Math.random()*3,1.5+Math.random()*2,0,0,Math.PI*2);
    ctx.fillStyle=`hsla(350,45%,78%,${0.15+Math.random()*0.15})`;
    ctx.fill();
    ctx.restore();
  }
  
  // Seal/stamp (bottom right)
  const stampX=w*0.85,stampY=h*0.82,stampS=Math.min(w,h)*0.05;
  ctx.fillStyle='rgba(180,40,30,0.6)';
  ctx.fillRect(stampX-stampS,stampY-stampS,stampS*2,stampS*2);
  ctx.strokeStyle='rgba(180,40,30,0.8)';
  ctx.lineWidth=1;
  ctx.strokeRect(stampX-stampS+2,stampY-stampS+2,stampS*2-4,stampS*2-4);
  // Simple kanji-like marks
  ctx.strokeStyle='rgba(240,230,220,0.7)';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(stampX-stampS*0.4,stampY-stampS*0.5);
  ctx.lineTo(stampX+stampS*0.4,stampY-stampS*0.5);
  ctx.moveTo(stampX,stampY-stampS*0.5);
  ctx.lineTo(stampX,stampY+stampS*0.5);
  ctx.moveTo(stampX-stampS*0.3,stampY);
  ctx.lineTo(stampX+stampS*0.3,stampY);
  ctx.stroke();
}

draw();
</script>
</body>
</html>
