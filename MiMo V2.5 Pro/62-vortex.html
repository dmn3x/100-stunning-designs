<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08080e}
canvas{display:block;cursor:crosshair}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,140,200,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Vortex</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Particles spiraling inward
const particles=[];
for(let i=0;i<500;i++){
  const angle=Math.random()*Math.PI*2;
  const r=50+Math.random()*400;
  particles.push({
    angle,r,
    speed:0.002+Math.random()*0.005,
    fallSpeed:0.1+Math.random()*0.3,
    hue:260+Math.random()*60,
    size:0.5+Math.random()*2,
    alpha:0.1+Math.random()*0.3,
  });
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(8,8,14,0.1)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  
  // Vortex center glow
  const centerG=ctx.createRadialGradient(cx,cy,0,cx,cy,80);
  centerG.addColorStop(0,'rgba(180,140,255,0.08)');
  centerG.addColorStop(0.5,'rgba(100,80,200,0.03)');
  centerG.addColorStop(1,'transparent');
  ctx.fillStyle=centerG;
  ctx.fillRect(0,0,w,h);
  
  // Spiral arms (background)
  for(let arm=0;arm<3;arm++){
    ctx.beginPath();
    for(let i=0;i<300;i++){
      const t=i/300;
      const angle=t*Math.PI*6+arm*Math.PI*2/3+frame*0.003;
      const r=t*Math.min(w,h)*0.45;
      const x=cx+Math.cos(angle)*r;
      const y=cy+Math.sin(angle)*r;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=`hsla(${260+arm*30},50%,40%,0.04)`;
    ctx.lineWidth=15;
    ctx.stroke();
  }
  
  // Particles
  for(const p of particles){
    p.angle+=p.speed*(1+10/(p.r+10));
    p.r-=p.fallSpeed;
    
    if(p.r<5){
      p.r=50+Math.random()*100;
      p.angle=Math.random()*Math.PI*2;
    }
    
    const x=cx+Math.cos(p.angle)*p.r;
    const y=cy+Math.sin(p.angle)*p.r;
    
    // Trail
    const prevAngle=p.angle-p.speed*(1+10/(p.r+10))*3;
    const prevR=p.r+p.fallSpeed*3;
    const px=cx+Math.cos(prevAngle)*prevR;
    const py=cy+Math.sin(prevAngle)*prevR;
    
    ctx.beginPath();
    ctx.moveTo(px,py);
    ctx.lineTo(x,y);
    ctx.strokeStyle=`hsla(${p.hue},60%,50%,${p.alpha*(1-p.r/500)})`;
    ctx.lineWidth=p.size;
    ctx.stroke();
    
    // Particle dot
    ctx.beginPath();
    ctx.arc(x,y,p.size*0.5,0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},70%,60%,${p.alpha*1.5*(1-p.r/500)})`;
    ctx.fill();
  }
  
  // Accretion disk rings
  for(let ring=0;ring<5;ring++){
    const r=20+ring*15;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(180,140,255,${0.05-ring*0.008})`;
    ctx.lineWidth=1;
    ctx.stroke();
  }
  
  // Event horizon
  ctx.beginPath();
  ctx.arc(cx,cy,8,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx,cy,10,0,Math.PI*2);
  ctx.strokeStyle='rgba(180,140,255,0.1)';
  ctx.lineWidth=2;
  ctx.stroke();
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
