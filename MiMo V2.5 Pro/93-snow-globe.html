<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Globe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2a}
canvas{display:block;cursor:crosshair}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(180,200,220,.2);pointer-events:none;z-index:10}
.hint{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);font:10px Georgia,serif;color:rgba(180,200,220,.15);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Snow Globe</div>
<div class="hint">Click to shake</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0,shake=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

c.addEventListener('click',()=>{shake=30});

const flakes=[];
for(let i=0;i<80;i++){
  flakes.push({
    x:Math.random(),y:Math.random(),
    r:1+Math.random()*2,
    vx:0,vy:0.001+Math.random()*0.002,
    wobble:Math.random()*Math.PI*2,
  });
}

function draw(){
  frame++;
  
  const bg=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.6);
  bg.addColorStop(0,'#1e1e30');
  bg.addColorStop(1,'#0e0e1a');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  const R=Math.min(w,h)*0.38;
  
  // Shake
  if(shake>0){
    shake--;
    ctx.save();
    ctx.translate(Math.random()*shake*0.5-shake*0.25,Math.random()*shake*0.3-shake*0.15);
  }
  
  // Globe
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.clip();
  
  // Interior scene
  // Background
  const intBg=ctx.createRadialGradient(cx,cy-R*0.3,0,cx,cy,R);
  intBg.addColorStop(0,'#2a3050');
  intBg.addColorStop(1,'#1a2030');
  ctx.fillStyle=intBg;
  ctx.fillRect(cx-R,cy-R,R*2,R*2);
  
  // Snow ground
  ctx.fillStyle='rgba(200,210,230,0.15)';
  ctx.beginPath();
  ctx.moveTo(cx-R,cy+R*0.6);
  for(let x=cx-R;x<=cx+R;x+=5){
    ctx.lineTo(x,cy+R*0.6+Math.sin(x*0.02)*5);
  }
  ctx.lineTo(cx+R,cy+R);
  ctx.lineTo(cx-R,cy+R);
  ctx.closePath();
  ctx.fill();
  
  // Small house
  ctx.fillStyle='rgba(180,80,60,0.3)';
  ctx.fillRect(cx-15,cy+R*0.3,30,20);
  ctx.fillStyle='rgba(140,60,40,0.3)';
  ctx.beginPath();
  ctx.moveTo(cx-20,cy+R*0.3);
  ctx.lineTo(cx,cy+R*0.15);
  ctx.lineTo(cx+20,cy+R*0.3);
  ctx.closePath();
  ctx.fill();
  // Window glow
  ctx.fillStyle='rgba(255,220,100,0.2)';
  ctx.fillRect(cx-5,cy+R*0.35,10,8);
  
  // Tree
  ctx.fillStyle='rgba(40,80,40,0.3)';
  ctx.beginPath();
  ctx.moveTo(cx+30,cy+R*0.6);
  ctx.lineTo(cx+25,cy+R*0.3);
  ctx.lineTo(cx+35,cy+R*0.3);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+28,cy+R*0.4);
  ctx.lineTo(cx+22,cy+R*0.15);
  ctx.lineTo(cx+38,cy+R*0.15);
  ctx.closePath();
  ctx.fill();
  
  // Snowflakes
  for(const f of flakes){
    f.wobble+=0.02;
    f.x+=f.vx+Math.sin(f.wobble)*0.0005+(shake>0?(Math.random()-0.5)*0.01:0);
    f.y+=f.vy+(shake>0?0.005:0);
    f.vy=Math.min(0.005,f.vy*0.999+0.00001);
    
    if(f.y>1.1){f.y=-0.1;f.x=Math.random();}
    
    const fx=cx+(f.x-0.5)*R*2;
    const fy=cy+(f.y-0.5)*R*2;
    
    ctx.beginPath();
    ctx.arc(fx,fy,f.r,0,Math.PI*2);
    ctx.fillStyle='rgba(220,230,255,0.3)';
    ctx.fill();
  }
  
  ctx.restore();
  
  // Globe glass
  const glassG=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
  glassG.addColorStop(0,'rgba(255,255,255,0.03)');
  glassG.addColorStop(0.7,'rgba(255,255,255,0)');
  glassG.addColorStop(1,'rgba(200,210,230,0.05)');
  ctx.fillStyle=glassG;
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.fill();
  
  // Globe outline
  ctx.strokeStyle='rgba(200,210,230,0.1)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.stroke();
  
  // Highlight
  ctx.beginPath();
  ctx.arc(cx-R*0.3,cy-R*0.3,R*0.15,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.04)';
  ctx.fill();
  
  // Base
  ctx.fillStyle='rgba(120,100,80,0.3)';
  ctx.fillRect(cx-R*0.5,cy+R+5,R,15);
  ctx.fillStyle='rgba(100,80,60,0.3)';
  ctx.fillRect(cx-R*0.6,cy+R+18,R*1.2,8);
  
  if(shake>0)ctx.restore();
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
