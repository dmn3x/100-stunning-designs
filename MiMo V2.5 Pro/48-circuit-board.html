<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Board</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a2a1a}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:2rem;font:600 .6rem/1 'SF Mono',monospace;letter-spacing:.35em;text-transform:uppercase;color:rgba(80,180,100,.25);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Circuit Board</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// PCB grid
const gridSize=20;
const cols=()=>Math.ceil(w/gridSize);
const rows=()=>Math.ceil(h/gridSize);

// Traces — pre-generated paths
const traces=[];
function generateTraces(){
  traces.length=0;
  const count=30;
  for(let i=0;i<count;i++){
    const startX=Math.floor(Math.random()*cols())*gridSize;
    const startY=Math.floor(Math.random()*rows())*gridSize;
    const points=[{x:startX,y:startY}];
    let cx=startX,cy=startY;
    const segs=5+Math.floor(Math.random()*10);
    for(let s=0;s<segs;s++){
      const dir=Math.floor(Math.random()*4);
      const len=(1+Math.floor(Math.random()*5))*gridSize;
      switch(dir){
        case 0:cx+=len;break;
        case 1:cx-=len;break;
        case 2:cy+=len;break;
        case 3:cy-=len;break;
      }
      points.push({x:cx,y:cy});
    }
    traces.push({points,hue:120+Math.random()*40,signalPhase:Math.random()*Math.PI*2});
  }
}
generateTraces();

// Components
const components=[];
for(let i=0;i<12;i++){
  components.push({
    x:Math.random()*w,y:Math.random()*h,
    w:20+Math.random()*40,h:10+Math.random()*20,
    type:['chip','resistor','capacitor'][Math.floor(Math.random()*3)],
    pins:Math.floor(Math.random()*4)*2+2,
  });
}

// Vias (connection points)
const vias=[];
for(let i=0;i<40;i++){
  vias.push({x:Math.floor(Math.random()*cols())*gridSize,y:Math.floor(Math.random()*rows())*gridSize});
}

function draw(){
  frame++;
  
  // PCB background
  ctx.fillStyle='#0a2a1a';
  ctx.fillRect(0,0,w,h);
  
  // Grid dots
  ctx.fillStyle='rgba(40,100,50,0.08)';
  for(let x=0;x<w;x+=gridSize){
    for(let y=0;y<h;y+=gridSize){
      ctx.fillRect(x-0.5,y-0.5,1,1);
    }
  }
  
  // Traces
  for(const trace of traces){
    if(trace.points.length<2)continue;
    
    // Signal animation
    const signalPos=((frame*0.02+trace.signalPhase)%1);
    
    ctx.beginPath();
    ctx.moveTo(trace.points[0].x,trace.points[0].y);
    for(let i=1;i<trace.points.length;i++){
      ctx.lineTo(trace.points[i].x,trace.points[i].y);
    }
    ctx.strokeStyle=`hsla(${trace.hue},50%,30%,0.3)`;
    ctx.lineWidth=2;
    ctx.stroke();
    
    // Signal pulse
    const totalLen=trace.points.length*gridSize*2;
    for(let i=0;i<trace.points.length-1;i++){
      const segLen=Math.abs(trace.points[i+1].x-trace.points[i].x)+Math.abs(trace.points[i+1].y-trace.points[i].y);
      const segStart=i*gridSize*2/totalLen;
      const segEnd=(i+1)*gridSize*2/totalLen;
      
      if(signalPos>=segStart&&signalPos<=segEnd){
        const t=(signalPos-segStart)/(segEnd-segStart);
        const px=trace.points[i].x+(trace.points[i+1].x-trace.points[i].x)*t;
        const py=trace.points[i].y+(trace.points[i+1].y-trace.points[i].y)*t;
        
        ctx.beginPath();
        ctx.arc(px,py,3,0,Math.PI*2);
        ctx.fillStyle=`hsla(${trace.hue},70%,60%,0.5)`;
        ctx.fill();
        
        // Glow
        const g=ctx.createRadialGradient(px,py,0,px,py,10);
        g.addColorStop(0,`hsla(${trace.hue},70%,60%,0.15)`);
        g.addColorStop(1,'transparent');
        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.arc(px,py,10,0,Math.PI*2);
        ctx.fill();
      }
    }
  }
  
  // Vias
  for(const v of vias){
    ctx.beginPath();
    ctx.arc(v.x,v.y,3,0,Math.PI*2);
    ctx.fillStyle='rgba(60,140,80,0.2)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(v.x,v.y,1.5,0,Math.PI*2);
    ctx.fillStyle='rgba(180,180,160,0.3)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(v.x,v.y,5,0,Math.PI*2);
    ctx.strokeStyle='rgba(60,140,80,0.1)';
    ctx.lineWidth=0.5;
    ctx.stroke();
  }
  
  // Components
  for(const comp of components){
    if(comp.type==='chip'){
      ctx.fillStyle='rgba(20,20,20,0.6)';
      ctx.fillRect(comp.x-comp.w/2,comp.y-comp.h/2,comp.w,comp.h);
      ctx.strokeStyle='rgba(80,180,100,0.2)';
      ctx.lineWidth=1;
      ctx.strokeRect(comp.x-comp.w/2,comp.y-comp.h/2,comp.w,comp.h);
      // Pins
      for(let p=0;p<comp.pins/2;p++){
        const px=comp.x-comp.w/2+comp.w/(comp.pins/2+1)*(p+1);
        ctx.fillStyle='rgba(180,180,160,0.3)';
        ctx.fillRect(px-2,comp.y-comp.h/2-4,4,4);
        ctx.fillRect(px-2,comp.y+comp.h/2,4,4);
      }
      // Label
      ctx.font='6px "SF Mono",monospace';
      ctx.fillStyle='rgba(80,180,100,0.3)';
      ctx.textAlign='center';
      ctx.fillText('IC',comp.x,comp.y+2);
    }else if(comp.type==='resistor'){
      ctx.strokeStyle='rgba(180,160,100,0.3)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(comp.x-comp.w/2,comp.y);
      for(let s=0;s<5;s++){
        const sx=comp.x-comp.w/2+comp.w/5*(s+0.5);
        ctx.lineTo(sx,comp.y+(s%2===0?-4:4));
      }
      ctx.lineTo(comp.x+comp.w/2,comp.y);
      ctx.stroke();
    }else{
      ctx.beginPath();
      ctx.arc(comp.x,comp.y,comp.h/2,0,Math.PI*2);
      ctx.fillStyle='rgba(40,60,40,0.4)';
      ctx.fill();
      ctx.strokeStyle='rgba(80,180,100,0.2)';
      ctx.lineWidth=1;
      ctx.stroke();
      // + mark
      ctx.beginPath();
      ctx.moveTo(comp.x-3,comp.y);ctx.lineTo(comp.x+3,comp.y);
      ctx.moveTo(comp.x,comp.y-3);ctx.lineTo(comp.x,comp.y+3);
      ctx.strokeStyle='rgba(180,180,160,0.2)';
      ctx.lineWidth=0.5;
      ctx.stroke();
    }
  }
  
  // Ground plane fill
  ctx.fillStyle='rgba(30,80,40,0.03)';
  ctx.fillRect(0,0,w,h);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
