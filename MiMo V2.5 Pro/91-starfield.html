<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starfield</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020206}
canvas{display:block}
.label{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);font:italic 300 .55rem/1 Georgia,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(200,200,240,.2);pointer-events:none;z-index:10}
</style>
</head>
<body>
<div class="label">Starfield</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,frame=0;

function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();addEventListener('resize',resize);

// Stars at various depths
const layers=[
  {stars:[],count:200,speed:0.2,size:0.5},
  {stars:[],count:100,speed:0.5,size:1},
  {stars:[],count:50,speed:1.2,size:1.5},
  {stars:[],count:20,speed:2.5,size:2},
];

for(const layer of layers){
  for(let i=0;i<layer.count;i++){
    layer.stars.push({
      x:Math.random()*2-1,
      y:Math.random()*2-1,
      z:Math.random(),
      b:Math.random(),
    });
  }
}

function draw(){
  frame++;
  ctx.fillStyle='rgba(2,2,6,0.95)';
  ctx.fillRect(0,0,w,h);
  
  const cx=w/2,cy=h/2;
  
  for(const layer of layers){
    for(const star of layer.stars){
      star.z-=layer.speed*0.001;
      if(star.z<=0){
        star.x=Math.random()*2-1;
        star.y=Math.random()*2-1;
        star.z=1;
      }
      
      const sx=cx+star.x*w/star.z*0.5;
      const sy=cy+star.y*h/star.z*0.5;
      const size=layer.size/star.z;
      const alpha=star.b*(1-star.z)*0.8;
      
      if(sx<0||sx>w||sy<0||sy>h)continue;
      
      // Star
      ctx.beginPath();
      ctx.arc(sx,sy,size,0,Math.PI*2);
      ctx.fillStyle=`rgba(220,220,255,${alpha})`;
      ctx.fill();
      
      // Streak (motion blur)
      if(layer.speed>0.5){
        const prevSx=cx+star.x*w/(star.z+layer.speed*0.005)*0.5;
        const prevSy=cy+star.y*h/(star.z+layer.speed*0.005)*0.5;
        ctx.beginPath();
        ctx.moveTo(prevSx,prevSy);
        ctx.lineTo(sx,sy);
        ctx.strokeStyle=`rgba(220,220,255,${alpha*0.3})`;
        ctx.lineWidth=size*0.5;
        ctx.stroke();
      }
    }
  }
  
  // Central glow (galactic core)
  const gc=ctx.createRadialGradient(cx,cy,0,cx,cy,100);
  gc.addColorStop(0,'rgba(100,100,180,0.02)');
  gc.addColorStop(1,'transparent');
  ctx.fillStyle=gc;
  ctx.fillRect(0,0,w,h);
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
