<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>73 — Volt Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0416;--fg:#e4dcf5;--muted:#5d5390;--violet:#a78bfa;--cyan:#7df9ff;--pink:#f472b6;--gold:#fbbf24}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;display:flex;align-items:center;justify-content:center;padding:1.4rem}
.game{width:min(560px,94vw);background:rgba(139,92,246,.05);border:1px solid rgba(167,139,250,.22);border-radius:1.4rem;padding:1.6rem;text-align:center}
h1{font-size:clamp(1.2rem,3.4vw,1.6rem);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.5rem}
h1 span{color:var(--violet);text-shadow:0 0 16px rgba(167,139,250,.6)}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#070312;border:1px solid rgba(167,139,250,.25);border-radius:.8rem;margin:1rem 0}
.controls{display:flex;justify-content:center;gap:.8rem}
button{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);color:var(--fg);padding:.7rem 1.4rem;border-radius:99px;font:inherit;font-size:.78rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
button:hover{background:rgba(167,139,250,.25);box-shadow:0 0 14px rgba(167,139,250,.35)}
.hint{text-align:center;margin-top:.9rem;font-size:.66rem;color:var(--muted);letter-spacing:.08em}
.hint b{color:var(--gold)}
</style>
</head>
<body>
<div class="game">
<h1>VOLT <span>RACE</span></h1>
<canvas id="c" width="560" height="315"></canvas>
<div class="controls"><button id="start">▶ START</button></div>
<div class="hint"><b>SPACE</b> to switch lanes · avoid the bolts</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=560,H=315;
const LANES=4,laneH=H/LANES;
let player=1,obstacles=[],score=0,hi=+localStorage.getItem('volt-race-hi')||0,running=false,gameOver=false,spawn=0,speed=5;
function reset(){
  player=1;obstacles=[];score=0;gameOver=false;running=true;spawn=0;speed=5;
}
addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!running){reset();return}
    if(!gameOver)player=(player+1)%LANES;
  }
});
document.getElementById('start').addEventListener('click',reset);
(function loop(){
  requestAnimationFrame(loop);
  ctx.fillStyle='#070312';ctx.fillRect(0,0,W,H);
  for(let i=0;i<LANES;i++){
    ctx.strokeStyle='rgba(167,139,250,.2)';
    ctx.beginPath();ctx.moveTo(0,i*laneH);ctx.lineTo(W,i*laneH);ctx.stroke();
    ctx.fillStyle='rgba(167,139,250,.06)';
    ctx.fillRect(0,i*laneH,W,laneH);
  }
  if(!running)return;
  if(!gameOver){
    if(spawn++>Math.max(18,32-speed)){obstacles.push({lane:Math.floor(Math.random()*LANES),x:W+20,y:0});spawn=0}
    speed=Math.min(9,speed+.003);
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      o.x-=speed;
      if(o.x<-30){obstacles.splice(i,1);score+=10;continue}
      if(Math.floor(o.y/laneH)===player&&o.x<70&&o.x>30){
        gameOver=true;running=false;
        if(score>hi){hi=score;localStorage.setItem('volt-race-hi',hi)}
      }
    }
  }
  // obstacles
  obstacles.forEach(o=>{
    const ly=o.lane*laneH;
    ctx.fillStyle='#f472b6';ctx.shadowColor='#f472b6';ctx.shadowBlur=10;
    ctx.beginPath();ctx.moveTo(o.x,ly+laneH*.2);
    ctx.lineTo(o.x+14,ly+laneH*.5);
    ctx.lineTo(o.x,ly+laneH*.8);
    ctx.lineTo(o.x-14,ly+laneH*.5);
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  });
  // player ship
  const py=player*laneH+laneH/2;
  ctx.fillStyle='#7df9ff';ctx.shadowColor='#7df9ff';ctx.shadowBlur=14;
  ctx.beginPath();ctx.moveTo(56,py-14);ctx.lineTo(78,py);ctx.lineTo(56,py+14);ctx.lineTo(44,py);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  // hud
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='12px monospace';ctx.textAlign='left';
  ctx.fillText('SCORE '+Math.floor(score),10,20);
  ctx.fillStyle='rgba(251,191,36,.8)';
  ctx.fillText('HI '+hi,10,38);
  ctx.textAlign='left';
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H/2-24,W,48);
    ctx.fillStyle='#f472b6';ctx.font='16px monospace';ctx.textAlign='center';
    ctx.fillText('GAME OVER — SPACE to retry',W/2,H/2+6);ctx.textAlign='left';
  }
})();
</script>
</body>
</html>
