<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>28 — Runway Finale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0512;--fg:#ece6fa;--muted:#6a5d9c;--violet:#a78bfa;--pink:#f472b6;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 'Avenir Next',system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage{width:min(920px,94vw);aspect-ratio:16/9;background:radial-gradient(ellipse at 50% 20%,#1c1038,#0a0512 70%);border:1px solid rgba(167,139,250,.25);border-radius:1rem;position:relative;overflow:hidden}
.stage::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 20%,transparent 80%,rgba(0,0,0,.6));pointer-events:none}
.track{position:absolute;left:50%;bottom:-2%;width:70%;height:38%;transform:translateX(-50%) perspective(400px) rotateX(55deg);background:linear-gradient(to top,#2e1065,#7c3aed 60%,transparent);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);opacity:.9}
.track::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 28px,rgba(236,230,250,.55) 28px 32px);animation:run 1.4s linear infinite}
@keyframes run{to{background-position:32px 0}}
.lights{position:absolute;left:50%;bottom:10%;width:80%;height:6%;transform:translateX(-50%);display:flex;justify-content:space-between}
.lights span{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink);animation:blink 1s steps(1) infinite}
.lights span:nth-child(odd){animation-delay:.5s;background:var(--gold);box-shadow:0 0 12px var(--gold)}
@keyframes blink{50%{opacity:.2}}
.model{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);font-size:clamp(1.6rem,4vw,2.6rem);letter-spacing:.3em;text-transform:uppercase;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(167,139,250,.9),0 4px 0 rgba(0,0,0,.5);animation:strut 5s ease-in-out infinite}
@keyframes strut{0%,100%{transform:translateX(-50%) translateY(0) rotate(0deg)}25%{transform:translateX(-50%) translateY(-4px) rotate(-2deg)}75%{transform:translateX(-50%) translateY(2px) rotate(2deg)}}
.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-20px);opacity:.4}}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.title span{color:var(--violet);text-shadow:0 0 16px rgba(167,139,250,.6)}
.sub{top:3.2rem;left:1.5rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<div class="ui title">RUNWAY <span>FINALE</span></div>
<div class="ui sub">the catwalk dreams in violet</div>
<div class="ui hint">clap if you dare</div>
<div class="stage">
  <div class="track"></div>
  <div class="lights"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="model">STELLA VELOUR</div>
  <div class="sparkle" style="left:12%;top:30%"></div>
  <div class="sparkle" style="left:34%;top:18%;animation-delay:1s"></div>
  <div class="sparkle" style="left:58%;top:26%;animation-delay:2s"></div>
  <div class="sparkle" style="left:78%;top:14%;animation-delay:3s"></div>
  <div class="sparkle" style="left:88%;top:38%;animation-delay:.8s"></div>
</div>
</body>
</html>
