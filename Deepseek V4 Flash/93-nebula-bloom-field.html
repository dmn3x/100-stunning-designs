<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>93 — Nebula Bloom Field</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05030e;--fg:#e4dcf5;--muted:#5a5090;--violet:#a78bfa;--pink:#f472b6;--cyan:#7df9ff}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.title span{color:var(--pink);text-shadow:0 0 16px rgba(244,114,182,.6)}
.sub{top:3.1rem;left:1.4rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--cyan)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">NEBULA <span>BLOOM FIELD</span></div>
<div class="ui sub">dust that learned to flower</div>
<div class="ui hint"><b>click</b> — scatter nebula seed</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const blooms=[],dust=[];
function seed(x,y){
  blooms.push({x,y,t:0,hue:265+Math.random()*50,petals:6+Math.floor(Math.random()*3)});
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,d=Math.random()*30;
    dust.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,life:1,hue:265+Math.random()*50});
  }
}
for(let i=0;i<5;i++)seed(Math.random()*W,Math.random()*H);
addEventListener('click',e=>seed(e.clientX,e.clientY));
addEventListener('touchstart',e=>seed(e.touches[0].clientX,e.touches[0].clientY));
(function tick(){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(5,3,14,.18)';ctx.fillRect(0,0,W,H);
  for(let i=dust.length-1;i>=0;i--){
    const d=dust[i];
    d.life-=.01;d.x+=(Math.random()-.5)*.4;d.y-=.2;
    if(d.life<=0){dust.splice(i,1);continue}
    ctx.fillStyle=`hsla(${d.hue},90%,80%,${d.life*.6})`;
    ctx.beginPath();ctx.arc(d.x,d.y,1.2,0,7);ctx.fill();
  }
  for(const b of blooms){
    b.t+=.02;
    const open=Math.min(1,b.t*.6);
    for(let p=0;p<b.petals;p++){
      const a=(p/b.petals)*Math.PI*2+Math.sin(b.t*.7+p)*.3;
      const len=open*(13+Math.sin(b.t*1.4+p)*3);
      const px=b.x+Math.cos(a)*len,py=b.y+Math.sin(a)*len*.8;
      ctx.fillStyle=`hsla(${b.hue},90%,70%,${.5*open})`;
      ctx.shadowColor=`hsla(${b.hue},95%,60%,.8)`;ctx.shadowBlur=9;
      ctx.beginPath();ctx.ellipse(px,py,len*.26,len*.16,a,0,7);ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle=`hsla(${(b.hue+30)%360},95%,86%,.95)`;
    ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
})(0);
</script>
</body>
</html>
