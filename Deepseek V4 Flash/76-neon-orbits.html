<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>76 — Neon Orbits</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060312;--fg:#e2dcf5;--muted:#58508d;--violet:#a78bfa;--cyan:#7df9ff;--pink:#f472b6;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.title span{color:var(--cyan);text-shadow:0 0 16px rgba(125,249,255,.6)}
.sub{top:3.1rem;left:1.4rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--gold)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">NEON <span>ORBITS</span></div>
<div class="ui sub">planets remember their paths</div>
<div class="ui hint"><b>click</b> — add a planet</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const planets=[];
function addPlanet(){
  const colors=[265,300,190,35,280];
  planets.push({
    r:60+Math.random()*Math.min(W,H)*.35,
    a:Math.random()*Math.PI*2,
    speed:(Math.random()<.5?-1:1)*(.002+Math.random()*.006),
    size:4+Math.random()*7,
    hue:colors[Math.floor(Math.random()*colors.length)],
    trail:[]
  });
}
for(let i=0;i<5;i++)addPlanet();
addEventListener('click',()=>{if(planets.length<12)addPlanet()});
addEventListener('touchstart',()=>{if(planets.length<12)addPlanet()});
(function tick(){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(6,3,18,.3)';ctx.fillRect(0,0,W,H);
  const x=W/2,y=H/2;
  // central star
  const g=ctx.createRadialGradient(x,y,0,x,y,34);
  g.addColorStop(0,'#fff');
  g.addColorStop(.5,'rgba(167,139,250,.9)');
  g.addColorStop(1,'rgba(167,139,250,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,34,0,7);ctx.fill();
  for(const p of planets){
    // orbit ring
    ctx.strokeStyle='rgba(167,139,250,.14)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(x,y,p.r,p.r*.62,0,0,7);ctx.stroke();
    p.a+=p.speed;
    const px=x+Math.cos(p.a)*p.r;
    const py=y+Math.sin(p.a)*p.r*.62;
    p.trail.push({x:px,y:py});
    if(p.trail.length>40)p.trail.shift();
    for(let i=0;i<p.trail.length;i++){
      const a=i/p.trail.length;
      ctx.fillStyle=`hsla(${p.hue},90%,75%,${a*.4})`;
      ctx.beginPath();ctx.arc(p.trail[i].x,p.trail[i].y,a*2.5,0,7);ctx.fill();
    }
    ctx.fillStyle=`hsla(${p.hue},95%,80%,.95)`;
    ctx.shadowColor=`hsla(${p.hue},95%,70%,1)`;ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(px,py,p.size,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
})(0);
</script>
</body>
</html>
