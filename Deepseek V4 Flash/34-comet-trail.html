<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>34 — Comet Trail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#030209;--fg:#dcd4f2;--muted:#4b4278;--violet:#a78bfa;--cyan:#7df9ff;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.title span{color:var(--cyan);text-shadow:0 0 16px rgba(125,249,255,.6)}
.sub{top:3.1rem;left:1.4rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--gold)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">COMET <span>TRAIL</span></div>
<div class="ui sub">three visitors cross the night every minute</div>
<div class="ui hint"><b>click</b> — fling a comet</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const stars=[];
for(let i=0;i<140;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3});
const comets=[];
function spawn(){
  const fromTop=Math.random()<.5;
  const x=fromTop?Math.random()*W:-50;
  const y=fromTop?-50:Math.random()*H;
  const a=Math.PI/4+Math.random()*.9;
  const speed=5+Math.random()*5;
  comets.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,hue:180+Math.random()*80,life:1});
}
for(let i=0;i<3;i++)spawn();
addEventListener('click',e=>{
  comets.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,hue:250+Math.random()*50,life:1});
});
setInterval(()=>{if(comets.length<8)spawn()},9000);
(function tick(){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(3,2,9,.35)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(220,212,242,.7)';
  for(const s of stars){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
  for(const c of comets){
    c.x+=c.vx;c.y+=c.vy;c.life-=.002;
    const len=Math.hypot(c.vx,c.vy);
    const vx=c.vx/len,vy=c.vy/len;
    for(let i=0;i<26;i++){
      const d=i*3;
      const a=1-i/26;
      ctx.fillStyle=`hsla(${c.hue},90%,70%,${a*.5*c.life})`;
      ctx.beginPath();ctx.arc(c.x-vx*d,c.y-vy*d,Math.max(.5,2.2-i*.07),0,7);ctx.fill();
    }
    ctx.fillStyle=`hsla(${c.hue},100%,88%,${c.life})`;
    ctx.shadowColor=`hsla(${c.hue},90%,70%,1)`;ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(c.x,c.y,2.6,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
  for(let i=comets.length-1;i>=0;i--){
    const c=comets[i];
    if(c.x<-100||c.x>W+100||c.y<-100||c.y>H+100||c.life<=0)comets.splice(i,1);
  }
})(0);
</script>
</body>
</html>
