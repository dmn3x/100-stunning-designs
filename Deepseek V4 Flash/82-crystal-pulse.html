<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>82 — Crystal Pulse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05030e;--fg:#e4dcf5;--muted:#5a5090;--violet:#a78bfa;--pink:#f472b6;--cyan:#7df9ff}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;display:flex;align-items:center;justify-content:center;padding:1.4rem}
.app{width:min(420px,94vw);background:rgba(139,92,246,.05);border:1px solid rgba(167,139,250,.22);border-radius:1.6rem;padding:2.2rem;text-align:center}
h1{font-size:clamp(1.2rem,3.4vw,1.6rem);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.4rem}
h1 span{color:var(--violet);text-shadow:0 0 16px rgba(167,139,250,.6)}
.sub{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:2rem}
.gem{width:130px;height:130px;margin:0 auto 1.6rem;position:relative;border-radius:20px;background:linear-gradient(145deg,rgba(167,139,250,.3),rgba(20,10,40,.9));border:1px solid rgba(167,139,250,.5);box-shadow:0 0 40px rgba(139,92,246,.25);display:flex;align-items:center;justify-content:center;transition:transform .3s}
.gem.pulse{animation:gemPulse .4s ease-out}
@keyframes gemPulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.gem .inner{width:80px;height:80px;border-radius:14px;background:radial-gradient(circle at 35% 30%,#fff,var(--violet) 55%,#4c1d95);box-shadow:0 0 30px rgba(167,139,250,.6)}
.readout{font-size:clamp(2.2rem,7vw,3.2rem);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(167,139,250,.8);margin-bottom:.4rem}
.note{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:1.8rem}
.controls{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
button{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);color:var(--fg);padding:.7rem 1.3rem;border-radius:99px;font:inherit;font-size:.76rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
button:hover{background:rgba(167,139,250,.25);box-shadow:0 0 14px rgba(167,139,250,.35)}
button.active{background:var(--violet);color:#05030e;border-color:var(--violet)}
</style>
</head>
<body>
<div class="app">
<h1>CRYSTAL <span>PULSE</span></h1>
<div class="sub">tap the gem, feel the hum</div>
<div class="gem" id="gem"><div class="inner"></div></div>
<div class="readout" id="v">0</div>
<div class="note" id="note">the crystal counts your taps</div>
<div class="controls">
  <button data-m="tap">💎 tap</button>
  <button data-m="auto" class="active">⚡ auto</button>
  <button data-m="reset">↺ reset</button>
</div>
</div>
<script>
const gem=document.getElementById('gem'),v=document.getElementById('v'),note=document.getElementById('note');
let count=0,auto=true;
function pulse(){
  gem.classList.remove('pulse');void gem.offsetWidth;
  gem.classList.add('pulse');
  count++;
  v.textContent=count;
  if(count===10)note.textContent='the crystal approves';
  if(count===25)note.textContent='it hums in violet';
  if(count===50)note.textContent='the gem is glowing now';
}
gem.addEventListener('click',()=>{if(!auto)pulse()});
document.querySelectorAll('button[data-m]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelector('button.active')?.classList.remove('active');
  b.classList.add('active');
  const m=b.dataset.m;
  auto=m==='auto';
  if(m==='reset'){count=0;v.textContent=0;note.textContent='the crystal counts your taps'}
}));
setInterval(()=>{if(auto)pulse()},700);
</script>
</body>
</html>
