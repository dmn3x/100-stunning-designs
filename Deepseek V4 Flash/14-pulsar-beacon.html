<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 — Pulsar Beacon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#030209;--fg:#dcd4f2;--muted:#4b4278;--violet:#a78bfa;--cyan:#7df9ff;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--violet);text-shadow:0 0 18px rgba(167,139,250,.5)}
.title small{display:block;font-size:.6rem;letter-spacing:.3em;color:var(--muted);font-weight:400;margin-top:.4rem}
.hint{bottom:1.4rem;right:1.4rem;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--cyan)}
.led{position:fixed;top:1.6rem;right:1.6rem;width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);z-index:6;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.hint{display:none}.led{top:.9rem;right:.9rem}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="led"></div>
<div class="ui title">PULSAR BEACON<small>rotating neutron star · 1.337 s period</small></div>
<div class="ui hint">click to <b>pulse</b> the beacon faster</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const cx=()=>W/2,cy=()=>H*.42;
let spin=0,speed=1.2,rings=[],flash=0;
addEventListener('click',()=>{speed=Math.min(speed+.4,6);flash=1;rings.push({r:20,a:.8})});
addEventListener('touchstart',()=>{speed=Math.min(speed+.4,6);flash=1;rings.push({r:20,a:.8})});
(function tick(){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(3,2,9,.4)';ctx.fillRect(0,0,W,H);
  const x=cx(),y=cy();
  // starfield
  ctx.fillStyle='rgba(220,212,242,.5)';
  for(let i=0;i<80;i++){
    const sx=(Math.sin(i*127.1)*43758.5453%1)*W;
    const sy=(Math.sin(i*311.7)*24621.13%1)*H;
    ctx.fillRect(sx,sy,1.5,1.5);
  }
  // accretion disk
  ctx.save();ctx.translate(x,y);ctx.rotate(spin*.4);
  for(let i=0;i<6;i++){
    ctx.rotate(Math.PI/3);
    ctx.strokeStyle=`rgba(167,139,250,${.04+i*.05})`;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,150,34,0,0,7);ctx.stroke();
  }
  ctx.restore();
  // beams
  for(let b=0;b<2;b++){
    const a=spin+b*Math.PI;
    ctx.save();ctx.translate(x,y);ctx.rotate(a);
    const g=ctx.createLinearGradient(0,0,600,0);
    g.addColorStop(0,'rgba(125,249,255,.5)');
    g.addColorStop(1,'rgba(125,249,255,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(620,-30);ctx.lineTo(620,30);ctx.lineTo(0,6);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // star core
  const core=ctx.createRadialGradient(x,y,0,x,y,60);
  core.addColorStop(0,'#fff');
  core.addColorStop(.25,'#fde68a');
  core.addColorStop(.6,'rgba(251,191,36,.6)');
  core.addColorStop(1,'rgba(251,191,36,0)');
  ctx.fillStyle=core;
  ctx.beginPath();ctx.arc(x,y,60,0,7);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();
  // rings
  rings.forEach(r=>{r.r+=4;r.a*=.96;
    ctx.strokeStyle=`rgba(125,249,255,${r.a})`;
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r.r,0,7);ctx.stroke();
  });
  rings=rings.filter(r=>r.a>.02);
  spin+=speed*.012;
  speed=Math.max(1.2,speed-.002);
  if(flash>0)flash-=.02;
})(0);
</script>
</body>
</html>
