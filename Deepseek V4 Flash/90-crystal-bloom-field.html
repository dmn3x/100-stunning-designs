<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>90 — Crystal Bloom Field</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05030e;--fg:#e4dcf5;--muted:#5a5090;--violet:#a78bfa;--cyan:#7df9ff;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.title span{color:var(--cyan);text-shadow:0 0 16px rgba(125,249,255,.6)}
.sub{top:3.1rem;left:1.4rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--gold)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">CRYSTAL <span>BLOOM FIELD</span></div>
<div class="ui sub">a field of mineral flowers</div>
<div class="ui hint"><b>click</b> — grow a crystal bloom</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const blooms=[];
function grow(x,y){
  blooms.push({x,y,t:0,hue:255+Math.random()*50,arms:4+Math.floor(Math.random()*3)});
}
for(let i=0;i<6;i++)grow(Math.random()*W,Math.random()*H);
addEventListener('click',e=>grow(e.clientX,e.clientY));
addEventListener('touchstart',e=>grow(e.touches[0].clientX,e.touches[0].clientY));
(function tick(){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(5,3,14,.18)';ctx.fillRect(0,0,W,H);
  for(const b of blooms){
    b.t+=.02;
    const open=Math.min(1,b.t*.5);
    for(let a=0;a<b.arms;a++){
      const ang=(a/b.arms)*Math.PI*2+Math.sin(b.t*.5)*.2;
      const len=open*(16+Math.sin(b.t*1.3+a)*4);
      const px=b.x+Math.cos(ang)*len,py=b.y+Math.sin(ang)*len*.85;
      ctx.strokeStyle=`hsla(${b.hue},90%,75%,${.6*open})`;
      ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(px,py);ctx.stroke();
      ctx.fillStyle=`hsla(${b.hue},95%,80%,${.7*open})`;
      ctx.shadowColor=`hsla(${b.hue},95%,70%,.8)`;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(px,py,2.2,0,7);ctx.fill();
    }
    ctx.fillStyle=`hsla(${(b.hue+30)%360},95%,88%,.95)`;
    ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
})(0);
</script>
</body>
</html>
