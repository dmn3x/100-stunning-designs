<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 — Kinetic Typography</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070312;--fg:#e6def7;--muted:#5d5290;--violet:#a78bfa;--pink:#f472b6;--cyan:#7df9ff}
html,body{height:100%;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
h1{font-size:clamp(2.4rem,9vw,6rem);font-weight:900;letter-spacing:-.04em;display:flex;flex-wrap:wrap;justify-content:center;max-width:90vw;user-select:none;cursor:default}
h1 span{display:inline-block;opacity:0;animation:enter .8s forwards;background:linear-gradient(135deg,var(--violet),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative}
h1 span::after{content:'';position:absolute;inset:0;background:transparent;pointer-events:none}
@keyframes enter{to{opacity:1;transform:none}}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:.64rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--pink)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<div class="ui title">KINETIC TYPOGRAPHY</div>
<div class="ui hint"><b>click</b> — re-explode · <b>keys 1-4</b> — switch motion</div>
<div id="stage"><h1 id="h1">VOLTAGE&nbsp;POETRY</h1></div>
<script>
const h1=document.getElementById('h1');
const WORD='VOLTAGE POETRY';
const MODES={
  1:(el,i)=>({delay:(i*.05)+'s',from:`transform:translateY(${80+Math.random()*160}px) rotate(${(Math.random()-.5)*90}deg) scale(0)`,dur:'.9s',ease:'cubic-bezier(.2,.9,.3,1.4)'}),
  2:(el,i)=>({delay:(i*.04)+'s',from:`transform:translateX(${(Math.random()<.5?-1:1)*(200+Math.random()*300)}px)`,dur:'1s',ease:'cubic-bezier(.1,.9,.2,1)'}),
  3:(el,i)=>({delay:(i*.03)+'s',from:`transform:scale(${Math.random()*3+.5}) rotate(${(Math.random()-.5)*360}deg)`,dur:'1.2s',ease:'cubic-bezier(.2,.8,.4,1.2)'}),
  4:(el,i)=>({delay:(i*.02)+'s',from:`transform:translateY(${(Math.random()<.5?-1:1)*(300+Math.random()*200)}px) scale(${.2+Math.random()})`,dur:'.8s',ease:'cubic-bezier(.3,1.2,.4,1)'})
};
let mode=1;
function build(){
  h1.innerHTML='';
  const word=WORD.split(' ')[0],word2=WORD.split(' ')[1];
  word.split('').forEach((c,i)=>h1.appendChild(letter(c,i)));
  h1.appendChild(document.createTextNode('\u00A0'));
  word2.split('').forEach((c,i)=>h1.appendChild(letter(c,i+word.length)));
  h1.querySelectorAll('span').forEach((el,i)=>{
    const m=MODES[mode](el,i);
    el.style.animationDelay=m.delay;
    el.style.animationDuration=m.dur;
    el.style.animationTimingFunction=m.ease;
    el.style.animationName='enter';
    el.style.animationFillMode='forwards';
    el.style.opacity='0';
    el.style.transform=m.from;
  });
}
function letter(c,i){
  const s=document.createElement('span');
  s.textContent=c===' '?'\u00A0':c;
  return s;
}
addEventListener('keydown',e=>{
  if(e.key>=1&&e.key<=4){mode=+e.key;build()}
});
h1.addEventListener('click',()=>{
  const letters=h1.querySelectorAll('span');
  letters.forEach((el,i)=>{
    const m=MODES[mode](el,i);
    el.style.animation='none';
    el.offsetHeight;
    el.style.animationName='enter';
    el.style.animationDelay=m.delay;
    el.style.animationDuration=m.dur;
    el.style.animationTimingFunction=m.ease;
    el.style.transform=m.from;
    el.style.opacity='0';
  });
});
build();
</script>
</body>
</html>
