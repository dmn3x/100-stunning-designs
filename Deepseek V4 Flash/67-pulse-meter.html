<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>67 — Pulse Meter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070312;--fg:#e2dcf5;--muted:#58508d;--violet:#a78bfa;--cyan:#7df9ff;--pink:#f472b6}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;display:flex;align-items:center;justify-content:center;padding:1.4rem}
.app{width:min(460px,94vw);background:rgba(139,92,246,.05);border:1px solid rgba(167,139,250,.22);border-radius:1.6rem;padding:2.2rem;text-align:center}
h1{font-size:clamp(1.2rem,3.4vw,1.6rem);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.4rem}
h1 span{color:var(--violet);text-shadow:0 0 16px rgba(167,139,250,.6)}
.sub{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:2rem}
.gauge{width:200px;height:200px;margin:0 auto 1.6rem;position:relative;border-radius:50%;background:conic-gradient(var(--violet) 0deg,var(--cyan) 180deg,var(--pink) 360deg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(139,92,246,.2)}
.gauge::before{content:'';position:absolute;inset:16px;border-radius:50%;background:#0d0720}
.gauge .inner{position:relative;z-index:2}
.gauge .v{font-size:2.4rem;font-weight:900;letter-spacing:-.03em}
.gauge .l{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:.2rem}
.zone{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:1.6rem}
.zone b{padding:.3rem .8rem;border-radius:99px}
.zone .low{color:var(--cyan);background:rgba(125,249,255,.1)}
.zone .mid{color:var(--violet);background:rgba(167,139,250,.1)}
.zone .high{color:var(--pink);background:rgba(244,114,182,.1)}
.controls{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
button{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);color:var(--fg);padding:.7rem 1.3rem;border-radius:99px;font:inherit;font-size:.76rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
button:hover{background:rgba(167,139,250,.25);box-shadow:0 0 14px rgba(167,139,250,.35)}
button.active{background:var(--violet);color:#070312;border-color:var(--violet)}
</style>
</head>
<body>
<div class="app">
<h1>PULSE <span>METER</span></h1>
<div class="sub">measure the hum of the room</div>
<div class="gauge"><div class="inner"><div class="v" id="v">50</div><div class="l">pulse</div></div></div>
<div class="zone" id="zone"><b class="mid">balanced</b></div>
<div class="controls">
  <button data-m="quiet">🌙 quiet</button>
  <button data-m="active" class="active">⚡ active</button>
  <button data-m="storm">🌩 storm</button>
</div>
</div>
<script>
const v=document.getElementById('v'),zone=document.getElementById('zone');
const MODES={quiet:{t:25,noise:2},active:{t:55,noise:6},storm:{t:82,noise:12}};
let m='active',cur=50;
document.querySelectorAll('button[data-m]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelector('button.active')?.classList.remove('active');
  b.classList.add('active');m=b.dataset.m;
}));
(function tick(){
  requestAnimationFrame(tick);
  const a=MODES[m];
  cur+=(a.t-cur)*.02+(Math.random()-.5)*a.noise;
  cur=Math.max(0,Math.min(100,cur));
  v.textContent=Math.round(cur);
  let label,cls;
  if(cur<35){label='quiet';cls='low'}
  else if(cur<70){label='balanced';cls='mid'}
  else{label='storming';cls='high'}
  zone.innerHTML=`<b class="${cls}">${label}</b>`;
})(0);
</script>
</body>
</html>
