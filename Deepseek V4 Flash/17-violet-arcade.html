<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 — Violet Arcade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0517;--fg:#e8e0f8;--muted:#6a5d9c;--violet:#a78bfa;--pink:#f472b6;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 'Press Start 2P',monospace;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem}
@font-face{font-family:'Press Start 2P';src:local('Press Start 2P')}
.screen{width:min(620px,92vw);background:#0d0620;border:4px solid var(--violet);border-radius:1.2rem;padding:1.4rem;box-shadow:0 0 60px rgba(139,92,246,.35),inset 0 0 30px rgba(0,0,0,.7);position:relative}
.screen::before{content:'INSERT COIN ▮';position:absolute;top:-2.4rem;left:50%;transform:translateX(-50%);font-size:.55rem;letter-spacing:.3em;color:var(--gold);animation:blink 1.4s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
h1{font-size:clamp(1.1rem,3vw,1.6rem);text-align:center;color:var(--violet);text-shadow:0 0 18px rgba(167,139,250,.7);letter-spacing:.08em;margin-bottom:1rem}
.score{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted);margin-bottom:.8rem;letter-spacing:.1em}
.score b{color:var(--gold)}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#060212;border:2px solid rgba(167,139,250,.3);border-radius:.6rem}
.controls{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;font-size:.6rem}
button{background:rgba(167,139,250,.12);border:2px solid var(--violet);color:var(--fg);padding:.7rem 1.2rem;border-radius:.5rem;font:inherit;font-size:.55rem;letter-spacing:.1em;cursor:pointer;transition:all .15s}
button:hover{background:var(--violet);color:#0b0517;box-shadow:0 0 20px rgba(167,139,250,.6)}
.keys{font-size:.55rem;color:var(--muted);letter-spacing:.05em}
.keys b{color:var(--pink)}
</style>
</head>
<body>
<div class="screen">
<h1>◮ VIOLET ARCADE ◮</h1>
<div class="score"><span>HI <b>0000</b></span><span id="score">SCORE 0000</span></div>
<canvas id="c" width="640" height="360"></canvas>
<div class="controls">
  <button id="start">▶ START</button>
  <button id="pause">⏸ PAUSE</button>
</div>
<div class="keys">← → move · <b>SPACE</b> shoot · <b>P</b> pause</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=640,H=360;
const player={x:W/2,y:H-40,w:44,h:14,speed:5};
const bullets=[],enemies=[],explosions=[];
let score=0,hi=0,paused=false,running=false,keys={},spawnT=0,gameOver=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&running&&!paused)shoot();if(e.code==='KeyP')paused=!paused});
addEventListener('keyup',e=>keys[e.code]=false);
function shoot(){
  bullets.push({x:player.x,y:player.y-10,vy:-8});
  if(bullets.length>1&&Math.random()<.3)bullets.push({x:player.x+10,y:player.y-8,vy:-8});
}
function spawnEnemy(){
  const type=Math.random()<.3?'fast':'norm';
  enemies.push({x:20+Math.random()*(W-40),y:-24,w:26,h:26,type,hp:type==='fast'?1:2,vy:type==='fast'?2.6:1.3});
}
function boom(x,y){
  for(let i=0;i<14;i++)explosions.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,hue:270+Math.random()*40});
}
document.getElementById('start').addEventListener('click',()=>{
  running=true;gameOver=false;paused=false;score=0;bullets.length=0;enemies.length=0;explosions.length=0;
  player.x=W/2;spawnT=0;
});
document.getElementById('pause').addEventListener('click',()=>{if(running)paused=!paused});
(function loop(){
  requestAnimationFrame(loop);
  if(!running)return;
  ctx.fillStyle='#060212';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(167,139,250,.12)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  if(!paused){
    if(keys['ArrowLeft'])player.x-=player.speed;
    if(keys['ArrowRight'])player.x+=player.speed;
    player.x=Math.max(20,Math.min(W-20,player.x));
    bullets.forEach(b=>b.y+=b.vy);
    enemies.forEach(e=>e.y+=e.vy);
    if(spawnT++>36){spawnEnemy();spawnT=0}
    for(let i=bullets.length-1;i>=0;i--)for(let j=enemies.length-1;j>=0;j--){
      const b=bullets[i],e=enemies[j];
      if(b&&e&&Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<16){
        e.hp--;bullets.splice(i,1);boom(e.x,e.y);
        if(e.hp<=0){enemies.splice(j,1);score+=100;if(score>hi)hi=score}
        break;
      }
    }
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(e.y>H+30||(Math.abs(e.x-player.x)<26&&Math.abs(e.y-player.y)<20)){
        if(e.y<H){boom(player.x,player.y);gameOver=true;running=false}
        enemies.splice(j,1);
      }
    }
    explosions.forEach(x=>{x.x+=x.vx;x.y+=x.vy;x.life*=.94});
    explosions=explosions.filter(x=>x.life>.02);
  }
  // draw player
  ctx.fillStyle='#7df9ff';
  ctx.shadowColor='#7df9ff';ctx.shadowBlur=12;
  ctx.fillRect(player.x-22,player.y-8,44,16);
  ctx.fillStyle='#a78bfa';
  ctx.beginPath();ctx.moveTo(player.x,player.y-20);ctx.lineTo(player.x-12,player.y-8);ctx.lineTo(player.x+12,player.y-8);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  // bullets
  ctx.fillStyle='#fbbf24';
  bullets.forEach(b=>{ctx.shadowColor='#fbbf24';ctx.shadowBlur=8;ctx.fillRect(b.x-2,b.y-6,4,12)});
  ctx.shadowBlur=0;
  // enemies
  enemies.forEach(e=>{
    ctx.fillStyle=e.type==='fast'?'#f472b6':'#a78bfa';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;
    ctx.beginPath();ctx.moveTo(e.x,e.y-13);ctx.lineTo(e.x+13,e.y+10);ctx.lineTo(e.x-13,e.y+10);ctx.closePath();ctx.fill();
  });
  ctx.shadowBlur=0;
  // explosions
  explosions.forEach(x=>{ctx.fillStyle=`hsla(${x.hue},90%,70%,${x.life})`;ctx.beginPath();ctx.arc(x.x,x.y,3,0,7);ctx.fill()});
  document.getElementById('score').textContent='SCORE '+String(score).padStart(4,'0');
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H/2-30,W,60);
    ctx.fillStyle='#f472b6';ctx.font='16px monospace';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,H/2+5);ctx.textAlign='left';
  }
})();
</script>
</body>
</html>
