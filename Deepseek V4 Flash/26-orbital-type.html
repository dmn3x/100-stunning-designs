<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>26 — Orbital Type</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070312;--fg:#e4dcf5;--muted:#5d5290;--violet:#a78bfa;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:900;letter-spacing:.02em}
.title em{font-style:normal;color:var(--violet);text-shadow:0 0 20px rgba(167,139,250,.7)}
.sub{top:3.2rem;left:1.4rem;font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--gold)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.7rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">ORBITAL <em>TYPE</em></div>
<div class="ui sub">words in orbit · type to launch a new satellite</div>
<div class="ui hint"><b>type</b> — new word · <b>click</b> — eject satellites</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const WORDS=['violet','voltage','nebula','pulse','aurora','plasma','orbit','signal','echo','flux','cascade','prism'];
const sats=[];
function addSat(text){
  const a=Math.random()*Math.PI*2;
  sats.push({text,x:W/2,y:H/2,r:70+Math.random()*150,a,speed:(Math.random()<.5?-1:1)*(.003+Math.random()*.006),hue:250+Math.random()*50,size:14+Math.random()*10});
}
for(let i=0;i<8;i++)addSat(WORDS[Math.floor(Math.random()*WORDS.length)]);
addEventListener('keydown',e=>{
  if(e.key.length===1&&e.key.match(/[a-z ]/i)){
    addSat(e.key.toUpperCase());
  }else if(e.key==='Backspace'&&sats.length){
    sats.pop();
  }
});
addEventListener('click',()=>{
  sats.forEach(s=>{s.r*=1.3;s.speed*=-1.2});
});
(function tick(){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(7,3,18,.3)';ctx.fillRect(0,0,W,H);
  // center sun
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,90);
  g.addColorStop(0,'rgba(167,139,250,.35)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(W/2,H/2,90,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.font='900 11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('TYPE',W/2,H/2);
  ctx.font='700 8px monospace';ctx.fillStyle='rgba(167,139,250,.7)';
  ctx.fillText('the void answers',W/2,H/2+16);
  for(const s of sats){
    s.a+=s.speed;
    const x=W/2+Math.cos(s.a)*s.r;
    const y=H/2+Math.sin(s.a)*s.r*.7;
    ctx.strokeStyle='rgba(167,139,250,.14)';
    ctx.setLineDash([3,7]);
    ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(x,y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.font=`700 ${s.size}px monospace`;
    ctx.fillStyle=`hsla(${s.hue},85%,75%,.95)`;
    ctx.shadowColor=`hsla(${s.hue},90%,60%,.9)`;ctx.shadowBlur=14;
    ctx.fillText(s.text,x,y);
    ctx.shadowBlur=0;
    // orbit trail
    ctx.beginPath();
    for(let i=0;i<36;i++){
      const a2=s.a-i*.02;
      const tx=W/2+Math.cos(a2)*s.r,ty=H/2+Math.sin(a2)*s.r*.7;
      i===0?ctx.moveTo(tx,ty):ctx.lineTo(tx,ty);
    }
    ctx.strokeStyle=`hsla(${s.hue},80%,60%,.2)`;
    ctx.stroke();
  }
  ctx.textAlign='left';
})(0);
</script>
</body>
</html>
