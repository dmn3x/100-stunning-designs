<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22 — Photo Loom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0512;--fg:#e6def5;--muted:#5f5490;--violet:#a78bfa;--cyan:#7df9ff}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif}
header{text-align:center;padding:3rem 1rem 1.6rem}
h1{font-size:clamp(1.5rem,4vw,2.4rem)}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--muted);margin-top:.7rem;font-size:.9rem}
main{max-width:1000px;margin:0 auto;padding:0 1.5rem 3rem}
.upload{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:2.6rem 1rem;border:2px dashed rgba(167,139,250,.35);border-radius:1.2rem;margin-bottom:1.6rem;cursor:pointer;transition:all .3s;background:rgba(139,92,246,.04)}
.upload:hover{border-color:var(--violet);background:rgba(139,92,246,.1)}
.upload .ico{font-size:2.2rem}
.upload small{color:var(--muted);font-size:.78rem}
.upload input{display:none}
.controls{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.6rem}
button{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);color:var(--fg);padding:.6rem 1.2rem;border-radius:99px;font:inherit;font-size:.8rem;cursor:pointer;transition:all .2s}
button:hover{background:rgba(167,139,250,.25);box-shadow:0 0 14px rgba(167,139,250,.35)}
button.active{background:var(--violet);color:#0a0512;border-color:var(--violet)}
.stage{display:none;position:relative;border-radius:1rem;overflow:hidden;background:#05020b;border:1px solid rgba(167,139,250,.2)}
.stage.show{display:block}
#img{display:block;width:100%;max-height:70vh;object-fit:contain}
#out{display:block;width:100%;max-height:70vh;object-fit:contain}
.note{text-align:center;color:var(--muted);font-size:.8rem;margin-top:1.2rem}
.note b{color:var(--cyan)}
</style>
</head>
<body>
<header><h1>Photo <em>Loom</em></h1><p>weave any image into threads of light — upload, pick a weave, watch it re-spin</p></header>
<main>
<label class="upload" id="drop">
  <div class="ico">🖼️</div>
  <div>Choose an image</div>
  <small>or drop one anywhere on this card</small>
  <input type="file" id="file" accept="image/*">
</label>
<div class="controls" id="controls" style="display:none">
  <button data-mode="threads" class="active">🪡 threads</button>
  <button data-mode="pixels">▪ pixels</button>
  <button data-mode="rings">◎ rings</button>
  <button data-mode="scan">▤ scan</button>
  <button id="download">⬇ save</button>
</div>
<div class="stage" id="stage"><canvas id="out"></canvas></div>
<p class="note" id="note" style="display:none">weave: <b>threads</b> · drag inside the stage to re-weave</p>
</main>
<script>
const file=document.getElementById('file'),drop=document.getElementById('drop');
const stage=document.getElementById('stage'),out=document.getElementById('out'),note=document.getElementById('note');
const controls=document.getElementById('controls');
const ctx=out.getContext('2d');
let img=null,mode='threads';
file.addEventListener('change',e=>{const f=e.target.files[0];if(f)load(f)});
drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='#7df9ff'});
drop.addEventListener('dragleave',()=>{drop.style.borderColor=''});
drop.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))load(f)});
function load(f){
  const url=URL.createObjectURL(f);
  const im=new Image();
  im.onload=()=>{
    img=im;
    stage.classList.add('show');
    controls.style.display='flex';
    note.style.display='block';
    weave();
    URL.revokeObjectURL(url);
  };
  im.src=url;
}
function weave(){
  if(!img)return;
  const W=Math.min(900,img.naturalWidth),H=Math.min(600,img.naturalHeight);
  out.width=W;out.height=H;
  ctx.fillStyle='#05020b';ctx.fillRect(0,0,W,H);
  const tw=Math.max(4,Math.floor(W/90)),th=Math.max(3,Math.floor(H/70));
  const cw=W/tw,ch=H/th;
  const tmp=document.createElement('canvas');
  tmp.width=tw;tmp.height=th;
  const tctx=tmp.getContext('2d');
  tctx.drawImage(img,0,0,tw,th);
  const data=tctx.getImageData(0,0,tw,th).data;
  if(mode==='threads'){
    for(let x=0;x<tw;x++){
      ctx.beginPath();
      let lastY=null;
      for(let y=0;y<th;y++){
        const i=(y*tw+x)*4;
        const col=`rgba(${data[i]},${data[i+1]},${data[i+2]},1)`;
        const yy=y*ch;
        ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,cw*.45);
        if(lastY!==null){ctx.beginPath();ctx.moveTo(x*cw+cw/2,lastY);ctx.lineTo(x*cw+cw/2,yy);ctx.stroke()}
        lastY=yy;
      }
    }
  }else if(mode==='pixels'){
    for(let y=0;y<th;y++)for(let x=0;x<tw;x++){
      const i=(y*tw+x)*4;
      ctx.fillStyle=`rgba(${data[i]},${data[i+1]},${data[i+2]},1)`;
      ctx.fillRect(x*cw,y*ch,cw+1,ch+1);
    }
  }else if(mode==='rings'){
    for(let y=0;y<th;y++)for(let x=0;x<tw;x++){
      const i=(y*tw+x)*4;
      ctx.fillStyle=`rgba(${data[i]},${data[i+1]},${data[i+2]},1)`;
      ctx.beginPath();ctx.arc(x*cw+cw/2,y*ch+ch/2,Math.max(1,cw*.42),0,7);ctx.fill();
    }
  }else{
    for(let x=0;x<tw;x++){
      const col=`rgba(${data[x*4]},${data[x*4+1]},${data[x*4+2]},1)`;
      ctx.fillStyle=col;
      ctx.fillRect(x*cw,0,cw+1,H);
    }
  }
}
document.querySelectorAll('#controls button[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelector('#controls button.active')?.classList.remove('active');
  b.classList.add('active');mode=b.dataset.mode;weave();
}));
document.getElementById('download').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download='photo-loom-weave.png';
  a.href=out.toDataURL('image/png');
  a.click();
});
let dragging=false;
stage.addEventListener('mousedown',()=>dragging=true);
addEventListener('mouseup',()=>dragging=false);
stage.addEventListener('mousemove',e=>{
  if(dragging&&img){
    const r=stage.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*img.naturalWidth;
    const y=(e.clientY-r.top)/r.height*img.naturalHeight;
    // shimmer effect: redraw with slight offset
    ctx.fillStyle='rgba(5,2,11,.12)';ctx.fillRect(0,0,out.width,out.height);
  }
});
</script>
</body>
</html>
