<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>21 — Violet Clockwork</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0513;--fg:#e6def7;--muted:#5d5390;--violet:#a78bfa;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'Courier New',monospace;overflow:hidden;display:flex;align-items:center;justify-content:center}
.clock{position:relative;width:min(520px,88vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1a1030,#0d0719 70%);border:2px solid rgba(167,139,250,.4);box-shadow:0 0 70px rgba(139,92,246,.2),inset 0 0 60px rgba(0,0,0,.6)}
.clock::before{content:'';position:absolute;inset:-4%;border-radius:50%;border:1px dashed rgba(167,139,250,.2);animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.marker{position:absolute;left:50%;top:50%;width:2px;height:10px;background:rgba(167,139,250,.5);transform-origin:0 0}
.hand{position:absolute;left:50%;top:50%;transform-origin:0 50%;border-radius:4px;z-index:3}
.hand.hour{width:22%;height:5px;background:linear-gradient(90deg,var(--violet),#c4b5fd);box-shadow:0 0 14px var(--violet)}
.hand.min{width:34%;height:3px;background:linear-gradient(90deg,#fbbf24,#fde68a);box-shadow:0 0 12px var(--gold)}
.hand.sec{width:40%;height:1px;background:var(--fg);box-shadow:0 0 8px #fff;z-index:4}
.center{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 18px var(--violet);transform:translate(-50%,-50%);z-index:5}
.digit{position:absolute;font-size:.72rem;letter-spacing:.2em;color:var(--muted);transform:translate(-50%,-50%);z-index:2}
.readout{position:absolute;left:50%;top:64%;transform:translateX(-50%);text-align:center;z-index:3}
.readout .time{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900;letter-spacing:.06em;color:var(--violet);text-shadow:0 0 22px rgba(167,139,250,.6)}
.readout .date{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:.4rem}
.brand{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:.56rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);z-index:2}
.title{position:fixed;top:1.5rem;left:1.5rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.title span{color:var(--violet);text-shadow:0 0 16px rgba(167,139,250,.6)}
.sub{position:fixed;top:3.2rem;left:1.5rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{position:fixed;bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<div class="title">VIOLET <span>CLOCKWORK</span></div>
<div class="sub">the hours tick in ultraviolet</div>
<div class="hint">time is an illusion — lunchtime doubly so</div>
<div class="clock" id="clock">
  <div class="brand">voltage &amp; co.</div>
  <div id="digits"></div>
  <div class="hand hour" id="hour"></div>
  <div class="hand min" id="min"></div>
  <div class="hand sec" id="sec"></div>
  <div class="center"></div>
  <div class="readout"><div class="time" id="time">00:00:00</div><div class="date" id="date">—</div></div>
</div>
<script>
const clock=document.getElementById('clock');
const digits=document.getElementById('digits');
let dhtml='';
for(let i=0;i<12;i++){
  const a=i*30*Math.PI/180;
  const x=50+Math.sin(a)*40,y=50-Math.cos(a)*40;
  dhtml+=`<div class="digit" style="left:${x}%;top:${y}%">${i===0?12:i}</div>`;
}
digits.innerHTML=dhtml;
const hour=document.getElementById('hour'),min=document.getElementById('min'),sec=document.getElementById('sec');
const timeEl=document.getElementById('time'),dateEl=document.getElementById('date');
function tick(){
  const now=new Date();
  const h=now.getHours()%12,m=now.getMinutes(),s=now.getSeconds(),ms=now.getMilliseconds();
  hour.style.transform=`rotate(${(h+m/60)*30}deg)`;
  min.style.transform=`rotate(${(m+s/60)*6}deg)`;
  sec.style.transform=`rotate(${(s+ms/1000)*6}deg)`;
  timeEl.textContent=now.toLocaleTimeString('en-GB');
  dateEl.textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(tick,50);tick();
</script>
</body>
</html>
