<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>62 — Plasma Fountain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060312;--fg:#e2dcf5;--muted:#58508d;--violet:#a78bfa;--cyan:#7df9ff;--pink:#f472b6}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.title span{color:var(--violet);text-shadow:0 0 16px rgba(167,139,250,.6)}
.sub{top:3.1rem;left:1.4rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--pink)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">PLASMA <span>FOUNTAIN</span></div>
<div class="ui sub">the basin fills with liquid light</div>
<div class="ui hint"><b>click</b> — stir the fountain</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const drops=[];
function fountain(){
  const x=W/2+(Math.random()-.5)*30;
  drops.push({
    x,y:H+10,
    vx:(Math.random()-.5)*2,
    vy:-(9+Math.random()*6),
    hue:250+Math.random()*60,
    s:1.5+Math.random()*2.5,
    life:1
  });
}
addEventListener('click',()=>{
  for(let i=0;i<14;i++)fountain();
});
addEventListener('touchstart',()=>{
  for(let i=0;i<14;i++)fountain();
});
setInterval(()=>{for(let i=0;i<4;i++)fountain()},80);
(function tick(){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(6,3,18,.25)';ctx.fillRect(0,0,W,H);
  // basin
  ctx.strokeStyle='rgba(167,139,250,.25)';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.ellipse(W/2,H-30,Math.min(W*.4,300),60,0,0,7);
  ctx.stroke();
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.vy+=.28;
    d.vx*=Math.random()<.02?-1:1;
    d.x+=d.vx;d.y+=d.vy;
    d.life-=.004;
    if(d.y>H-20){d.y=H-20;d.vy*=-.35;d.vx*=.9;d.life-=.01}
    if(d.life<=0){drops.splice(i,1);continue}
    ctx.fillStyle=`hsla(${d.hue},90%,${50+d.life*40}%,${d.life*.9})`;
    ctx.beginPath();ctx.arc(d.x,d.y,d.s,0,7);ctx.fill();
  }
  // surface shimmer
  for(let i=0;i<10;i++){
    const sx=W/2+(Math.random()-.5)*Math.min(W*.8,500);
    const sy=H-28+Math.sin(performance.now()*.003+i)*6;
    ctx.fillStyle=`hsla(${265+i*4},90%,75%,.25)`;
    ctx.beginPath();ctx.arc(sx,sy,2,0,7);ctx.fill();
  }
})(0);
</script>
</body>
</html>
