<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18 — Grid Sentinels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0714;--fg:#e6def7;--muted:#5d5290;--violet:#8b5cf6;--cyan:#67e8f9}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'Segoe UI',system-ui,sans-serif;overflow:hidden}
#grid{position:fixed;inset:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-template-rows:repeat(auto-fill,minmax(120px,1fr));gap:1px;background:rgba(139,92,246,.08);padding:0;z-index:0}
.cell{position:relative;background:transparent;cursor:pointer;overflow:hidden}
.cell::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(139,92,246,.35),transparent 60%);opacity:0;transition:opacity .3s}
.cell:hover::after{opacity:1}
.cell .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--violet);box-shadow:0 0 14px var(--violet);opacity:.7;transition:all .3s}
.cell:hover .core{transform:translate(-50%,-50%) scale(2.4);opacity:1;background:var(--cyan);box-shadow:0 0 30px var(--cyan)}
.ui{position:fixed;z-index:10;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.title span{color:var(--violet);text-shadow:0 0 18px rgba(139,92,246,.6)}
.sub{top:3.1rem;left:1.4rem;font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.counter{bottom:1.4rem;right:1.4rem;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.counter b{color:var(--cyan)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.counter{bottom:.8rem;right:.8rem}}
</style>
</head>
<body>
<div id="grid"></div>
<div class="ui title">GRID <span>SENTINELS</span></div>
<div class="ui sub">every cell watches · wake them with a touch</div>
<div class="ui counter">awake: <b id="aw">0</b></div>
<script>
const grid=document.getElementById('grid');
const COLS=Math.max(5,Math.floor(innerWidth/120));
const ROWS=Math.max(4,Math.floor(innerHeight/120));
grid.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
grid.style.gridTemplateRows=`repeat(${ROWS},1fr)`;
const cells=[];
let awake=0;
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const cell=document.createElement('div');
  cell.className='cell';
  cell.innerHTML='<span class="core"></span>';
  const delay=(Math.random()*6).toFixed(2);
  const data={r,c,on:false,delay};
  cell.dataset.delay=delay;
  cell.addEventListener('click',()=>{
    if(data.on)return;
    data.on=true;awake++;
    cell.classList.add('lit');
    cell.querySelector('.core').style.animation=`wake 2s ease-out`;
    const pulse=setInterval(()=>{
      if(!data.on){clearInterval(pulse);return}
      const r0=r+Math.floor(Math.random()*3)-1,c0=c+Math.floor(Math.random()*3)-1;
      if(r0>=0&&r0<ROWS&&c0>=0&&c0<COLS){
        const t=cells[r0*COLS+c0];
        if(t&&!t.on){t.on=true;awake++;t.querySelector('.core').style.animation='wake 2s ease-out'}
      }
    },600);
    cell.addEventListener('mouseleave',()=>{});
  });
  grid.appendChild(cell);
  cells.push(data);
  const core=cell.querySelector('.core');
  core.style.animation=`pulse ${2+Math.random()*3}s ease-in-out ${delay}s infinite`;
}
document.addEventListener('keydown',e=>{
  if(e.code==='KeyR'){
    cells.forEach(d=>{d.on=false});
    document.querySelectorAll('.cell .core').forEach(c=>c.style.animation='');
    awake=0;update();
  }
});
function update(){document.getElementById('aw').textContent=awake}
setInterval(update,300);
const style=document.createElement('style');
style.textContent=`
@keyframes pulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.6)}}
@keyframes wake{0%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 14px var(--violet)}50%{transform:translate(-50%,-50%) scale(3.2);box-shadow:0 0 44px var(--cyan)}100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 14px var(--violet)}}
.cell.lit .core{background:var(--cyan)!important;box-shadow:0 0 24px var(--cyan)!important;opacity:1}
`;
document.head.appendChild(style);
update();
</script>
</body>
</html>
