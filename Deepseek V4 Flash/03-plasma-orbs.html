<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 — Plasma Orbs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0618;--fg:#e6def7;--muted:#6b5f99}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'Segoe UI',system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-weight:800;font-size:clamp(1.2rem,3vw,1.7rem);letter-spacing:.04em}
.title span{background:linear-gradient(90deg,#c084fc,#8b5cf6,#6d28d9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{top:3.1rem;left:1.4rem;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.counter{bottom:1.4rem;left:1.4rem;font-size:.68rem;color:var(--muted)}
.counter b{color:#c084fc}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint,.counter{bottom:.8rem}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title"><span>Plasma Orbs</span></div>
<div class="ui sub">liquid light · cursor stirs the brew</div>
<div class="ui counter">orbs: <b id="oc">0</b></div>
<div class="ui hint">click to add · right-click to pop</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
const orbs=[];
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
function addOrb(x,y){
  const hue=250+Math.random()*60;
  orbs.push({x:x??Math.random()*W,y:y??Math.random()*H,r:26+Math.random()*60,hue,
    vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,
    t:Math.random()*Math.PI*2,id:Date.now()+Math.random()});
}
for(let i=0;i<10;i++)addOrb();
let mx=W/2,my=H/2,mDown=false;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY});
addEventListener('mousedown',e=>{mDown=true;if(e.button===2)orbs.length&&orbs.splice(orbs.length-1,1);else addOrb(e.clientX,e.clientY)});
addEventListener('mouseup',()=>mDown=false);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('touchstart',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;addOrb(mx,my)});
(function tick(){
  requestAnimationFrame(tick);
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  g.addColorStop(0,'#140a2b');g.addColorStop(1,'#0b0618');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(mDown)orbs.forEach(o=>{o.vx+=(mx-o.x)*.0002;o.vy+=(my-o.y)*.0002});
  orbs.forEach((o,i)=>{
    o.t+=.02;o.x+=o.vx;o.y+=o.vy;o.vx*=.99;o.vy*=.99;
    if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;
    if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;
    const rr=o.r*(1+Math.sin(o.t)*.08);
    const rad=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,rr*2);
    rad.addColorStop(0,`hsla(${o.hue},90%,78%,.85)`);
    rad.addColorStop(.45,`hsla(${o.hue},85%,55%,.35)`);
    rad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rad;
    ctx.beginPath();ctx.arc(o.x,o.y,rr*2,0,7);ctx.fill();
    ctx.fillStyle=`hsla(${o.hue},90%,88%,.9)`;
    ctx.beginPath();ctx.arc(o.x-rr*.2,o.y-rr*.2,rr*.12,0,7);ctx.fill();
    orbs.forEach((q,j)=>{if(j<=i)return;const d=Math.hypot(o.x-q.x,o.y-q.y);if(d<o.r+q.r){const m=Math.min(o.r,q.r)/Math.max(o.r,q.r);ctx.strokeStyle=`hsla(${o.hue},80%,70%,${m*.25})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(q.x,q.y);ctx.stroke()}});
  });
  document.getElementById('oc').textContent=orbs.length;
})(0);
</script>
</body>
</html>
