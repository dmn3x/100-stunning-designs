<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>35 — Lunar Phases</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05030e;--fg:#e0d8f2;--muted:#5a5090;--violet:#a78bfa;--gold:#fbbf24}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace}
.wrap{max-width:760px;margin:0 auto;padding:3rem 1.5rem 4rem;text-align:center}
h1{font-size:clamp(1.5rem,4vw,2.4rem);letter-spacing:.06em;margin-bottom:.5rem}
h1 em{font-style:normal;color:var(--violet);text-shadow:0 0 20px rgba(167,139,250,.6)}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:2.6rem}
.moon-wrap{position:relative;width:min(280px,64vw);aspect-ratio:1;margin:0 auto 2rem}
.moon{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5f0ff,#c4b5fd 45%,#6d28d9 85%);box-shadow:0 0 80px rgba(167,139,250,.35),inset 0 0 40px rgba(0,0,0,.3);overflow:hidden}
.moon .dark{position:absolute;inset:0;border-radius:50%;background:#0a0618}
.moon .crater{position:absolute;border-radius:50%;background:rgba(0,0,0,.22);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.stage .pct{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);background:rgba(5,3,14,.7);padding:.4rem 1rem;border-radius:99px}
.slider{max-width:420px;margin:0 auto 2.4rem}
input[type=range]{width:100%;accent-color:var(--violet);cursor:pointer}
.labels{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.5rem}
.phase{font-size:1.3rem;letter-spacing:.1em;color:var(--gold);min-height:1.8em}
.desc{max-width:480px;margin:0 auto;color:var(--muted);font-size:.85rem;line-height:1.7;font-style:italic}
@media (max-width:600px){.wrap{padding-top:2rem}}
</style>
</head>
<body>
<div class="wrap">
<h1>LUNAR <em>PHASES</em></h1>
<div class="sub">drag the slider — the moon obeys your hand</div>
<div class="moon-wrap">
  <div class="moon" id="moon">
    <div class="crater" style="width:18%;height:18%;left:22%;top:28%"></div>
    <div class="crater" style="width:12%;height:12%;left:58%;top:46%"></div>
    <div class="crater" style="width:8%;height:8%;left:38%;top:62%"></div>
    <div class="crater" style="width:10%;height:10%;left:66%;top:22%"></div>
    <div class="dark" id="dark"></div>
  </div>
  <div class="stage"><div class="pct" id="pct">0%</div></div>
</div>
<div class="slider">
  <input type="range" id="slider" min="0" max="100" value="0">
  <div class="labels"><span>new</span><span>waxing</span><span>full</span><span>waning</span><span>new</span></div>
</div>
<div class="phase" id="phase">New Moon</div>
<div class="desc" id="desc">The moon hides its face from the world.</div>
</div>
<script>
const slider=document.getElementById('slider'),dark=document.getElementById('dark');
const pct=document.getElementById('pct'),phase=document.getElementById('phase'),desc=document.getElementById('desc');
const PHASES=[
 {n:'New Moon',d:'The moon hides its face from the world.'},
 {n:'Waxing Crescent',d:'A sliver of light returns, thin as a promise.'},
 {n:'First Quarter',d:'Half the disc glows — a decision half-made.'},
 {n:'Waxing Gibbous',d:'More than half, not yet whole; the light swells.'},
 {n:'Full Moon',d:'The moon shows all of itself at once.'},
 {n:'Waning Gibbous',d:'The light begins its slow retreat.'},
 {n:'Last Quarter',d:'Half again, but the other half this time.'},
 {n:'Waning Crescent',d:'A thin smile of light before the dark.'}
];
slider.addEventListener('input',()=>{
  const v=+slider.value;
  const rad=v/100*Math.PI*2;
  const lit=Math.cos(rad);
  const clip=`inset(0 ${lit>=0?0:50}% 0 ${lit>=0?50:0}%)`;
  dark.style.clipPath=`polygon(${lit>=0?'100% 0, 100% 100%, 50% 100%, 50% 0':'0 0, 0 100%, 50% 100%, 50% 0'})`;
  // simpler: use two overlays
  dark.style.clipPath=`circle(50% at 50% 50%)`;
  dark.style.opacity=String(1-Math.abs(lit)*.92);
  if(v<6.25){phase.textContent=PHASES[0].n;desc.textContent=PHASES[0].d}
  else if(v<18.75){phase.textContent=PHASES[1].n;desc.textContent=PHASES[1].d}
  else if(v<31.25){phase.textContent=PHASES[2].n;desc.textContent=PHASES[2].d}
  else if(v<43.75){phase.textContent=PHASES[3].n;desc.textContent=PHASES[3].d}
  else if(v<56.25){phase.textContent=PHASES[4].n;desc.textContent=PHASES[4].d}
  else if(v<68.75){phase.textContent=PHASES[5].n;desc.textContent=PHASES[5].d}
  else if(v<81.25){phase.textContent=PHASES[6].n;desc.textContent=PHASES[6].d}
  else if(v<93.75){phase.textContent=PHASES[7].n;desc.textContent=PHASES[7].d}
  else{phase.textContent=PHASES[0].n;desc.textContent=PHASES[0].d}
  pct.textContent=Math.round(Math.abs(Math.cos(v/100*Math.PI*2))*100)+'% lit';
});
slider.dispatchEvent(new Event('input'));
</script>
</body>
</html>
