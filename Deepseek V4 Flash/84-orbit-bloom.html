<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>84 — Orbit Bloom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060312;--fg:#e2dcf5;--muted:#58508d;--violet:#a78bfa;--pink:#f472b6;--gold:#fbbf24}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.title span{color:var(--gold);text-shadow:0 0 16px rgba(251,191,36,.6)}
.sub{top:3.1rem;left:1.4rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--pink)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">ORBIT <span>BLOOM</span></div>
<div class="ui sub">petals that remember their orbit</div>
<div class="ui hint"><b>click</b> — seed a bloom</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
const blooms=[];
function seed(x,y){
  blooms.push({x,y,t:0,hue:250+Math.random()*60,petals:5+Math.floor(Math.random()*4)});
}
for(let i=0;i<4;i++)seed(Math.random()*W,Math.random()*H);
addEventListener('click',e=>seed(e.clientX,e.clientY));
addEventListener('touchstart',e=>seed(e.touches[0].clientX,e.touches[0].clientY));
(function tick(){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(6,3,18,.2)';ctx.fillRect(0,0,W,H);
  for(const b of blooms){
    b.t+=.015;
    const open=Math.min(1,b.t);
    for(let p=0;p<b.petals;p++){
      const a=(p/b.petals)*Math.PI*2+b.t*.3;
      const len=open*(18+Math.sin(b.t*1.4+p)*4);
      const px=b.x+Math.cos(a)*len;
      const py=b.y+Math.sin(a)*len*.75;
      ctx.fillStyle=`hsla(${b.hue},90%,72%,${.6*open})`;
      ctx.shadowColor=`hsla(${b.hue},95%,60%,.9)`;ctx.shadowBlur=10;
      ctx.beginPath();ctx.ellipse(px,py,len*.3,len*.18,a,0,7);ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle=`hsla(${(b.hue+30)%360},95%,88%,.95)`;
    ctx.shadowColor='#fff';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
})(0);
</script>
</body>
</html>
