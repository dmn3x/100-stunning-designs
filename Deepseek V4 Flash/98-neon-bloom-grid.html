<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>98 — Neon Bloom Grid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060312;--fg:#e2dcf5;--muted:#58508d;--violet:#a78bfa;--pink:#f472b6;--cyan:#7df9ff}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,sans-serif}
header{text-align:center;padding:3rem 1rem 2rem}
h1{font-size:clamp(1.5rem,4.2vw,2.4rem);letter-spacing:.02em}
h1 span{background:linear-gradient(90deg,var(--violet),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--muted);margin-top:.6rem;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1.2rem;max-width:1000px;margin:0 auto;padding:0 1.5rem 4rem}
.tile{position:relative;aspect-ratio:1;border-radius:1.1rem;background:rgba(139,92,246,.05);border:1px solid rgba(167,139,250,.16);cursor:pointer;overflow:hidden;transition:all .3s}
.tile:hover{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 12px 36px rgba(139,92,246,.2)}
.tile canvas{position:absolute;inset:0;width:100%;height:100%}
.tile .label{position:absolute;bottom:.5rem;left:50%;transform:translateX(-50%);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tile:hover .label{color:var(--cyan)}
</style>
</head>
<body>
<header><h1>NEON <span>BLOOM GRID</span></h1><p>a wall of light-flowers — hover to grow, click to burst</p></header>
<div class="grid" id="grid"></div>
<script>
const grid=document.getElementById('grid');
const N=16;
for(let i=0;i<N;i++){
  const tile=document.createElement('div');
  tile.className='tile';
  const hue=245+(i*17)%60;
  tile.innerHTML=`<canvas width="170" height="170"></canvas><span class="label">bloom ${String(i+1).padStart(2,'0')}</span>`;
  grid.appendChild(tile);
  const cv=tile.querySelector('canvas'),ctx=cv.getContext('2d');
  let t=Math.random()*10,grow=0,burst=0;
  function draw(){
    ctx.clearRect(0,0,170,170);
    t+=.02;grow=Math.max(0,Math.min(1,grow));burst=Math.max(0,burst-.02);
    const cx=85,cy=85;
    for(let p=0;p<6;p++){
      const a=(p/6)*Math.PI*2+t*.3;
      const len=(14+grow*20+burst*26)*(1+Math.sin(t*1.4+p)*.2);
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
      ctx.strokeStyle=`hsla(${hue},90%,75%,${.4+grow*.4})`;
      ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.5,-8,len,0);ctx.stroke();
      ctx.fillStyle=`hsla(${hue},90%,72%,${.4+grow*.4+burst*.3})`;
      ctx.beginPath();ctx.ellipse(len*.85,0,len*.3,len*.2,0,0,7);ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle=`hsla(${(hue+30)%360},95%,86%,${.4+grow*.6})`;
    ctx.shadowColor='#fff';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(cx,cy,4+grow*4+burst*3,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
  tile.addEventListener('mouseenter',()=>grow+=.25);
  tile.addEventListener('mouseleave',()=>grow-=.15);
  tile.addEventListener('click',()=>burst=1);
  (function loop(){requestAnimationFrame(loop);draw()})();
}
</script>
</body>
</html>
