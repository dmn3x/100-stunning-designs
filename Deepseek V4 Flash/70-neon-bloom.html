<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>70 — Neon Bloom</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070312;--fg:#e4dcf5;--muted:#5d5290;--violet:#a78bfa;--pink:#f472b6;--gold:#fbbf24}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,sans-serif}
header{text-align:center;padding:3rem 1rem 2rem}
h1{font-size:clamp(1.5rem,4.2vw,2.4rem);letter-spacing:.02em}
h1 span{background:linear-gradient(90deg,var(--violet),var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--muted);margin-top:.6rem;font-size:.9rem}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.4rem;max-width:1000px;margin:0 auto;padding:0 1.5rem 4rem}
.flower{position:relative;aspect-ratio:1;border-radius:1.2rem;background:rgba(139,92,246,.05);border:1px solid rgba(167,139,250,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:all .3s}
.flower:hover{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 14px 40px rgba(139,92,246,.18)}
.flower canvas{position:absolute;inset:0;width:100%;height:100%}
.flower .tag{position:absolute;bottom:.6rem;left:50%;transform:translateX(-50%);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.flower:hover .tag{color:var(--pink)}
</style>
</head>
<body>
<header><h1>NEON <span>BLOOM</span></h1><p>twelve flowers of light — click any to make it bloom</p></header>
<div class="garden" id="garden"></div>
<script>
const FLOWERS=[
 {h:265,p:6,n:'Violet Star'},{h:290,p:7,n:'Plasma Rose'},{h:190,p:5,n:'Cyan Lily'},
 {h:320,p:8,n:'Fuchsia Burst'},{h:255,p:6,n:'Indigo Lotus'},{h:35,p:7,n:'Amber Sun'},
 {h:275,p:9,n:'Ultra Bloom'},{h:210,p:5,n:'Ice Petal'},{h:305,p:6,n:'Magenta Kiss'},
 {h:245,p:8,n:'Deep Violet'},{h:100,p:6,n:'Lime Spark'},{h:285,p:7,n:'Royal Daisy'}
];
const garden=document.getElementById('garden');
FLOWERS.forEach((f,i)=>{
  const d=document.createElement('div');
  d.className='flower';
  d.innerHTML=`<canvas width="200" height="200"></canvas><span class="tag">${f.n}</span>`;
  garden.appendChild(d);
  const cv=d.querySelector('canvas'),ctx=cv.getContext('2d');
  let bloom=0;
  function draw(){
    ctx.clearRect(0,0,200,200);
    const cx=100,cy=100;
    for(let p=0;p<f.p;p++){
      const a=(p/f.p)*Math.PI*2+performance.now()*.0004;
      const len=bloom*(30+Math.sin(performance.now()*.002+p)*6);
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
      ctx.fillStyle=`hsla(${f.h},90%,70%,.75)`;
      ctx.shadowColor=`hsla(${f.h},90%,60%,.9)`;ctx.shadowBlur=12;
      ctx.beginPath();ctx.ellipse(len*.5,0,len*.55,len*.3,0,0,7);ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle=`hsla(${(f.h+30)%360},95%,85%,.95)`;
    ctx.shadowColor='#fff';ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(cx,cy,8,0,7);ctx.fill();
    ctx.shadowBlur=0;
  }
  d.addEventListener('mouseenter',()=>{bloom=Math.min(1,bloom+.15)});
  d.addEventListener('mouseleave',()=>{bloom=Math.max(0,bloom-.08)});
  d.addEventListener('click',()=>{bloom=1;setTimeout(()=>bloom=.3,800)});
  (function loop(){requestAnimationFrame(loop);draw()})();
});
</script>
</body>
</html>
