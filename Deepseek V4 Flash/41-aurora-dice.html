<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>41 — Aurora Dice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070312;--fg:#e4dcf5;--muted:#5d5290;--violet:#a78bfa;--cyan:#7df9ff;--gold:#fbbf24}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;display:flex;align-items:center;justify-content:center;padding:1.4rem}
.app{width:min(460px,94vw);background:rgba(139,92,246,.05);border:1px solid rgba(167,139,250,.22);border-radius:1.6rem;padding:2.2rem;text-align:center}
h1{font-size:clamp(1.2rem,3.4vw,1.6rem);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.4rem}
h1 span{color:var(--violet);text-shadow:0 0 16px rgba(167,139,250,.6)}
.sub{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:1.8rem}
.die{width:120px;height:120px;margin:0 auto 1.6rem;border-radius:22px;background:linear-gradient(145deg,#1e1240,#0d0720);border:1px solid rgba(167,139,250,.5);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 40px rgba(139,92,246,.2);transition:transform .2s}
.die.rolling{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) translate(-4px,2px)}40%{transform:rotate(10deg) translate(4px,-2px)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.die .pips{display:grid;grid-template-columns:repeat(3,16px);grid-template-rows:repeat(3,16px);gap:8px}
.die .pip{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);place-self:center}
.readout{font-size:clamp(2.4rem,7vw,3.4rem);font-weight:900;letter-spacing:-.02em;color:#fff;text-shadow:0 0 30px rgba(167,139,250,.8);margin-bottom:.4rem}
.note{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:1.8rem}
.controls{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
button{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);color:var(--fg);padding:.7rem 1.4rem;border-radius:99px;font:inherit;font-size:.76rem;letter-spacing:.1em;cursor:pointer;transition:all .2s}
button:hover{background:rgba(167,139,250,.25);box-shadow:0 0 14px rgba(167,139,250,.35)}
button.active{background:var(--violet);color:#070312;border-color:var(--violet)}
.history{display:flex;justify-content:center;gap:.35rem;flex-wrap:wrap;margin-top:1.6rem;min-height:2em}
.history span{font-size:.7rem;padding:.25rem .55rem;border-radius:99px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.2);color:var(--muted)}
.history span.six{color:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
<div class="app">
<h1>AURORA <span>DICE</span></h1>
<div class="sub">one die · many skies</div>
<div class="die" id="die"><div class="pips" id="pips"></div></div>
<div class="readout" id="val">6</div>
<div class="note" id="note">the die glows with the northern lights</div>
<div class="controls">
  <button data-side="1">1</button><button data-side="2">2</button><button data-side="3">3</button>
  <button data-side="4">4</button><button data-side="5">5</button><button data-side="6">6</button>
</div>
<div class="history" id="history"></div>
</div>
<script>
const die=document.getElementById('die'),pips=document.getElementById('pips'),val=document.getElementById('val'),note=document.getElementById('note');
const history=document.getElementById('history');
const GRIDS={1:['2/2'],2:['1/1','3/3'],3:['1/1','2/2','3/3'],4:['1/1','1/3','3/1','3/3'],5:['1/1','1/3','2/2','3/1','3/3'],6:['1/1','1/3','2/1','2/3','3/1','3/3']};
const NOTES={1:'the sky is quiet tonight',2:'two lights dance',3:'a small constellation',4:'the aurora splits',5:'five stars align',6:'the full bloom of light'};
function show(n,animate){
  if(animate){
    die.classList.remove('rolling');void die.offsetWidth;
    die.classList.add('rolling');
  }
  pips.innerHTML=GRIDS[n].map(g=>`<span class="pip" style="grid-area:${g}"></span>`).join('');
  val.textContent=n;
  note.textContent=NOTES[n];
  const h=document.createElement('span');
  h.textContent=n;
  if(n===6)h.classList.add('six');
  history.prepend(h);
  while(history.children.length>8)history.removeChild(history.lastChild);
}
document.querySelectorAll('button[data-side]').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.side,true)));
show(6,false);
</script>
</body>
</html>
