<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09 — Auroral Curtain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#04030d;--fg:#d9d2f0;--muted:#4e4680}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'Georgia',serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.6rem;left:1.6rem;font-size:clamp(1.4rem,3.6vw,2.2rem);font-weight:700;letter-spacing:.06em}
.title i{font-style:normal;background:linear-gradient(90deg,#a78bfa,#67e8f9,#e879f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{top:3.5rem;left:1.6rem;font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.6rem;right:1.6rem;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:right}
@media (max-width:600px){.title{top:1rem;left:1rem}.sub{top:2.9rem;left:1rem}.hint{bottom:1rem;right:1rem}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">AURORAL <i>CURTAIN</i></div>
<div class="ui sub">polar wind · move cursor to part the veil</div>
<div class="ui hint">the sky dances for you</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
let mx=W/2;
addEventListener('mousemove',e=>{mx=e.clientX});
addEventListener('touchmove',e=>{mx=e.touches[0].clientX});
const STRIPS=90;
const strips=[];
for(let i=0;i<STRIPS;i++){
  strips.push({off:Math.random()*Math.PI*2,speed:.008+Math.random()*.03,amp:20+Math.random()*90,hue:250+Math.random()*70});
}
(function tick(t){
  requestAnimationFrame(tick);
  ctx.fillStyle='rgba(4,3,13,.3)';ctx.fillRect(0,0,W,H);
  const step=W/STRIPS;
  for(let s=0;s<STRIPS;s++){
    const st=strips[s];
    const sway=Math.sin(t*st.speed+st.off)*st.amp;
    const baseX=s*step;
    const curve=[];
    for(let y=0;y<H;y+=6){
      const wave=Math.sin(y*.01+t*st.speed*1.6+st.off)*st.amp*.5;
      const curtain=Math.max(0,1-Math.abs(baseX-mx)/(W*.5));
      const x=baseX+wave+(mx>baseX?curtain*30:0);
      curve.push([x,y]);
    }
    ctx.beginPath();ctx.moveTo(curve[0][0],curve[0][1]);
    for(const [x,y] of curve)ctx.lineTo(x,y);
    ctx.strokeStyle=`hsla(${st.hue},90%,${55+sway*.1}%,${.05+sway*.002})`;
    ctx.lineWidth=2;ctx.stroke();
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,`hsla(${st.hue},90%,65%,.045)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(curve[0][0],0);
    for(const [x,y] of curve)ctx.lineTo(x,y);
    ctx.lineTo(baseX+sway,H);ctx.lineTo(baseX+sway,0);ctx.closePath();ctx.fill();
  }
})(0);
</script>
</body>
</html>
