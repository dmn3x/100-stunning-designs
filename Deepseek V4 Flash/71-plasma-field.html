<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>71 — Plasma Field</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060312;--fg:#e2dcf5;--muted:#58508d;--violet:#a78bfa;--cyan:#7df9ff;--pink:#f472b6}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'SF Mono',Consolas,monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.1rem,2.8vw,1.5rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.title span{color:var(--pink);text-shadow:0 0 16px rgba(244,114,182,.6)}
.sub{top:3.1rem;left:1.4rem;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
.hint b{color:var(--cyan)}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.6rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">PLASMA <span>FIELD</span></div>
<div class="ui sub">a sea of charged light, breathing</div>
<div class="ui hint"><b>click</b> — ripple the field</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',resize);resize();
let t=0,ripples=[];
addEventListener('click',e=>ripples.push({x:e.clientX,y:e.clientY,r:0}));
addEventListener('touchstart',e=>ripples.push({x:e.touches[0].clientX,y:e.touches[0].clientY,r:0}));
(function tick(){
  requestAnimationFrame(tick);
  t+=.01;
  ctx.fillStyle='rgba(6,3,18,.16)';ctx.fillRect(0,0,W,H);
  const step=26;
  for(let y=step/2;y<H;y+=step){
    for(let x=step/2;x<W;x+=step){
      let v=Math.sin(x*.012+t)*Math.cos(y*.012-t*.7)*.5;
      v+=Math.sin((x+y)*.008-t*1.2)*.3;
      for(const r of ripples){
        const d=Math.hypot(x-r.x,y-r.y);
        if(d<r.r+40)v+=Math.sin(d*.2-r.r*.25)*.8*Math.max(0,1-d/140);
      }
      const hue=260+v*80;
      const a=.25+v*.25;
      ctx.fillStyle=`hsla(${hue},90%,${55+v*18}%,${Math.max(.08,a)})`;
      ctx.fillRect(x-3,y-3,6,6);
    }
  }
  ripples.forEach(r=>r.r+=2.5);
  ripples=ripples.filter(r=>r.r<240);
})(0);
</script>
</body>
</html>
