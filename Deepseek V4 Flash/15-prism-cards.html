<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 — Prism Cards</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0616;--fg:#e8e0f8;--muted:#6b5e9c}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,sans-serif}
header{text-align:center;padding:3.4rem 1rem 2.4rem}
h1{font-size:clamp(1.6rem,4.4vw,2.6rem);letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#c084fc,#818cf8,#22d3ee,#f472b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p.sub{color:var(--muted);margin-top:.7rem;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.4rem;max-width:1080px;margin:0 auto;padding:0 1.5rem 4rem}
.card{position:relative;border-radius:1.1rem;padding:1.6rem;min-height:190px;cursor:pointer;overflow:hidden;border:1px solid rgba(167,139,250,.22);background:#140b26;transition:transform .3s,box-shadow .3s}
.card::before{content:'';position:absolute;inset:-60%;background:conic-gradient(from var(--a,0deg),transparent 0 40%,rgba(167,139,250,.5) 50%,transparent 60% 100%);animation:rotate 6s linear infinite;opacity:0;transition:opacity .4s}
.card:hover::before{opacity:1}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 50px rgba(139,92,246,.25)}
@keyframes rotate{to{--a:360deg}}
.card .content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
.card .icon{font-size:1.9rem;margin-bottom:.9rem}
.card h3{font-size:1.1rem;margin-bottom:.45rem;font-weight:700}
.card p{font-size:.85rem;color:var(--muted);line-height:1.55;flex:1}
.card .tag{align-self:flex-start;margin-top:1rem;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;padding:.3rem .7rem;border-radius:99px;background:rgba(167,139,250,.12);color:#c4b5fd}
@media (prefers-reduced-motion:reduce){.card::before{animation:none}}
</style>
</head>
<body>
<header><h1>Prism <span>Cards</span></h1><p class="sub">a rainbow of thought — hover to split the light</p></header>
<div class="grid" id="grid"></div>
<script>
const CARDS=[
 {icon:'⚡',t:'Voltage',d:'Every stroke of lightning is a question the sky asks too quickly.',tag:'Physics'},
 {icon:'🌱',t:'Growth',d:'Roots do not hurry; they simply refuse to stop believing in spring.',tag:'Botany'},
 {icon:'🌌',t:'Vastness',d:'The galaxy is patient, and it has been waiting for your wonder.',tag:'Astronomy'},
 {icon:'💭',t:'Dreams',d:'Sleep is the workshop where the mind repairs itself in violet light.',tag:'Psychology'},
 {icon:'🔭',t:'Curiosity',d:'Every telescope is a promise: look closer, and the universe will answer.',tag:'Science'},
 {icon:'🎵',t:'Harmony',d:'Music is the space between notes where the silence learns to sing.',tag:'Art'},
 {icon:'📚',t:'Knowledge',d:'A page turned is a door opened into a room you built yourself.',tag:'Literature'},
 {icon:'🧪',t:'Alchemy',d:'We are all trying to turn the ordinary hours into a little gold.',tag:'Chemistry'},
 {icon:'🪐',t:'Orbits',d:'Gravity is just love that learned to be patient.',tag:'Astronomy'},
 {icon:'🔥',t:'Ember',d:'Small fires still cast the longest shadows at dawn.',tag:'Poetry'},
 {icon:'💧',t:'Flow',d:'Water does not fight the stone; it memorizes its shape.',tag:'Philosophy'},
 {icon:'🕯️',t:'Light',d:'A candle is a star that agreed to stay indoors.',tag:'Poetry'},
 {icon:'🌀',t:'Chaos',d:'The butterfly does not know it owns the weather.',tag:'Chaos theory'},
 {icon:'🧭',t:'Direction',d:'North is not a place; it is a decision you keep making.',tag:'Navigation'},
 {icon:'🕰️',t:'Time',d:'Clocks measure the seconds; they cannot weigh the moments.',tag:'Philosophy'},
 {icon:'🌊',t:'Tide',d:'The ocean keeps the moon on a string, and neither notices.',tag:'Oceanography'}
];
const grid=document.getElementById('grid');
grid.innerHTML=CARDS.map((c,i)=>`<div class="card" style="--a:${i*22}deg"><div class="content"><div class="icon">${c.icon}</div><h3>${c.t}</h3><p>${c.d}</p><span class="tag">${c.tag}</span></div></div>`).join('');
</script>
</body>
</html>
