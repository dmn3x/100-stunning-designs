<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 — Synthwave Sunset</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#10001f;--fg:#f0e9ff;--muted:#6d5aa8;--sun:#ff2d78;--grid:#a78bfa}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 'Courier New',monospace;overflow:hidden}
#sky{position:fixed;inset:0;background:linear-gradient(to bottom,#1a0033 0%,#3b0764 32%,#7c3aed 55%,#ff2d78 78%,#fbbf24 100%);z-index:0}
.sun{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:26vmin;height:26vmin;border-radius:50%;background:linear-gradient(to top,#fde047,#fb923c 40%,#ff2d78);filter:drop-shadow(0 0 60px rgba(255,45,120,.8));z-index:1;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06)}}
.sun::before{content:'';position:absolute;inset:-14%;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(240,233,255,.5) 6px 7px);mix-blend-mode:screen;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mountains{position:absolute;left:0;right:0;bottom:34%;height:20%;z-index:2}
.mountains span{position:absolute;bottom:0;width:0;height:0;border-left:9vw solid transparent;border-right:9vw solid transparent;border-bottom:14vh solid rgba(16,0,31,.92)}
.m1{left:-2vw}.m2{left:14vw;transform:scale(1.3)}.m3{left:30vw;transform:scale(.8)}.m4{left:46vw;transform:scale(1.5)}.m5{left:62vw;transform:scale(.9)}.m6{left:78vw;transform:scale(1.35)}.m7{left:94vw;transform:scale(.85)}
.grid{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:3;perspective:220px;overflow:hidden}
.grid .floor{position:absolute;inset:-60% -20% 0;transform:rotateX(62deg);background-image:linear-gradient(rgba(167,139,250,.75) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,.75) 1px,transparent 1px);background-size:60px 60px;animation:gridmove 1.2s linear infinite}
@keyframes gridmove{to{background-position:0 60px}}
.car{position:absolute;bottom:8%;z-index:4;width:34px;animation:drive 9s linear infinite}
.car::before{content:'🚗';font-size:28px;filter:hue-rotate(250deg)}
.c1{left:-40px;animation-delay:0s}
.c2{left:-40px;animation-delay:3.2s;filter:brightness(1.3)}
.c3{left:-40px;animation-delay:6.4s;filter:hue-rotate(90deg)}
@keyframes drive{to{left:104vw}}
.ui{position:fixed;z-index:6;pointer-events:none}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1.5rem,4vw,2.6rem);font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#ffe8f5;text-shadow:0 0 24px #ff2d78,0 4px 0 rgba(0,0,0,.4)}
.title em{font-style:normal;color:#fde047}
.sub{top:4rem;left:1.5rem;font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:#f3d7ff}
.hint{bottom:1.2rem;right:1.2rem;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:#f3d7ff;z-index:5}
@media (max-width:600px){.title{font-size:1.3rem}.sub{top:3.4rem;font-size:.55rem}}
</style>
</head>
<body>
<div id="sky"></div>
<div class="sun"></div>
<div class="mountains"><span class="m1"></span><span class="m2"></span><span class="m3"></span><span class="m4"></span><span class="m5"></span><span class="m6"></span><span class="m7"></span></div>
<div class="grid"><div class="floor"></div></div>
<div class="car c1"></div><div class="car c2"></div><div class="car c3"></div>
<div class="ui title">SYNTHWAVE <em>SUNSET</em></div>
<div class="ui sub">drive into the retro horizon</div>
<div class="ui hint">turn up the neon · it's always 1984 here</div>
</body>
</html>
