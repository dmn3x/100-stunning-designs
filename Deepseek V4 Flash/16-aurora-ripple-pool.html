<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 — Aurora Ripple Pool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#040310;--fg:#dcd5f2;--muted:#544b85}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'Avenir Next',system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.ui{position:fixed;z-index:5;pointer-events:none}
.title{top:1.4rem;left:1.4rem;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:900}
.title em{font-style:normal;background:linear-gradient(90deg,#a78bfa,#7df9ff,#f0abfc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{top:3.2rem;left:1.4rem;font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.hint{bottom:1.4rem;right:1.4rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}
@media (max-width:600px){.title{top:.9rem;left:.9rem}.sub{top:2.7rem;left:.9rem}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Aurora <em>Ripple Pool</em></div>
<div class="ui sub">light bends where you touch · drop stones of color</div>
<div class="ui hint">click to drop a stone · drag to paint ripples</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;base=ctx.getImageData(0,0,W,H);}
addEventListener('resize',resize);resize();
let base=ctx.getImageData(0,0,W,H);
const ripples=[];
function drop(x,y,force=1){
  const hue=250+Math.random()*60;
  ripples.push({x,y,r:2,amp:10*force,hue,life:1});
}
addEventListener('click',e=>drop(e.clientX,e.clientY,1));
let dragging=false;
addEventListener('mousedown',e=>{dragging=true;drop(e.clientX,e.clientY,.6)});
addEventListener('mouseup',()=>dragging=false);
addEventListener('mousemove',e=>{if(dragging)drop(e.clientX,e.clientY,.5)});
addEventListener('touchstart',e=>{drop(e.touches[0].clientX,e.touches[0].clientY,.7)});
(function tick(){
  requestAnimationFrame(tick);
  ctx.putImageData(base,0,0);
  const w=W,h=H;
  const img=ctx.getImageData(0,0,w,h);
  const d=img.data;
  for(const r of ripples){
    r.r+=2.2;r.life*=.97;
    for(let y=Math.max(0,r.y-r.r-4);y<Math.min(h,r.y+r.r+4);y++){
      for(let x=Math.max(0,r.x-r.r-4);x<Math.min(w,r.x+r.r+4);x++){
        const dx=x-r.x,dy=y-r.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>r.r)continue;
        const wave=Math.sin(dist*.35-r.r*.35)*r.amp*r.life*Math.max(0,1-dist/r.r);
        const idx=(y*w+x)*4;
        d[idx]+=wave*.6;
        d[idx+1]+=wave*.4;
        d[idx+2]+=wave*1.4;
        d[idx+3]=255;
      }
    }
  }
  ctx.putImageData(img,0,0);
  ripples=ripples.filter(r=>r.life>.05&&r.r<Math.max(W,H)*.8);
})(0);
</script>
</body>
</html>
