<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>94 Glowing Dots.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){ctx.fillStyle="rgba(0,0,0,.08)";ctx.fillRect(0,0,w,h);t+=.01;for(let i=0;i<50;i++){const a=t+i*.3,d=100+i*8;const x=w/2+Math.cos(a)*d,y=h/2+Math.sin(a*.7)*d*.6;const g=ctx.createRadialGradient(x,y,0,x,y,20);g.addColorStop(0,"rgba(255,255,255,.8)");g.addColorStop(.3,"rgba(150,200,255,.4)");g.addColorStop(1,"rgba(150,200,255,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}draw();</script></body></html>
