<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Glitch Terminal</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d1117;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:"Courier New",monospace;overflow:hidden}
.glitch{font-size:clamp(2rem,8vw,7rem);color:#00ff88;text-shadow:2px 0 #ff0055,-2px 0 #0055ff;animation:skew 1s infinite linear alternate-reverse}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch::before{left:2px;text-shadow:-2px 0 #ff0055;clip:rect(44px,450px,56px,0);animation:top 2s infinite linear alternate-reverse}
.glitch::after{left:-2px;text-shadow:-2px 0 #0055ff;clip:rect(24px,450px,68px,0);animation:bottom 3s infinite linear alternate-reverse}
@keyframes skew{0%{transform:skew(0deg)}100%{transform:skew(3deg)}}
@keyframes top{0%{clip:rect(10px,999px,30px,0)}100%{clip:rect(60px,999px,90px,0)}}
@keyframes bottom{0%{clip:rect(30px,999px,50px,0)}100%{clip:rect(70px,999px,100px,0)}}
.sub{color:#586069;margin-top:2rem;text-align:center;font-size:1rem;letter-spacing:.2em}
</style></head>
<body><div style="position:relative"><div class="glitch" data-text="SYNTHWAVE">SYNTHWAVE</div><p class="sub">[ SYSTEM ONLINE ]</p></div></body></html>
