<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Rainmaker — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(180deg,#0a0608,#1c1218);color:#cfa4d8;font-family:"Iowan Old Style",serif;min-height:100vh;padding:1.4rem}
  .stage{position:relative;height:60vh;background:radial-gradient(ellipse at 50% 100%,#3a1d4a,#0a0608 70%);border:1px solid #5a3a6e;overflow:hidden;cursor:crosshair}
  canvas{display:block;width:100%;height:100%}
  .dial{padding:1rem;display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin-top:1rem}
  .dial button{font:inherit;background:transparent;color:#cfa4d8;border:1px solid #5a3a6e;padding:.6rem;cursor:pointer;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;font-family:"Courier New",monospace}
  .dial button:hover{background:#5a3a6e;color:#0a0608}
  .legend{font-family:"Courier New",monospace;font-size:.78rem;line-height:1.5;color:#9b6db5}
  footer{text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5a3a6e;text-transform:uppercase;margin-top:1rem}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="stage"><canvas id="cv"></canvas></section>
<div class="dial">
  <button data-c="light">Light rain</button>
  <button data-c="steady">Steady</button>
  <button data-c="heavy">Heavy</button>
  <button data-c="hail">Hail</button>
  <button data-c="drought">Drought</button>
</div>
<p class="legend">Click the sky to summon precipitation. The cloud listens; the cloud also has preferences.</p>
<footer>MiniMax M3 · 76 / 100</footer>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');const w=cv.parentElement;let W,H;function fit(){W=cv.width=w.offsetWidth*2;H=cv.height=w.offsetHeight*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  const drops=[];let mode='steady';
  document.querySelectorAll('.dial button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.c;drops.length=0}));
  function step(){if(mode==='drought')return;const n=mode==='light'?5:mode==='steady'?15:mode==='heavy'?30:8;for(let i=0;i<n;i++)drops.push({x:Math.random()*W,y:-10,v:2+Math.random()*3,r:mode==='hail'?Math.random()*4+2:1+Math.random()*2})}
  function draw(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(58,29,74,.2)';cx.fillRect(0,0,W,H);drops.forEach(d=>{d.y+=d.v;d.x+=Math.sin(d.y*.01)*.4;if(d.y>H){d.x=Math.random()*W;d.y=-10}d.life=Date.now();cx.fillStyle=mode==='hail'?'#fff':'#a4d7e1';cx.beginPath();cx.arc(d.x,d.y,d.r,0,Math.PI*2);cx.fill()});
    for(let i=drops.length-1;i>=0;i--)if(drops[i].y>H)drops.splice(i,1);
    requestAnimationFrame(draw);
  }
  setInterval(step,80);
  draw();
  cv.parentElement.addEventListener('pointerdown',()=>{for(let i=0;i<80;i++)drops.push({x:Math.random()*W,y:-10,v:3+Math.random()*4,r:1+Math.random()*2})});
</script>
</body>
</html>
