<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Indigo Ferry — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0d2a;color:#e6e2ff;font-family:"Iowan Old Style",serif;min-height:100vh;padding:1.4rem;display:grid;grid-template-rows:auto 1fr}
  header{display:flex;justify-content:space-between;border-bottom:1px solid #6e7ad6;padding-bottom:.6rem;flex-wrap:wrap;gap:.4rem}
  header h1{font-family:"Bodoni Moda",serif;font-size:1.6rem;font-style:italic}
  header .tide{font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#a4d7e1;text-transform:uppercase}
  .harbor{position:relative;display:grid;grid-template-rows:1fr auto 1fr;min-height:60vh;gap:1rem}
  .water{background:linear-gradient(180deg,#0a0d2a 0%,#1a2d5a 100%);position:relative;overflow:hidden;border:1px solid #6e7ad6;min-height:30vh}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .board{background:rgba(0,0,0,.4);border:1px solid #6e7ad6;padding:1rem;font-family:"Courier New",monospace;font-size:.85rem}
  table{width:100%;border-collapse:collapse}
  th,td{padding:.4rem .6rem;border-bottom:1px dotted #6e7ad6;text-align:left}
  th{color:#f5d56e;letter-spacing:.3em;text-transform:uppercase;font-size:.7rem;font-weight:400}
  tr.now td{background:rgba(245,213,110,.15);color:#fff}
  footer{grid-column:1/-1;text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#6e7ad6;text-transform:uppercase;margin-top:1rem}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Indigo Ferry</h1>
  <span class="tide">tide ▲ rising · +14cm/hr</span>
  <span class="tide">harbormaster · L. Solé</span>
</header>
<main class="harbor">
  <div class="water"><canvas id="cv"></canvas></div>
  <div class="board">
    <table>
      <thead><tr><th>Dep</th><th>Vessel</th><th>Crew</th><th>Cargo</th><th>Status</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <p style="font-size:.85rem;line-height:1.5;font-style:italic;padding:1rem;color:#a4d7e1">"The ferry left on time, as it always did, despite the harbour having its own opinions about time."</p>
</main>
<footer>MiniMax M3 · 56 / 100</footer>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');const w=cv.parentElement;let W,H;function fit(){W=cv.width=w.offsetWidth*2;H=cv.height=w.offsetHeight*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  const moon=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5}));
  function loop(){cx.clearRect(0,0,W,H);for(let i=0;i<5;i++){cx.beginPath();for(let x=0;x<W;x+=20){cx.lineTo(x,H*.7+Math.sin(x*.005+Date.now()*.001+i)*6+i*14)}cx.lineTo(W,H);cx.lineTo(0,H);cx.fillStyle=`rgba(110,122,214,.${.05+i*.02})`;cx.fill()}moon.forEach(m=>{cx.fillStyle='rgba(255,255,255,.6)';cx.beginPath();cx.arc(m.x,m.y,m.r,0,6.283);cx.fill()});requestAnimationFrame(loop)}loop();
  const data=[['22:00','Indigo 02','B. Solé','freshwater','docked'],['22:45','Indigo 04','A. Vell','passengers','departing'],['23:14','Indigo 06','H. Pul','glassware','sailing'],['00:30','Indigo 03','—','—','due'],['01:14','Indigo 01','—','—','at sea']];
  const body=document.getElementById('body');data.forEach(d=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${d[0]}</td><td>${d[1]}</td><td>${d[2]}</td><td>${d[3]}</td><td>${d[4]}</td>`;body.appendChild(tr)});let i=0;setInterval(()=>{document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('now'));const rows=document.querySelectorAll('#body tr');if(rows[i])rows[i].classList.add('now');i=(i+1)%rows.length},2200);
</script>
</body>
</html>
