<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Library of Light — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1c1006;color:#f5d56e;font-family:"Iowan Old Style",serif;min-height:100vh;padding:1.4rem;display:grid;grid-template-columns:1fr 320px;gap:1rem}
  @media (max-width:880px){body{grid-template-columns:1fr}}
  .stage{position:relative;background:radial-gradient(circle at 50% 80%,#3a1a04,#1c1006 70%);border:6px ridge #5a2c0e;display:flex;align-items:center;justify-content:center;min-height:60vh;overflow:hidden}
  .beam{position:absolute;top:0;left:50%;transform-origin:top;width:200px;height:80%;background:linear-gradient(180deg,rgba(245,213,110,.25),rgba(245,213,110,0));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);transform:translateX(-50%) rotate(var(--r,0deg))}
  .shelf{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;align-content:flex-end;height:100%;align-items:flex-end;padding:1rem}
  .book{width:60px;height:140px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#3a2614,#1c1006);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:.3rem;color:#fff;font-family:"Bodoni Moda",serif;font-size:.7rem;font-style:italic;text-align:center;border:1px solid #5a2c0e}
  .book.glow{background:linear-gradient(180deg,#f5d56e,#a05c2a);color:#1c1006;box-shadow:0 0 20px #f5d56e}
  aside{padding:1rem;background:rgba(0,0,0,.4);border:1px solid #5a2c0e;display:flex;flex-direction:column;gap:.6rem;font-family:"Courier New",monospace}
  aside h1{font-family:"Bodoni Moda",serif;font-size:1.4rem;color:#f5d56e;font-style:italic}
  aside p{font-size:.85rem;line-height:1.5}
  .controls{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto}
  button{font:inherit;background:transparent;color:#f5d56e;border:1px solid #5a2c0e;padding:.4rem .7rem;cursor:pointer;letter-spacing:.2em;text-transform:uppercase;font-size:.65rem}
  button:hover{background:#5a2c0e}
  footer{grid-column:1/-1;text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5a2c0e;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="stage"><div class="beam" id="beam"></div>
  <div class="shelf" id="shelf"></div>
</section>
<aside>
  <h1>Library of Light</h1>
  <p>Each spine keeps its own small reading beam. Click a book to direct the light at it; the title rises from the dark.</p>
  <p>Move the cursor across the shelf to drag the reading beam like an old librarian's light.</p>
  <div id="read" style="background:#5a2c0e;padding:.6rem;border:1px dashed #f5d56e;font-size:.85rem;min-height:60px">— choose a book —</div>
  <div class="controls">
    <button id="all">Light all</button>
    <button id="one">Light one</button>
    <button id="off">All off</button>
    <button id="reverse">Reverse order</button>
  </div>
</aside>
<footer>MiniMax M3 · 89 / 100</footer>
<script>
  const titles=['Owl','Lamp','Quill','Letter','River','Sail','Tin Cat','Glass','Tide','Whisper','Wax','Dust','Atlas','Cradle','Pebble','Moth','Reed','Soot','Crown','Drift'];
  const shelf=document.getElementById('shelf');
  titles.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='book';b.textContent=t;b.addEventListener('mouseenter',()=>{document.querySelectorAll('.book').forEach(x=>x.classList.remove('glow'));b.classList.add('glow');document.getElementById('read').textContent=t+': a small volume; a single reader; a thin bookmark';});shelf.appendChild(b)});
  const beam=document.getElementById('beam');document.querySelector('.stage').addEventListener('pointermove',e=>{const r=beam.parentElement.getBoundingClientRect();const cx2=(e.clientX-r.left)/r.width*100;beam.style.setProperty('--r',((cx2-50)*.6)+'deg')});
  document.getElementById('all').addEventListener('click',()=>{document.querySelectorAll('.book').forEach(b=>b.classList.add('glow'))});
  document.getElementById('one').addEventListener('click',()=>{document.querySelectorAll('.book').forEach(b=>b.classList.remove('glow'));const r=document.querySelectorAll('.book')[Math.floor(Math.random()*20)];r.classList.add('glow');document.getElementById('read').textContent=r.textContent+': chosen by lot.'});
  document.getElementById('off').addEventListener('click',()=>document.querySelectorAll('.book').forEach(b=>b.classList.remove('glow')));
  document.getElementById('reverse').addEventListener('click',()=>{const arr=Array.from(shelf.children);arr.reverse();arr.forEach(b=>shelf.appendChild(b))});
</script>
</body>
</html>
