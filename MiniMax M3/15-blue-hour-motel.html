<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blue Hour Motel — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0d18;color:#a5b3d2;font-family:"Times New Roman",serif;min-height:100vh;display:flex;flex-direction:column;padding:1.4rem;gap:1rem}
  .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #233054;padding-bottom:.6rem;flex-wrap:wrap;gap:.5rem}
  .top h1{font-family:"Bodoni Moda",serif;font-size:clamp(1.5rem,3.5vw,2.2rem);color:#dde7ff}
  .top h1 small{display:block;font-family:"Courier New",monospace;font-size:.65rem;letter-spacing:.3em;color:#5a6c91;text-transform:uppercase;margin-top:.2rem}
  .neon{font-family:"Bodoni Moda",serif;color:#ff5b94;text-shadow:0 0 6px rgba(255,91,148,.6);font-style:italic}
  .board{background:#070912;border:6px ridge #233054;padding:1.4rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .room{aspect-ratio:1;background:linear-gradient(180deg,#10162a,#070912 60%);border:1px solid #2c3656;padding:.8rem;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden}
  .room::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 80%,rgba(255,235,180,.18),transparent 70%);mix-blend-mode:screen}
  .room h3{font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.25em;color:#a5b3d2;text-transform:uppercase}
  .room .num{font-family:"Bodoni Moda",serif;font-size:1.6rem;color:#ffdd6e;font-style:italic}
  .room[data-state="vacant"] .num{color:#5a6c91}
  .room[data-state="occupied"] .num{color:#ff5b94;text-shadow:0 0 4px #ff5b94}
  .room[data-state="dirty"]{outline:2px solid #ff7550;outline-offset:-6px}
  .room button{font:inherit;background:#10162a;color:#dde7ff;border:1px solid #233054;padding:.3rem .5rem;cursor:pointer;letter-spacing:.2em;text-transform:uppercase;font-size:.6rem;font-family:"Courier New",monospace}
  .room button:hover,button:focus-visible{background:#233054;outline:none}
  .legend{display:flex;gap:1rem;flex-wrap:wrap;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.25em;text-transform:uppercase}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:.4rem;vertical-align:middle}
  footer{display:flex;justify-content:space-between;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:#5a6c91;border-top:1px solid #233054;padding-top:.6rem}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>BLUE HOUR MOTEL<small>vacancy board · east-bound</small></h1>
  <div class="neon">— Vacancy —</div>
</header>
<section class="board" id="board"></section>
<div class="legend">
  <span><i style="background:#5a6c91"></i>vacant</span>
  <span><i style="background:#ff5b94"></i>occupied</span>
  <span><i style="background:#ff7550"></i>please service</span>
  <span><i style="background:#ffdd6e"></i>checked-out · ready</span>
</div>
<footer><span>MiniMax M3 · 15 / 100</span><span>Route 9 · state line · 8 mi north</span></footer>
<script>
  const board=document.getElementById('board');const rooms=[];const states=['vacant','occupied','dirty','ready'];
  for(let i=1;i<=16;i++){
    const r=document.createElement('article');r.className='room';r.dataset.state=states[Math.floor(Math.random()*4)];
    r.innerHTML=`<h3>Room</h3><div class="num">${('0'+i).slice(-2)}</div><button type="button">Mark clean</button>`;
    r.querySelector('button').addEventListener('click',e=>{e.stopPropagation();r.dataset.state='ready'});
    r.addEventListener('click',()=>{const next={'vacant':'occupied','occupied':'dirty','dirty':'ready','ready':'vacant'};r.dataset.state=next[r.dataset.state]});
    board.appendChild(r);rooms.push(r);
  }
</script>
</body>
</html>
