<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bloom Machine — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#f0e4d1;--ink:#3a2418;--rose:#c44569;--leaf:#557755;--cream:#fff8e6;--accent:#7a4ea0}
  body{background:var(--bg);color:var(--ink);font-family:"Iowan Old Style",serif;min-height:100vh;display:grid;grid-template-columns:1.6fr 1fr}
  @media (max-width:880px){body{grid-template-columns:1fr}}
  .garden{position:relative;overflow:hidden;background:linear-gradient(180deg,#dde6d7 0%,#c2cca6 100%);border-right:1px solid var(--ink);min-height:100vh}
  .bed{position:absolute;bottom:0;left:0;right:0;height:18%;background:linear-gradient(180deg,#8a624a,#4a3320)}
  canvas{display:block;width:100%;height:100%}
  .controls{padding:1.4rem;background:var(--cream);display:flex;flex-direction:column;gap:1rem;border-left:1px solid var(--ink)}
  header h1{font-family:"Bodoni Moda",serif;font-size:1.6rem;letter-spacing:.04em}
  header p{font-size:.9rem;line-height:1.5;color:#4a3320;margin-top:.3rem}
  .panel{background:#fff;border:1px solid var(--ink);padding:1rem}
  .panel h3{font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:.6rem;color:var(--rose)}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-size:.85rem}
  .row label{flex:0 0 auto;width:80px}
  input[type=range]{accent-color:var(--rose);flex:1;margin-left:.5rem}
  select,.btn{font:inherit;padding:.4rem .6rem;border:1px solid var(--ink);background:#fff;cursor:pointer}
  .palette{display:flex;gap:.4rem;margin-top:.6rem}
  .palette button{width:30px;height:30px;border:1px solid var(--ink);cursor:pointer;border-radius:50%}
  .log{font-family:"Courier New",monospace;font-size:.75rem;line-height:1.5;color:#4a3320;max-height:120px;overflow:auto;border-top:1px dashed var(--ink);padding-top:.6rem}
  @media (prefers-reduced-motion: reduce){.bloom{transition:none!important}}
</style>
</head>
<body>
<section class="garden">
  <canvas id="cv"></canvas>
</section>
<aside class="controls">
  <header>
    <h1>Bloom Machine</h1>
    <p>A small, hand-tuned cabinet for growing flowers that should not exist. Adjust the seed; watch the bed sprout.</p>
  </header>
  <div class="panel">
    <h3>Seed parameters</h3>
    <div class="row"><label>Stems</label><input type="range" min="1" max="40" value="14" id="stems"></div>
    <div class="row"><label>Petals</label><input type="range" min="3" max="9" value="6" id="petals"></div>
    <div class="row"><label>Bend</label><input type="range" min="-50" max="50" value="0" id="bend"></div>
    <div class="row"><label>Pace</label><input type="range" min="0.2" max="2" step="0.1" value="1" id="pace"></div>
    <div class="row"><label>Bloom</label><input type="range" min="0" max="1" step="0.05" value="0.4" id="bloom"></div>
  </div>
  <div class="panel">
    <h3>Palette</h3>
    <div class="palette">
      <button style="background:#c44569" data-c="#c44569"></button>
      <button style="background:#7a4ea0" data-c="#7a4ea0"></button>
      <button style="background:#e8a02a" data-c="#e8a02a"></button>
      <button style="background:#3a6b3a" data-c="#3a6b3a"></button>
      <button style="background:#fae08c" data-c="#fae08c"></button>
      <button style="background:#0d3b66" data-c="#0d3b66"></button>
    </div>
    <div style="margin-top:.6rem"><button class="btn" id="seed">Re-seed bed</button></div>
  </div>
  <div class="log" id="log">[garden quiet]</div>
  <footer style="font-family:'Courier New',monospace;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;text-align:right">M3 · 14 / 100</footer>
</aside>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');let W,H;function fit(){const r=cv.parentElement.getBoundingClientRect();W=cv.width=r.width*2;H=cv.height=r.height*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  const params={stems:14,petals:6,bend:0,pace:1,bloom:.4,color:'#c44569'},log=document.getElementById('log');
  let stems=[];function gen(){stems=[];for(let i=0;i<params.stems;i++)stems.push({x:Math.random()*W,y:H-H*.15,sway:Math.random()*Math.PI*2,h:Math.random()*150+180,t:Math.random()*Math.PI})}gen();
  function logm(s){log.innerHTML+=`<br>[${new Date().toLocaleTimeString()}] ${s}`;log.scrollTop=log.scrollHeight}
  document.querySelectorAll('input[type=range]').forEach(inp=>inp.addEventListener('input',e=>{params[e.target.id]=+e.target.value;if(e.target.id==='stems')gen()}));
  document.querySelectorAll('.palette button').forEach(b=>b.addEventListener('click',()=>{params.color=b.dataset.c;logm('palette changed')}));document.getElementById('seed').addEventListener('click',()=>{gen();logm('bed re-seeded')});
  let t=0;function draw(){
    cx.clearRect(0,0,W,H);
    cx.fillStyle='#a78b5e';cx.fillRect(0,H-H*.15,W,H*.15);
    stems.forEach(s=>{
      const grow=H-H*.15-s.h,g=Math.min(1,Math.sin(t*params.pace*.01+s.t)*.5+.5)*params.bloom;
      const tipx=s.x+Math.sin(t*.02+s.sway)*20+params.bend;const tipy=grow+params.bend*.5;
      cx.strokeStyle='#3a6b3a';cx.lineWidth=3;cx.beginPath();cx.moveTo(s.x,H-H*.15);
      cx.quadraticCurveTo((s.x+tipx)/2+(params.bend*.5),(H-H*.15+tipy)/2,tipx,tipy);cx.stroke();
      // leaves
      for(let i=0;i<2;i++){const lp=t*H*.6+H*.05,lo=Math.sin(t*.04+s.t+i)*.4;cx.fillStyle='#7a9f6d';cx.beginPath();cx.ellipse(s.x+30+lo*10,lp,30,8,lo,0,Math.PI*2);cx.fill()}
      // flower
      for(let i=0;i<params.petals;i++){const a=i/params.petals*Math.PI*2;cx.fillStyle=params.color;cx.beginPath();cx.ellipse(tipx,tipy,30*params.bloom,12*params.bloom,a,0,Math.PI*2);cx.fill()}
      cx.fillStyle='#f4d860';cx.beginPath();cx.arc(tipx,tipy,8*params.bloom,0,Math.PI*2);cx.fill();
    });
    t+=params.pace;requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
