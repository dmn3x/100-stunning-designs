<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Noise Complaint — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0c0c10;color:#f0e6cf;font-family:"Inter",sans-serif;min-height:100vh;padding:1.4rem;display:grid;grid-template-columns:1fr 320px;gap:1rem}
  @media (max-width:880px){body{grid-template-columns:1fr}}
  .map{background:#0c0c10;border:1px solid #5a6c91;display:grid;grid-template-columns:repeat(8,1fr);min-height:60vh;cursor:pointer}
  .cell{aspect-ratio:1;border:1px solid #1a1a25;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#5a6c91;position:relative;transition:background .3s}
  .cell.active{background:#f5d56e;color:#1c1206}
  .cell.howl{background:#c44569;color:#fff}
  aside{padding:1rem;background:rgba(0,0,0,.4);border:1px solid #5a6c91;display:flex;flex-direction:column;gap:.6rem}
  aside h1{font-family:"Bodoni Moda",serif;font-size:1.4rem;color:#f0e6cf;font-style:italic}
  aside p{font-size:.9rem;line-height:1.5}
  .row{display:flex;justify-content:space-between;border-bottom:1px dashed #5a6c91;padding:.3rem 0;font-family:"Courier New",monospace;font-size:.85rem}
  .row b{color:#f5d56e}
  button{font:inherit;background:transparent;color:#f0e6cf;border:1px solid #5a6c91;padding:.4rem .7rem;cursor:pointer;letter-spacing:.2em;text-transform:uppercase;font-size:.65rem;font-family:"Courier New",monospace}
  button:hover{background:#5a6c91;color:#0c0c10}
  footer{grid-column:1/-1;text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5a6c91;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="map" id="map"></section>
<aside>
  <h1>Noise complaint</h1>
  <p>Hover the cells. Yellow = local noise, red = full hooley. Mute each block; or add to it.</p>
  <div class="row"><span>complaints</span><b id="c">0</b></div>
  <div class="row"><span>soft</span><b id="s">0</b></div>
  <div class="row"><span>loud</span><b id="l">0</b></div>
  <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem">
    <button id="quieten">Quiet block</button>
    <button id="howl">Howl!</button>
    <button id="reset">Reset</button>
    <button id="complaint">Issue complaint</button>
  </div>
  <p style="font-size:.85rem;font-style:italic;line-height:1.4;color:#a4b3cf">"For the umpteenth time — yes, the pigeon is a permitted resident."</p>
</aside>
<footer>MiniMax M3 · 74 / 100</footer>
<script>
  const map=document.getElementById('map');for(let i=0;i<64;i++){const c=document.createElement('button');c.type='button';c.className='cell';c.textContent=Math.random()<.2?['🚗','🐕','🐓','🎷','📻','🎉'][Math.floor(Math.random()*6)]:'';c.addEventListener('click',()=>{c.classList.remove('howl');c.classList.toggle('active')});map.appendChild(c)}
  const cEl=document.getElementById('c'),sEl=document.getElementById('s'),lEl=document.getElementById('l');
  function recount(){const a=document.querySelectorAll('.cell.active').length;const h=document.querySelectorAll('.cell.howl').length;sEl.textContent=a;lEl.textContent=h}
  document.getElementById('quieten').addEventListener('click',()=>{document.querySelectorAll('.cell.active,.cell.howl').forEach(c=>c.classList.remove('active','howl'));recount()});
  document.getElementById('howl').addEventListener('click',()=>{const cells=[...document.querySelectorAll('.cell:not(.howl)')];const target=cells[Math.floor(Math.random()*cells.length)];target.classList.add('howl');recount()});
  document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active','howl'));recount()});
  document.getElementById('complaint').addEventListener('click',()=>cEl.textContent=+cEl.textContent+1);
</script>
</body>
</html>
