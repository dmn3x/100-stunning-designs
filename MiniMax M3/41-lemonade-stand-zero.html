<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lemonade Stand Zero — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff5b5;color:#5a3a1a;font-family:"Comic Sans MS","Sniglet",system-ui,sans-serif;min-height:100vh;padding:1.4rem}
  .stand{max-width:880px;margin:0 auto;background:#fff8da;border:6px solid #d49a4a;border-radius:14px;padding:1.4rem;box-shadow:0 12px 0 rgba(0,0,0,.1)}
  .aerial{background:linear-gradient(180deg,#7ad6f0,#a3e0a3);border:4px solid #d49a4a;border-radius:8px;height:140px;position:relative;overflow:hidden;margin-bottom:1rem}
  .bird{position:absolute;top:20px;left:-30px;font-size:1.6rem;animation:fly 18s linear infinite}
  @keyframes fly{to{left:100%}}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media (max-width:780px){.grid{grid-template-columns:1fr}}
  .panel{padding:1rem;background:repeating-linear-gradient(45deg,#fff8da 0 6px,#fbeac9 6px 12px);border:3px dashed #d49a4a;border-radius:8px}
  h1{font-size:2.4rem;letter-spacing:.02em;color:#d49a4a;text-align:center;text-shadow:2px 2px 0 #fff}
  h1 small{display:block;font-size:.85rem;letter-spacing:.3em;color:#5a3a1a}
  h2{font-family:"Courier New",monospace;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:#5a3a1a}
  .counter{display:flex;justify-content:space-around;margin:1rem 0;font-size:1.4rem;text-align:center}
  .counter div span{display:block;font-family:"Courier New",monospace;font-size:.6rem;letter-spacing:.3em;color:#5a3a1a}
  .counter div b{color:#d49a4a}
  .supplies{display:flex;flex-direction:column;gap:.4rem}
  .supply{display:flex;justify-content:space-between;align-items:center;font-family:"Courier New",monospace;font-size:.85rem}
  .supply .bar{flex:1;height:14px;background:rgba(212,154,74,.2);border-radius:7px;margin:0 .4rem;overflow:hidden;border:1px solid #d49a4a}
  .supply .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd28a,#d49a4a);transition:width .3s}
  button{font:inherit;background:#d49a4a;color:#fff8da;border:none;padding:.5rem .9rem;cursor:pointer;border-radius:6px;letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;box-shadow:0 4px 0 #5a3a1a}
  button:hover{background:#5a3a1a}
  button:active{transform:translateY(2px);box-shadow:none}
  footer{margin-top:1rem;text-align:center;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5a3a1a;text-transform:uppercase}
  .ribbon{position:absolute;top:0;left:0;right:0;text-align:center;background:#e34f1c;color:#fff;padding:.3rem;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="ribbon">✦ optimistic apocalypse kiosk ✦ open until the world ends ✦</div>
<div class="stand">
  <div class="aerial"><div class="bird">🕊</div></div>
  <h1>LEMONADE STAND ZERO<small>yes, even now</small></h1>
  <div class="grid">
    <section class="panel">
      <h2>Today</h2>
      <div class="counter">
        <div><b id="glasses">0</b><span>cups served</span></div>
        <div><b>$<span id="rev">0</span></b><span>raised</span></div>
        <div><b id="tip">0</b><span>kindness</span></div>
      </div>
      <button id="pour" style="margin:.4rem 0;width:100%" type="button">pour a cup</button>
      <p style="font-family:'Courier New',monospace;font-size:.78rem">⚠ Public notice: the lemon tree survived. We are open.</p>
    </section>
    <section class="panel">
      <h2>Supplies</h2>
      <div class="supplies">
        <div class="supply">Lemons<span class="bar"><i id="b1" style="width:90%"></i></span><span>14</span></div>
        <div class="supply">Sugar<span class="bar"><i id="b2" style="width:65%"></i></span><span>2.6kg</span></div>
        <div class="supply">Ice<span class="bar"><i id="b3" style="width:50%"></i></span><span>melted slowly</span></div>
        <div class="supply">Hope<span class="bar"><i id="b4" style="width:100%"></i></span><span>∞</span></div>
      </div>
      <div style="display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap">
        <button id="restock">Re-stock</button>
        <button id="spin">Spin the sign</button>
      </div>
    </section>
  </div>
  <footer>MiniMax M3 · 41 / 100 · "the lemons remain"</footer>
</div>
<script>
  let glasses=0,rev=0,tip=0;
  document.getElementById('pour').addEventListener('click',()=>{glasses++;rev+=2;tip+=Math.random()>0.5?1:0;document.getElementById('glasses').textContent=glasses;document.getElementById('rev').textContent=rev;document.getElementById('tip').textContent=tip;document.getElementById('b1').style.width=Math.max(0,90-glasses*4)+'%';document.getElementById('b3').style.width=Math.max(0,50-glasses*3)+'%'});
  document.getElementById('restock').addEventListener('click',()=>{document.getElementById('b1').style.width='90%';document.getElementById('b2').style.width='90%';document.getElementById('b3').style.width='90%'});
  document.getElementById('spin').addEventListener('click',()=>{document.querySelector('.ribbon').style.transition='transform 1s';document.querySelector('.ribbon').style.transform='rotate(360deg)';setTimeout(()=>document.querySelector('.ribbon').style.transform='',1000)});
</script>
</body>
</html>
