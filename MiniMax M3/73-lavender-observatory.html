<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lavender Observatory — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(180deg,#1c1233,#0a0618);color:#d8b6f5;font-family:"Iowan Old Style",serif;min-height:100vh;padding:1.4rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media (max-width:880px){body{grid-template-columns:1fr}}
  .dome{position:relative;border-radius:50% 50% 4px 4px;background:radial-gradient(ellipse at 50% 50%,#2a1d4a,#0a0618);overflow:hidden;aspect-ratio:1;border:6px solid #5a3a8a;box-shadow:inset 0 -20px 40px rgba(0,0,0,.6)}
  canvas{display:block;width:100%;height:100%}
  .horizon{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:80%;height:10px;background:#5a3a8a}
  aside{padding:1rem;background:rgba(0,0,0,.4);border:1px solid #5a3a8a;display:flex;flex-direction:column;gap:.6rem}
  aside h1{font-family:"Bodoni Moda",serif;font-size:1.4rem;font-style:italic;color:#d8b6f5}
  aside p{font-size:.95rem;line-height:1.5}
  .constel{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin-top:.4rem}
  .con{aspect-ratio:1;background:rgba(0,0,0,.3);border:1px dashed #5a3a8a;display:flex;align-items:center;justify-content:center;text-align:center;padding:.3rem;font-family:"Courier New",monospace;font-size:.78rem;letter-spacing:.1em;cursor:pointer}
  .con:hover{background:rgba(0,0,0,.7);color:#fff}
  .log{font-family:"Courier New",monospace;font-size:.75rem;line-height:1.5;height:100px;overflow:auto;border-top:1px dashed #5a3a8a;padding-top:.6rem}
  footer{grid-column:1/-1;text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5a3a8a;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="dome"><canvas id="cv"></canvas><div class="horizon"></div></section>
<aside>
  <h1>Lavender Observatory</h1>
  <p>A small, restful place to chart the night. Choose a constellation; the dome settles on it.</p>
  <div class="constel" id="cons"></div>
  <div class="log" id="log">[observatory open · soft evening]</div>
</aside>
<footer>MiniMax M3 · 73 / 100</footer>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');let W,H;function fit(){W=cv.width=cv.parentElement.offsetWidth*2;H=cv.height=cv.parentElement.offsetHeight*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  const stars=Array.from({length:160},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.5,b:Math.random()}));
  const cons=['Orion','Cassiopeia','Lyra','Cygnus','Ursa Minor','Sagittarius','Vega','Andromeda','Capricornus','Lacerta'];
  const con=document.getElementById('cons');cons.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='con';b.textContent=c;b.addEventListener('click',()=>addLog('charted '+c+' — minor cloud cover, holding steady.'))});con.appendChild(document.createElement('span'));
  function loop(){cx.clearRect(0,0,W,H);const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*.6);g.addColorStop(0,'rgba(45,28,80,.6)');g.addColorStop(1,'rgba(10,6,24,1)');cx.fillStyle=g;cx.fillRect(0,0,W,H);stars.forEach(s=>{s.b=Math.max(0,Math.min(1,s.b+Math.random()*.04-.02));cx.fillStyle=`rgba(255,255,255,${s.b*.8})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fill()});requestAnimationFrame(loop)}loop();
  const log=document.getElementById('log');function addLog(s){log.innerHTML+=`<br>[${new Date().toLocaleTimeString()}] ${s}`;log.scrollTop=log.scrollHeight}
</script>
</body>
</html>
