<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cobalt Cathedral — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#040820;color:#aeb6cf;font-family:"Iowan Old Style",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4rem}
  .nave{aspect-ratio:.7;max-width:540px;width:90vw;background:linear-gradient(180deg,#020412,#0a1532);border:6px ridge #4a6cb0;position:relative;overflow:hidden}
  svg{width:100%;height:100%}
  .choir{position:absolute;left:0;right:0;bottom:.5rem;text-align:center;font-family:"Bodoni Moda",serif;font-style:italic;font-size:1.2rem;color:#f5d56e;letter-spacing:.04em;opacity:.7}
  .control{position:fixed;bottom:1rem;display:flex;gap:.4rem;font-family:"Courier New",monospace;letter-spacing:.2em;font-size:.7rem}
  button{font:inherit;background:transparent;color:#f5d56e;border:1px solid #4a6cb0;padding:.4rem .7rem;cursor:pointer;text-transform:uppercase}
  button:hover{background:#4a6cb0;color:#fff}
  .stamp{position:fixed;top:1rem;left:1rem;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#4a6cb0;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stamp">cobalt cathedral · evensong</div>
<div class="nave">
  <svg viewBox="0 0 360 500" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="cobalt" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#3a4ea8"/><stop offset="1" stop-color="#0a1532"/>
      </linearGradient>
      <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#f5d56e"/><stop offset="1" stop-color="#a05c2a"/>
      </linearGradient>
      <radialGradient id="rose" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#c44569"/><stop offset="1" stop-color="#3a1d6e"/>
      </radialGradient>
    </defs>
    <rect width="360" height="500" fill="url(#cobalt)"/>
    <!-- arches -->
    <g fill="none" stroke="url(#gold)" stroke-width="1.6">
      <path d="M40,500 L40,260 Q40,160 100,160 Q160,160 160,260 L160,500 Z"/>
      <path d="M200,500 L200,260 Q200,160 260,160 Q320,160 320,260 L320,500 Z"/>
      <path d="M30,500 Q180,420 330,500" stroke-width="2"/>
    </g>
    <!-- stained glass segments -->
    <g>
      <rect x="50" y="200" width="100" height="60" fill="url(#rose)" opacity=".7"/>
      <rect x="210" y="200" width="100" height="60" fill="#3a6cb0" opacity=".8"/>
      <polygon points="100,260 60,300 140,300" fill="#9b6db5" opacity=".7"/>
      <polygon points="260,260 220,300 300,300" fill="#c44569" opacity=".7"/>
    </g>
    <!-- light beams -->
    <g fill="#fff" opacity=".5">
      <polygon points="100,200 60,500 140,500"/>
      <polygon points="260,200 220,500 300,500"/>
    </g>
    <!-- rose window -->
    <circle cx="180" cy="120" r="40" fill="url(#rose)" stroke="#f5d56e" stroke-width="2"/>
    <g stroke="#f5d56e" stroke-width="1" fill="none" opacity=".5">
      <line x1="180" y1="80" x2="180" y2="160"/><line x1="140" y1="120" x2="220" y2="120"/>
      <line x1="148" y1="88" x2="212" y2="152"/><line x1="212" y1="88" x2="148" y2="152"/>
    </g>
    <!-- altar -->
    <rect x="160" y="400" width="40" height="60" fill="#a05c2a" stroke="#f5d56e" stroke-width="1"/>
    <circle cx="180" cy="430" r="3" fill="#fff"/>
  </svg>
  <div class="choir">— light comes through only in pieces —</div>
</div>
<div class="control">
  <button id="dawn">Dawn</button>
  <button id="eve">Evensong</button>
  <button id="storm">Storm</button>
</div>
<script>
  const svg=document.querySelector('svg');
  document.getElementById('dawn').addEventListener('click',()=>svg.style.filter='brightness(1.4) hue-rotate(-15deg)');
  document.getElementById('eve').addEventListener('click',()=>svg.style.filter='brightness(.9) hue-rotate(10deg)');
  document.getElementById('storm').addEventListener('click',()=>svg.style.filter='brightness(.7) hue-rotate(40deg) contrast(1.2)');
</script>
</body>
</html>
