<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grand Finale — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#f0e6cf;font-family:"Iowan Old Style",serif;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:1.4rem}
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
  h1{font-family:"Bodoni Moda",serif;font-size:clamp(2.4rem,8vw,6rem);font-style:italic;line-height:.9;text-align:center;background:linear-gradient(135deg,#c44569,#f5d56e,#5fa8d3,#a4b6a4,#9b6db5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:glow 6s ease-in-out infinite}
  @keyframes glow{50%{filter:brightness(1.3)}}
  h1 small{display:block;font-size:.3em;font-family:"Courier New",monospace;letter-spacing:.4em;color:#a05c2a;text-transform:uppercase;-webkit-text-fill-color:#a05c2a;margin-top:.6rem}
  .credits{font-family:"Courier New",monospace;font-size:.85rem;text-align:center;color:#cfa4d8;max-width:520px;line-height:1.7}
  .credits b{color:#f5d56e}
  .finale{font-family:"Bodoni Moda",serif;font-style:italic;font-size:1.2rem;max-width:520px;text-align:center;color:#a4b6a4;line-height:1.6}
  button{font:inherit;background:transparent;color:#f5d56e;border:1px solid #f5d56e;padding:.4rem .8rem;cursor:pointer;letter-spacing:.2em;text-transform:uppercase;font-size:.65rem;font-family:"Courier New",monospace}
  button:hover{background:#f5d56e;color:#0a0a0f}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<h1>100 Designs<small>— for the patient reader —</small></h1>
<p class="credits">conceived and built by <b>MiniMax M3</b>, with the long-suffering help of <b>Hermes Agent (Bog)</b> · for <b>dmn3x</b></p>
<p class="finale">Each page a different weather. Each weather a small, kind wish. Each wish a tea, a kettle, and a door open by half.</p>
<button id="end" type="button">read again</button>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');let W,H;function fit(){W=cv.width=innerWidth*2;H=cv.height=innerHeight*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  const sparks=Array.from({length:160},()=>({x:Math.random()*W,y:Math.random()*H,v:Math.random()*2+1,r:Math.random()*2+1,c:`hsl(${Math.random()*360},80%,70%)`}));
  function draw(){cx.fillStyle='rgba(10,10,15,.06)';cx.fillRect(0,0,W,H);sparks.forEach(s=>{s.y-=s.v;if(s.y<0){s.y=H;s.x=Math.random()*W}cx.fillStyle=s.c;cx.fillRect(s.x,s.y,s.r,s.r)});requestAnimationFrame(draw)}draw();
  document.getElementById('end').addEventListener('click',()=>{document.querySelector('h1').style.opacity='1';sparks.forEach(s=>{s.v*=-1})});
</script>
</body>
</html>
