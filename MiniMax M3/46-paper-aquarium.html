<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Paper Aquarium — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1a26;color:#cfe9f6;font-family:"Iowan Old Style",serif;min-height:100vh;padding:1.4rem}
  .bowl{display:grid;grid-template-rows:auto 1fr;gap:.6rem;min-height:calc(100vh - 2.8rem)}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #5fa8d3;padding-bottom:.4rem;flex-wrap:wrap;gap:.4rem}
  header h1{font-family:"Bodoni Moda",serif;font-size:1.6rem;color:#fff}
  header small{font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5fa8d3;text-transform:uppercase}
  .aqua{position:relative;background:linear-gradient(180deg,#073350,#0a1a26 80%);border:8px ridge #5fa8d3;overflow:hidden;min-height:60vh}
  canvas{display:block;width:100%;height:100%}
  .paper{position:absolute;background:rgba(255,255,255,.85);color:#0a1a26;padding:.6rem .8rem;font-family:"Iowan Old Style",serif;font-size:.85rem;line-height:1.4;max-width:240px;transform-origin:top left}
  footer{text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5fa8d3;margin-top:.4rem;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bowl">
  <header>
    <h1>Paper Aquarium</h1>
    <small>origami fish · fresh water</small>
    <small>tank <b>id</b> · 03-12</small>
  </header>
  <section class="aqua"><canvas id="cv"></canvas></section>
  <footer>MiniMax M3 · 46 / 100</footer>
</div>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');const aqua=cv.parentElement;let W,H;function fit(){const r=aqua.getBoundingClientRect();W=cv.width=r.width*2;H=cv.height=r.height*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  const fish=[];for(let i=0;i<14;i++)fish.push({x:Math.random()*W,y:Math.random()*H,v:Math.random()*.4+.2,swim:Math.random()*Math.PI*2,color:`hsl(${Math.random()*30+170},${Math.random()*30+50}%,${Math.random()*30+50}%)`,size:Math.random()*14+10,tap:0});
  const paper=document.createElement('div');paper.className='paper';paper.style.top='10px';paper.style.left='10px';paper.innerHTML='Tap the water to drop a folded note.<br>Each one drifts, then sinks.';aqua.appendChild(paper);
  setInterval(()=>{paper.style.transform=`rotate(${Math.sin(Date.now()*.001)*2}deg)`},30);
  const notes=[];aqua.addEventListener('pointerdown',e=>{const r=aqua.getBoundingClientRect();notes.push({x:(e.clientX-r.left),y:(e.clientY-r.top),vy:.3,vx:Math.random()-.5,life:200,angle:Math.random()*360});if(notes.length>20)notes.shift()});
  function draw(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(207,233,246,.06)';for(let i=0;i<5;i++){cx.beginPath();cx.moveTo(0,H*.8+i*10);for(let x=0;x<W;x+=20){cx.lineTo(x,Math.sin(x*.005+i*Date.now()*.0005)*4+H*.8+i*10)}cx.strokeStyle='rgba(255,255,255,.1)';cx.stroke()}
  fish.forEach(f=>{f.swim+=f.v*.05;f.x+=Math.cos(f.swim)*f.v*4;f.y+=Math.sin(f.swim)*f.v*2;if(f.x<0)f.x=W;if(f.x>W)f.x=0;if(f.y<0)f.y=H;if(f.y>H)f.y=0;
  cx.save();cx.translate(f.x,f.y);cx.rotate(f.swim);cx.fillStyle=f.color;cx.beginPath();cx.moveTo(f.size,0);cx.lineTo(-f.size,f.size/2);cx.lineTo(-f.size,-f.size/2);cx.closePath();cx.fill();cx.fillStyle=f.color;cx.beginPath();cx.arc(f.size*.6,0,f.size*.18,0,Math.PI*2);cx.fill();cx.restore()});
  notes.forEach(n=>{n.y+=n.vy*4;n.x+=n.vx*4;n.life--;cx.save();cx.translate(n.x,n.y);cx.rotate(n.angle);cx.fillStyle='rgba(255,255,255,.85)';cx.fillRect(-12,-12,24,24);cx.fillStyle='#0a1a26';cx.font='12px serif';cx.fillText('✉',-5,4);cx.restore()});if(notes.length>0&&notes[0].life<0)notes.shift();requestAnimationFrame(draw)}
  draw();
</script>
</body>
</html>
