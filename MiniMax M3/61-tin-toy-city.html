<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tin Toy City — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f4e7d3;color:#5a2c0e;font-family:"Times New Roman",serif;min-height:100vh;padding:1.4rem;display:grid;grid-template-rows:auto 1fr}
  header{display:flex;justify-content:space-between;border-bottom:2px solid #5a2c0e;padding-bottom:.4rem;flex-wrap:wrap;gap:.4rem}
  header h1{font-family:"Bodoni Moda",serif;font-size:1.4rem;font-style:italic}
  header small{font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:#a05c2a}
  .sky{position:relative;background:linear-gradient(180deg,#fce5c8,#f4c985 60%,#eaa86a);min-height:60vh;overflow:hidden;border:1px solid #5a2c0e}
  canvas{display:block;width:100%;height:100%}
  .ground{position:absolute;bottom:0;left:0;right:0;height:20%;background:repeating-linear-gradient(180deg,#a05c2a 0 4px,#7d4520 4px 8px)}
  .controls{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);display:flex;gap:.4rem;font-family:"Courier New",monospace;letter-spacing:.2em}
  button{font:inherit;background:#5a2c0e;color:#f4e7d3;border:none;padding:.4rem .8rem;cursor:pointer;text-transform:uppercase;font-size:.7rem}
  button:hover{background:#a05c2a}
  footer{margin-top:.6rem;text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#a05c2a;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Tin Toy City</h1>
  <small>wind-up village · four streets</small>
  <small>current wind <b id="w">calm</b></small>
</header>
<section class="sky"><canvas id="cv"></canvas><div class="ground"></div></section>
<div class="controls">
  <button id="wind">wind up</button>
  <button id="more">add vehicle</button>
  <button id="stop">stop all</button>
  <button id="parade">parade</button>
</div>
<footer>MiniMax M3 · 61 / 100</footer>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');let W,H;function fit(){W=cv.width=cv.parentElement.offsetWidth*2;H=cv.height=cv.parentElement.offsetHeight*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  const buildings=[{x:.1,y:.5,w:.12,h:.25},{x:.27,y:.4,w:.16,h:.35},{x:.5,y:.45,w:.14,h:.3},{x:.7,y:.4,w:.15,h:.35}];
  const vehicles=[];const colors=['#c44569','#0d3b66','#7a4ea0','#3a6b3a','#e8a02a'];
  let wind=0,parade=false;const parks=Array.from({length:5},()=>({x:Math.random()*.5+.45,y:Math.random()*.4+.4,r:Math.random()*30+20}));
  function drawBuilding(b){cx.fillStyle='#a05c2a';cx.fillRect(b.x*W,b.y*H,b.w*W,b.h*H);cx.fillStyle='#c44569';for(let i=0;i<4;i++)for(let j=0;j<3;j++){cx.fillRect((b.x+(b.w*.2)+i*(b.w*.15))*W,(b.y+(b.h*.2)+j*(b.h*.2))*H,b.w*.08*W,b.h*.15*H)}cx.fillStyle='#5a2c0e';cx.fillRect((b.x+(b.w*.4))*W,(b.y+(b.h*.7))*H,b.w*.2*W,b.h*.3*H)}
  function draw(){cx.clearRect(0,0,W,H);const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fce5c8');g.addColorStop(.6,'#f4c985');g.addColorStop(1,'#eaa86a');cx.fillStyle=g;cx.fillRect(0,0,W,H);parks.forEach(p=>{cx.fillStyle=`rgba(${150+Math.random()*30},${90+Math.random()*30},60,.7)`;cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);cx.fill()});buildings.forEach(drawBuilding);vehicles.forEach(v=>{cx.save();cx.translate(v.x,v.y);cx.rotate(v.rot);cx.fillStyle=v.c;cx.fillRect(-12,-6,24,12);cx.fillStyle='#5a2c0e';cx.beginPath();cx.arc(-8,6,4,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(8,6,4,0,Math.PI*2);cx.fill();cx.restore()})}
  function step(){vehicles.forEach(v=>{v.x+=Math.cos(v.rot)*(1+wind*.05);v.y+=Math.sin(v.rot)*(1+wind*.05);if(v.x<-20)v.x=W+20;if(v.x>W+20)v.x=-20;if(v.y<-20)v.y=H+20;if(v.y>H*.8)v.y=H*.3;if(parade){v.rot=Math.atan2(Math.sin(Date.now()*.001)*30+v.y-H/2,Math.cos(Date.now()*.001)*30+v.x-W/2)}})}
  function loop(){draw();step();requestAnimationFrame(loop)}loop();
  for(let i=0;i<6;i++)vehicles.push({x:Math.random()*W,y:H*.4+Math.random()*H*.2,rot:Math.random()*Math.PI*2,c:colors[i%colors.length]});
  document.getElementById('wind').addEventListener('click',()=>{wind=Math.min(10,wind+2);document.getElementById('w').textContent=wind<3?'calm':wind<7?'breezy':'gusty'});
  document.getElementById('more').addEventListener('click',()=>vehicles.push({x:Math.random()*W,y:H*.4+Math.random()*H*.2,rot:Math.random()*Math.PI*2,c:colors[Math.floor(Math.random()*colors.length)]}));
  document.getElementById('stop').addEventListener('click',()=>vehicles.forEach(v=>{v.rot=0;v.x=Math.random()*W}));
  document.getElementById('parade').addEventListener('click',()=>{parade=!parade});
</script>
</body>
</html>
