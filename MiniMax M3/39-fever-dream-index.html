<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fever Dream Index — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:linear-gradient(180deg,#1c0a14,#240e2a);color:#f0d5e5;font-family:"Iowan Old Style",serif;min-height:100vh;padding:1.4rem}
  header{text-align:center;border-bottom:1px dashed #5a1d4a;padding-bottom:.6rem;margin-bottom:1.4rem}
  header h1{font-family:"Bodoni Moda",serif;font-size:clamp(1.8rem,5vw,3rem);font-style:italic;letter-spacing:.04em}
  header p{font-family:"Courier New",monospace;letter-spacing:.4em;font-size:.7rem;text-transform:uppercase;color:#9b6db5}
  .dome{aspect-ratio:16/9;background:radial-gradient(ellipse at 50% 30%,#3a1a48,#240e2a);border:1px solid #5a1d4a;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:1rem}
  .dome b{position:absolute;font-family:"Bodoni Moda",serif;font-size:clamp(1.4rem,4vw,2.6rem);font-style:italic;color:#f0d5e5;letter-spacing:.04em;text-align:center;max-width:80%;text-shadow:0 0 30px #9b6db5}
  .dome b::first-letter{font-size:1.4em;color:#d8a8b4}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.6rem}
  .entry{background:rgba(0,0,0,.3);border:1px dashed #5a1d4a;padding:.6rem .8rem;font-size:.85rem;font-style:italic;color:#d8a8b4;cursor:pointer;font-family:"Courier New",monospace}
  .entry:hover{background:rgba(0,0,0,.5)}
  .entry b{font-style:normal;color:#f0d5e5;display:block;font-family:"Iowan Old Style",serif;font-size:1.05rem;margin-bottom:.2rem}
  footer{margin-top:1.4rem;text-align:center;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#9b6db5;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Fever Dream Index</h1>
  <p>— a small encyclopedia —</p>
</header>
<section class="dome"><b id="quote">"the lamps forgot their colours at midnight and one of them laughed."</b></section>
<div class="grid" id="grid"></div>
<footer>MiniMax M3 · 39 / 100</footer>
<script>
  const entries=[
    ['Lamps, Laughing','A burst of coloured laughter is consistent with overdrafts of sleep and cocoa.'],
    ['Stairways to Nowhere','Reproducible. Take two left turns after the third window.'],
    ['Ondine, Vexed','Fluid; irritable; slightly unsettled; rational under duress.'],
    ['Taxidermy of Shadows','Common; harmless; do not keep in sunlight.'],
    ['Wandering Clocks','Each slow by one minute; together they are punctual.'],
    ['Carpets, Flying','Allergic to dust; prefers altitude.'],
    ['Postal Storms','Addressed, franked, and delivered — sometimes to non-existent towns.'],
    ['Servant, Mirrored','Carries lamps for you; cannot be heard to refuse.'],
    ['Library, Endless','Do not disturb the librarian; she is also a book.'],
    ['Camera, Lying','Photographs items that didn't happen.'],
    ['Owl, Disgruntled','Has been awake for some time; please offer tea.'],
    ['Bookmarks, Wandering','Will return — eventually — usually with weather.'],
    ['Cousin to Whom','You have not one but several. None will say so.'],
    ['Clockmaker, Livid','In the kitchen; beside the kettle; muttering about seconds.'],
    ['River, Reversed','Patient. Will run inland if asked politely.'],
    ['Forest, Office-like','Has a paper drawer. Files by tree.'],
    ['Houseplant, Inhospitable','Refuses water. Possibly a cactus. Wants a lawyer.'],
    ['Telegram, Recursive','Send it, but only the second one will arrive.'],
    ['Dentist, Compassionate','Diagnoses your dreams rather than your teeth.'],
    ['Swan, Legal','Drafts contracts; very black-and-white.'],
  ];
  const grid=document.getElementById('grid'),quote=document.getElementById('quote');
  entries.forEach(([t,d])=>{const e=document.createElement('button');e.type='button';e.className='entry';e.innerHTML=`<b>${t}</b>${d}`;e.addEventListener('click',()=>{quote.textContent='"'+d+'"'});grid.appendChild(e)});
  let i=0;setInterval(()=>{quote.style.opacity=0;setTimeout(()=>{quote.textContent='"'+entries[i][1]+'"';quote.style.opacity=1;i=(i+1)%entries.length},400)},6500);
</script>
</body>
</html>
