<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Apricot FM — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1c0808;color:#f5d56e;font-family:"JetBrains Mono","Courier New",monospace;min-height:100vh;padding:1.4rem;display:grid;grid-template-columns:1fr 360px;gap:1rem}
  @media (max-width:880px){body{grid-template-columns:1fr}}
  .panel{background:rgba(0,0,0,.4);border:1px solid #5a2c0e;padding:1.4rem;display:flex;flex-direction:column;gap:.6rem;min-height:60vh;position:relative}
  .freq{font-family:"Courier New",monospace;font-size:1rem;color:#f5d56e;letter-spacing:.3em}
  .vumeter{height:14px;background:#0a0202;border:1px solid #5a2c0e;position:relative;overflow:hidden}
  .vumeter i{display:block;height:100%;background:linear-gradient(90deg,#a4d7a6 0,#f5d56e 60%,#c44569 90%);transition:width .2s}
  canvas{width:100%;height:200px;background:#0a0202;border:1px solid #5a2c0e}
  aside{background:rgba(0,0,0,.4);border:1px solid #5a2c0e;padding:1.4rem;display:flex;flex-direction:column;gap:.6rem}
  aside h1{font-family:"Bodoni Moda",serif;font-size:1.4rem;color:#f5d56e}
  .pl{font-size:.85rem;line-height:1.5}
  .pl li{padding:.3rem 0;border-bottom:1px dashed #5a2c0e;list-style:none;display:flex;justify-content:space-between;cursor:pointer}
  .pl li:hover{color:#fff}
  .pl li.now{color:#a4d7a6}
  .controls{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto}
  button{font:inherit;background:transparent;color:#f5d56e;border:1px solid #5a2c0e;padding:.4rem .7rem;cursor:pointer;letter-spacing:.2em;text-transform:uppercase;font-size:.65rem}
  button:hover{background:#5a2c0e}
  footer{grid-column:1/-1;text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5a2c0e;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="panel">
  <header style="display:flex;justify-content:space-between">
    <div class="freq" id="freq">96.4 MHz · APRICOT FM</div>
    <div class="freq">live · coast station</div>
  </header>
  <canvas id="cv"></canvas>
  <div class="freq" id="track">— Broadcasting —</div>
  <div class="vumeter"><i id="vu" style="width:50%"></i></div>
  <div class="controls">
    <button id="next">Next track</button>
    <button id="mute">Mute</button>
    <button id="interview">Interview</button>
    <button id="beacon">S.O.S</button>
  </div>
</section>
<aside>
  <h1>Coastal radio</h1>
  <div class="pl" id="pl"></div>
  <p style="font-size:.85rem;font-style:italic;color:#a05c2a">"We are open through the night. We broadcast the rain and the silence of the river mouth. We do not apologise for either."</p>
</aside>
<footer>MiniMax M3 · 68 / 100</footer>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');let W,H;function fit(){W=cv.width=cv.offsetWidth*2;H=cv.height=cv.offsetHeight*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  let f=96.4,track=0,mute=false;const tracks=[['Letter from a far harbour','03:14','A','spoken word'],['Brass trio at the marshes','02:48','A','instrumental'],['Found: a small coat','04:02','B','story'],['Coast weather, midnight','01:14','B','weather'],['Twelve strings and a kettle','03:50','C','instrumental'],['Intermission brief','00:34','C','psa']];
  const pl=document.getElementById('pl');tracks.forEach((t,i)=>{const l=document.createElement('button');l.type='button';l.innerHTML=`<span>${t[0]}</span><span style="font-size:.7rem;color:#a05c2a">${t[1]} · ${t[2]}</span>`;l.style.background='transparent';l.style.border='none';l.style.width='100%';l.style.textAlign='left';l.style.color='inherit';l.style.font='inherit';l.addEventListener('click',()=>{track=i;render()});pl.appendChild(l)});
  function render(){document.querySelectorAll('.pl button').forEach((x,i)=>x.classList.toggle('now',i===track));document.getElementById('track').textContent='— '+tracks[track][0]+' —'}
  render();
  function loop(){cx.clearRect(0,0,W,H);cx.strokeStyle='rgba(245,213,110,.4)';cx.beginPath();cx.moveTo(0,H/2);for(let x=0;x<W;x+=4){cx.lineTo(x,H/2+Math.sin(x*.04+f*10)*30*(mute?.2:1)+Math.random()*4}cx.stroke();f+=.001;document.getElementById('freq').textContent=f.toFixed(2)+' MHz';document.getElementById('vu').style.width=(50+Math.random()*40*(mute?.2:1))+'%';requestAnimationFrame(loop)}loop();
  document.getElementById('next').addEventListener('click',()=>{track=(track+1)%tracks.length;render()});
  document.getElementById('mute').addEventListener('click',()=>{mute=!mute});
  document.getElementById('interview').addEventListener('click',()=>{document.getElementById('track').textContent='— interview: a kettle's opinion —'});
  document.getElementById('beacon').addEventListener('click',()=>{document.getElementById('track').textContent='— SOS: vessel adrift near harbour mouth —'});
</script>
</body>
</html>
