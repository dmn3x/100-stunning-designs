<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Blue Orchard — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a14;color:#a4b3d2;font-family:"Iowan Old Style",serif;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:1.4rem;gap:1rem}
  header{display:flex;justify-content:space-between;border-bottom:1px solid #5a6c91;padding-bottom:.4rem;flex-wrap:wrap;gap:.4rem}
  header h1{font-family:"Bodoni Moda",serif;font-size:1.6rem;font-style:italic}
  header small{font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5a6c91;text-transform:uppercase}
  .stage{position:relative;background:linear-gradient(180deg,#0a0a14,#1a1532 60%,#040408);border:1px solid #5a6c91;min-height:60vh;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  aside{padding:1rem;background:rgba(0,0,0,.4);border:1px solid #5a6c91;display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;font-family:"Courier New",monospace;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#a4b3d2}
  aside div{padding:.4rem;border:1px dashed #5a6c91}
  aside b{color:#f5d56e}
  footer{text-align:right;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#5a6c91;text-transform:uppercase}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>The Blue Orchard</h1>
  <small>nocturnal fruit atlas · 51 trees</small>
  <small>moon phase <b id="phase">waxing gibbous</b></small>
</header>
<section class="stage"><canvas id="cv"></canvas></section>
<aside>
  <div>trees<b>51</b></div>
  <div>blue plums<b>243</b></div>
  <div>night visitors<b>12</b></div>
  <div>guardians<b>2</b></div>
</aside>
<footer>MiniMax M3 · 86 / 100</footer>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');const w=cv.parentElement;let W,H;function fit(){W=cv.width=w.offsetWidth*2;H=cv.height=w.offsetHeight*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  const trees=[];for(let i=0;i<51;i++)trees.push({x:Math.random()*W,y:H*.4+Math.random()*H*.5,r:30+Math.random()*60,plums:Math.floor(Math.random()*5)+3,phase:Math.random()*Math.PI*2,sway:Math.random()*.06});
  function loop(){cx.fillStyle='rgba(10,10,20,.05)';cx.fillRect(0,0,W,H);trees.forEach(t=>{t.phase+=t.sway;cx.save();cx.translate(t.x+Math.sin(t.phase)*6,t.y);cx.strokeStyle='#5a6c91';cx.lineWidth=4;cx.beginPath();cx.moveTo(0,40);cx.quadraticCurveTo(20,0,0,-60);cx.stroke();cx.strokeStyle='#3a4a6c';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,-30);cx.quadraticCurveTo(40,-50,30,-90);cx.stroke();cx.beginPath();cx.moveTo(0,-30);cx.quadraticCurveTo(-40,-50,-30,-90);cx.stroke();for(let i=0;i<t.plums;i++){cx.fillStyle='rgba(150,180,210,.95)';cx.beginPath();cx.arc(Math.cos(i)*30+Math.sin(t.phase+i)*4,Math.sin(i)*30-80,5,0,Math.PI*2);cx.fill()}cx.restore()});requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
