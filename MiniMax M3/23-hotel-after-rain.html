<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hotel After Rain — MiniMax M3</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#191823;color:#e0d5b1;font-family:"Iowan Old Style",serif;min-height:100vh;padding:1.4rem;display:grid;grid-template-columns:280px 1fr;gap:1.4rem}
  @media (max-width:880px){body{grid-template-columns:1fr}}
  .lobby{background:#0d0c12;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 30px,transparent 30px 60px);border:1px solid #2c2a3c;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
  .marble{aspect-ratio:1;background:linear-gradient(45deg,#3a3349 0,#1d1b29 60%,#0d0c12 100%);position:relative;overflow:hidden;border:1px solid #3a3349}
  .marble::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px)}
  .marble::after{content:"";position:absolute;top:50%;left:0;width:100%;height:60%;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),transparent 70%)}
  .ref{position:absolute;width:80%;height:24px;background:linear-gradient(180deg,rgba(224,213,177,.06),transparent);bottom:30%;left:10%;filter:blur(6px);transform:scaleY(-1)}
  h1{font-family:"Bodoni Moda",serif;font-size:1.4rem;letter-spacing:.04em;margin-bottom:.4rem}
  .room{border:1px solid #2c2a3c;padding:.6rem;font-family:"Courier New",monospace;font-size:.85rem;cursor:pointer;background:transparent;color:inherit;text-align:left}
  .room:hover,.room:focus-visible{background:#1d1b29;outline:none}
  .room small{display:block;font-size:.65rem;letter-spacing:.3em;color:#7d75a4;text-transform:uppercase}
  .reflect{border:1px solid #2c2a3c;padding:1rem;background:#0d0c12;position:relative;overflow:hidden}
  .reflect::before{content:"";position:absolute;top:0;left:0;right:0;height:60%;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
  .lobby-text{margin-top:.6rem;line-height:1.55;font-size:.95rem}
  .stage{padding:1.4rem;display:flex;flex-direction:column;align-items:stretch;background:linear-gradient(180deg,#191823 0%,#0c0b12 100%);border:1px solid #2c2a3c}
  .window{aspect-ratio:16/9;background:linear-gradient(180deg,#0c1a36 0%,#1a3651 60%,#2a4a6c 100%);position:relative;border:8px solid #2c2a3c;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .log{font-family:"Courier New",monospace;font-size:.75rem;letter-spacing:.2em;color:#a097c4;margin-top:.6rem;text-transform:uppercase}
  footer{margin-top:auto;font-family:"Courier New",monospace;font-size:.7rem;letter-spacing:.3em;color:#7d75a4;text-transform:uppercase;text-align:right}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="lobby">
  <div class="marble">
    <div class="ref"></div>
    <div style="position:absolute;bottom:5%;left:10%;font-family:'Bodoni Moda',serif;font-style:italic;color:#e0d5b1;opacity:.2;font-size:1.2rem">— reflection —</div>
  </div>
  <h1>Reception</h1>
  <p class="lobby-text">The hotel does not accept reservations. It accepts arrivals. Tonight, after the rain, there are three rooms open.</p>
  <button class="room" type="button" data-r="1"><span>Room 01</span><small>upstairs · harbour view</small></button>
  <button class="room" type="button" data-r="2"><span>Room 02</span><small>ground floor · garden</small></button>
  <button class="room" type="button" data-r="3"><span>Room 03</span><small>attic · skylight</small></button>
</aside>
<main class="stage">
  <div class="window">
    <canvas id="cv"></canvas>
  </div>
  <div class="log" id="log">[guest departs quietly through the side door · 02:14 LST]</div>
  <footer>MiniMax M3 · 23 / 100 · reception lights low</footer>
</main>
<script>
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');let W,H;function fit(){const r=cv.parentElement.getBoundingClientRect();W=cv.width=r.width*2;H=cv.height=r.height*2;cx.scale(2,2)}fit();addEventListener('resize',fit);
  let raining=true;const drop=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*4+2}));
  function loop(){cx.clearRect(0,0,W,H);for(let i=0;i<drop.length;i++){const d=drop[i];d.y+=d.s;if(d.y>H){d.y=-10;d.x=Math.random()*W}cx.strokeStyle='rgba(220,230,250,.5)';cx.lineWidth=1;cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x-2,d.y+10);cx.stroke()}if(Math.random()<.04){cx.fillStyle='rgba(255,255,255,.7)';cx.beginPath();cx.arc(Math.random()*W,H*.6,2,0,6.283);cx.fill()}requestAnimationFrame(loop)}loop();
  const lines={'1':'A small leather suitcase · a half-read novel · a teacup, still warm. The harbour lights up between pages.','2':'A glass door opens onto a clipped garden. The rain keeps falling into the rosemary.','3':'A skylight, a single chair, the night with the entire roof taken off.'};
  document.querySelectorAll('.room').forEach(b=>b.addEventListener('click',()=>{document.getElementById('log').textContent='[room '+b.dataset.r+' unlocked] '+lines[b.dataset.r]}));
</script>
</body>
</html>
