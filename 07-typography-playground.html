<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Typography Playground</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#faf8f5;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;padding:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem;max-width:1200px;width:100%}
.card{background:#fff;padding:2rem;border-radius:1rem;box-shadow:0 4px 24px rgba(0,0,0,.06);transition:transform .3s,box-shadow .3s}.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.12)}
.tag{display:inline-block;background:#f0ede8;padding:.25rem .75rem;border-radius:1rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:1rem;font-family:system-ui}
.s{font-family:Georgia,serif;font-size:2rem;font-weight:700}.ss{font-family:system-ui;font-size:2rem;font-weight:900;letter-spacing:-.02em}.m{font-family:'Courier New',monospace;font-size:2rem}.sc{font-family:'Brush Script MT',cursive;font-size:2.5rem}.t{font-weight:100;font-size:3rem}.b{font-weight:900;font-size:3rem}.w{letter-spacing:.3em;font-size:2rem}.ti{letter-spacing:-.05em;font-size:2rem}
</style></head>
<body><div class="grid">
<div class="card"><span class="tag">Serif</span><p class="s">Elegance is refusal.</p></div>
<div class="card"><span class="tag">Sans</span><p class="ss">Clarity above all.</p></div>
<div class="card"><span class="tag">Mono</span><p class="m">function type(){return beauty;}</p></div>
<div class="card"><span class="tag">Script</span><p class="sc">Flowing like ink on paper.</p></div>
<div class="card"><span class="tag">Weight</span><p class="t">Whisper</p><p class="b">SHOUT</p></div>
<div class="card"><span class="tag">Spacing</span><p class="w">BREATHE</p><p class="ti">crunchedclose</p></div>
</div></body></html>
