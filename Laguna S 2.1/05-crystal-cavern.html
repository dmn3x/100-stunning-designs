<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Cavern</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cavern {
    position: relative;
    width: 800px;
    height: 600px;
    background: radial-gradient(ellipse at center,
      rgba(10,10,30,0.8) 0%,
      rgba(0,0,10,0.9) 100%);
    border: 2px solid rgba(100,200,255,0.2);
    border-radius: 20px;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
  }
  .crystal {
    position: absolute;
    background: linear-gradient(135deg,
      rgba(100,200,255,0.6),
      rgba(200,100,255,0.4),
      rgba(255,200,100,0.5));
    filter: blur(1px);
    box-shadow: 0 0 20px rgba(100,200,255,0.5);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    animation: glow 4s ease-in-out infinite;
  }
  .crystal:nth-child(1) { width: 60px; height: 200px; top: 50px; left: 100px; animation-delay: 0s; }
  .crystal:nth-child(2) { width: 80px; height: 150px; top: 200px; left: 300px; animation-delay: -0.5s; }
  .crystal:nth-child(3) { width: 50px; height: 180px; top: 300px; left: 500px; animation-delay: -1s; }
  .crystal:nth-child(4) { width: 70px; height: 220px; top: 100px; left: 600px; animation-delay: -1.5s; }
  .crystal:nth-child(5) { width: 40px; height: 120px; top: 400px; left: 200px; animation-delay: -2s; }
  .crystal:nth-child(6) { width: 90px; height: 160px; top: 150px; left: 450px; animation-delay: -2.5s; }
  @keyframes glow {
    0%, 100% { opacity: 0.6; filter: blur(1px) brightness(1); }
    50% { opacity: 1; filter: blur(2px) brightness(1.3); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #a0c0ff;
    max-width: 500px;
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 300;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(100,200,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="cavern">
    <div class="crystal"></div>
    <div class="crystal"></div>
    <div class="crystal"></div>
    <div class="crystal"></div>
    <div class="crystal"></div>
    <div class="crystal"></div>
  </div>
  <div class="content">
    <h1>Crystal Cavern</h1>
    <p class="subtitle">Ancient geodes pulsing with bioluminescent energy, grown over millennia in the deep earth.</p>
  </div>
</body>
</html>
