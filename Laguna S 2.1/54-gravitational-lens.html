<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravitational Lens</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lens-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .starfield {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background:
      radial-gradient(white 1px, transparent 1px),
      radial-gradient(white 1px, transparent 1px);
    background-size: 30px 30px, 60px 60px;
  }
  .lens {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background: radial-gradient(circle,
      rgba(100,200,255,0.3) 0%,
      rgba(0,100,200,0.5) 50%,
      rgba(0,0,50,0.8) 100%);
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(100,200,255,0.3);
    animation: pulse 5s ease-in-out infinite;
  }
  .bent-light {
    position: absolute;
    top: 50%; left: 50%;
    width: 2px;
    height: 300px;
    background: rgba(255,255,255,0.5);
    box-shadow: 0 0 5px white;
    transform-origin: center;
    animation: bend 10s linear infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 50px rgba(100,200,255,0.3); }
    50% { box-shadow: 0 0 80px rgba(100,200,255,0.5), 0 0 120px rgba(100,200,255,0.3); }
  }
  @keyframes bend {
    0% { transform: rotate(0deg); opacity: 0.3; }
    100% { transform: rotate(360deg); opacity: 0.3; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3ffff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="lens-container">
    <div class="starfield"></div>
    <div class="lens"></div>
    <div class="bent-light"></div>
    <div class="bent-light" style="animation-duration: 8s;"></div>
    <div class="bent-light" style="animation-duration: 12s;"></div>
  </div>
  <div class="content">
    <h1>Gravitational Lens</h1>
    <p class="subtitle">Massive objects bend the fabric of spacetime, warping light from distant galaxies.</p>
  </div>
</body>
</html>
