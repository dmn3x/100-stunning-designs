<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Eclipse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .eclipse-container {
    position: relative;
    width: 600px;
    height: 600px;
  }
  .sun {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, #ff6600 0%, #ff3300 50%, #aa0000 100%);
    border-radius: 50%;
    box-shadow: 0 0 80px #ff6600;
    animation: pulse 5s ease-in-out infinite;
  }
  .moon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) translateX(-100px);
    width: 320px;
    height: 320px;
    background: #000;
    border-radius: 50%;
    animation: eclipse 20s linear infinite;
  }
  .corona {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    height: 400px;
    border: 4px solid rgba(255,100,0,0.3);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(255,100,0,0.3);
    animation: pulse 5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 80px #ff6600; }
    50% { box-shadow: 0 0 120px #ff9900, 0 0 200px #ff6600; }
  }
  @keyframes eclipse {
    0% { transform: translate(-50%, -50%) translateX(-100px); }
    50% { transform: translate(-50%, -50%) translateX(0px); }
    100% { transform: translate(-50%, -50%) translateX(-100px); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ffd9b3;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,100,0,0.5);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="eclipse-container">
    <div class="corona"></div>
    <div class="sun"></div>
    <div class="moon"></div>
  </div>
  <div class="content">
    <h1>Crimson Eclipse</h1>
    <p class="subtitle">The moon's shadow sweeps across the solar disk, revealing the star's hidden corona.</p>
  </div>
</body>
</html>
