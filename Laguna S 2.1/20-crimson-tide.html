<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Tide</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tide-container {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .wave-base {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 200px;
    background: linear-gradient(to top, #4a0000 0%, #8a0000 50%, #cc0000 100%);
    filter: blur(3px);
    animation: wave 12s ease-in-out infinite;
  }
  .wave-base:nth-child(1) { bottom: -20px; animation-duration: 12s; }
  .wave-base:nth-child(2) { bottom: -40px; animation-duration: 15s; animation-direction: reverse; }
  .wave-base:nth-child(3) { bottom: -60px; animation-duration: 18s; }
  .blood-drop {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #cc0000;
    border-radius: 50%;
    box-shadow: 0 0 10px #cc0000;
    animation: fall linear infinite;
  }
  .moon {
    position: absolute;
    top: 100px;
    right: 100px;
    width: 80px;
    height: 80px;
    background: #ffcc99;
    border-radius: 50%;
    box-shadow: 0 0 30px #ffcc99;
  }
  @keyframes wave {
    0%, 100% { transform: translateX(0) scaleY(1); }
    50% { transform: translateX(-100px) scaleY(1.1); }
  }
  @keyframes fall {
    0% { transform: translateY(-50px); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(600px); opacity: 0; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ff9999;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(204,0,0,0.5);
  }
  .subtitle {
    font-size: 1.3rem;
    font-weight: 300;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="tide-container">
    <div class="moon"></div>
    <div class="wave-base"></div>
    <div class="wave-base"></div>
    <div class="wave-base"></div>
  </div>
  <div class="content">
    <h1>Crimson Tide</h1>
    <p class="subtitle">Blood-red waves crash against black shores under a pale, watchful moon.</p>
  </div>
</body>
</html>
