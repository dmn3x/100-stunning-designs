<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galactic Spiral</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .galaxy-container {
    position: relative;
    width: 800px;
    height: 800px;
  }
  .spiral-arm {
    position: absolute;
    top: 50%; left: 50%;
    width: 600px;
    height: 600px;
    border: 1px solid transparent;
    border-top-color: rgba(255,255,255,0.1);
    border-right-color: rgba(255,255,255,0.1);
    border-radius: 50%;
    transform: rotate(0deg);
    animation: spin 60s linear infinite;
  }
  .spiral-arm:nth-child(1) { animation-duration: 60s; }
  .spiral-arm:nth-child(2) { animation-duration: 50s; animation-direction: reverse; }
  .spiral-arm:nth-child(3) { animation-duration: 40s; }
  .spiral-arm:nth-child(4) { animation-duration: 30s; animation-direction: reverse; }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 5px white;
    animation: twinkle 4s ease-in-out infinite;
  }
  .center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, #ff9900 0%, #aa3300 100%);
    border-radius: 50%;
    box-shadow: 0 0 40px #ff6600;
    z-index: 5;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #fff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
  }
  .subtitle {
    font-size: 1.3rem;
    font-weight: 300;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="galaxy-container">
    <div class="spiral-arm"></div>
    <div class="spiral-arm"></div>
    <div class="spiral-arm"></div>
    <div class="spiral-arm"></div>
    <div class="center"></div>
  </div>
  <div class="content">
    <h1>Galactic Spiral</h1>
    <p class="subtitle">A majestic whirlpool of 200 billion stars, each a sun with its own retinue of worlds.</p>
  </div>
</body>
</html>
