<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Entanglement</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .entanglement-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .particle {
    position: absolute;
    width: 20px;
    height: 20px;
    background: radial-gradient(circle, #00ffff 0%, #0066ff 100%);
    border-radius: 50%;
    box-shadow: 0 0 20px #00ffff;
    animation: pulse 2s ease-in-out infinite;
  }
  .particle:nth-child(1) { top: 200px; left: 200px; animation-delay: 0s; }
  .particle:nth-child(2) { top: 200px; left: 600px; animation-delay: -0.5s; }
  .particle:nth-child(3) { top: 400px; left: 200px; animation-delay: -1s; }
  .particle:nth-child(4) { top: 400px; left: 600px; animation-delay: -1.5s; }
  .link {
    position: absolute;
    height: 2px;
    background: rgba(0,255,255,0.3);
    box-shadow: 0 0 10px #00ffff;
    animation: flow 4s linear infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3ffff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  @keyframes flow {
    0% { opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.3; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="entanglement-container">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  <div class="content">
    <h1>Quantum Entanglement</h1>
    <p class="subtitle">Two particles sharing a single quantum state across any distance, instantly.</p>
  </div>
</body>
</html>
