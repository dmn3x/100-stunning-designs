<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volcanic Eruption</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .volcano {
    position: relative;
    width: 600px;
    height: 600px;
  }
  .cone {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-bottom: 250px solid #333;
  }
  .lava {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 80px;
    background: linear-gradient(to top, #ff3300, #ff6600, #ff9900);
    box-shadow: 0 0 20px #ff3300;
    animation: erupt 4s ease-in-out infinite;
  }
  .ash {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #333;
    border-radius: 50%;
    animation: fall linear infinite;
  }
  .smoke {
    position: absolute;
    bottom: 350px;
    left: 50%;
    width: 60px;
    height: 120px;
    background: rgba(50,50,50,0.5);
    filter: blur(5px);
    animation: rise 6s ease-in-out infinite;
  }
  .smoke:nth-child(1) { left: 45%; }
  .smoke:nth-child(2) { left: 55%; }
  @keyframes erupt {
    0%, 100% { height: 80px; opacity: 0.5; }
    50% { height: 200px; opacity: 1; box-shadow: 0 0 40px #ff6600, 0 -50px 60px #ff3300; }
  }
  @keyframes rise {
    0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.5; }
    100% { transform: translateX(-50%) translateY(-200px) scale(2); opacity: 0; }
  }
  @keyframes fall {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(500px); opacity: 0; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ffd9b3;
    max-width: 500px;
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,100,0,0.5);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="volcano">
    <div class="cone"></div>
    <div class="lava"></div>
    <div class="smoke"></div>
    <div class="smoke"></div>
  </div>
  <div class="content">
    <h1>Volcanic Eruption</h1>
    <p class="subtitle">Magma chambers rupture, hurling superheated pyroclastic flows down ancient slopes.</p>
  </div>
</body>
</html>
