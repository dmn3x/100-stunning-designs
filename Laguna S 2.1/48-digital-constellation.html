<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .constellation-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .star {
    position: absolute;
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white;
    animation: twinkle 3s ease-in-out infinite;
  }
  .star:nth-child(1) { top: 100px; left: 200px; animation-delay: 0s; }
  .star:nth-child(2) { top: 150px; left: 400px; animation-delay: -0.5s; }
  .star:nth-child(3) { top: 200px; left: 600px; animation-delay: -1s; }
  .star:nth-child(4) { top: 300px; left: 300px; animation-delay: -1.5s; }
  .star:nth-child(5) { top: 400px; left: 500px; animation-delay: -2s; }
  .star:nth-child(6) { top: 500px; left: 200px; animation-delay: -2.5s; }
  .star:nth-child(7) { top: 350px; left: 600px; animation-delay: -3s; }
  .star:nth-child(8) { top: 250px; left: 100px; animation-delay: -3.5s; }
  .star:nth-child(9) { top: 450px; left: 700px; animation-delay: -4s; }
  .star:nth-child(10) { top: 100px; left: 500px; animation-delay: -4.5s; }
  .connection {
    position: absolute;
    height: 1px;
    background: rgba(255,255,255,0.2);
    box-shadow: 0 0 5px white;
    transform-origin: left center;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #fff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="constellation-container">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>
  <div class="content">
    <h1>Digital Constellation</h1>
    <p class="subtitle">Ancient star patterns mapped in pixels, connecting the cosmos through data.</p>
  </div>
</body>
</html>
