<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystalline Matrix</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .matrix-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .grid-line {
    position: absolute;
    background: rgba(100,200,255,0.1);
    box-shadow: 0 0 5px rgba(100,200,255,0.3);
  }
  .grid-line:nth-child(1) { width: 100%; height: 2px; top: 20%; left: 0; }
  .grid-line:nth-child(2) { width: 100%; height: 2px; top: 40%; left: 0; }
  .grid-line:nth-child(3) { width: 100%; height: 2px; top: 60%; left: 0; }
  .grid-line:nth-child(4) { width: 100%; height: 2px; top: 80%; left: 0; }
  .grid-line:nth-child(5) { width: 2px; height: 100%; top: 0; left: 20%; }
  .grid-line:nth-child(6) { width: 2px; height: 100%; top: 0; left: 40%; }
  .grid-line:nth-child(7) { width: 2px; height: 100%; top: 0; left: 60%; }
  .grid-line:nth-child(8) { width: 2px; height: 100%; top: 0; left: 80%; }
  .node {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #00ffff;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ffff;
    animation: pulse 3s ease-in-out infinite;
  }
  .connection {
    position: absolute;
    background: rgba(0,255,255,0.2);
    box-shadow: 0 0 5px #00ffff;
    animation: flow 5s linear infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3ffff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  @keyframes flow {
    0% { opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.3; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="matrix-container">
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="node" style="top:20%; left:20%;"></div>
    <div class="node" style="top:20%; left:40%;"></div>
    <div class="node" style="top:20%; left:60%;"></div>
    <div class="node" style="top:40%; left:20%;"></div>
    <div class="node" style="top:40%; left:40%;"></div>
    <div class="node" style="top:40%; left:60%;"></div>
    <div class="node" style="top:60%; left:20%;"></div>
    <div class="node" style="top:60%; left:40%;"></div>
    <div class="node" style="top:60%; left:60%;"></div>
  </div>
  <div class="content">
    <h1>Crystalline Matrix</h1>
    <p class="subtitle">A lattice of energy nodes connected by flowing streams of quantum information.</p>
  </div>
</body>
</html>
