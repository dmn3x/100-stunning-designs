<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chrome Dome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dome-container {
    position: relative;
    width: 600px;
    height: 600px;
  }
  .dome {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    height: 400px;
    background: radial-gradient(circle,
      #cccccc 0%,
      #999999 30%,
      #666666 60%,
      #333333 100%);
    border-radius: 50%;
    box-shadow:
      inset 0 0 30px rgba(0,0,0,0.5),
      0 0 60px rgba(200,200,200,0.3);
    animation: rotate 30s linear infinite;
  }
  .reflection {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle,
      rgba(255,255,255,0.5) 0%,
      transparent 70%);
    border-radius: 50%;
    animation: reflect 15s ease-in-out infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #cccccc;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(200,200,200,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes rotate {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }
  @keyframes reflect {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
    50% { transform: translate(-60%, -40%) scale(1.1); opacity: 0.5; }
  }
</style>
</head>
<body>
  <div class="dome-container">
    <div class="dome"></div>
    <div class="reflection"></div>
  </div>
  <div class="content">
    <h1>Chrome Dome</h1>
    <p class="subtitle">A perfectly polished sphere reflecting the cosmos in warped, distorted fragments.</p>
  </div>
</body>
</html>
