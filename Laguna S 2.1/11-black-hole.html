<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .blackhole-container {
    position: relative;
    width: 600px;
    height: 600px;
  }
  .event-horizon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background: #000;
    border: 4px solid rgba(100,200,255,0.3);
    border-radius: 50%;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
    animation: pulse 5s ease-in-out infinite;
  }
  .accretion-disk {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    height: 400px;
    border: 2px solid transparent;
    border-top-color: rgba(255,100,150,0.4);
    border-right-color: rgba(100,200,255,0.4);
    border-bottom-color: rgba(255,200,100,0.3);
    border-radius: 50%;
    animation: rotate 15s linear infinite;
    filter: blur(1px);
  }
  .accretion-disk:nth-child(2) {
    width: 350px;
    height: 350px;
    animation-duration: 12s;
    animation-direction: reverse;
  }
  .accretion-disk:nth-child(3) {
    width: 300px;
    height: 300px;
    animation-duration: 10s;
  }
  .accretion-disk:nth-child(4) {
    width: 250px;
    height: 250px;
    animation-duration: 8s;
    animation-direction: reverse;
  }
  .accretion-disk:nth-child(5) {
    width: 200px;
    height: 200px;
    animation-duration: 6s;
  }
  @keyframes pulse {
    0%, 100% { border-color: rgba(100,200,255,0.2); box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 0 30px rgba(100,200,255,0.3); }
    50% { border-color: rgba(200,100,255,0.4); box-shadow: inset 0 0 80px rgba(0,0,0,0.95), 0 0 50px rgba(200,100,255,0.4); }
  }
  @keyframes rotate {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3ffff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(100,200,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="blackhole-container">
    <div class="event-horizon"></div>
    <div class="accretion-disk"></div>
    <div class="accretion-disk"></div>
    <div class="accretion-disk"></div>
    <div class="accretion-disk"></div>
    <div class="accretion-disk"></div>
  </div>
  <div class="content">
    <h1>Black Hole</h1>
    <p class="subtitle">Spacetime curvature so extreme that not even light escapes its gravitational pull.</p>
  </div>
</body>
</html>
