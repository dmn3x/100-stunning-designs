<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Circuit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .circuit-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .trace {
    position: absolute;
    background: rgba(0,255,100,0.3);
    box-shadow: 0 0 5px rgba(0,255,100,0.5);
    animation: flow 4s linear infinite;
  }
  .trace:nth-child(1) { width: 300px; height: 2px; top: 100px; left: 100px; }
  .trace:nth-child(2) { width: 2px; height: 200px; top: 100px; left: 400px; }
  .trace:nth-child(3) { width: 200px; height: 2px; top: 300px; left: 200px; }
  .trace:nth-child(4) { width: 2px; height: 150px; top: 300px; left: 400px; }
  .trace:nth-child(5) { width: 300px; height: 2px; top: 450px; left: 100px; }
  .trace:nth-child(6) { width: 2px; height: 200px; top: 250px; left: 700px; }
  .node {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #00ff66;
    border-radius: 50%;
    box-shadow: 0 0 15px #00ff66;
    animation: pulse 2s ease-in-out infinite;
  }
  .node:nth-child(7) { top: 100px; left: 100px; animation-delay: 0s; }
  .node:nth-child(8) { top: 100px; left: 400px; animation-delay: -0.5s; }
  .node:nth-child(9) { top: 300px; left: 200px; animation-delay: -1s; }
  .node:nth-child(10) { top: 300px; left: 400px; animation-delay: -1.5s; }
  .node:nth-child(11) { top: 450px; left: 100px; animation-delay: -2s; }
  .node:nth-child(12) { top: 450px; left: 400px; animation-delay: -2.5s; }
  @keyframes flow {
    0% { opacity: 0.2; }
    50% { opacity: 0.6; box-shadow: 0 0 10px rgba(0,255,100,0.8); }
    100% { opacity: 0.2; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #00ff66;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,100,0.3);
  }
  .subtitle {
    font-size: 1.1rem;
    opacity: 0.7;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="circuit-container">
    <div class="trace"></div>
    <div class="trace"></div>
    <div class="trace"></div>
    <div class="trace"></div>
    <div class="trace"></div>
    <div class="trace"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
    <div class="node"></div>
  </div>
  <div class="content">
    <h1>Neon Circuit</h1>
    <p class="subtitle">Electric pathways carrying data at light-speed through silicon valleys.</p>
  </div>
</body>
</html>
