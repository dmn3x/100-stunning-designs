<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidal Wave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #051020;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ocean {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60%;
    background: linear-gradient(to top, #003366 0%, #004488 50%, #0055aa 100%);
  }
  .wave {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 100%;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,60 C200,100 400,20 600,60 C800,100 1000,20 1200,60 L1200,120 L0,120 Z" fill="%230055aa"></path></svg>');
    background-size: 500px 100px;
    opacity: 0.6;
    animation: wave 8s ease-in-out infinite;
  }
  .wave:nth-child(2) {
    bottom: -10px;
    opacity: 0.4;
    animation-duration: 10s;
    animation-direction: reverse;
  }
  .wave:nth-child(3) {
    bottom: -20px;
    opacity: 0.3;
    animation-duration: 12s;
  }
  .foam {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 30px;
    background: rgba(255,255,255,0.3);
    filter: blur(2px);
    animation: foam-anim 8s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-250px); }
  }
  @keyframes foam-anim {
    0%, 100% { opacity: 0.1; height: 10px; }
    50% { opacity: 0.4; height: 30px; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3e0ff;
    max-width: 500px;
    top: -50px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(100,200,255,0.3);
  }
  .subtitle {
    font-size: 1.3rem;
    font-weight: 300;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="ocean"></div>
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="foam"></div>
  <div class="content">
    <h1>Tidal Wave</h1>
    <p class="subtitle">A wall of water 100 feet high, moving at 50 mph across the ocean surface.</p>
  </div>
</body>
</html>
