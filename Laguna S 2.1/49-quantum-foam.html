<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Foam</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .foam-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(100,200,255,0.1);
    box-shadow: 0 0 5px rgba(100,200,255,0.3);
    animation: pulse 3s ease-in-out infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3ffff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
  }
</style>
</head>
<body>
  <div class="foam-container"></div>
  <div class="content">
    <h1>Quantum Foam</h1>
    <p class="subtitle">Spacetime itself bubbling at the Planck scale, virtual particles flickering in and out of existence.</p>
  </div>
</body>
</html>
