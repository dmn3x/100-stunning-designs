<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismatic Dome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dome-container {
    position: relative;
    width: 600px;
    height: 600px;
  }
  .dome {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    height: 400px;
    background: conic-gradient(
      from 0deg,
      rgba(255,100,200,0.3),
      rgba(100,200,255,0.3),
      rgba(200,100,255,0.3),
      rgba(255,200,100,0.3),
      rgba(255,100,200,0.3)
    );
    border-radius: 50%;
    animation: rotate 30s linear infinite;
    filter: blur(2px);
    box-shadow: 0 0 40px rgba(255,100,200,0.3);
  }
  .dome::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
    border-radius: 50%;
  }
  @keyframes rotate {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ffd9ff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,100,200,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="dome-container">
    <div class="dome"></div>
  </div>
  <div class="content">
    <h1>Prismatic Dome</h1>
    <p class="subtitle">A translucent sphere of swirling color, refracting light into impossible spectrums.</p>
  </div>
</body>
</html>
