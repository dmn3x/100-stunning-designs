<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian Monolith</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .monolith-container {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .monolith {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    height: 400px;
    background: linear-gradient(180deg,
      #000 0%,
      #111 20%,
      #0a0a0a 50%,
      #000 80%,
      #000 100%);
    border-radius: 10px;
    box-shadow:
      0 0 30px rgba(0,0,0,0.5),
      inset 0 0 20px rgba(100,200,255,0.1);
    animation: pulse 10s ease-in-out infinite;
  }
  .reflection {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scaleY(-1);
    width: 120px;
    height: 400px;
    background: linear-gradient(180deg,
      rgba(0,0,0,0.3) 0%,
      rgba(0,0,0,0.1) 20%,
      transparent 50%,
      transparent 100%);
    border-radius: 10px;
    filter: blur(5px);
    opacity: 0.5;
  }
  .glyph {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3rem;
    color: rgba(100,200,255,0.3);
    font-family: 'Arial', sans-serif;
    letter-spacing: 0.5em;
    text-shadow: 0 0 20px rgba(100,200,255,0.5);
    animation: glow 5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(100,200,255,0.1); }
    50% { box-shadow: 0 0 50px rgba(100,200,255,0.3), inset 0 0 30px rgba(100,200,255,0.2); }
  }
  @keyframes glow {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.6; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3d9ff;
    max-width: 500px;
    top: 100px;
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(100,200,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="monolith-container">
    <div class="monolith"></div>
    <div class="reflection"></div>
    <div class="glyph">▲▼◆</div>
  </div>
  <div class="content">
    <h1>Obsidian Monolith</h1>
    <p class="subtitle">A black pillar of unknown origin, humming with alien electromagnetic frequencies.</p>
  </div>
</body>
</html>
