<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nebula-container {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .nebula-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 30% 30%,
      rgba(255,100,150,0.2) 0%,
      rgba(100,200,255,0.15) 25%,
      rgba(150,100,255,0.2) 50%,
      transparent 70%);
    filter: blur(60px);
    animation: breathe 20s ease-in-out infinite;
  }
  .nebula-layer:nth-child(1) { animation-duration: 25s; }
  .nebula-layer:nth-child(2) { animation-duration: 30s; animation-delay: -5s; background: radial-gradient(circle at 70% 60%, rgba(255,150,100,0.15) 0%, rgba(100,255,200,0.1) 30%, transparent 70%); }
  .nebula-layer:nth-child(3) { animation-duration: 22s; animation-delay: -10s; background: radial-gradient(circle at 50% 80%, rgba(200,100,255,0.18) 0%, rgba(100,150,255,0.12) 40%, transparent 80%); }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #fff;
    max-width: 600px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
  }
  .subtitle {
    font-size: 1.3rem;
    font-weight: 300;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.05); }
  }
</style>
</head>
<body>
  <div class="nebula-container">
    <div class="nebula-layer"></div>
    <div class="nebula-layer"></div>
    <div class="nebula-layer"></div>
  </div>
  <div class="content">
    <h1>Nebula Drift</h1>
    <p class="subtitle">Molecular clouds collapse under gravity, birthing stars in swirling chambers of cosmic gas.</p>
  </div>
</body>
</html>
