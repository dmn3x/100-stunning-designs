<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyperbolic Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .garden-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .petal {
    position: absolute;
    background: linear-gradient(135deg,
      rgba(255,100,200,0.5),
      rgba(200,100,255,0.4),
      rgba(100,200,255,0.5));
    filter: blur(1px);
    box-shadow: 0 0 15px rgba(255,100,200,0.3);
    transform-origin: center;
    animation: bloom 10s ease-in-out infinite;
  }
  .petal:nth-child(1) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(0deg); }
  .petal:nth-child(2) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(30deg); }
  .petal:nth-child(3) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(60deg); }
  .petal:nth-child(4) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(90deg); }
  .petal:nth-child(5) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(120deg); }
  .petal:nth-child(6) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(150deg); }
  .petal:nth-child(7) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(180deg); }
  .petal:nth-child(8) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(210deg); }
  .petal:nth-child(9) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(240deg); }
  .petal:nth-child(10) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(270deg); }
  .petal:nth-child(11) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(300deg); }
  .petal:nth-child(12) { width: 200px; height: 40px; top: 50%; left: 50%; transform: rotate(330deg); }
  @keyframes bloom {
    0%, 100% { transform: rotate(0deg) scaleX(0.5); opacity: 0.3; }
    50% { transform: rotate(15deg) scaleX(1); opacity: 0.8; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ffd9ff;
    max-width: 500px;
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,100,200,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="garden-container">
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
  </div>
  <div class="content">
    <h1>Hyperbolic Garden</h1>
    <p class="subtitle">Impossible flowers blooming in curved space, their petals defying Euclidean geometry.</p>
  </div>
</body>
</html>
