<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismatic Storm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .storm-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .beam {
    position: absolute;
    width: 4px;
    height: 300px;
    background: linear-gradient(180deg,
      rgba(255,100,200,0) 0%,
      rgba(255,100,200,0.8) 50%,
      rgba(255,100,200,0) 100%);
    box-shadow: 0 0 15px rgba(255,100,200,0.5);
    animation: sway 6s ease-in-out infinite;
  }
  .beam:nth-child(1) { left: 100px; top: 150px; animation-delay: 0s; }
  .beam:nth-child(2) { left: 200px; top: 100px; animation-delay: -0.5s; }
  .beam:nth-child(3) { left: 300px; top: 200px; animation-delay: -1s; }
  .beam:nth-child(4) { left: 400px; top: 120px; animation-delay: -1.5s; }
  .beam:nth-child(5) { left: 500px; top: 180px; animation-delay: -2s; }
  .beam:nth-child(6) { left: 600px; top: 140px; animation-delay: -2.5s; }
  .beam:nth-child(7) { left: 700px; top: 160px; animation-delay: -3s; }
  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); opacity: 0.5; }
    50% { transform: rotate(5deg); opacity: 1; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ffd9ff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,100,200,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="storm-container">
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
  </div>
  <div class="content">
    <h1>Prismatic Storm</h1>
    <p class="subtitle">Light beams of every color dancing in chaotic harmony, refracting through atmospheric crystals.</p>
  </div>
</body>
</html>
