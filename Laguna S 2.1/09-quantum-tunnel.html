<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Tunnel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tunnel-container {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 1000px;
  }
  .tunnel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotateX(20deg);
    width: 300px;
    height: 600px;
    border: 2px solid rgba(0,255,255,0.3);
    border-radius: 50%;
    animation: zoom 8s linear infinite;
  }
  .tunnel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle,
      rgba(0,255,255,0.1) 0%,
      transparent 70%);
    animation: rotate 4s linear infinite;
  }
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ffff;
    animation: travel 3s linear infinite;
  }
  @keyframes zoom {
    0% { transform: translate(-50%, -50%) rotateX(20deg) scale(1); }
    50% { transform: translate(-50%, -50%) rotateX(20deg) scale(1.5); }
    100% { transform: translate(-50%, -50%) rotateX(20deg) scale(1); }
  }
  @keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes travel {
    0% { transform: translate(-50%, -50%) translateZ(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translate(-50%, -50%) translateZ(100px); opacity: 0; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3ffff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="tunnel-container">
    <div class="tunnel"></div>
  </div>
  <div class="content">
    <h1>Quantum Tunnel</h1>
    <p class="subtitle">Particles phase through energy barriers, emerging in probability clouds across spacetime.</p>
  </div>
</body>
</html>
