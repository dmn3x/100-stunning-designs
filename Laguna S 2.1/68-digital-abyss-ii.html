<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Abyss</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .abyss-container {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .code-stream {
    position: absolute;
    font-size: 1.2rem;
    font-weight: bold;
    color: rgba(0,255,100,0.5);
    text-shadow: 0 0 5px rgba(0,255,100,0.3);
    animation: fall linear infinite;
  }
  .glitch {
    position: absolute;
    font-size: 2rem;
    font-weight: bold;
    color: rgba(255,0,100,0.7);
    text-shadow: 2px 0 0 #00ffff, -2px 0 0 #ff0066;
    animation: glitch-anim 3s infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #00ff66;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,100,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes fall {
    0% { transform: translateY(-50px); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.7; }
    100% { transform: translateY(100vh); opacity: 0; }
  }
  @keyframes glitch-anim {
    0%, 100% { clip: rect(0, 9999px, 0, 0); }
    10% { clip: rect(0, 9999px, 9999px, 0); }
    20% { clip: rect(30px, 9999px, 60px, 0); }
    30% { clip: rect(0, 9999px, 9999px, 0); }
    40% { clip: rect(80px, 9999px, 120px, 0); }
    50% { clip: rect(0, 9999px, 9999px, 0); }
    60% { clip: rect(150px, 9999px, 200px, 0); }
    70% { clip: rect(0, 9999px, 9999px, 0); }
    80% { clip: rect(250px, 9999px, 300px, 0); }
    90% { clip: rect(0, 9999px, 9999px, 0); }
  }
</style>
</head>
<body>
  <div class="abyss-container"></div>
  <div class="glitch" style="top:100px; left:50%;">ERROR</div>
  <div class="glitch" style="top:200px; left:30%;">NULL</div>
  <div class="glitch" style="top:300px; left:70%;">404</div>
  <div class="content">
    <h1>Digital Abyss</h1>
    <p class="subtitle">An infinite void of corrupted data streams and broken code fragments.</p>
  </div>
</body>
</html>
