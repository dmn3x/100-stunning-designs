<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Grid</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
  }
  .grid-container {
    position: relative;
    width: 500px;
    height: 500px;
    transform-style: preserve-3d;
    animation: rotate 30s linear infinite;
  }
  @keyframes rotate {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
  }
  .grid-line {
    position: absolute;
    background: rgba(0,255,100,0.15);
    box-shadow: 0 0 10px rgba(0,255,100,0.3);
  }
  .grid-line:nth-child(1) { width: 100%; height: 2px; top: 25%; left: 0; }
  .grid-line:nth-child(2) { width: 100%; height: 2px; top: 50%; left: 0; }
  .grid-line:nth-child(3) { width: 100%; height: 2px; top: 75%; left: 0; }
  .grid-line:nth-child(4) { width: 2px; height: 100%; top: 0; left: 25%; }
  .grid-line:nth-child(5) { width: 2px; height: 100%; top: 0; left: 50%; }
  .grid-line:nth-child(6) { width: 2px; height: 100%; top: 0; left: 75%; }
  .grid-intersection {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #00ff66;
    border-radius: 50%;
    box-shadow: 0 0 15px #00ff66;
    animation: pulse 2s ease-in-out infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #00ff66;
  }
  h1 {
    font-size: 3rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(0,255,100,0.5);
    margin-bottom: 1rem;
  }
  .subtitle {
    font-size: 1rem;
    opacity: 0.7;
    letter-spacing: 0.1em;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }
</style>
</head>
<body>
  <div class="grid-container">
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-line"></div>
    <div class="grid-intersection" style="top:25%; left:25%;"></div>
    <div class="grid-intersection" style="top:25%; left:50%;"></div>
    <div class="grid-intersection" style="top:25%; left:75%;"></div>
    <div class="grid-intersection" style="top:50%; left:25%;"></div>
    <div class="grid-intersection" style="top:50%; left:50%;"></div>
    <div class="grid-intersection" style="top:50%; left:75%;"></div>
    <div class="grid-intersection" style="top:75%; left:25%;"></div>
    <div class="grid-intersection" style="top:75%; left:50%;"></div>
    <div class="grid-intersection" style="top:75%; left:75%;"></div>
  </div>
  <div class="content">
    <h1>Neon Grid</h1>
    <p class="subtitle">Digital matrix of luminous pathways</p>
  </div>
</body>
</html>
