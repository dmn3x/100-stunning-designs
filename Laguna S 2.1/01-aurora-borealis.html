<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at center, #0a0a2a 0%, #000000 100%);
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .aurora-container { position: relative; width: 100%; height: 100%; }
  .aurora {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg,
      rgba(0,255,180,0.15) 0%,
      rgba(0,200,255,0.1) 25%,
      rgba(100,150,255,0.08) 50%,
      rgba(200,100,255,0.12) 75%,
      rgba(255,150,200,0.1) 100%);
    filter: blur(60px);
    animation: drift 20s ease-in-out infinite;
    transform-origin: center;
  }
  .aurora:nth-child(1) { top: 10%; left: -10%; width: 120%; height: 60%; animation-duration: 25s; }
  .aurora:nth-child(2) { top: 30%; left: -20%; width: 140%; height: 50%; animation-duration: 30s; animation-delay: -5s; }
  .aurora:nth-child(3) { top: 50%; left: -5%; width: 110%; height: 40%; animation-duration: 22s; animation-delay: -10s; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) scale(1) rotate(-2deg); opacity: 0.7; }
    25% { transform: translateY(-20px) scale(1.05) rotate(1deg); opacity: 0.8; }
    50% { transform: translateY(10px) scale(0.95) rotate(-1deg); opacity: 0.75; }
    75% { transform: translateY(-5px) scale(1.02) rotate(0.5deg); opacity: 0.85; }
  }
  .content {
    position: relative;
    text-align: center;
    color: #e0f0ff;
    max-width: 600px;
    z-index: 10;
  }
  h1 {
    font-size: 4.5rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,180,0.3);
    line-height: 1.1;
  }
  .subtitle {
    font-size: 1.4rem;
    font-weight: 300;
    opacity: 0.8;
    letter-spacing: 0.05em;
    line-height: 1.6;
  }
  .byline {
    font-size: 0.9rem;
    opacity: 0.5;
    margin-top: 2rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="aurora-container">
    <div class="aurora"></div>
    <div class="aurora"></div>
    <div class="aurora"></div>
  </div>
  <div class="content">
    <h1>Aurora Borealis</h1>
    <p class="subtitle">Witness the celestial dance of charged particles painting the polar sky in ribbons of emerald and violet.</p>
    <p class="byline">Laguna S 2.1</p>
  </div>
</body>
</html>
