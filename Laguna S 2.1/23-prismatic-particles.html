<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismatic Particles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .particle-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    box-shadow: 0 0 10px;
    animation: float 8s ease-in-out infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #fff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
    50% { transform: translateY(-30px) scale(1.2); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="particle-container"></div>
  <div class="content">
    <h1>Prismatic Particles</h1>
    <p class="subtitle">Colorful orbs floating in zero gravity, each reflecting a different spectrum of light.</p>
  </div>
</body>
</html>
