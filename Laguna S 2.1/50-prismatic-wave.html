<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismatic Wave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wave-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .wave {
    position: absolute;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg,
      rgba(255,100,200,0) 0%,
      rgba(255,100,200,0.8) 25%,
      rgba(100,200,255,0.8) 50%,
      rgba(200,100,255,0.8) 75%,
      rgba(255,100,200,0) 100%);
    box-shadow: 0 0 10px rgba(255,100,200,0.5);
    animation: flow 6s ease-in-out infinite;
  }
  .wave:nth-child(1) { top: 100px; animation-delay: 0s; }
  .wave:nth-child(2) { top: 200px; animation-delay: -0.5s; }
  .wave:nth-child(3) { top: 300px; animation-delay: -1s; }
  .wave:nth-child(4) { top: 400px; animation-delay: -1.5s; }
  .wave:nth-child(5) { top: 500px; animation-delay: -2s; }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ffd9ff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,100,200,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes flow {
    0%, 100% { opacity: 0.3; transform: scaleX(0.8); }
    50% { opacity: 0.8; transform: scaleX(1); }
  }
</style>
</head>
<body>
  <div class="wave-container">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>
  <div class="content">
    <h1>Prismatic Wave</h1>
    <p class="subtitle">Color waves propagating through space, each frequency painting reality in its own hue.</p>
  </div>
</body>
</html>
