<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chrono Shift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chrono-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .clock-hand {
    position: absolute;
    background: linear-gradient(90deg, rgba(0,255,255,0) 0%, rgba(0,255,255,0.8) 100%);
    box-shadow: 0 0 10px #00ffff;
    transform-origin: left center;
    animation: rotate 12s linear infinite;
  }
  .clock-hand:nth-child(1) { width: 300px; height: 2px; top: 300px; left: 400px; }
  .clock-hand:nth-child(2) { width: 200px; height: 2px; top: 300px; left: 400px; animation-duration: 8s; }
  .clock-hand:nth-child(3) { width: 250px; height: 2px; top: 300px; left: 400px; animation-duration: 15s; animation-direction: reverse; }
  .clock-hand:nth-child(4) { width: 150px; height: 2px; top: 300px; left: 400px; animation-duration: 6s; }
  .clock-hand:nth-child(5) { width: 100px; height: 2px; top: 300px; left: 400px; animation-duration: 4s; animation-direction: reverse; }
  .core {
    position: absolute;
    top: 290px; left: 390px;
    width: 20px;
    height: 20px;
    background: #00ffff;
    border-radius: 50%;
    box-shadow: 0 0 20px #00ffff;
    z-index: 5;
  }
  @keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3ffff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="chrono-container">
    <div class="clock-hand"></div>
    <div class="clock-hand"></div>
    <div class="clock-hand"></div>
    <div class="clock-hand"></div>
    <div class="clock-hand"></div>
    <div class="core"></div>
  </div>
  <div class="content">
    <h1>Chrono Shift</h1>
    <p class="subtitle">Temporal hands spinning at different rates, creating cascading waves of time distortion.</p>
  </div>
</body>
</html>
