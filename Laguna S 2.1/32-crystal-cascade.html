<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Cascade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cascade-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .crystal {
    position: absolute;
    background: linear-gradient(135deg,
      rgba(100,200,255,0.4),
      rgba(200,100,255,0.3),
      rgba(255,200,100,0.4));
    filter: blur(1px);
    box-shadow: 0 0 15px rgba(100,200,255,0.3);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    animation: fall linear infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #a0c0ff;
    max-width: 500px;
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 300;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(100,200,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes fall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(700px) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="cascade-container"></div>
  <div class="content">
    <h1>Crystal Cascade</h1>
    <p class="subtitle">Prismatic shards tumbling down in an endless waterfall of refracted light.</p>
  </div>
</body>
</html>
