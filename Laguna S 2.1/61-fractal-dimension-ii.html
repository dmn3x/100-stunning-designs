<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Dimension</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dimension-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .axis {
    position: absolute;
    background: linear-gradient(90deg, rgba(255,100,200,0) 0%, rgba(255,100,200,0.8) 50%, rgba(255,100,200,0) 100%);
    box-shadow: 0 0 10px rgba(255,100,200,0.5);
    animation: pulse 3s ease-in-out infinite;
  }
  .axis:nth-child(1) { width: 400px; height: 2px; top: 50%; left: 200px; transform: rotate(0deg); }
  .axis:nth-child(2) { width: 2px; height: 300px; top: 150px; left: 400px; transform: rotate(0deg); }
  .axis:nth-child(3) { width: 300px; height: 2px; top: 300px; left: 250px; transform: rotate(45deg); }
  .axis:nth-child(4) { width: 2px; height: 400px; top: 100px; left: 600px; transform: rotate(-30deg); }
  .axis:nth-child(5) { width: 350px; height: 2px; top: 400px; left: 225px; transform: rotate(-45deg); }
  .axis:nth-child(6) { width: 2px; height: 350px; top: 125px; left: 100px; transform: rotate(30deg); }
  .node {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #ff66cc;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff66cc;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ffd9ff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,100,200,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="dimension-container">
    <div class="axis"></div>
    <div class="axis"></div>
    <div class="axis"></div>
    <div class="axis"></div>
    <div class="axis"></div>
    <div class="axis"></div>
    <div class="node" style="top:50%; left:200px;"></div>
    <div class="node" style="top:150px; left:400px;"></div>
    <div class="node" style="top:300px; left:400px;"></div>
    <div class="node" style="top:400px; left:225px;"></div>
  </div>
  <div class="content">
    <h1>Fractal Dimension</h1>
    <p class="subtitle">Infinite axes of possibility intersecting at points of pure mathematical beauty.</p>
  </div>
</body>
</html>
