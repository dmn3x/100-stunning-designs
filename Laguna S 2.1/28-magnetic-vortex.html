<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Vortex</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .vortex-container {
    position: relative;
    width: 600px;
    height: 600px;
  }
  .vortex-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid transparent;
    border-top-color: rgba(0,255,255,0.5);
    border-right-color: rgba(255,0,255,0.5);
    border-radius: 50%;
    animation: spin 8s linear infinite;
    filter: blur(1px);
    box-shadow: 0 0 20px rgba(0,255,255,0.3);
  }
  .vortex-ring:nth-child(1) { width: 400px; height: 400px; animation-duration: 8s; }
  .vortex-ring:nth-child(2) { width: 300px; height: 300px; animation-duration: 6s; animation-direction: reverse; }
  .vortex-ring:nth-child(3) { width: 200px; height: 200px; animation-duration: 4s; }
  .vortex-ring:nth-child(4) { width: 100px; height: 100px; animation-duration: 2s; animation-direction: reverse; }
  @keyframes spin {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3ffff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="vortex-container">
    <div class="vortex-ring"></div>
    <div class="vortex-ring"></div>
    <div class="vortex-ring"></div>
    <div class="vortex-ring"></div>
  </div>
  <div class="content">
    <h1>Magnetic Vortex</h1>
    <p class="subtitle">Dimensional rift spinning at light-speed, folding space-time into fractal singularities.</p>
  </div>
</body>
</html>
