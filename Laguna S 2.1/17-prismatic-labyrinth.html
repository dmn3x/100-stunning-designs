<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismatic Labyrinth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .labyrinth {
    position: relative;
    width: 600px;
    height: 600px;
    perspective: 1200px;
  }
  .wall {
    position: absolute;
    background: linear-gradient(135deg,
      rgba(255,100,200,0.4),
      rgba(100,200,255,0.4),
      rgba(200,100,255,0.4));
    box-shadow: 0 0 20px rgba(255,100,200,0.5);
    transform-style: preserve-3d;
    animation: rotate 20s linear infinite;
  }
  .wall:nth-child(1) { width: 500px; height: 20px; top: 50px; left: 50px; transform: rotateX(0); }
  .wall:nth-child(2) { width: 20px; height: 500px; top: 50px; left: 50px; transform: rotateY(0); }
  .wall:nth-child(3) { width: 500px; height: 20px; top: 540px; left: 50px; transform: rotateX(0); }
  .wall:nth-child(4) { width: 20px; height: 500px; top: 50px; left: 540px; transform: rotateY(0); }
  .wall:nth-child(5) { width: 300px; height: 20px; top: 200px; left: 150px; transform: rotateX(0); animation-delay: -2s; }
  .wall:nth-child(6) { width: 20px; height: 300px; top: 200px; left: 300px; transform: rotateY(0); animation-delay: -3s; }
  @keyframes rotate {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    25% { transform: rotateX(90deg) rotateY(45deg) rotateZ(15deg); }
    50% { transform: rotateX(180deg) rotateY(90deg) rotateZ(30deg); }
    75% { transform: rotateX(270deg) rotateY(135deg) rotateZ(45deg); }
    100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(60deg); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #ffd9ff;
    max-width: 500px;
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(255,100,200,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="labyrinth">
    <div class="wall"></div>
    <div class="wall"></div>
    <div class="wall"></div>
    <div class="wall"></div>
    <div class="wall"></div>
    <div class="wall"></div>
  </div>
  <div class="content">
    <h1>Prismatic Labyrinth</h1>
    <p class="subtitle">A maze of light-refracting crystal walls shifting through four-dimensional space.</p>
  </div>
</body>
</html>
