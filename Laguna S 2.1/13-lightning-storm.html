<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightning Storm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #051020;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .storm-container {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .cloud {
    position: absolute;
    background: rgba(30,30,50,0.6);
    border-radius: 50%;
    filter: blur(10px);
    animation: drift 20s ease-in-out infinite;
  }
  .cloud:nth-child(1) { width: 300px; height: 100px; top: 20%; left: 10%; }
  .cloud:nth-child(2) { width: 250px; height: 80px; top: 15%; left: 60%; }
  .cloud:nth-child(3) { width: 400px; height: 120px; top: 30%; left: 30%; }
  .cloud:nth-child(4) { width: 200px; height: 70px; top: 10%; left: 80%; }
  .lightning {
    position: absolute;
    width: 4px;
    height: 200px;
    background: #fff;
    box-shadow: 0 0 20px #fff, 0 0 40px #00aaff;
    z-index: 5;
    animation: flash 5s ease-in-out infinite;
    clip-path: polygon(50% 0%, 100% 20%, 60% 20%, 80% 100%, 40% 100%, 50% 40%);
  }
  .lightning:nth-child(5) { left: 20%; top: 30%; height: 300px; animation-delay: 0s; }
  .lightning:nth-child(6) { left: 50%; top: 25%; height: 250px; animation-delay: -1s; }
  .lightning:nth-child(7) { left: 70%; top: 35%; height: 280px; animation-delay: -2s; }
  @keyframes drift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(30px); }
  }
  @keyframes flash {
    0%, 80%, 100% { opacity: 0; }
    82% { opacity: 0.3; }
    85% { opacity: 1; }
    88% { opacity: 0.5; }
    90% { opacity: 0; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #b3d9ff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(100,200,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="storm-container">
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="lightning"></div>
    <div class="lightning"></div>
    <div class="lightning"></div>
  </div>
  <div class="content">
    <h1>Lightning Storm</h1>
    <p class="subtitle">Electrical discharge at 30,000 amps, bridging the gap between heaven and earth.</p>
  </div>
</body>
</html>
