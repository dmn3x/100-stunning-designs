<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rain-container {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .column {
    position: absolute;
    top: -100px;
    font-size: 1.5rem;
    font-weight: bold;
    color: rgba(0,255,100,0.7);
    text-shadow: 0 0 5px rgba(0,255,100,0.5);
    animation: fall linear infinite;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #00ff66;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0,255,100,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
  @keyframes fall {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.7; }
    100% { transform: translateY(100vh); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="rain-container"></div>
  <div class="content">
    <h1>Binary Rain</h1>
    <p class="subtitle">Digital code cascades down the screen in emerald streams of pure information.</p>
  </div>
</body>
</html>
