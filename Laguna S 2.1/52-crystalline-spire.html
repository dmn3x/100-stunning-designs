<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystalline Spire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spire-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  .spire {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 400px;
    background: linear-gradient(180deg,
      rgba(100,200,255,0.6) 0%,
      rgba(200,100,255,0.4) 50%,
      rgba(255,200,100,0.5) 100%);
    filter: blur(1px);
    box-shadow: 0 0 20px rgba(100,200,255,0.4);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    animation: pulse 8s ease-in-out infinite;
  }
  .spire-reflection {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scaleY(-1);
    width: 40px;
    height: 400px;
    background: linear-gradient(180deg,
      rgba(100,200,255,0.3) 0%,
      rgba(200,100,255,0.15) 50%,
      transparent 100%);
    filter: blur(5px);
    opacity: 0.5;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #a0c0ff;
    max-width: 500px;
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 300;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(100,200,255,0.3);
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="spire-container">
    <div class="spire"></div>
    <div class="spire-reflection"></div>
  </div>
  <div class="content">
    <h1>Crystalline Spire</h1>
    <p class="subtitle">A towering crystal of unknown origin, pulsing with inner light from its core.</p>
  </div>
</body>
</html>
