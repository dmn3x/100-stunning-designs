<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Metal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .liquid-container {
    position: relative;
    width: 600px;
    height: 600px;
  }
  .liquid {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg,
      #4a4a6a 0%,
      #6a5acd 25%,
      #8a7fff 50%,
      #4a4a6a 75%,
      #6a5acd 100%);
    background-size: 300% 300%;
    border-radius: 50%;
    filter: blur(2px);
    animation: flow 15s ease infinite;
    box-shadow:
      inset 0 0 50px rgba(0,0,0,0.5),
      0 0 80px rgba(106,90,205,0.4),
      0 0 120px rgba(138,127,255,0.3);
  }
  .liquid::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 50%);
    animation: shimmer 8s ease-in-out infinite;
  }
  @keyframes flow {
    0% { background-position: 0% 50%; transform: scale(1) rotate(0deg); }
    25% { background-position: 100% 50%; transform: scale(1.05) rotate(2deg); }
    50% { background-position: 100% 100%; transform: scale(0.95) rotate(0deg); }
    75% { background-position: 0% 100%; transform: scale(1.02) rotate(-2deg); }
    100% { background-position: 0% 50%; transform: scale(1) rotate(0deg); }
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.3; transform: translateX(-20px) translateY(-20px); }
    50% { opacity: 0.5; transform: translateX(20px) translateY(20px); }
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    color: #e0e0ff;
    max-width: 500px;
  }
  h1 {
    font-size: 4rem;
    font-weight: 200;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(138,127,255,0.5);
    line-height: 1.1;
  }
  .subtitle {
    font-size: 1.2rem;
    opacity: 0.8;
    letter-spacing: 0.05em;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="liquid-container">
    <div class="liquid"></div>
    <div class="liquid" style="animation-delay: -5s;"></div>
    <div class="liquid" style="animation-delay: -10s;"></div>
  </div>
  <div class="content">
    <h1>Liquid Metal</h1>
    <p class="subtitle">Molten alloy flowing through unseen magnetic fields, solidifying into impossible geometries.</p>
  </div>
</body>
</html>
