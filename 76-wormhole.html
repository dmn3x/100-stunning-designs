<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>76 Wormhole.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){ctx.fillStyle="rgba(0,0,0,.1)";ctx.fillRect(0,0,w,h);t+=.01;for(let i=0;i<40;i++){const a=t+i*.2,d=50+i*8;ctx.beginPath();ctx.arc(w/2+Math.cos(a)*d,h/2+Math.sin(a)*d,3+i*.2,0,Math.PI*2);ctx.fillStyle="hsl("+((t*60+i*9)%360)+",80%,60%)";ctx.fill()}requestAnimationFrame(draw)}draw();</script></body></html>
