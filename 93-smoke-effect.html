<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>93 Smoke Effect.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,p=[];function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;c.addEventListener("mousemove",e=>{for(let i=0;i<3;i++)p.push({x:e.clientX+(Math.random()-.5)*20,y:e.clientY,r:5+Math.random()*15,a:1,vy:-1-Math.random()*2,vx:(Math.random()-.5)*2})});function draw(){ctx.fillStyle="rgba(0,0,0,.05)";ctx.fillRect(0,0,w,h);p=p.filter(pt=>{pt.y+=pt.vy;pt.x+=pt.vx;pt.a-=.01;pt.r+=.3;if(pt.a<=0)return 0;const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.r);g.addColorStop(0,"rgba(200,200,255,"+pt.a+")");g.addColorStop(1,"rgba(200,200,255,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();return 1});requestAnimationFrame(draw)}draw();</script></body></html>
