<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>78 Lava Lamp.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0514;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){ctx.fillStyle="rgba(10,5,20,.05)";ctx.fillRect(0,0,w,h);t+=.005;for(let i=0;i<5;i++){ctx.beginPath();const cx=w/2+Math.sin(t*1.3+i)*60,cy=h*.6+Math.sin(t*.7+i*2)*120,ry=60+Math.sin(t*.5+i)*30;ctx.ellipse(cx,cy,40+Math.sin(t+i)*15,ry,0,0,Math.PI*2);const g=ctx.createRadialGradient(cx,cy-20,10,cx,cy+20,80);g.addColorStop(0,"rgba(255,100,50,.8)");g.addColorStop(.5,"rgba(255,50,100,.4)");g.addColorStop(1,"rgba(100,50,200,.1)");ctx.fillStyle=g;ctx.fill()}requestAnimationFrame(draw)}draw();</script></body></html>
