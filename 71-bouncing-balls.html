<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>71 Bouncing Balls.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,B=[];function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;for(let i=0;i<30;i++)B.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,r:10+Math.random()*20,h:Math.random()*360});function draw(){ctx.fillStyle="rgba(0,0,0,.1)";ctx.fillRect(0,0,w,h);B.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<b.r||b.x>w-b.r)b.vx*=-1;if(b.y<b.r||b.y>h-b.r)b.vy*=-1;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle="hsl("+b.h+",80%,65%)";ctx.fill()});requestAnimationFrame(draw)}draw();</script></body></html>
