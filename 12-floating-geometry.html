<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Floating Geometry</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f1a;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:1000px}
.scene{position:relative;width:400px;height:400px;transform-style:preserve-3d;animation:rot 20s linear infinite}
@keyframes rot{0%{transform:rotateX(30deg) rotateY(0)}100%{transform:rotateX(30deg) rotateY(360deg)}}
.sh{position:absolute;top:50%;left:50%;transform-style:preserve-3d}
.sh:nth-child(1){animation:o1 6s ease-in-out infinite}.sh:nth-child(2){animation:o2 8s ease-in-out infinite}
.sh:nth-child(3){animation:o3 10s ease-in-out infinite}.sh:nth-child(4){animation:o4 12s ease-in-out infinite}
@keyframes o1{0%,100%{transform:translate(-50%,-50%) translateZ(100px)}50%{transform:translate(-50%,-50%) translateZ(-100px)}}
@keyframes o2{0%,100%{transform:translate(-50%,-50%) translateZ(150px)}50%{transform:translate(-50%,-50%) translateZ(-150px)}}
@keyframes o3{0%,100%{transform:translate(-50%,-50%) translateX(120px)}50%{transform:translate(-50%,-50%) translateX(-120px)}}
@keyframes o4{0%,100%{transform:translate(-50%,-50%) translateY(100px)}50%{transform:translate(-50%,-50%) translateY(-100px)}}
.cu{width:60px;height:60px;background:linear-gradient(135deg,rgba(100,130,255,.4),rgba(200,100,255,.4));border:2px solid rgba(255,255,255,.3);border-radius:12px}
.tr{width:0;height:0;border-left:35px solid transparent;border-right:35px solid transparent;border-bottom:60px solid rgba(255,150,100,.4)}
.ci{width:50px;height:50px;background:rgba(100,255,200,.4);border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.st{width:50px;height:50px;background:rgba(255,200,50,.5);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ti{position:fixed;color:rgba(255,255,255,.6);font-family:Georgia,serif;font-size:2rem;bottom:3rem;letter-spacing:.3em;pointer-events:none}
</style></head>
<body><div class="scene"><div class="sh"><div class="cu"></div></div><div class="sh"><div class="tr"></div></div><div class="sh"><div class="ci"></div></div><div class="sh"><div class="st"></div></div></div><div class="ti">DIMENSION</div></body></html>
