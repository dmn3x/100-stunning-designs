<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>97 Floating Island.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0f1e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){ctx.fillStyle="rgba(10,15,30,.1)";ctx.fillRect(0,0,w,h);t+=.005;const cx=w/2+Math.sin(t*.3)*50,cy=h/2+Math.sin(t*.5)*30;ctx.beginPath();ctx.ellipse(cx,cy+40,120,30,0,0,Math.PI*2);ctx.fillStyle="rgba(100,200,150,.3)";ctx.fill();ctx.beginPath();ctx.moveTo(cx-80,cy+20);ctx.quadraticCurveTo(cx-20,cy-60,cx+40,cy-20);ctx.quadraticCurveTo(cx+70,cy-30,cx+90,cy+15);ctx.fillStyle="rgba(60,120,80,.4)";ctx.fill();ctx.beginPath();ctx.moveTo(cx-30,cy-60);ctx.lineTo(cx-15,cy-90);ctx.lineTo(cx,cy-70);ctx.lineTo(cx+15,cy-85);ctx.lineTo(cx+25,cy-60);ctx.fillStyle="rgba(40,100,60,.5)";ctx.fill();requestAnimationFrame(draw)}draw();</script></body></html>
