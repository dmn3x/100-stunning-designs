<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>75 Dna Helix.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){ctx.fillStyle="rgba(0,0,0,.15)";ctx.fillRect(0,0,w,h);t+=.02;ctx.strokeStyle="rgba(100,200,255,.5)";ctx.lineWidth=2;for(let i=0;i<2;i++){ctx.beginPath();for(let y=0;y<h;y+=5){const x=w/2+Math.sin(y*.02+t+i*Math.PI)*100;y===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}for(let y=0;y<h;y+=40){const x1=w/2+Math.sin(y*.02+t)*100,x2=w/2+Math.sin(y*.02+t+Math.PI)*100;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.strokeStyle="rgba(255,255,255,.3)";ctx.stroke()}requestAnimationFrame(draw)}draw();</script></body></html>
