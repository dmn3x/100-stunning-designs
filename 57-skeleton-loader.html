<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>57 Skeleton Loader.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}.sk{background:linear-gradient(90deg,#e8ecf0 25%,#f0f2f5 50%,#e8ecf0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}</style></head><body><div style="background:#fff;border-radius:1rem;padding:2rem;width:380px;box-shadow:0 4px 20px rgba(0,0,0,.08)"><div class="sk" style="width:60px;height:60px;border-radius:50%;margin-bottom:1rem"></div><div class="sk" style="height:14px;margin-bottom:.75rem;border-radius:.25rem"></div><div class="sk" style="height:14px;margin-bottom:.75rem;border-radius:.25rem;width:80%"></div><div class="sk" style="height:14px;margin-bottom:.75rem;border-radius:.25rem;width:60%"></div><div class="sk" style="height:160px;margin-top:1.5rem;border-radius:.5rem"></div></div></body></html>
