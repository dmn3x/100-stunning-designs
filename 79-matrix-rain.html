<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>79 Matrix Rain.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,cols=[];function R(){w=c.width=innerWidth;h=c.height=innerHeight;cols=Array(Math.floor(w/20)).fill(0).map(()=>Math.random()*h)}R();onresize=R;const ch="ｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";function draw(){ctx.fillStyle="rgba(0,0,0,.05)";ctx.fillRect(0,0,w,h);ctx.font="16px monospace";cols.forEach((y,i)=>{const x=i*20;const c=ch[Math.floor(Math.random()*ch.length)];ctx.fillStyle="rgba(0,255,70,.8)";ctx.fillText(c,x,y);ctx.fillStyle="rgba(0,255,70,.3)";ctx.fillText(c,x-1,y-1);if(y>h+20&&Math.random()>.98)cols[i]=0;else cols[i]=y+16});requestAnimationFrame(draw)}draw();</script></body></html>
