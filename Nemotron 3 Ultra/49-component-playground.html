<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>49 — Component Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--fg:#e6edf3;--muted:#484f58;--accent:#58a6ff;--accent2:#3fb950;--accent3:#d29922;--card:#161b22;--border:#30363d}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 'JetBrains Mono','SF Mono',monospace;overflow:auto}
.layout{display:grid;grid-template-columns:300px 1fr;height:100%}
@media (max-width:1000px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.sidebar{background:var(--card);border-right:1px solid var(--border);padding:1rem;overflow:auto}
.sidebar-header{position:sticky;top:0;background:var(--card);padding-bottom:1rem;border-bottom:1px solid var(--border);margin-bottom:1rem;z-index:10}
.sidebar-header h2{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.component-list{display:flex;flex-direction:column;gap:.5rem}
.comp-btn{text-align:left;padding:.75rem;border:1px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:.75rem;border-radius:4px;cursor:pointer;transition:all .1s}
.comp-btn:hover,.comp-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,0.1)}
.comp-btn .comp-name{font-weight:500;margin-bottom:.25rem}
.comp-btn .comp-desc{font-size:.65rem;color:var(--muted)}
.props-panel{margin-top:1rem;padding:1rem;background:var(--bg);border:1px solid var(--border);border-radius:4px}
.prop-row{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.75rem}
.prop-row label{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prop-row input,.prop-row select{background:var(--card);border:1px solid var(--border);color:var(--fg);font:inherit;padding:.4rem;border-radius:3px;font-size:.75rem}
.main{padding:2rem;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%}
.preview{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3rem;min-width:320px;max-width:600px;width:100%}
.preview-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.preview-header h3{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.code-toggle{background:transparent;border:1px solid var(--border);color:var(--fg);padding:.25rem .5rem;font:inherit;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:3px;cursor:pointer}
.code-panel{display:none;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1rem;margin-top:1rem;font-size:.7rem;overflow:auto;max-height:300px}
.code-panel.visible{display:block}
.footer{text-align:center;padding:2rem;border-top:1px solid var(--border);color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="sidebar-header"><h2>Components</h2></div>
<div class="component-list" id="componentList"></div>
<div class="props-panel" id="propsPanel"></div>
</aside>
<main class="main">
<div class="preview" id="preview">
<div class="preview-header"><h3 id="previewTitle">Select a Component</h3><button class="code-toggle" id="codeToggle">Show Code</button></div>
<div id="previewContent"></div>
<div class="code-panel" id="codePanel"></div>
</div>
</main>
</div>
<footer class="footer">Nemotron 3 Ultra · 049 / 100 · Component Playground</footer>
<script>
const components={
  button:{name:'Button',desc:'Interactive button with variants',props:{variant:['primary','secondary','ghost','danger'],size:['sm','md','lg'],disabled:[false,true],loading:[false,true]},render:(p)=>`<button class="btn btn-${p.variant} btn-${p.size}" ${p.disabled?'disabled':''}>${p.loading?'<span class="spinner"></span>Loading...':'Button'}</button>`,css:`.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:inherit;padding:.5rem 1rem;border-radius:6px;border:1px solid transparent;cursor:pointer;transition:all .1s}.btn:disabled{opacity:.5;cursor:not-allowed}.btn-primary{background:var(--accent);color:var(--bg)}.btn-secondary{background:transparent;border-color:var(--border);color:var(--fg)}.btn-ghost{background:transparent;border-color:transparent;color:var(--fg)}.btn-danger{background:var(--accent4);color:var(--bg)}.btn-sm{padding:.25rem .75rem;font-size:.8rem}.btn-lg{padding:.75rem 1.5rem;font-size:1.1rem}.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}`},
  card:{name:'Card',desc:'Content container with header/body/footer',props:{title:['Card Title',''],subtitle:['Subtitle',''],image:['https://picsum.photos/400/200',''],footer:['Footer action','']},render:(p)=>`<article class="card">${p.image?`<img src="${p.image}" alt="" style="width:100%;height:auto;display:block">`:''}<div class="card-body">${p.title?`<h3 class="card-title">${p.title}</h3>`:''}${p.subtitle?`<p class="card-subtitle">${p.subtitle}</p>`:''}<p class="card-text">This is a card component with flexible content areas.</p></div>${p.footer?`<div class="card-footer"><button class="btn btn-primary btn-sm">${p.footer}</button></div>`:''}</article>`,css:`.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}.card-body{padding:1.5rem}.card-title{font-size:1.1rem;font-weight:600;margin-bottom:.25rem}.card-subtitle{color:var(--muted);font-size:.9rem;margin-bottom:.75rem}.card-text{color:var(--fg);line-height:1.6}.card-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);background:var(--bg)}`},
  input:{name:'Input',desc:'Form input with label, error, helper',props:{type:['text','email','password','number'],label:['Email Address',''],placeholder:['Enter your email',''],value:['',''],error:['Invalid email format',''],disabled:[false,true]},render:(p)=>`<label class="field"><span class="field-label">${p.label}</span><input type="${p.type}" class="field-input${p.error?' field-input--error':''}" placeholder="${p.placeholder}" value="${p.value}" ${p.disabled?'disabled':''}>${p.error?`<span class="field-error">${p.error}</span>`:''}</label>`,css:`.field{display:flex;flex-direction:column;gap:.35rem;width:100%}.field-label{font-size:.7rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.field-input{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:.6rem .75rem;border-radius:6px;font:inherit;transition:border .1s,box-shadow .1s}.field-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)33}.field-input--error{border-color:var(--accent4)}.field-error{font-size:.7rem;color:var(--accent4)}`},
  badge:{name:'Badge',desc:'Status indicator with variants',props:{variant:['default','success','warning','danger','info'],size:['sm','md','lg'],dot:[false,true],text:['Active','']},render:(p)=>`<span class="badge badge-${p.variant} badge-${p.size}">${p.dot?'<span class="badge-dot"></span>':''}${p.text}</span>`,css:`.badge{display:inline-flex;align-items:center;gap:.35rem;font-weight:500;border-radius:9999px;border:1px solid transparent}.badge-sm{padding:.15rem .5rem;font-size:.65rem}.badge-md{padding:.25rem .75rem;font-size:.75rem}.badge-lg{padding:.35rem 1rem;font-size:.85rem}.badge-default{background:var(--muted);color:var(--bg)}.badge-success{background:rgba(63,185,80,.1,.15);border-color:var(--accent2);color:var(--accent2)}.badge-warning{background:rgba(210,153,34,.15);border-color:var(--accent3);color:var(--accent3)}.badge-danger{background:rgba(248,81,73,.15);border-color:var(--accent4);color:var(--accent4)}.badge-info{background:rgba(88,166,255,.15);border-color:var(--accent);color:var(--accent)}.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}`},
  alert:{name:'Alert',desc:'Dismissible alert messages',props:{variant:['info','success','warning','danger'],title:['Alert Title',''],message:['This is an alert message with important information.',''],dismissible:[true,false]},render:(p)=>`<div class="alert alert-${p.variant}" role="alert"><div class="alert-content"><strong class="alert-title">${p.title}</strong><p class="alert-message">${p.message}</p></div>${p.dismissible?`<button class="alert-dismiss" aria-label="Dismiss">×</button>`:''}</div>`,css:`.alert{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;padding:1rem;border-radius:8px;border:1px solid transparent}.alert-content{flex:1}.alert-title{display:block;margin-bottom:.25rem}.alert-message{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0}.alert-dismiss{background:none;border:none;color:inherit;font-size:1.25rem;line-height:1;cursor:pointer;opacity:.6}.alert-dismiss:hover{opacity:1}.alert-info{background:rgba(88,166,255,.1);border-color:var(--accent);color:var(--accent)}.alert-success{background:rgba(63,185,81,.1);border-color:var(--accent2);color:var(--accent2)}.alert-warning{background:rgba(210,153,34,.1);border-color:var(--accent3);color:var(--accent3)}.alert-danger{background:rgba(248,81,73,.1);border-color:var(--accent4);color:var(--accent4)}`},
  avatar:{name:'Avatar',desc:'User avatar with fallback',props:{src:['https://picsum.photos/seed/avatar/100/100',''],name:['John Doe',''],size:['xs','sm','md','lg','xl'],shape:['circle','square'],status:[false,true]},render:(p)=>`<div class="avatar avatar-${p.size} avatar-${p.shape}" style="${p.src?'background-image:url('+p.src+')':'background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:600'}">${p.src?'':p.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div>${p.status?'<span class="avatar-status"></span>':''}`,css:`.avatar{position:relative;display:inline-flex;background-size:cover;background-position:center;border-radius:50%;overflow:hidden}.avatar-square{border-radius:8px}.avatar-xs{width:24px;height:24px;font-size:.6rem}.avatar-sm{width:32px;height:32px;font-size:.7rem}.avatar-md{width:40px;height:40px;font-size:.8rem}.avatar-lg{width:56px;height:56px;font-size:1rem}.avatar-xl{width:80px;height:80px;font-size:1.5rem}.avatar-status{position:absolute;bottom:0;right:0;width:25%;height:25%;min-width:6px;min-height:6px;background:var(--accent2);border:2px solid var(--bg);border-radius:50%}`},
  tooltip:{name:'Tooltip',desc:'Hover-triggered tooltip',props:{content:['Tooltip content',''],position:['top','bottom','left','right'],delay:[200,0,100,300,500]},render:(p)=>`<div class="tooltip-wrapper"><button class="btn btn-secondary">Hover me</button><div class="tooltip tooltip-${p.position}" style="--delay:${p.delay}ms">${p.content}</div></div>`,css:`.tooltip-wrapper{position:relative;display:inline-block}.tooltip-wrapper:hover .tooltip{opacity:1;visibility:visible;transform:translateY(0)}.tooltip{position:absolute;background:var(--fg);color:var(--bg);padding:.5rem .75rem;border-radius:6px;font-size:.75rem;white-space:nowrap;opacity:0;visibility:hidden;transition:all .2s;z-index:10}.tooltip-top{bottom:100%;left:50%;transform:translateX(-50%) translateY(-8px)}.tooltip-bottom{top:100%;left:50%;transform:translateX(-50%) translateY(8px)}.tooltip-left{right:100%;top:50%;transform:translateY(-50%) translateX(-8px)}.tooltip-right{left:100%;top:50%;transform:translateY(-50%) translateX(8px)}.tooltip::after{content:'';position:absolute;border:5px solid transparent}.tooltip-top::after{top:100%;left:50%;margin-left:-5px;border-top-color:var(--fg)}.tooltip-bottom::after{bottom:100%;left:50%;margin-left:-5px;border-bottom-color:var(--fg)}.tooltip-left::after{left:100%;top:50%;margin-top:-5px;border-left-color:var(--fg)}.tooltip-right::after{right:100%;top:50%;margin-top:-5px;border-right-color:var(--fg)}`},
  dropdown:{name:'Dropdown',desc:'Menu dropdown component',props:{trigger:['Options',''],items:['Option 1,Option 2,Option 3,Danger',''],align:['left','right']},render:(p)=>`<div class="dropdown"><button class="btn btn-secondary dropdown-toggle">${p.trigger}</button><div class="dropdown-menu dropdown-${p.align}">${p.items.split(',').map(i=>`<div class="dropdown-item${i==='Danger'?' dropdown-item--danger':''}">${i}</div>`).join('')}</div></div>`,css:`.dropdown{position:relative;display:inline-block}.dropdown-menu{position:absolute;top:100%;margin-top:.5rem;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);min-width:180px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;z-index:10}.dropdown:hover .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}.dropdown-left{left:0}.dropdown-right{right:0}.dropdown-item{padding:.5rem 1rem;font-size:.85rem;cursor:pointer;transition:background .1s}.dropdown-item:hover{background:var(--bg)}.dropdown-item--danger{color:var(--accent4)}.dropdown-item--danger:hover{background:rgba(248,81,73,.1)}`},
  progress:{name:'Progress',desc:'Progress bar with variants',props:{value:[65,0,25,50,75,100],max:[100,100],variant:['default','success','warning','danger'],striped:[true,false],animated:[false,true],showLabel:[true,false]},render:(p)=>`<div class="progress" role="progressbar" aria-valuenow="${p.value}" aria-valuemin="0" aria-valuemax="${p.max}"><div class="progress-bar progress-${p.variant} ${p.striped?'progress-striped':''} ${p.animated?'progress-animated':''}" style="width:${p.value}%">${p.showLabel?p.value+'%':''}</div></div>`,css:`.progress{height:8px;background:var(--muted);border-radius:9999px;overflow:hidden}.progress-bar{height:100%;background:var(--accent);border-radius:9999px;transition:width .3s;display:flex;align-items:center;justify-content:flex-end;padding-right:.5rem;font-size:.6rem;color:var(--bg)}.progress-success{background:var(--accent2)}.progress-warning{background:var(--accent3)}.progress-danger{background:var(--accent4)}.progress-striped{background-image:linear-gradient(45deg,rgba(255,255,255,.15)25%,transparent25%,transparent50%,rgba(255,255,255,.15)50%,rgba(255,255,255,.15)75%,transparent75%,transparent);background-size:1rem 1rem}.progress-animated{animation:progress-bar-stripes 1s linear infinite}@keyframes progress-bar-stripes{0%{background-position:1rem 0}100%{background-position:0 0}}`},
  tabs:{name:'Tabs',desc:'Tab navigation component',props:{tabs:['Home,Profile,Settings,Messages',''],variant:['line','pills','underline'],defaultIndex:[0,1,2,3]},render:(p)=>`<div class="tabs tabs-${p.variant}"><div class="tabs-list" role="tablist">${p.tabs.split(',').map((t,i)=>`<button class="tab${i===p.defaultIndex?' active':''}" role="tab" aria-selected="${i===p.defaultIndex}">${t}</button>`).join('')}</div><div class="tab-panel" role="tabpanel">Content for ${p.tabs.split(',')[p.defaultIndex]}</div></div>`,css:`.tabs-list{display:flex;gap:.25rem;margin-bottom:1rem}.tab{background:none;border:none;color:var(--muted);padding:.5rem 1rem;font:inherit;cursor:pointer;border-radius:6px;transition:all .1s}.tab:hover{color:var(--fg);background:var(--bg)}.tab.active{color:var(--accent)}.tabs-line .tab{border-bottom:2px solid transparent}.tabs-line .tab.active{border-bottom-color:var(--accent);background:transparent}.tabs-pills .tab.active{background:var(--accent);color:var(--bg)}.tabs-underline .tab{position:relative}.tabs-underline .tab.active::after{content:'';position:absolute;bottom:0;left:25%;right:25%;height:2px;background:var(--accent)}.tab-panel{padding:1rem 0;color:var(--muted)}`}
};
let activeComp='button',props={};
const list=document.getElementById('componentList');
Object.entries(components).forEach(([key,comp])=>{const btn=document.createElement('button');btn.className='comp-btn'+(key===activeComp?' active':'');btn.dataset.comp=key;btn.innerHTML=`<div class="comp-name">${comp.name}</div><div class="comp-desc">${comp.desc}</div>`;btn.onclick=()=>{document.querySelectorAll('.comp-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeComp=key;renderProps();renderPreview();};list.appendChild(btn);});
function renderProps(){
  const comp=components[activeComp];
  const panel=document.getElementById('propsPanel');
  panel.innerHTML='';
  Object.entries(comp.props).forEach(([prop,options])=>{if(!props[prop])props[prop]=options[0];const row=document.createElement('div');row.className='prop-row';const isSelect=Array.isArray(options)&&options.length>2&&typeof options[0]==='string';row.innerHTML=`<label>${prop}</label>${isSelect?`<select>${options.map(o=>`<option value="${o}"${o===props[prop]?' selected':''}>${o}</option>`).join('')}</select>`:`<input type="${typeof options[0]==='boolean'?'checkbox':'text'}" value="${props[prop]}" ${typeof options[0]==='boolean'?props[prop]?'checked':'' :''}>`}`;if(isSelect)row.querySelector('select').onchange=e=>{props[prop]=e.target.value;renderPreview();};elserow.querySelector('input').onchange=e=>{props[prop]=e.target.type==='checkbox'?e.target.checked:e.target.value;renderPreview();};panel.appendChild(row);});
}
function renderPreview(){
  const comp=components[activeComp];
  document.getElementById('previewTitle').textContent=comp.name;
  const html=comp.render(props);
  document.getElementById('previewContent').innerHTML=html;
  document.getElementById('codePanel').innerHTML=`<div class="code"><span class="comment">/* HTML */</span>\n${html.replace(/</g,'<').replace(/>/g,'>')}\n\n<span class="comment">/* CSS */</span>\n${comp.css}`;
  document.getElementById('codePanel').classList.remove('visible');
}
document.getElementById('codeToggle').onclick=()=>{document.getElementById('codePanel').classList.toggle('visible');document.getElementById('codeToggle').textContent=document.getElementById('codePanel').classList.contains('visible')?'Hide Code':'Show Code';};
renderProps();
renderPreview();
</script>
</body>
</html>
