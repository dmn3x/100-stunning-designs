<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>79 — Terminal Recorder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--fg:#e6edf3;--muted:#484f58;--accent:#58a6ff;--accent2:#3fb950;--accent3:#d29922;--accent4:#f85149;--card:#161b22;--border:#30363d}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 'JetBrains Mono','SF Mono',monospace;overflow:auto}
.header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:1rem 2rem;z-index:10;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
.header h1{font-size:1.5rem;font-weight:300}
.header h1 span{font-weight:700;color:var(--accent)}
.main{padding:2rem;max-width:1200px;margin:0 auto}
.terminal{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.term-header{background:var(--border);padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center}
.term-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.term-controls{display:flex;gap:.5rem}
.btn{padding:.35rem .75rem;border:1px solid var(--border);background:var(--card);color:var(--fg);font:inherit;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:3px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.recording{background:var(--accent4);border-color:var(--accent4);color:var(--bg);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.term-body{padding:1rem;min-height:400px;max-height:600px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.5}
.term-line{margin-bottom:.25rem;white-space:pre-wrap;word-break:break-word}
.term-prompt{color:var(--accent2)}
.term-command{color:var(--fg)}
.term-output{color:var(--muted)}
.term-error{color:var(--accent4)}
.term-timestamp{color:var(--muted);font-size:.65rem;margin-right:.5rem}
.recording-indicator{display:flex;align-items:center;gap:.5rem;color:var(--accent4);font-size:.7rem}
.recording-dot{width:8px;height:8px;border-radius:50%;background:var(--accent4);animation:pulse 1s infinite}
.playback{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-top:1.5rem}
.playback-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.playback-header h3{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.playback-controls{display:flex;gap:.5rem}
.playback-speed{display:flex;align-items:center;gap:.5rem;font-size:.7rem;color:var(--muted)}
.footer{text-align:center;padding:2rem;border-top:1px solid var(--border);color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<header class="header"><h1>Terminal <span>Recorder</span></h1><div class="recording-indicator" id="recIndicator" style="display:none"><span class="recording-dot"></span><span id="recTime">00:00</span></div></header>
<main class="main">
<div class="terminal">
<div class="term-header"><span class="term-title">Live Terminal</span><div class="term-controls"><button class="btn primary" id="recordBtn">Start Recording</button><button class="btn" id="pauseBtn" disabled>Pause</button><button class="btn" id="stopBtn" disabled>Stop</button><button class="btn" id="clearBtn">Clear</button></div></div>
<div class="term-body" id="termBody"></div>
</div>
<div class="playback">
<div class="playback-header"><h3>Playback</h3><div class="playback-controls"><button class="btn" id="playBtn" disabled>Play</button><button class="btn" id="pausePlayBtn" disabled>Pause</button><button class="btn" id="stopPlayBtn" disabled>Stop</button></div></div>
<div class="playback-speed"><label>Speed: <input type="range" id="speedInput" min="0.5" max="3" step="0.1" value="1"></label><span id="speedVal">1x</span></div>
<textarea id="exportData" style="width:100%;height:150px;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:inherit;padding:.5rem;border-radius:4px;font-size:.65rem" placeholder="Recording data will appear here..." readonly></textarea>
<div style="margin-top:.5rem;display:flex;gap:.5rem"><button class="btn" id="exportBtn">Export JSON</button><button class="btn" id="importBtn">Import JSON</button><button class="btn" id="downloadBtn">Download .cast</button></div>
</div>
</main>
<footer class="footer">Nemotron 3 Ultra · 079 / 100 · Terminal Recorder</footer>
<script>
const termBody=document.getElementById('termBody');
const recIndicator=document.getElementById('recIndicator');
const recTime=document.getElementById('recTime');
const exportData=document.getElementById('exportData');
let recording=false,paused=false,startTime=0,frames=[],frameId=0,recordingTimer;
const commands=['ls -la','cd /home/user','npm install','git status','git commit -m "fix bug"','git push','docker build -t app .','kubectl apply -f deployment.yaml','terraform plan','vim config.json'];
const outputs={'ls -la':'total 48\ndrwxr-xr-x 5 user user 4096 Jan 15 10:30 .\ndrwxr-xr-x 3 root root 4096 Jan 10 08:00 ..\n-rw-r--r-- 1 user user  234 Jan 15 10:30 package.json\ndrwxr-xr-x 8 user user 4096 Jan 14 15:22 node_modules\n-rw-r--r-- 1 user user 1024 Jan 15 10:30 README.md','npm install':'added 247 packages in 12s\n45 packages are looking for funding\n  run `npm fund` for details','git status':'On branch main\nYour branch is up to date with origin/main.\n\nChanges not staged for commit:\n  modified:   src/index.js\n  modified:   package.json','git commit -m "fix bug"':'[main a1b2c3d] fix bug\n 1 file changed, 5 insertions(+), 2 deletions(-)','git push':'Enumerating objects: 5, done.\nCounting objects: 100% (5/5), done.\nWriting objects: 100% (3/3), 312 bytes | 312.00 KiB/s, done.\nTo github.com:user/repo.git\n   a1b2c3d..e4f5g6h  main -> main','docker build -t app .':'[+] Building 12.3s (12/12) FINISHED\n => [internal] load build definition from Dockerfile\n => => transferring dockerfile: 32B\n => [1/8] FROM node:18-alpine\n => [2/8] WORKDIR /app\n => [3/8] COPY package*.json ./\n => [4/8] RUN npm ci\n => [5/8] COPY . .\n => [6/8] EXPOSE 3000\n => [7/8] CMD ["node", "index.js"]','kubectl apply -f deployment.yaml':'deployment.apps/my-app created\nservice/my-app created','terraform plan':'Terraform will perform the following actions:\n  # aws_instance.web will be created\n  + resource "aws_instance" "web" {\n      + ami           = "ami-0c55b159cbfafe1f0"\n      + instance_type = "t3.micro"\n    }\nPlan: 1 to add, 0 to change, 0 to destroy.'};
function addLine(text,type='output'){
  const line=document.createElement('div');
  line.className='term-line';
  const time=new Date().toLocaleTimeString();
  if(type==='prompt'){line.innerHTML=`<span class="term-timestamp">[${time}]</span><span class="term-prompt">$ </span><span class="term-command">${escapeHtml(text)}</span>`;}
  else if(type==='error'){line.innerHTML=`<span class="term-error">${escapeHtml(text)}</span>`;}
  else{line.innerHTML=`<span class="term-output">${escapeHtml(text)}</span>`;}
  termBody.appendChild(line);
  termBody.scrollTop=termBody.scrollHeight;
  if(recording&&!paused){
    frames.push({time:Date.now()-startTime,text,type});
  }
}
function escapeHtml(str){return String(str).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
function simulateTerminal(){
  if(!recording)return;
  const cmd=commands[Math.floor(Math.random()*commands.length)];
  addLine(cmd,'prompt');
  setTimeout(()=>{
    const out=outputs[cmd]||'Command executed successfully.';
    out.split('\n').forEach(l=>addLine(l));
    setTimeout(simulateTerminal,Math.random()*3000+1000);
  },Math.random()*1000+500);
}
function startRecording(){
  recording=true;paused=false;startTime=Date.now();frames=[];
  document.getElementById('recordBtn').textContent='Recording...';
  document.getElementById('recordBtn').classList.add('recording');
  document.getElementById('recordBtn').disabled=true;
  document.getElementById('pauseBtn').disabled=false;
  document.getElementById('stopBtn').disabled=false;
  document.getElementById('playBtn').disabled=true;
  recIndicator.style.display='flex';
  recordingTimer=setInterval(()=>{const elapsed=Date.now()-startTime;recTime.textContent=formatTime(elapsed);},100);
  termBody.innerHTML='';
  addLine('Recording started...','output');
  simulateTerminal();
}
function pauseRecording(){
  paused=!paused;
  document.getElementById('pauseBtn').textContent=paused?'Resume':'Pause';
}
function stopRecording(){
  recording=false;paused=false;
  clearInterval(recordingTimer);
  document.getElementById('recordBtn').textContent='Start Recording';
  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('recordBtn').disabled=false;
  document.getElementById('pauseBtn').disabled=true;
  document.getElementById('stopBtn').disabled=true;
  document.getElementById('playBtn').disabled=frames.length===0;
  recIndicator.style.display='none';
  addLine('Recording stopped.','output');
  exportData.value=JSON.stringify({version:2,width:80,height:24,timestamp:Date.now(),frames},null,2);
}
function formatTime(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);return `${m.toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;}
function playRecording(){
  if(frames.length===0)return;
  termBody.innerHTML='';
  let i=0;
  function playNext(){
    if(i>=frames.length||!recording){document.getElementById('playBtn').disabled=false;document.getElementById('pausePlayBtn').disabled=true;document.getElementById('stopPlayBtn').disabled=true;return;}
    const f=frames[i];
    addLine(f.text,f.type);
    i++;
    const nextTime=frames[i]?frames[i].time:f.time+1000;
    const delay=(nextTime-f.time)/parseFloat(document.getElementById('speedInput').value);
    setTimeout(playNext,delay);
  }
  document.getElementById('playBtn').disabled=true;
  document.getElementById('pausePlayBtn').disabled=false;
  document.getElementById('stopPlayBtn').disabled=false;
  playNext();
}
function stopPlayback(){
  recording=true; // hack to stop playback loop
  setTimeout(()=>{recording=false;document.getElementById('playBtn').disabled=false;document.getElementById('pausePlayBtn').disabled=true;document.getElementById('stopPlayBtn').disabled=true;},100);
}
document.getElementById('recordBtn').onclick=startRecording;
document.getElementById('pauseBtn').onclick=pauseRecording;
document.getElementById('stopBtn').onclick=stopRecording;
document.getElementById('playBtn').onclick=playRecording;
document.getElementById('stopPlayBtn').onclick=stopPlayback;
document.getElementById('clearBtn').onclick=()=>{termBody.innerHTML='';};
document.getElementById('speedInput').oninput=e=>document.getElementById('speedVal').textContent=e.target.value+'x';
document.getElementById('exportBtn').onclick=()=>{navigator.clipboard.writeText(exportData.value);alert('Copied to clipboard!');};
document.getElementById('downloadBtn').onclick=()=>{const blob=new Blob([exportData.value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`terminal-${Date.now()}.cast`;a.click();};
document.getElementById('importBtn').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.cast,.json';i.onchange=e=>{const f=e.target.files[0];const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);frames=data.frames||[];exportData.value=JSON.stringify(data,null,2);document.getElementById('playBtn').disabled=frames.length===0;alert('Imported '+frames.length+' frames');}catch{alert('Invalid file');}};r.readAsText(f);};i.click();};
</script>
</body>
</html>
