<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>63 — JWT Debugger</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--fg:#e6edf3;--muted:#484f58;--accent:#58a6ff;--accent2:#3fb950;--accent3:#d29922;--accent4:#f85149;--card:#161b22;--border:#30363d}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 'JetBrains Mono','SF Mono',monospace;overflow:auto}
.layout{display:grid;grid-template-columns:1fr 1fr;height:100%}
@media (max-width:1000px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.panel{padding:1.5rem;overflow:auto}
.panel-header{margin-bottom:1.5rem}
.panel-header h2{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.panel-header h1{font-size:1.5rem;font-weight:300}
.panel-header h1 span{font-weight:700;color:var(--accent)}
.token-input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:1.5rem}
.token-input label{display:block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.token-input textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font:inherit;padding:.75rem;border-radius:4px;min-height:120px;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:.75rem}
.token-input textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)33}
.section{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:1rem}
.section h3{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
.decoded{font-size:.75rem;line-height:1.8}
.decoded .label{color:var(--muted);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}
.decoded .value{font-weight:500;margin-bottom:.5rem;word-break:break-all}
.decoded .value.expired{color:var(--accent4)}
.decoded .value.valid{color:var(--accent2)}
.key-val{display:flex;gap:1rem;margin-bottom:.5rem;flex-wrap:wrap}
.key-val .k{color:var(--muted);font-size:.7rem}
.key-val .v{color:var(--fg);font-family:'JetBrains Mono',monospace}
.verification{display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--bg);border-radius:4px}
.verify-status{font-size:1.5rem;font-weight:700}
.verify-status.valid{color:var(--accent2)}
.verify-status.invalid{color:var(--accent4)}
.verify-details{font-size:.75rem;color:var(--muted)}
.secret-input{display:flex;gap:.5rem;align-items:center}
.secret-input input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:.5rem;border-radius:4px;font:inherit}
.secret-input input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)33}
.footer{grid-column:1/-1;text-align:center;padding:2rem;border-top:1px solid var(--border);color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="layout">
<div class="panel">
<div class="panel-header"><h2>Decoder</h2><h1>JWT <span>Debugger</span></h1></div>
<div class="token-input"><label>JWT Token</label><textarea id="jwtInput" placeholder="Paste JWT token here..."></textarea></div>
<div class="section"><h3>Header</h3><div class="decoded" id="headerDecoded"></div></div>
<div class="section"><h3>Payload</h3><div class="decoded" id="payloadDecoded"></div></div>
<div class="section"><h3>Signature</h3><div class="decoded" id="sigDecoded"></div></div>
</div>
<div class="panel">
<div class="panel-header"><h2>Verification</h2></div>
<div class="section"><h3>Verify Signature</h3><div class="secret-input"><label style="font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap">Secret / Public Key</label><input type="text" id="secretInput" placeholder="HS256 secret or RS256 public key"></div><button class="btn primary" id="verifyBtn" style="margin-top:1rem;width:100%;padding:.75rem;font-size:.7rem">Verify Signature</button></div>
<div class="section"><h3>Verification Result</h3><div class="verification" id="verifyResult"><span class="verify-status" id="verifyStatus">—</span><span class="verify-details" id="verifyDetails">Enter a token and secret to verify</span></div></div>
<div class="section"><h3>Token Info</h3><div class="decoded" id="tokenInfo"></div></div>
<div class="section"><h3>Quick Actions</h3><div style="display:flex;flex-wrap:wrap;gap:.5rem"><button class="btn" id="genSample">Generate Sample</button><button class="btn" id="copyHeader">Copy Header</button><button class="btn" id="copyPayload">Copy Payload</button></div></div>
</div>
</div>
<footer class="footer">Nemotron 3 Ultra · 063 / 100 · JWT Debugger</footer>
<script>
const jwtInput=document.getElementById('jwtInput');
const headerDecoded=document.getElementById('headerDecoded');
const payloadDecoded=document.getElementById('payloadDecoded');
const sigDecoded=document.getElementById('sigDecoded');
const verifyResult=document.getElementById('verifyResult');
const verifyStatus=document.getElementById('verifyStatus');
const verifyDetails=document.getElementById('verifyDetails');
const tokenInfo=document.getElementById('tokenInfo');
const secretInput=document.getElementById('secretInput');
const sampleJwt='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkRob3JpbiBEemltYXIiLCJpYXQiOjE1MTYyMzkwMjIsImV4cCI6MTUxNjIzOTAyMn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c';
function base64UrlDecode(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/');
  const pad=str.length%4;
  if(pad)str+='='.repeat(4-pad);
  try{return decodeURIComponent(escape(atob(str)));}catch{return atob(str);}
}
function decodeJwt(token){
  const parts=token.split('.');
  if(parts.length!==3)return null;
  try{
    const header=JSON.parse(base64UrlDecode(parts[0]));
    const payload=JSON.parse(base64UrlDecode(parts[1]));
    const signature=parts[2];
    return {header,payload,signature,raw:parts};
  }catch{return null;}
}
function renderDecoded(obj,container,title){
  if(!obj){container.innerHTML='<div style="color:var(--accent4)">Invalid token</div>';return;}
  container.innerHTML=Object.entries(obj).map(([k,v])=>`<div class="key-val"><span class="k">${k}:</span><span class="v">${JSON.stringify(v)}</span></div>`).join('');
}
function updateTokenInfo(decoded){
  if(!decoded){tokenInfo.innerHTML='<div style="color:var(--accent4)">Invalid token</div>';return;}
  const payload=decoded.payload;
  const now=Math.floor(Date.now()/1000);
  const exp=payload.exp;
  const iat=payload.iat;
  const nbf=payload.nbf;
  let html='';
  if(exp){const diff=exp-now;const expired=diff<0;html+=`<div class="key-val"><span class="k">exp:</span><span class="v ${expired?'expired':'valid'}">${new Date(exp*1000).toISOString()} ${expired?'(EXPIRED)':`(in ${formatDuration(diff)})`}</span></div>`;}
  if(iat){html+=`<div class="key-val"><span class="k">iat:</span><span class="v">${new Date(iat*1000).toISOString()}</span></div>`;}
  if(nbf){html+=`<div class="key-val"><span class="k">nbf:</span><span class="v">${new Date(nbf*1000).toISOString()}</span></div>`;}
  if(payload.sub){html+=`<div class="key-val"><span class="k">sub:</span><span class="v">${payload.sub}</span></div>`;}
  if(payload.iss){html+=`<div class="key-val"><span class="k">iss:</span><span class="v">${payload.iss}</span></div>`;}
  if(payload.aud){html+=`<div class="key-val"><span class="k">aud:</span><span class="v">${Array.isArray(payload.aud)?payload.aud.join(', '):payload.aud}</span></div>`;}
  html+=`<div class="key-val"><span class="k">alg:</span><span class="v">${decoded.header.alg}</span></div>`;
  html+=`<div class="key-val"><span class="k">typ:</span><span class="v">${decoded.header.typ}</span></div>`;
  tokenInfo.innerHTML=html;
}
function formatDuration(s){
  if(s<60)return `${s}s`;
  if(s<3600)return `${Math.floor(s/60)}m ${s%60}s`;
  if(s<86400)return `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
  return `${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h`;
}
async function verifySignature(token,secret){
  const parts=token.split('.');
  const data=parts[0]+'.'+parts[1];
  const sig=parts[2];
  try{
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),{name:'HMAC',hash:'SHA-256'},false,['verify']);
    const sigBytes=Uint8Array.from(atob(sig.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
    const valid=await crypto.subtle.verify('HMAC',key,sigBytes,new TextEncoder().encode(data));
    return valid;
  }catch{return false;}
}
jwtInput.value=sampleJwt;
jwtInput.oninput=()=>{
  const decoded=decodeJwt(jwtInput.value);
  if(decoded){
    renderDecoded(decoded.header,headerDecoded,'Header');
    renderDecoded(decoded.payload,payloadDecoded,'Payload');
    sigDecoded.innerHTML=`<div class="key-val"><span class="k">Algorithm:</span><span class="v">${decoded.header.alg}</span></div><div class="key-val"><span class="k">Signature:</span><span class="v">${decoded.signature}</span></div>`;
    updateTokenInfo(decoded);
  }else{
    headerDecoded.innerHTML=payloadDecoded.innerHTML=sigDecoded.innerHTML=tokenInfo.innerHTML='<div style="color:var(--accent4)">Invalid JWT format</div>';
  }
};
document.getElementById('verifyBtn').onclick=async()=>{
  const token=jwtInput.value.trim();
  const secret=secretInput.value.trim();
  if(!token||!secret){alert('Enter token and secret');return;}
  const decoded=decodeJwt(token);
  if(!decoded||!['HS256','HS384','HS512'].includes(decoded.header.alg)){verifyStatus.textContent='N/A';verifyStatus.className='verify-status';verifyDetails.textContent='Only HMAC algorithms supported in browser';return;}
  verifyStatus.textContent='Verifying...';verifyStatus.className='verify-status';verifyDetails.textContent='';
  const valid=await verifySignature(token,secret);
  verifyStatus.textContent=valid?'VALID':'INVALID';
  verifyStatus.className='verify-status '+(valid?'valid':'invalid');
  verifyDetails.textContent=valid?'Signature verified successfully':'Signature verification failed';
};
document.getElementById('genSample').onclick=()=>{jwtInput.value=sampleJwt;jwtInput.dispatchEvent(new Event('input'));};
document.getElementById('copyHeader').onclick=()=>{const d=decodeJwt(jwtInput.value);if(d)navigator.clipboard.writeText(JSON.stringify(d.header,null,2));};
document.getElementById('copyPayload').onclick=()=>{const d=decodeJwt(jwtInput.value);if(d)navigator.clipboard.writeText(JSON.stringify(d.payload,null,2));};
jwtInput.dispatchEvent(new Event('input'));
</script>
</body>
</html>
