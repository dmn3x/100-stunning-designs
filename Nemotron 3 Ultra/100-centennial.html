<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100th Design — Nemotron 3 Ultra #100</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #030305; --fg: #f0ebe5; --accent: #00ffc8; --accent2: #ff3366; --accent3: #ffcc00; --card: #0a0c16; --border: #1a1f3a; --glow: rgba(0, 255, 200, 0.35); }
@media (prefers-color-scheme: light) { :root { --bg: #faf9f5; --fg: #1a1815; --accent: #00b88a; --accent2: #cc1a44; --accent3: #b8860b; --card: #ffffff; --border: #d0cec8; --glow: rgba(0, 184, 138, 0.3); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
@font-face { font-family: 'SpaceGrotesk'; src: local('Space Grotesk'), local('Inter'), local('system-ui'); font-display: swap; }
@font-face { font-family: 'JetBrainsMono'; src: local('JetBrains Mono'), local('Fira Code'), local('Monospace'); font-display: swap; }
body { font-family: 'SpaceGrotesk', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow: hidden; position: relative; }
#canvas { position: fixed; inset: 0; z-index: 0; display: block; }
.ui { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; pointer-events: none; }
.header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
.title-block h1 { font-family: 'SpaceGrotesk', system-ui; font-size: clamp(1.8rem, 5vw, 3.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.title-block .subtitle { font-family: 'JetBrainsMono', monospace; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); opacity: 0.8; margin-top: 0.25rem; }
.controls { display: flex; gap: 0.75rem; flex-wrap: wrap; pointer-events: auto; }
.btn { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.6rem 1.2rem; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; transition: all 0.15s ease; position: relative; overflow: hidden; }
.btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.15s ease; }
.btn:hover::before, .btn:focus::before { opacity: 1; }
.btn span { position: relative; z-index: 1; }
.btn.primary { border-color: var(--accent); }
.btn.primary:hover, .btn.primary:focus { border-color: var(--accent); box-shadow: 0 0 24px var(--glow); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
.info { font-family: 'JetBrainsMono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.4; }
.stats { display: flex; gap: 2rem; flex-wrap: wrap; }
.stat { text-align: right; }
.stat-value { font-family: 'SpaceGrotesk', system-ui; font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
.stat-label { font-family: 'JetBrainsMono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.5; margin-top: 0.15rem; }
.slider-group { pointer-events: auto; display: flex; flex-direction: column; gap: 0.3rem; min-width: 100px; }
.slider-group label { font-family: 'JetBrainsMono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); opacity: 0.6; }
.slider-group input { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--border); outline: none; }
.slider-group input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
@media (max-width: 640px) { .header { flex-direction: column; align-items: flex-start; } .footer { flex-direction: column; align-items: flex-start; } .stats { gap: 1rem; } .controls { flex-direction: column; } .slider-group { width: 100%; } }
</style>
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>
<div class="ui">
<header class="header">
<div class="title-block">
<h1>CENTENNIAL</h1>
<p class="subtitle">Design 100 of 100</p>
</div>
<div class="controls">
<div class="slider-group"><label>Complexity</label><input type="range" id="complexSlider" min="1" max="10" step="1" value="5"></div>
<div class="slider-group"><label>Harmony</label><input type="range" id="harmonySlider" min="0" max="1" step="0.1" value="0.618"></div>
<button class="btn primary" id="btnRemix" aria-label="Remix the finale"><span>Remix</span></button>
<button class="btn" id="btnPause" aria-label="Toggle animation"><span>Pause</span></button>
<button class="btn" id="btnTheme" aria-label="Toggle theme"><span>Theme: Dark</span></button>
</div>
</header>
<footer class="footer">
<p class="info" id="infoText">Click anywhere to spark • Keys: Space pause • R remix • T theme • ←→ complexity • ↑↓ harmony</p>
<div class="stats">
<div class="stat"><div class="stat-value">100</div><div class="stat-label">Designs Complete</div></div>
<div class="stat"><div class="stat-value" id="fps">60</div><div class="stat-label">FPS</div></div>
</div>
</footer>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = 0, height = 0, dpr = 1;
let particles = [], paused = false, running = true, themeDark = true;
let complexity = 5, harmony = 0.618, time = 0;
let lastTime = 0, frameCount = 0, fps = 60, fpsTime = 0, animationId = null;
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); width = canvas.width = Math.floor(window.innerWidth * dpr); height = canvas.height = Math.floor(window.innerHeight * dpr); ctx.scale(dpr, dpr); initParticles(); }
function initParticles() { particles = []; const w = width / dpr, h = height / dpr; const count = 50 + complexity * 50; for (let i = 0; i < count; i++) { const angle = (i / count) * Math.PI * 2 * harmony; const radius = Math.min(w, h) * 0.35 * (0.5 + Math.random() * 0.5); particles.push({ x: w/2 + Math.cos(angle) * radius, y: h/2 + Math.sin(angle) * radius, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, baseAngle: angle, baseRadius: radius, hue: (i / count) * 360, phase: Math.random() * Math.PI * 2, life: 1, maxLife: 1 }); } }
function spark(x, y) { for (let i = 0; i < 20; i++) { const angle = (i / 20) * Math.PI * 2; const speed = 2 + Math.random() * 3; particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, baseAngle: angle, baseRadius: 0, hue: (Math.random() * 60 + 210) % 360, phase: 0, life: 1, maxLife: 1 }); } }
function step() { const w = width / dpr, h = height / dpr; const dt = 0.016; for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; const targetX = w/2 + Math.cos(p.baseAngle + time * 0.5) * p.baseRadius * (1 + Math.sin(time + p.phase) * 0.3); const targetY = h/2 + Math.sin(p.baseAngle + time * 0.5) * p.baseRadius * (1 + Math.sin(time + p.phase) * 0.3); const dx = targetX - p.x, dy = targetY - p.y; p.vx += dx * 0.02 * complexity * 0.2; p.vy += dy * 0.02 * complexity * 0.2; p.vx *= 0.98; p.vy *= 0.98; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.life -= dt * 0.1; if (p.life <= 0) { particles.splice(i, 1); } } }
function render() { const w = width / dpr, h = height / dpr; ctx.fillStyle = themeDark ? '#030305' : '#faf9f5'; ctx.fillRect(0, 0, w, h); if (particles.length < 2) return; ctx.lineWidth = 1.5; for (let i = 0; i < particles.length; i++) { for (let j = i + 1; j < particles.length; j++) { const dx = particles[j].x - particles[i].x, dy = particles[j].y - particles[i].y; const dist = Math.sqrt(dx*dx + dy*dy); if (dist < 80) { const alpha = (1 - dist / 80) * 0.4; const hue1 = particles[i].hue, hue2 = particles[j].hue; const hue = (hue1 + hue2) / 2; ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${alpha})`; ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); } } } for (const p of particles) { const alpha = p.life; const r = 2 + Math.sin(time * 3 + p.phase) * 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fillStyle = `hsla(${p.hue}, 80%, 60%, ${alpha * 0.8})`; ctx.shadowColor = `hsla(${p.hue}, 80%, 60%, ${alpha * 0.6})`; ctx.shadowBlur = 6; ctx.fill(); ctx.shadowBlur = 0; } ctx.fillStyle = themeDark ? '#00ffc8' : '#00b88a'; ctx.font = 'bold 200px SpaceGrotesk, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = 0.03; ctx.fillText('100', w/2, h/2); ctx.globalAlpha = 1; }
function loop(t) { if (!running) { animationId = requestAnimationFrame(loop); return; } const dt = (t - lastTime) / 1000; lastTime = t; frameCount++; if (t - fpsTime > 1000) { fps = Math.round(frameCount * 1000 / (t - fpsTime)); frameCount = 0; fpsTime = t; document.getElementById('fps').textContent = fps; } if (!paused) { time += dt; } step(); render(); animationId = requestAnimationFrame(loop); }
function init() { resize(); document.getElementById('complexSlider').addEventListener('input', e => { complexity = parseInt(e.target.value); initParticles(); }); document.getElementById('harmonySlider').addEventListener('input', e => { harmony = parseFloat(e.target.value); initParticles(); }); lastTime = performance.now(); fpsTime = performance.now(); loop(lastTime); }
window.addEventListener('resize', resize);
canvas.addEventListener('click', e => { spark(e.clientX, e.clientY); });
document.getElementById('btnRemix').addEventListener('click', initParticles);
document.getElementById('btnPause').addEventListener('click', () => { paused = !paused; running = !paused; document.getElementById('btnPause').querySelector('span').textContent = paused ? 'Resume' : 'Pause'; if (running) { lastTime = performance.now(); loop(lastTime); } });
document.getElementById('btnTheme').addEventListener('click', () => { themeDark = !themeDark; document.getElementById('btnTheme').querySelector('span').textContent = themeDark ? 'Theme: Dark' : 'Theme: Light'; });
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); paused = !paused; running = !paused; document.getElementById('btnPause').querySelector('span').textContent = paused ? 'Resume' : 'Pause'; if (running) { lastTime = performance.now(); loop(lastTime); } } else if (e.key === 'r' || e.key === 'R') initParticles(); else if (e.key === 't' || e.key === 'T') { themeDark = !themeDark; document.getElementById('btnTheme').querySelector('span').textContent = themeDark ? 'Theme: Dark' : 'Theme: Light'; } else if (e.key === 'ArrowLeft') { complexity = Math.max(1, complexity - 1); document.getElementById('complexSlider').value = complexity; initParticles(); } else if (e.key === 'ArrowRight') { complexity = Math.min(10, complexity + 1); document.getElementById('complexSlider').value = complexity; initParticles(); } else if (e.key === 'ArrowUp') { harmony = Math.min(1, harmony + 0.1); document.getElementById('harmonySlider').value = harmony.toFixed(1); initParticles(); } else if (e.key === 'ArrowDown') { harmony = Math.max(0, harmony - 0.1); document.getElementById('harmonySlider').value = harmony.toFixed(1); initParticles(); } });
init();
</script>
</body>
</html>
