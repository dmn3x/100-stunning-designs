<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 — Neon Sign Workshop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--fg:#f0f0f5;--muted:#2a2a3a;--accent:#ff0040;--accent2:#0080ff}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'Space Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.08em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.controls{bottom:1.5rem;left:1.5rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.ctrl{display:flex;align-items:center;gap:.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctrl input[type=range]{width:100px;accent-color:var(--accent)}
.ctrl input[type=color]{width:30px;height:30px;border:none;border-radius:3px;cursor:pointer}
.ctrl select{background:transparent;border:1px solid var(--muted);color:var(--fg);padding:.2rem .5rem;font:inherit;font-size:.6rem}
.stat{color:var(--accent);font-weight:500;font-size:.75rem}
.mode{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;text-align:right}
.mode kbd{background:rgba(255,255,255,0.06);padding:.15rem .4rem;border-radius:3px;font-family:inherit;font-size:.75em;margin:0 .2rem}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .controls{bottom:1rem;left:1rem;gap:.5rem}
  .ctrl input[type=range]{width:70px}
  .mode{bottom:1rem;right:1rem;font-size:.55rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Neon Sign Workshop</div>
<div class="ui subtitle">path drawing & gas tube simulation</div>
<div class="ui controls">
<label class="ctrl">Color <input type="color" id="tubeColor" value="#ff0040"></label>
<label class="ctrl">Flicker <input type="range" id="flicker" min="0" max="1" step="0.01" value="0.15"><span class="stat" id="flickerVal">0.15</span></label>
<label class="ctrl">Glow <input type="range" id="glow" min="0" max="50" step="1" value="20"><span class="stat" id="glowVal">20</span></label>
<label class="ctrl"><select id="tool"><option value="draw">Draw</option><option value="move">Move Point</option><option value="delete">Delete Point</option><option value="clear">Clear All</option></select></label>
<label class="ctrl"><input type="checkbox" id="animate" checked> Animate</label>
</div>
<div class="ui mode">click to add points · drag to move · <kbd>Space</kbd> animate</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const paths=[],currentPath=[];
let tool='draw',flicker=0.15,glow=20,animate=true,time=0,frame=0;
let mouse={x:0,y:0,down:false},dragIdx=-1,dragPath=-1;
const gasColors={'#ff0040':[255,0,64],'#0080ff':[0,128,255],'#ff1493':[255,20,147],'#00ffff':[0,255,255],'#ffff00':[255,255,0],'#ff8c00':[255,140,0]};
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
}
document.getElementById('tubeColor').addEventListener('input',e=>{});
document.getElementById('flicker').addEventListener('input',e=>{flicker=+e.target.value;document.getElementById('flickerVal').textContent=flicker.toFixed(2);});
document.getElementById('glow').addEventListener('input',e=>{glow=+e.target.value;document.getElementById('glowVal').textContent=glow;});
document.getElementById('tool').addEventListener('change',e=>{tool=e.target.value;if(tool==='clear'){paths.length=0;currentPath.length=0;tool='draw';document.getElementById('tool').value='draw';}});
document.getElementById('animate').addEventListener('change',e=>animate=e.target.checked);
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('mousedown',e=>{
  mouse.down=true;
  if(tool==='draw'){
    currentPath.push({x:e.clientX,y:e.clientY,color:document.getElementById('tubeColor').value});
  }else if(tool==='move'){
    let minDist=Infinity;
    for(let pi=0;pi<paths.length;pi++){
      for(let i=0;i<paths[pi].points.length;i++){
        const p=paths[pi].points[i];
        const d=Math.hypot(p.x-e.clientX,p.y-e.clientY);
        if(d<minDist&&d<15){minDist=d;dragIdx=i;dragPath=pi;}
      }
    }
  }else if(tool==='delete'){
    for(let pi=paths.length-1;pi>=0;pi--){
      for(let i=paths[pi].points.length-1;i>=0;i--){
        const p=paths[pi].points[i];
        if(Math.hypot(p.x-e.clientX,p.y-e.clientY)<10){
          paths[pi].points.splice(i,1);
          if(paths[pi].points.length<2)paths.splice(pi,1);
          return;
        }
      }
    }
  }
});
window.addEventListener('mouseup',()=>{mouse.down=false;dragIdx=-1;dragPath=-1;if(currentPath.length>1){paths.push({points:[...currentPath],color:currentPath[0].color});currentPath.length=0;}});
window.addEventListener('mousemove',e=>{
  if(mouse.down&&dragIdx>=0&&dragPath>=0){
    paths[dragPath].points[dragIdx].x=e.clientX;
    paths[dragPath].points[dragIdx].y=e.clientY;
  }
});
window.addEventListener('touchstart',e=>{const t=e.touches[0];mouse.down=true;mouse.x=t.clientX;mouse.y=t.clientY;if(tool==='draw')currentPath.push({x:t.clientX,y:t.clientY,color:document.getElementById('tubeColor').value});},{passive:false});
window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;},{passive:false});
window.addEventListener('touchend',()=>{mouse.down=false;if(currentPath.length>1){paths.push({points:[...currentPath],color:currentPath[0].color});currentPath.length=0;}});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){animate=!animate;document.getElementById('animate').checked=animate;e.preventDefault();}
  if(e.code==='Escape'){currentPath.length=0;}
});
function drawTube(path){
  if(path.points.length<2)return;
  const [r,g,b]=gasColors[path.color]||[255,0,64];
  const flick=animate?(Math.random()-0.5)*flicker*2:0;
  const baseAlpha=0.7+flick;
  const segments=[];
  for(let i=0;i<path.points.length-1;i++){
    const p1=path.points[i],p2=path.points[i+1];
    segments.push({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y});
  }
  for(const s of segments){
    const dx=s.x2-s.x1,dy=s.y2-s.y1,dist=Math.hypot(dx,dy);
    if(dist<1)continue;
    const ux=dx/dist,uy=dy/dist;
    const px=-uy,py=ux;
    for(let pass=0;pass<3;pass++){
      const spread=(pass-1)*3;
      ctx.beginPath();
      ctx.moveTo(s.x1+px*spread,s.y1+py*spread);
      ctx.lineTo(s.x2+px*spread,s.y2+py*spread);
      const alpha=baseAlpha*(1-pass*0.25);
      const width=4-pass*1.2;
      ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth=width;
      ctx.lineCap='round';
      ctx.shadowColor=`rgba(${r},${g},${b},${alpha*0.8})`;
      ctx.shadowBlur=glow*(1-pass*0.2);
      ctx.stroke();
    }
  }
  ctx.shadowBlur=0;
  for(const p of path.points){
    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${baseAlpha})`;
    ctx.fill();
  }
}
function tick(){
  frame++;
  if(animate)time+=0.05;
  ctx.fillStyle='rgba(10,10,18,0.15)';
  ctx.fillRect(0,0,W/DPR,H/DPR);
  for(const p of paths)drawTube(p);
  if(currentPath.length>1){
    const temp={points:currentPath,color:currentPath[0].color};
    drawTube(temp);
  }else if(currentPath.length===1){
    const p=currentPath[0];
    const [r,g,b]=gasColors[p.color]||[255,0,64];
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},0.8)`;
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
resize();
tick();
</script>
</body>
</html>
