<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 — Chromatic Drift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050508;--fg:#f0f0f5;--muted:#404050;--accent:#ff3366;--accent2:#00ffcc}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'DM Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.08em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.info{bottom:1.5rem;left:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;line-height:1.8}
.hint{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.6;text-align:right}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .info{bottom:1rem;left:1rem;font-size:.55rem}
  .hint{bottom:1rem;right:1rem;font-size:.55rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Chromatic Drift</div>
<div class="ui subtitle">differential growth field</div>
<div class="ui info">
Particles: <span id="pc">0</span><br>
Iteration: <span id="iter">0</span><br>
Mode: <span id="mode">DIFFUSION</span>
</div>
<div class="ui hint">click to seed growth<br>drag to guide flow<br><kbd>1-4</kbd> modes · <kbd>Space</kbd> reset</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const MAX=4000;
let particles=[],frame=0,mode=0;
const modes=['DIFFUSION','REACTION','ATTRACTION','CURL'];
let mouse={x:0,y:0,down:false};
const palette=[[255,51,102],[0,255,204],[255,204,0],[102,153,255],[204,51,255],[51,255,102]];
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
}
class P{
  constructor(x,y,parent=null){
    this.x=x;this.y=y;
    this.vx=(Math.random()-0.5)*0.6;this.vy=(Math.random()-0.5)*0.6;
    this.life=1;this.decay=0.0003+Math.random()*0.0004;
    this.size=1.2+Math.random()*1.5;
    this.color=palette[Math.floor(Math.random()*palette.length)];
    this.trail=parent?[{x:parent.x,y:parent.y}]:[];
    this.maxTrail=15;
    this.age=0;
  }
  update(){
    this.age++;
    this.trail.unshift({x:this.x,y:this.y});
    if(this.trail.length>this.maxTrail)this.trail.pop();
    const dx=mouse.x-this.x,dy=mouse.y-this.y,dist=Math.hypot(dx,dy)||1;
    if(mode===2&&mouse.down&&dist<180){
      this.vx+=dx/dist*0.03;this.vy+=dy/dist*0.03;
    }
    if(mode===3){
      const angle=Math.atan2(dy,dx)+Math.PI/2;
      this.vx+=Math.cos(angle)*0.008;this.vy+=Math.sin(angle)*0.008;
    }
    if(mode===1){
      const neighbors=particles.filter(p=>p!==this&&Math.hypot(p.x-this.x,p.y-this.y)<40).length;
      if(neighbors>3)this.life-=0.002;
      else if(neighbors<2)this.life-=0.001;
    }
    this.vx*=0.99;this.vy*=0.99;
    this.x+=this.vx;this.y+=this.vy;
    this.life-=this.decay;
    if(this.x<0||this.x>W/DPR||this.y<0||this.y>H/DPR){
      this.x=Math.max(0,Math.min(W/DPR,this.x));
      this.y=Math.max(0,Math.min(H/DPR,this.y));
      this.vx*=-0.3;this.vy*=-0.3;
    }
  }
  draw(){
    if(this.trail.length<2)return;
    const [r,g,b]=this.color;
    ctx.beginPath();
    ctx.moveTo(this.trail[0].x,this.trail[0].y);
    for(let i=1;i<this.trail.length;i++){
      const t=this.trail[i],a=(1-i/this.trail.length)*this.life*0.5;
      ctx.lineTo(t.x,t.y);
      ctx.strokeStyle=`rgba(${r},${g},${b},${a})`;
      ctx.lineWidth=this.size*(1-i/this.trail.length)*0.6;
      ctx.stroke();
      ctx.beginPath();ctx.moveTo(t.x,t.y);
    }
  }
}
function seed(x,y,count=1){
  for(let i=0;i<count&&particles.length<MAX;i++){
    particles.push(new P(x+ (Math.random()-0.5)*10,y+ (Math.random()-0.5)*10));
  }
}
function split(p){
  if(particles.length>=MAX)return;
  const angle=Math.random()*Math.PI*2;
  const child=new P(p.x,p.y,p);
  child.vx=Math.cos(angle)*0.8;child.vy=Math.sin(angle)*0.8;
  child.size=p.size*0.9;child.decay=p.decay*1.1;
  child.color=palette[(palette.indexOf(p.color)+1+Math.floor(Math.random()*2))%palette.length];
  particles.push(child);
}
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('mousedown',e=>{mouse.down=true;seed(e.clientX,e.clientY,5);});
window.addEventListener('mouseup',()=>mouse.down=false);
window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;if(mouse.down)seed(t.clientX,t.clientY,1);},{passive:false});
window.addEventListener('touchstart',e=>{mouse.down=true;const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;seed(t.clientX,t.clientY,5);},{passive:false});
window.addEventListener('touchend',()=>mouse.down=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){particles=[];frame=0;e.preventDefault();}
  if(e.code==='Digit1'){mode=0;document.getElementById('mode').textContent=modes[0];}
  if(e.code==='Digit2'){mode=1;document.getElementById('mode').textContent=modes[1];}
  if(e.code==='Digit3'){mode=2;document.getElementById('mode').textContent=modes[2];}
  if(e.code==='Digit4'){mode=3;document.getElementById('mode').textContent=modes[3];}
});
function tick(){
  frame++;
  ctx.fillStyle='rgba(5,5,8,0.12)';
  ctx.fillRect(0,0,W/DPR,H/DPR);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.update();p.draw();
    if(mode===0&&p.age%40===0&&Math.random()<0.02)split(p);
    if(p.life<=0)particles.splice(i,1);
  }
  if(particles.length<50&&Math.random()<0.01)seed(Math.random()*W/DPR,Math.random()*H/DPR,1);
  document.getElementById('pc').textContent=particles.length;
  document.getElementById('iter').textContent=frame;
  requestAnimationFrame(tick);
}
resize();
for(let i=0;i<30;i++)seed(Math.random()*W/DPR,Math.random()*H/DPR,1);
tick();
</script>
</body>
</html>
