<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>43 — Kinetic Poetry Canvas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050508;--fg:#f0f0f5;--muted:#2a2a3a;--accent:#00ffaa;--accent2:#ff3366;--accent3:#ffcc00}
html,body{height:100%;background:var(--bg);color:var(--fg);font:16px/1.6 'DM Serif Display',Georgia,serif;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:1}
.ui{position:fixed;z-index:10;padding:1rem;pointer-events:none}
.ui.top-left{top:0;left:0;display:flex;flex-direction:column;gap:.5rem}
.ui.top-right{top:0;right:0;text-align:right}
.ui.bottom{bottom:0;left:0;right:0;display:flex;justify-content:center;gap:1rem;flex-wrap:wrap}
.ui *{pointer-events:auto}
.label{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
select,input,button{background:rgba(10,10,15,0.9);border:1px solid var(--muted);color:var(--fg);font:inherit;padding:.4rem .75rem;border-radius:4px;font-size:.7rem}
select:focus,input:focus{border-color:var(--accent);outline:none}
button{cursor:pointer;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:hover:not(.primary){border-color:var(--accent);color:var(--accent)}
.slider{width:120px;accent-color:var(--accent)}
.poem-display{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;pointer-events:none;max-width:90vw}
.poem-line{font-size:clamp(1.5rem,4vw,3rem);line-height:1.8;white-space:pre-wrap;transition:all .5s cubic-bezier(.16,1,.3,1)}
.poem-line span{display:inline-block;transition:all .3s}
.poem-line .noun{color:var(--accent)}
.poem-line .verb{color:var(--accent2)}
.poem-line .adj{color:var(--accent3)}
.controls-panel{background:rgba(10,10,15,0.95);border:1px solid var(--muted);border-radius:8px;padding:1rem;min-width:200px}
@media (max-width:600px){.ui{padding:.5rem}.controls-panel{min-width:auto}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui top-left">
<div class="controls-panel">
<div class="label">Structure</div>
<select id="structure"><option value="haiku">Haiku (5-7-5)</option><option value="tanka">Tanka (5-7-5-7-7)</option><option value="sonnet">Sonnet (14 lines)</option><option value="free">Free Verse</option><option value="acrostic">Acrostic</option></select>
<div class="label" style="margin-top:.75rem">Theme</div>
<select id="theme"><option value="nature">Nature</option><option value="tech">Technology</option><option value="love">Love & Loss</option><option value="philosophy">Philosophy</option><option value="cosmic">Cosmic</option></select>
<div class="label" style="margin-top:.75rem">Complexity <span id="complexityVal">5</span></div>
<input type="range" id="complexity" class="slider" min="1" max="10" value="5">
</div>
</div>
<div class="ui top-right">
<div class="controls-panel" style="text-align:right">
<div class="label">Visual Mode</div>
<select id="visualMode"><option value="particles">Particles</option><option value="waves">Wave Field</option><option value="flow">Flow Field</option><option value="geometry">Sacred Geometry</option><option value="typography">Typography</option></select>
<div class="label" style="margin-top:.75rem">Color Scheme</div>
<select id="colorScheme"><option value="theme">Theme-Based</option><option value="mono">Monochrome</option><option value="complement">Complementary</option><option value="triadic">Triadic</option><option value="rainbow">Rainbow</option></select>
</div>
</div>
<div class="ui bottom">
<div class="controls-panel" style="display:flex;gap:.5rem;align-items:center">
<button class="primary" id="generate">Generate Poem</button>
<button id="pause">Pause Animation</button>
<button id="save">Save as Image</button>
</div>
<div class="controls-panel" style="display:flex;gap:1rem;align-items:center">
<label><input type="checkbox" id="showPos" checked> Color by POS</label>
<label><input type="checkbox" id="showGrid"> Show Grid</label>
</div>
</div>
<div class="poem-display" id="poemDisplay"></div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const words={
  nature:{noun:['mountain','river','forest','meadow','ocean','sky','cloud','stone','leaf','root','seed','bloom','thorn','petal','branch','nest','horizon','dawn','dusk','tide'],verb:['flows','blooms','grows','whispers','sleeps','awakens','dances','falls','rises','breathes','sings','dreams','waits','endures','transforms'],adj:['ancient','wild','gentle','fierce','silent','vibrant','patient','eternal','fragile','resilient','luminous','shadowed','verdant','crystalline','sacred'],adv:['slowly','swiftly','quietly','boldly','patiently','eternally','gently','fiercely','softly','wildly']},
  tech:{noun:['circuit','algorithm','signal','network','node','packet','latency','bandwidth','server','protocol','cache','kernel','process','thread','memory','register','bus','clock','gate','bit'],verb:['processes','compiles','executes','optimizes','synchronizes','transmits','encrypts','decrypts','allocates','deallocates','iterates','recurses','converges','diverges','scales'],adj:['distributed','parallel','asynchronous','deterministic','recursive','modular','scalable','latent','concurrent','atomic','idempotent','stateless','virtual','logical','physical'],adv:['recursively','atomically','concurrently','deterministically','asynchronously','lazily','eagerly','optimistically','pessimistically','idempotently']},
  love:{noun:['heart','soul','embrace','whisper','promise','memory','longing','absence','presence','touch','gaze','silence','distance','reunion','farewell','eternity','moment','breath','pulse','rhythm'],verb:['loves','aches','yearns','remembers','forgets','waits','finds','loses','holds','releases','breaks','heals','burns','freezes','transcends'],adj:['tender','fierce','eternal','fleeting','gentle','consuming','patient','restless','faithful','wandering','broken','whole','lost','found','infinite'],adv:['deeply','softly','fiercely','patiently','eternally','tenderly','desperately','hopefully','faithfully','completely']},
  philosophy:{noun:['truth','meaning','existence','consciousness','void','essence','being','becoming','time','space','causality','freedom','necessity','chance','order','chaos','self','other','knowledge','wisdom'],verb:['questions','doubts','affirms','denies','seeks','finds','contemplates','transcends','embraces','rejects','synthesizes','dialects','unfolds','reveals','conceals'],adj:['profound','elusive','self-evident','paradoxical','necessary','contingent','absolute','relative','finite','infinite','implicit','explicit','a priori','a posteriori','transcendent'],adv:['necessarily','contingently','dialectically','phenomenologically','ontologically','epistemologically','existentially','teleologically','hermeneutically','apophatically']},
  cosmic:{noun:['star','galaxy','nebula','quasar','pulsar','black hole','supernova','cosmos','universe','void','light year','gravity','spacetime','singularity','event horizon','dark matter','dark energy','cosmic dust','radiation','entropy'],verb:['expands','collapses','rotates','orbits','fuses','radiates','gravitates','warps','bends','accelerates','cools','ignites','explodes','implodes','transcends'],adj:['infinite','vast','ancient','nascent','luminous','dark','curved','flat','expanding','contracting','entropic','ordered','chaotic','fine-tuned','inevitable'],adv:['infinitely','eternally','relentlessly','inexorably','gracefully','violently','silently','thunderously','patiently','urgently']}
};
const structures={haiku:[5,7,5],tanka:[5,7,5,7,7],sonnet:Array(14).fill(10),free:null,acrostic:null};
let currentStructure='haiku',currentTheme='nature',complexity=5;
let visualMode='particles',colorScheme='theme';
let poemLines=[],poemPOS=[],poemSyllables=[];
let particles=[],waves=[],flowField=[],geometry=[],typoElements=[];
let animationId=0,paused=false,time=0;
function resize(){W=canvas.width=window.innerWidth*DPR;H=canvas.height=window.innerHeight*DPR;canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';initSystems();}
function initSystems(){
  particles=[];for(let i=0;i<200;i++)particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,life:Math.random(),hue:Math.random()*360,size:Math.random()*3+1});
  waves=[];for(let i=0;i<5;i++)waves.push({amplitude:50+Math.random()*100,frequency:0.005+Math.random()*0.01,phase:Math.random()*Math.PI*2,speed:0.001+Math.random()*0.002});
  flowField=[];const cols=Math.floor(W/40),rows=Math.floor(H/40);for(let y=0;y<rows;y++){for(let x=0;x<cols;x++){flowField.push({x:x*40+20,y:y*40+20,angle:Math.random()*Math.PI*2,strength:Math.random()});}}
  geometry=[];for(let i=0;i<12;i++)geometry.push({x:W/2,y:H/2,radius:50+i*30,sides:3+Math.floor(Math.random()*6),rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.002,hue:Math.random()*360});
  typoElements=[];poemLines.forEach((line,li)=>line.forEach((word,wi)=>{typoElements.push({word,pos:poemPOS[li][wi],x:W/2+(wi-line.length/2)*80,y:H/2+(li-poemLines.length/2)*60,vx:0,vy:0,targetX:W/2+(wi-line.length/2)*80,targetY:H/2+(li-poemLines.length/2)*60});}));
}
function countSyllables(w){w=w.toLowerCase();if(w.length<=3)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');const m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1;}
function getWords(t,pos,c){const p=words[t][pos]||[];const r=[];for(let i=0;i<c;i++)r.push(p[Math.floor(Math.random()*p.length)]);return r;}
function generateLine(target,t,avail){
  const line=[],pos=[],syl=[];let rem=target;
  while(rem>0){
    const p=Math.random()<0.4?'noun':Math.random()<0.5?'verb':Math.random()<0.7?'adj':'adv';
    const w=getWords(t,p,1)[0];const s=countSyllables(w);
    if(s<=rem||rem===target){line.push(w);pos.push(p);syl.push(s);rem-=s;}
    if(line.length>target)break;
  }
  while(rem>0&&line.length>0){const w=getWords(t,'adj',1)[0];const s=countSyllables(w);if(s<=rem){line.push(w);pos.push('adj');syl.push(s);rem-=s;}else break;}
  return {words:line,pos,syllables:syl};
}
function generatePoem(){
  const struct=structures[currentStructure];const t=currentTheme;
  poemLines=[];poemPOS=[];poemSyllables=[];
  if(currentStructure==='free'){
    const lines=3+Math.floor(Math.random()*5);
    for(let i=0;i<lines;i++){const syl=5+Math.floor(Math.random()*8);const l=generateLine(syl,t);poemLines.push(l.words);poemPOS.push(l.pos);poemSyllables.push(l.syllables);}
  }else if(currentStructure==='acrostic'){
    const word='NEMOTRON';
    for(let i=0;i<word.length;i++){const syl=5+Math.floor(Math.random()*5);const l=generateLine(syl,t);if(l.words.length>0)l.words[0]=word[i]+l.words[0].slice(1);poemLines.push(l.words);poemPOS.push(l.pos);poemSyllables.push(l.syllables);}
  }else{
    for(const syl of struct){const l=generateLine(syl,t);poemLines.push(l.words);poemPOS.push(l.pos);poemSyllables.push(l.syllables);}
  }
  renderPoemDisplay();
  initSystems();
}
function renderPoemDisplay(){
  const disp=document.getElementById('poemDisplay');
  disp.innerHTML=poemLines.map((line,li)=>`<div class="poem-line">${line.map((w,wi)=>`<span class="${poemPOS[li][wi]}">${w}</span>`).join(' ')}</div>`).join('');
}
function getColor(pos,scheme){
  const base={noun:140,verb:350,adj:50,adv:260,other:0};
  let h=base[pos]||0;
  if(scheme==='mono')h=200;
  else if(scheme==='complement')h=(h+180)%360;
  else if(scheme==='triadic')h=(h+120)%360;
  else if(scheme==='rainbow')h=(time*30+pos*60)%360;
  return `hsl(${h},80%,60%)`;
}
function drawParticles(){
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=colorScheme==='theme'?getColor('noun','theme'):getColor('noun',colorScheme);
    ctx.globalAlpha=0.3+0.5*p.life;ctx.fill();ctx.globalAlpha=1;
  });
}
function drawWaves(){
  ctx.strokeStyle=getColor('noun',colorScheme);ctx.lineWidth=2;ctx.lineCap='round';
  waves.forEach((w,wi)=>{
    ctx.beginPath();ctx.globalAlpha=0.3;
    for(let x=0;x<W;x+=2){const y=H/2+Math.sin(x*w.frequency+w.phase+time*w.speed)*w.amplitude*(1+wi*0.3);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
    ctx.stroke();w.phase+=w.speed;
  });ctx.globalAlpha=1;
}
function drawFlow(){
  ctx.strokeStyle=getColor('noun',colorScheme);ctx.lineWidth=1;ctx.globalAlpha=0.4;
  flowField.forEach(f=>{
    f.angle+=Math.sin(time*0.001+f.x*0.001+f.y*0.001)*0.1;
    const nx=f.x+Math.cos(f.angle)*f.strength*20;
    const ny=f.y+Math.sin(f.angle)*f.strength*20;
    ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(nx,ny);ctx.stroke();
  });ctx.globalAlpha=1;
}
function drawGeometry(){
  geometry.forEach(g=>{
    g.rotation+=g.rotSpeed;
    ctx.strokeStyle=`hsl(${g.hue+time*10},80%,60%)`;ctx.lineWidth=1.5;ctx.globalAlpha=0.4;
    ctx.beginPath();
    for(let i=0;i<=g.sides;i++){const a=g.rotation+i*Math.PI*2/g.sides;const x=g.x+Math.cos(a)*g.radius;const y=g.y+Math.sin(a)*g.radius;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.closePath();ctx.stroke();ctx.globalAlpha=1;
  });
}
function drawTypography(){
  typoElements.forEach(t=>{
    const dx=t.targetX-t.x,dy=t.targetY-t.y;
    t.vx+=dx*0.01;t.vy+=dy*0.01;
    t.vx*=0.92;t.vy*=0.92;
    t.x+=t.vx;t.y+=t.vy;
    ctx.font='24px "DM Serif Display"';ctx.fillStyle=getColor(t.pos,colorScheme);
    ctx.textAlign='center';ctx.fillText(t.word,t.x,t.y);
  });
}
function animate(){
  if(paused){animationId=requestAnimationFrame(animate);return;}
  ctx.clearRect(0,0,W,H);
  time+=0.016;
  switch(visualMode){
    case 'particles':drawParticles();break;
    case 'waves':drawWaves();break;
    case 'flow':drawFlow();break;
    case 'geometry':drawGeometry();break;
    case 'typography':drawTypography();break;
  }
  animationId=requestAnimationFrame(animate);
}
document.getElementById('structure').onchange=e=>{currentStructure=e.target.value;generatePoem();};
document.getElementById('theme').onchange=e=>{currentTheme=e.target.value;generatePoem();};
document.getElementById('complexity').oninput=e=>{complexity=+e.target.value;document.getElementById('complexityVal').textContent=complexity;generatePoem();};
document.getElementById('visualMode').onchange=e=>visualMode=e.target.value;
document.getElementById('colorScheme').onchange=e=>colorScheme=e.target.value;
document.getElementById('generate').onclick=generatePoem;
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause Animation';};
document.getElementById('save').onclick=()=>{const link=document.createElement('a');link.download='kinetic-poetry.png';link.href=canvas.toDataURL();link.click();};
document.getElementById('showPos').onchange=renderPoemDisplay;
window.addEventListener('resize',resize);
resize();generatePoem();animate();
</script>
</body>
</html>
