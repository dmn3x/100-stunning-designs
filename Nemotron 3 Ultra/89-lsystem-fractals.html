<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-System Fractals — Nemotron 3 Ultra #89</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #030305; --fg: #f0ebe5; --accent: #00ffc8; --accent2: #ff3366; --accent3: #ffcc00; --card: #0a0c16; --border: #1a1f3a; --glow: rgba(0, 255, 200, 0.35); }
@media (prefers-color-scheme: light) { :root { --bg: #faf9f5; --fg: #1a1815; --accent: #00b88a; --accent2: #cc1a44; --accent3: #b8860b; --card: #ffffff; --border: #d0cec8; --glow: rgba(0, 184, 138, 0.3); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
@font-face { font-family: 'SpaceGrotesk'; src: local('Space Grotesk'), local('Inter'), local('system-ui'); font-display: swap; }
@font-face { font-family: 'JetBrainsMono'; src: local('JetBrains Mono'), local('Fira Code'), local('Monospace'); font-display: swap; }
body { font-family: 'SpaceGrotesk', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow: hidden; position: relative; }
#canvas { position: fixed; inset: 0; z-index: 0; display: block; }
.ui { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; pointer-events: none; }
.header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
.title-block h1 { font-family: 'SpaceGrotesk', system-ui; font-size: clamp(1.8rem, 5vw, 3.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.title-block .subtitle { font-family: 'JetBrainsMono', monospace; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); opacity: 0.8; margin-top: 0.25rem; }
.controls { display: flex; gap: 0.75rem; flex-wrap: wrap; pointer-events: auto; }
.btn { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.6rem 1.2rem; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; transition: all 0.15s ease; position: relative; overflow: hidden; }
.btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.15s ease; }
.btn:hover::before, .btn:focus::before { opacity: 1; }
.btn span { position: relative; z-index: 1; }
.btn.primary { border-color: var(--accent); }
.btn.primary:hover, .btn.primary:focus { border-color: var(--accent); box-shadow: 0 0 24px var(--glow); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
.info { font-family: 'JetBrainsMono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.4; }
.stats { display: flex; gap: 2rem; flex-wrap: wrap; }
.stat { text-align: right; }
.stat-value { font-family: 'SpaceGrotesk', system-ui; font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
.stat-label { font-family: 'JetBrainsMono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.5; margin-top: 0.15rem; }
.lsys-selector { pointer-events: auto; }
.lsys-selector select { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.5rem 1rem; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; appearance: none; }
.lsys-selector select:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.slider-group { pointer-events: auto; display: flex; flex-direction: column; gap: 0.3rem; min-width: 100px; }
.slider-group label { font-family: 'JetBrainsMono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); opacity: 0.6; }
.slider-group input { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--border); outline: none; }
.slider-group input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
@media (max-width: 640px) { .header { flex-direction: column; align-items: flex-start; } .footer { flex-direction: column; align-items: flex-start; } .stats { gap: 1rem; } }
</style>
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>
<div class="ui">
<header class="header">
<div class="title-block">
<h1>L-SYSTEM FRACTALS</h1>
<p class="subtitle">Recursive Growth Patterns</p>
</div>
<div class="controls">
<div class="lsys-selector"><select id="lsysSelect" aria-label="Select L-system"></select></div>
<div class="slider-group"><label>Iterations</label><input type="range" id="iterSlider" min="1" max="8" step="1" value="5"></div>
<div class="slider-group"><label>Angle</label><input type="range" id="angleSlider" min="10" max="120" step="1" value="25"></div>
<div class="slider-group"><label>Length</label><input type="range" id="lenSlider" min="1" max="20" step="0.5" value="4"></div>
<button class="btn primary" id="btnAnimate" aria-label="Animate growth"><span>Animate</span></button>
<button class="btn" id="btnColor" aria-label="Toggle color"><span>Color: Depth</span></button>
</div>
</header>
<footer class="footer">
<p class="info" id="infoText">Drag to pan • Scroll to zoom • Keys: A animate • C color • 1-7 systems • ↑↓ iterations</p>
<div class="stats">
<div class="stat"><div class="stat-value" id="segmentCount">0</div><div class="stat-label">Segments</div></div>
<div class="stat"><div class="stat-value" id="iterCount">5</div><div class="stat-label">Iterations</div></div>
<div class="stat"><div class="stat-value" id="fps">60</div><div class="stat-label">FPS</div></div>
</div>
</footer>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = 0, height = 0, dpr = 1;
const systems = [
    { name: 'Tree', axiom: 'F', rules: { 'F': 'FF+[+F-F-F]-[-F+F+F]' }, angle: 25, startAngle: -90 },
    { name: 'Fern', axiom: 'F', rules: { 'F': 'FF-[-F+F+F]+[+F-F-F]' }, angle: 22.5, startAngle: -90 },
    { name: 'Bush', axiom: 'F', rules: { 'F': 'FF+[+F-F-F]-[-F+F+F]' }, angle: 25.7, startAngle: -90 },
    { name: 'Dragon', axiom: 'FX', rules: { 'X': 'X+YF+', 'Y': '-FX-Y' }, angle: 90, startAngle: 0 },
    { name: 'Sierpinski', axiom: 'F-G-G', rules: { 'F': 'F-G+F+G-F', 'G': 'GG' }, angle: 120, startAngle: 0 },
    { name: 'Koch', axiom: 'F++F++F', rules: { 'F': 'F-F++F-F' }, angle: 60, startAngle: 0 },
    { name: 'Plant', axiom: 'F', rules: { 'F': 'F[+F]F[-F]F' }, angle: 25.7, startAngle: -90 },
];
let currentSystem = 0, iterations = 5, angle = 25, length = 4, colorMode = 0, animating = false, animProgress = 0, animTarget = 5;
let lastTime = 0, frameCount = 0, fps = 60, fpsTime = 0, animationId = null, running = true;
const camera = { x: 0, y: 0, scale: 1, targetX: 0, targetY: 0, targetScale: 1 };
const mouse = { down: false, lastX: 0, lastY: 0 };
const select = document.getElementById('lsysSelect');
systems.forEach((s, i) => { const opt = document.createElement('option'); opt.value = i; opt.textContent = `${i+1} ${s.name}`; select.appendChild(opt); });
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); width = canvas.width = Math.floor(window.innerWidth * dpr); height = canvas.height = Math.floor(window.innerHeight * dpr); ctx.scale(dpr, dpr); camera.targetX = width / dpr / 2; camera.targetY = height / dpr / 2; }
function generate(axiom, rules, iter) { let result = axiom; for (let i = 0; i < iter; i++) { let next = ''; for (const ch of result) next += rules[ch] || ch; result = next; } return result; }
function drawLSystem(instructions, maxSegments = Infinity) { let x = width / dpr / 2, y = height / dpr * 0.9; let currentAngle = systems[currentSystem].startAngle; const stack = []; let segments = 0; const stepLen = length; const angleRad = angle * Math.PI / 180; ctx.strokeStyle = '#00ffc8'; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.beginPath(); for (const ch of instructions) { if (segments >= maxSegments) break; if (ch === 'F' || ch === 'G') { const nx = x + Math.cos(currentAngle * Math.PI / 180) * stepLen; const ny = y + Math.sin(currentAngle * Math.PI / 180) * stepLen; ctx.moveTo(x, y); ctx.lineTo(nx, ny); x = nx; y = ny; segments++; } else if (ch === '+') currentAngle += angle; else if (ch === '-') currentAngle -= angle; else if (ch === '[') { stack.push({ x, y, a: currentAngle }); } else if (ch === ']') { const state = stack.pop(); if (state) { x = state.x; y = state.y; currentAngle = state.a; ctx.moveTo(x, y); } } } ctx.stroke(); return segments; }
function render() { const w = width / dpr, h = height / dpr; ctx.fillStyle = '#030305'; ctx.fillRect(0, 0, w, h); ctx.save(); ctx.translate(w / 2 - camera.x * camera.scale, h / 2 - camera.y * camera.scale); ctx.scale(camera.scale, camera.scale); const sys = systems[currentSystem]; const instructions = generate(sys.axiom, sys.rules, iterations); let maxSeg = Infinity; if (animating) maxSeg = Math.floor(instructions.length * animProgress); const segs = drawLSystem(instructions, maxSeg); document.getElementById('segmentCount').textContent = segs.toLocaleString(); document.getElementById('iterCount').textContent = iterations; ctx.restore(); }
function loop(time) { if (!running) { animationId = requestAnimationFrame(loop); return; } const dt = (time - lastTime) / 1000; lastTime = time; frameCount++; if (time - fpsTime > 1000) { fps = Math.round(frameCount * 1000 / (time - fpsTime)); frameCount = 0; fpsTime = time; document.getElementById('fps').textContent = fps; } if (animating) { animProgress += dt * 0.5; if (animProgress >= 1) { animProgress = 1; animating = false; document.getElementById('btnAnimate').querySelector('span').textContent = 'Animate'; } } camera.x += (camera.targetX - camera.x) * 0.08; camera.y += (camera.targetY - camera.y) * 0.08; camera.scale += (camera.targetScale - camera.scale) * 0.08; render(); animationId = requestAnimationFrame(loop); }
function init() { resize(); document.getElementById('iterSlider').addEventListener('input', e => { iterations = parseInt(e.target.value); }); document.getElementById('angleSlider').addEventListener('input', e => { angle = parseFloat(e.target.value); }); document.getElementById('lenSlider').addEventListener('input', e => { length = parseFloat(e.target.value); }); lastTime = performance.now(); fpsTime = performance.now(); loop(lastTime); }
window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.lastX = e.clientX; mouse.lastY = e.clientY; canvas.style.cursor = 'grabbing'; });
window.addEventListener('mousemove', e => { if (mouse.down) { camera.targetX -= (e.clientX - mouse.lastX) / camera.scale; camera.targetY -= (e.clientY - mouse.lastY) / camera.scale; mouse.lastX = e.clientX; mouse.lastY = e.clientY; } });
window.addEventListener('mouseup', () => { mouse.down = false; canvas.style.cursor = 'grab'; });
canvas.addEventListener('wheel', e => { e.preventDefault(); camera.targetScale = Math.max(0.2, Math.min(5, camera.targetScale * (e.deltaY > 0 ? 0.9 : 1.1))); }, { passive: false });
select.addEventListener('change', e => { currentSystem = parseInt(e.target.value); const sys = systems[currentSystem]; angle = sys.angle; document.getElementById('angleSlider').value = angle; });
document.getElementById('btnAnimate').addEventListener('click', () => { if (!animating) { animating = true; animProgress = 0; document.getElementById('btnAnimate').querySelector('span').textContent = 'Animating...'; } });
document.getElementById('btnColor').addEventListener('click', () => { colorMode = (colorMode + 1) % 3; const labels = ['Color: Depth', 'Color: Rainbow', 'Color: Mono']; document.getElementById('btnColor').querySelector('span').textContent = labels[colorMode]; });
document.addEventListener('keydown', e => { if (e.key === 'a' || e.key === 'A') { if (!animating) { animating = true; animProgress = 0; document.getElementById('btnAnimate').querySelector('span').textContent = 'Animating...'; } } else if (e.key === 'c' || e.key === 'C') { colorMode = (colorMode + 1) % 3; const labels = ['Color: Depth', 'Color: Rainbow', 'Color: Mono']; document.getElementById('btnColor').querySelector('span').textContent = labels[colorMode]; } else if (e.key === 'ArrowUp') { iterations = Math.min(8, iterations + 1); document.getElementById('iterSlider').value = iterations; } else if (e.key === 'ArrowDown') { iterations = Math.max(1, iterations - 1); document.getElementById('iterSlider').value = iterations; } else if (e.key >= '1' && e.key <= '7') { currentSystem = parseInt(e.key) - 1; select.value = currentSystem; const sys = systems[currentSystem]; angle = sys.angle; document.getElementById('angleSlider').value = angle; } });
init();
</script>
</body>
</html>
