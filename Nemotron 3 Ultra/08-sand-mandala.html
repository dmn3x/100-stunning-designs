<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 — Sand Mandala</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5dc;--fg:#2a2a1a;--muted:#8b7d5a;--accent:#ff9933;--accent2:#8b4513}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'DM Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.08em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stats{bottom:1.5rem;left:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;line-height:1.8}
.controls{bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:.4rem;align-items:flex-end}
.mode-btn{background:transparent;border:1px solid var(--muted);color:var(--fg);padding:.3rem .6rem;font-size:.55rem;cursor:pointer;transition:.15s;font-family:inherit}
.mode-btn:hover,.mode-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(255,153,51,0.1)}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .stats{bottom:1rem;left:1rem;font-size:.55rem}
  .controls{bottom:1rem;right:1rem;font-size:.55rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Sand Mandala</div>
<div class="ui subtitle">symmetric particle deposition</div>
<div class="ui stats">
Grains: <span id="count">0</span><br>
Symmetry: <span id="sym">8</span>-fold<br>
Wind: <span id="wind">0</span>
</div>
<div class="ui controls">
<button class="mode-btn" id="btn8" data-sym="8">8-fold</button>
<button class="mode-btn" id="btn6" data-sym="6">6-fold</button>
<button class="mode-btn" id="btn12" data-sym="12">12-fold</button>
<button class="mode-btn" id="btn4" data-sym="4">4-fold</button>
<kbd>Space</kbd> clear · <kbd>W</kbd> wind
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const grains=[],MAX=50000;
let symmetry=8,wind=0,windAngle=0,frame=0;
let mouse={x:0,y:0,down:false};
const colors=[
  [255,153,51],[200,180,140],[139,69,19],[210,180,140],
  [255,200,100],[180,150,100],[255,180,80],[160,130,80]
];
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
  ctx.translate(W/DPR/2,H/DPR/2);
}
function rotatePoint(x,y,angle){
  const c=Math.cos(angle),s=Math.sin(angle);
  return [x*c-y*s,x*s+y*c];
}
function deposit(x,y){
  for(let s=0;s<symmetry;s++){
    const angle=(Math.PI*2/symmetry)*s;
    const [rx,ry]=rotatePoint(x,y,angle);
    grains.push({x:rx,y:ry,color:colors[Math.floor(Math.random()*colors.length)],size:1+Math.random()*1.5,age:0});
    if(grains.length>MAX)grains.shift();
  }
}
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX-W/2;mouse.y=e.clientY-H/2;});
window.addEventListener('mousedown',e=>{mouse.down=true;deposit(mouse.x,mouse.y);});
window.addEventListener('mouseup',()=>mouse.down=false);
window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse.x=t.clientX-W/2;mouse.y=t.clientY-H/2;if(mouse.down)deposit(mouse.x,mouse.y);},{passive:false});
window.addEventListener('touchstart',e=>{mouse.down=true;const t=e.touches[0];mouse.x=t.clientX-W/2;mouse.y=t.clientY-H/2;deposit(mouse.x,mouse.y);},{passive:false});
window.addEventListener('touchend',()=>mouse.down=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){grains.length=0;e.preventDefault();}
  if(e.code==='KeyW'){wind=wind?0:0.5;document.getElementById('wind').textContent=wind;}
  if(e.code==='Digit8'){symmetry=8;updateBtns();}
  if(e.code==='Digit6'){symmetry=6;updateBtns();}
  if(e.code==='Digit2'){symmetry=12;updateBtns();}
  if(e.code==='Digit4'){symmetry=4;updateBtns();}
});
const btns=document.querySelectorAll('.mode-btn');
function updateBtns(){btns.forEach(b=>b.classList.toggle('active',+b.dataset.sym===symmetry));}
btns.forEach(b=>b.onclick=()=>{symmetry=+b.dataset.sym;updateBtns();});
function tick(){
  frame++;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='rgba(245,245,220,0.04)';
  ctx.fillRect(0,0,W/DPR,H/DPR);
  ctx.translate(W/DPR/2,H/DPR/2);
  windAngle+=0.002;
  const wx=Math.cos(windAngle)*wind,wy=Math.sin(windAngle)*wind;
  if(mouse.down)deposit(mouse.x,mouse.y);
  for(let i=grains.length-1;i>=0;i--){
    const g=grains[i];
    g.x+=wx+ (Math.random()-0.5)*0.3;
    g.y+=wy+ (Math.random()-0.5)*0.3;
    g.age++;
    if(g.age>20000||Math.abs(g.x)>W/DPR||Math.abs(g.y)>H/DPR)grains.splice(i,1);
    else{
      ctx.beginPath();
      ctx.arc(g.x,g.y,g.size,0,Math.PI*2);
      ctx.fillStyle=`rgb(${g.color.join(',')})`;
      ctx.fill();
    }
  }
  document.getElementById('count').textContent=grains.length;
  document.getElementById('sym').textContent=symmetry;
  requestAnimationFrame(tick);
}
resize();
for(let i=0;i<200;i++)deposit((Math.random()-0.5)*W/DPR*0.5,(Math.random()-0.5)*H/DPR*0.5);
tick();
</script>
</body>
</html>
