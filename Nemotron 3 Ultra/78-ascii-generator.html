<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>78 — ASCII Art Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--fg:#e6edf3;--muted:#484f58;--accent:#58a6ff;--accent2:#3fb950;--accent3:#d29922;--accent4:#f85149;--card:#161b22;--border:#30363d}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 'JetBrains Mono','SF Mono',monospace;overflow:auto}
.layout{display:grid;grid-template-columns:1fr 1fr;height:100%}
@media (max-width:1000px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.editor{padding:1.5rem;overflow:auto}
.editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:1rem}
.editor-header h2{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.editor textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font:inherit;padding:1rem;min-height:300px;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.6}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)33}
.section{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem;margin-top:1rem}
.section h3{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem}
.row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem;align-items:center}
.row label{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.row input,.row select{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:.5rem;border-radius:4px;font:inherit;font-size:.7rem}
.row input:focus,.row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)33}
.btn{padding:.5rem 1rem;border:1px solid var(--border);background:var(--card);color:var(--fg);font:inherit;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.output{padding:1.5rem;overflow:auto;background:var(--card);border-left:1px solid var(--border)}
.output-header{margin-bottom:1rem}
.output-header h3{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ascii-output{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1rem;font-family:'JetBrains Mono',monospace;font-size:.65rem;line-height:1.1;white-space:pre;overflow:auto;max-height:70vh;color:var(--accent2)}
.footer{grid-column:1/-1;text-align:center;padding:2rem;border-top:1px solid var(--border);color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="layout">
<div class="editor">
<div class="editor-header"><h2>Input</h2></div>
<textarea id="inputImage" placeholder="Drag & drop an image, or click to select..."></textarea>
<div class="section"><h3>Settings</h3><div class="row"><label>Width (chars)</label><input type="number" id="asciiWidth" value="120" min="20" max="300"></div><div class="row"><label>Character Set</label><select id="charSet"><option value="standard">Standard (@%#*+=-:. )</option><option value="blocks">Blocks (█▓▒░ )</option><option value="minimal">Minimal (#+=-. )</option><option value="dense">Dense ($@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\|()1{}[]?-_+~<>i!lI;:,"^`'. )</option><option value="custom">Custom</option></select></div><div class="row" id="customRow" style="display:none"><label>Custom Chars</label><input type="text" id="customChars" placeholder="Characters from dark to light"></div><div class="row"><label>Invert</label><input type="checkbox" id="invertColors"></div><div class="row"><label>Color Output</label><input type="checkbox" id="colorOutput"></div><div class="row"><label>Dither</label><select id="ditherMode"><option value="none">None</option><option value="floyd">Floyd-Steinberg</option><option value="ordered">Ordered</option></select></div><div class="row"><button class="btn primary" id="generateBtn">Generate ASCII</button><button class="btn" id="copyBtn">Copy</button><button class="btn" id="downloadBtn">Download</button></div></div>
</div>
<div class="output">
<div class="output-header"><h3>Output</h3></div>
<pre class="ascii-output" id="asciiOutput" spellcheck="false">Drop an image or click the input area to select a file...</pre>
</div>
</div>
<footer class="footer">Nemotron 3 Ultra · 078 / 100 · ASCII Art Generator</footer>
<script>
const inputArea=document.getElementById('inputImage');
const output=document.getElementById('asciiOutput');
const charSets={standard:'@%#*+=-:. ',blocks:'█▓▒░ ',minimal:'#+=-. ',dense:'$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,"^`\'. '};
let currentImage=null;
inputArea.addEventListener('click',()=>document.createElement('input').click());
inputArea.addEventListener('dragover',e=>{e.preventDefault();inputArea.style.borderColor='var(--accent)';});
inputArea.addEventListener('dragleave',()=>inputArea.style.borderColor='');
inputArea.addEventListener('drop',e=>{e.preventDefault();inputArea.style.borderColor='';handleFile(e.dataTransfer.files[0]);});
inputArea.addEventListener('click',()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=e=>handleFile(e.target.files[0]);i.click();});
function handleFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  const img=new Image();
  img.onload=()=>{currentImage=img;generate();};
  img.src=URL.createObjectURL(file);
}
function generate(){
  if(!currentImage)return;
  const width=parseInt(document.getElementById('asciiWidth').value);
  const invert=document.getElementById('invertColors').checked;
  const color=document.getElementById('colorOutput').checked;
  const dither=document.getElementById('ditherMode').value;
  let chars=document.getElementById('charSet').value;
  if(chars==='custom')chars=document.getElementById('customChars').value||charSets.standard;
  else chars=charSets[chars];
  const canvas=document.createElement('canvas');
  const aspect=currentImage.height/currentImage.width;
  canvas.width=width;
  canvas.height=Math.round(width*aspect*0.5);
  const ctx=canvas.getContext('2d');
  ctx.drawImage(currentImage,0,0,canvas.width,canvas.height);
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const data=imgData.data;
  // Grayscale conversion
  const gray=new Float32Array(canvas.width*canvas.height);
  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const i=(y*canvas.width+x)*4;
      gray[y*canvas.width+x]=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
    }
  }
  // Dithering
  if(dither==='floyd'){
    for(let y=0;y<canvas.height;y++){
      for(let x=0;x<canvas.width;x++){
        const idx=y*canvas.width+x;
        const old=gray[idx];
        const newVal=Math.round(old/255*(chars.length-1))*255/(chars.length-1);
        gray[idx]=newVal;
        const err=old-newVal;
        if(x+1<canvas.width)gray[idx+1]+=err*7/16;
        if(x-1>=0&&y+1<canvas.height)gray[idx-1+canvas.width]+=err*3/16;
        if(y+1<canvas.height)gray[idx+canvas.width]+=err*5/16;
        if(x+1<canvas.width&&y+1<canvas.height)gray[idx+1+canvas.width]+=err*1/16;
      }
    }
  }else if(dither==='ordered'){
    const bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,5,13,7]];
    for(let y=0;y<canvas.height;y++){
      for(let x=0;x<canvas.width;x++){
        const idx=y*canvas.width+x;
        const threshold=bayer[y%4][x%4]/16;
        gray[idx]=Math.round((gray[idx]/255+threshold)*(chars.length-1))*255/(chars.length-1);
      }
    }
  }
  // Generate ASCII
  let ascii='';
  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const idx=y*canvas.width+x;
      const val=gray[idx];
      let charIdx=Math.floor(val/255*(chars.length-1));
      if(invert)charIdx=chars.length-1-charIdx;
      charIdx=Math.max(0,Math.min(chars.length-1,charIdx));
      const ch=chars[charIdx];
      if(color){
        const i=(y*canvas.width+x)*4;
        ascii+=`<span style="color:rgb(${data[i]},${data[i+1]},${data[i+2]})">${ch=== ' '?'&nbsp;':ch}</span>`;
      }else{
        ascii+=ch===' '?'&nbsp;':ch;
      }
    }
    ascii+='\n';
  }
  output.innerHTML=ascii;
}
document.getElementById('asciiWidth').oninput=generate;
document.getElementById('charSet').onchange=e=>{document.getElementById('customRow').style.display=e.target.value==='custom'?'flex':'none';generate();};
document.getElementById('customChars').oninput=generate;
document.getElementById('invertColors').onchange=generate;
document.getElementById('colorOutput').onchange=generate;
document.getElementById('ditherMode').onchange=generate;
document.getElementById('generateBtn').onclick=generate;
document.getElementById('copyBtn').onclick=()=>{navigator.clipboard.writeText(output.innerText);alert('Copied!');};
document.getElementById('downloadBtn').onclick=()=>{const blob=new Blob([output.innerText],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ascii-art.txt';a.click();};
</script>
</body>
</html>
