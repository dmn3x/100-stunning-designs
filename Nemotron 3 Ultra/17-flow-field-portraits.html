<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 — Flow Field Portraits</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--fg:#e8e8f0;--muted:#3a3a5a;--accent:#00d4ff}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'Space Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.08em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.controls{bottom:1.5rem;left:1.5rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.ctrl{display:flex;align-items:center;gap:.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctrl input[type=range]{width:100px;accent-color:var(--accent)}
.ctrl select{background:transparent;border:1px solid var(--muted);color:var(--fg);padding:.2rem .5rem;font:inherit;font-size:.6rem}
.stat{color:var(--accent);font-weight:500;font-size:.75rem}
.mode{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;text-align:right}
.mode kbd{background:rgba(255,255,255,0.06);padding:.15rem .4rem;border-radius:3px;font-family:inherit;font-size:.75em;margin:0 .2rem}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .controls{bottom:1rem;left:1rem;gap:.5rem}
  .ctrl input[type=range]{width:70px}
  .mode{bottom:1rem;right:1rem;font-size:.55rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Flow Field Portraits</div>
<div class="ui subtitle">particle tracing on luminance fields</div>
<div class="ui controls">
<label class="ctrl">Particles <input type="range" id="count" min="500" max="8000" step="100" value="3000"><span class="stat" id="countVal">3000</span></label>
<label class="ctrl">Step <input type="range" id="step" min="0.5" max="5" step="0.1" value="1.5"><span class="stat" id="stepVal">1.5</span></label>
<label class="ctrl">Noise Scale <input type="range" id="noise" min="0.001" max="0.02" step="0.001" value="0.005"><span class="stat" id="noiseVal">0.005</span></label>
<label class="ctrl"><select id="mode"><option value="0">Luminance</option><option value="1">Edges</option><option value="2">Curl</option><option value="3">Random</option></select></label>
<label class="ctrl"><input type="checkbox" id="trails" checked> Trails</label>
<label class="ctrl"><input type="checkbox" id="animate" checked> Animate</label>
</div>
<div class="ui mode">click to reset · <kbd>Space</kbd> pause · <kbd>I</kbd> load image</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
let particles=[],imgData=null,mode=0,step=1.5,noiseScale=0.005;
let trails=true,animate=true,frame=0,time=0;
let mouse={x:0,y:0,down:false};
const MAX=8000;
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
  initImage();
  initParticles();
}
function initImage(){
  const cw=W/DPR,ch=H/DPR;
  const temp=document.createElement('canvas');
  temp.width=cw;temp.height=ch;
  const tctx=temp.getContext('2d');
  const grad=tctx.createRadialGradient(cw/2,ch/2,0,cw/2,ch/2,Math.max(cw,ch)/2);
  grad.addColorStop(0,'#fff');grad.addColorStop(0.5,'#888');grad.addColorStop(1,'#000');
  tctx.fillStyle=grad;tctx.fillRect(0,0,cw,ch);
  tctx.fillStyle='#fff';
  tctx.font='bold 200px serif';
  tctx.textAlign='center';tctx.textBaseline='middle';
  tctx.fillText('NEMOTRON',cw/2,ch/2);
  imgData=tctx.getImageData(0,0,cw,ch);
}
function luminance(x,y){
  if(!imgData)return 0.5;
  const ix=Math.floor(x),iy=Math.floor(y);
  if(ix<0||ix>=imgData.width||iy<0||iy>=imgData.height)return 0.5;
  const i=(iy*imgData.width+ix)*4;
  return (imgData.data[i]*0.299+imgData.data[i+1]*0.587+imgData.data[i+2]*0.114)/255;
}
function edge(x,y){
  const l=luminance(x,y);
  const lx=luminance(x+1,y),ly=luminance(x,y+1);
  return Math.hypot(lx-l,ly-l);
}
function curl(x,y){
  const eps=1;
  const lx=luminance(x+eps,y)-luminance(x-eps,y);
  const ly=luminance(x,y+eps)-luminance(x,y-eps);
  return ly-lx;
}
function fieldAngle(x,y){
  switch(mode){
    case 0: return (1-luminance(x,y))*Math.PI*2;
    case 1: return edge(x,y)*20;
    case 2: return curl(x,y)*50;
    case 3: return Math.random()*Math.PI*2;
  }
}
function initParticles(){
  particles=[];
  const cw=W/DPR,ch=H/DPR;
  for(let i=0;i<Math.min(MAX,count);i++){
    particles.push({x:Math.random()*cw,y:Math.random()*ch,hue:Math.random()*360,life:1});
  }
}
document.getElementById('count').addEventListener('input',e=>{count=+e.target.value;document.getElementById('countVal').textContent=count;initParticles();});
document.getElementById('step').addEventListener('input',e=>{step=+e.target.value;document.getElementById('stepVal').textContent=step.toFixed(1);});
document.getElementById('noise').addEventListener('input',e=>{noiseScale=+e.target.value;document.getElementById('noiseVal').textContent=noiseScale.toFixed(3);});
document.getElementById('mode').addEventListener('change',e=>mode=+e.target.value);
document.getElementById('trails').addEventListener('change',e=>trails=e.target.checked);
document.getElementById('animate').addEventListener('change',e=>animate=e.target.checked);
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('mousedown',()=>{mouse.down=true;initParticles();});
window.addEventListener('mouseup',()=>mouse.down=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){animate=!animate;document.getElementById('animate').checked=animate;e.preventDefault();}
  if(e.code==='KeyI'){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const temp=document.createElement('canvas');temp.width=W/DPR;temp.height=H/DPR;const tctx=temp.getContext('2d');tctx.drawImage(img,0,0,temp.width,temp.height);imgData=tctx.getImageData(0,0,temp.width,temp.height);initParticles();};img.src=fr.result;};fr.readAsDataURL(input.files[0]);};input.click();e.preventDefault();}
});
function tick(){
  frame++;
  if(animate)time+=0.01;
  const cw=W/DPR,ch=H/DPR;
  if(trails){
    ctx.fillStyle='rgba(26,26,46,0.08)';
    ctx.fillRect(0,0,cw,ch);
  }else{
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(0,0,cw,ch);
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    const angle=fieldAngle(p.x,p.y)+Math.sin(time+p.y*0.01)*0.2;
    p.x+=Math.cos(angle)*step;
    p.y+=Math.sin(angle)*step;
    p.life-=0.0005;
    if(p.x<0||p.x>cw||p.y<0||p.y>ch||p.life<=0){
      p.x=Math.random()*cw;p.y=Math.random()*ch;p.life=1;p.hue=Math.random()*360;
    }
    ctx.beginPath();
    ctx.arc(p.x,p.y,0.8,0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},80%,60%,${p.life*0.6})`;
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
resize();
tick();
</script>
</body>
</html>
