<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>39 — Color System Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--fg:#f0f0f5;--muted:#3a3a4a;--accent:#00d4ff;--card:#12121a}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 'JetBrains Mono','SF Mono',monospace;overflow:auto}
.header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--muted);padding:1rem 2rem;z-index:10;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
.header h1{font-size:1.5rem;font-weight:300;letter-spacing:-.02em}
.header h1 span{font-weight:700;color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.controls label{display:flex;align-items:center;gap:.3rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);cursor:pointer}
.controls select,.controls input[type=text]{background:var(--card);border:1px solid var(--muted);color:var(--fg);padding:.3rem .5rem;font:inherit;font-size:.7rem}
.controls button{background:var(--accent);border:none;color:var(--bg);padding:.3rem .75rem;font:inherit;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.main{padding:2rem;max-width:1400px;margin:0 auto}
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.swatch{background:var(--card);border:1px solid var(--muted);border-radius:8px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.swatch:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,212,255,0.15);border-color:var(--accent)}
.swatch-color{height:100px;position:relative}
.swatch-info{padding:1rem}
.swatch-name{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.swatch-values{display:flex;flex-direction:column;gap:.25rem;font-size:.7rem}
.swatch-value{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace}
.swatch-value .label{color:var(--muted)}
.swatch-value .value{color:var(--fg);font-weight:500}
.swatch-value .copy{background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;font-size:.65rem;opacity:0;transition:opacity .2s}
.swatch-value:hover .copy{opacity:1}
.palette-actions{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
.palette-actions button{background:var(--card);border:1px solid var(--muted);color:var(--fg);padding:.5rem 1rem;font:inherit;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.palette-actions button:hover{border-color:var(--accent);color:var(--accent)}
.palette-actions button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.harmony{background:var(--card);border:1px solid var(--muted);border-radius:8px;padding:1.5rem;margin-bottom:2rem}
.harmony h3{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
.harmony-swatches{display:flex;gap:.5rem;flex-wrap:wrap}
.harmony-swatch{flex:1;min-width:80px;height:60px;border-radius:4px;position:relative}
.harmony-swatch::after{content:attr(data-hex);position:absolute;bottom:-.25rem;left:50%;transform:translateX(-50%);font-size:.55rem;color:var(--muted);white-space:nowrap}
.footer{text-align:center;padding:2rem;border-top:1px solid var(--muted);color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
@media (max-width:600px){.header{padding:1rem}.main{padding:1rem}}
</style>
</head>
<body>
<header class="header"><h1>Color <span>System</span> Builder</h1><div class="controls"><label>Base Hue <input type="range" id="baseHue" min="0" max="360" value="200" style="width:120px"><span id="baseHueVal">200°</span></label><label>Scheme <select id="scheme"><option value="mono">Monochromatic</option><option value="analogous">Analogous</option><option value="complement">Complementary</option><option value="triadic">Triadic</option><option value="tetradic">Tetradic</option><option value="split">Split Complement</option></select></label><label>Steps <input type="range" id="steps" min="5" max="12" value="9" style="width:80px"><span id="stepsVal">9</span></label><button id="randomize">Randomize</button><button id="exportCSS">Export CSS</button></div></header>
<main class="main">
<div class="palette-actions"><button class="primary" id="addColor">+ Add Custom Color</button><button id="savePalette">Save Palette</button><button id="loadPalette">Load Palette</button><button id="clearPalette">Clear All</button></div>
<div class="swatch-grid" id="swatchGrid"></div>
<div class="harmony"><h3>Harmony Preview</h3><div class="harmony-swatches" id="harmonySwatches"></div></div>
</main>
<footer class="footer">Nemotron 3 Ultra · 039 / 100 · Color System Builder</footer>
<script>
const grid=document.getElementById('swatchGrid');
const harmony=document.getElementById('harmonySwatches');
let customColors=[],baseHue=200,scheme='mono',steps=9;
function hslToHex(h,s,l){h/=360;const a=s*Math.min(l,1-l);const f=(n,k=(n+h*12)%12)=>Math.round(255*(l-a*Math.max(Math.min(k-3,9-k),-1)));return '#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function hexToHsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break}h*=60}return{h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};}
function getLuminance(hex){const rgb=hex.slice(1).match(/.{2}/g).map(x=>{const v=parseInt(x,16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2];}
function getContrast(c1,c2){const l1=getLuminance(c1),l2=getLuminance(c2);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
function generateScheme(hue,scheme,steps){
  const colors=[],hues=[];
  switch(scheme){
    case 'mono':for(let i=0;i<steps;i++)hues.push(hue);break;
    case 'analogous':for(let i=0;i<steps;i++)hues.push((hue-45+i*90/(steps-1)+360)%360);break;
    case 'complement':hues.push(hue,(hue+180)%360);for(let i=2;i<steps;i++)hues.push((hue+i*30)%360);break;
    case 'triadic':hues.push(hue,(hue+120)%360,(hue+240)%360);for(let i=3;i<steps;i++)hues.push((hue+i*15)%360);break;
    case 'tetradic':hues.push(hue,(hue+90)%360,(hue+180)%360,(hue+270)%360);for(let i=4;i<steps;i++)hues.push((hue+i*20)%360);break;
    case 'split':hues.push(hue,(hue+150)%360,(hue+210)%360);for(let i=3;i<steps;i++)hues.push((hue+i*25)%360);break;
  }
  hues.forEach((h,i)=>{const l=10+80*i/(steps-1),s=scheme==='mono'?90:70;colors.push({hue:h,sat:s,light:l,hex:hslToHex(h,s,l)});});
  return colors;
}
function render(){
  grid.innerHTML='';
  const schemeColors=generateScheme(baseHue,scheme,steps);
  const allColors=[...schemeColors,...customColors];
  allColors.forEach((c,i)=>{
    const isCustom=i>=schemeColors.length;
    const swatch=document.createElement('div');
    swatch.className='swatch';
    const textColor=getContrast(c.hex,'#ffffff')>getContrast(c.hex,'#000000')?'#000':'#fff';
    swatch.innerHTML=`<div class="swatch-color" style="background:${c.hex}"></div><div class="swatch-info"><div class="swatch-name">${isCustom?'Custom':'Scheme'} ${isCustom?customColors.indexOf(c)+1:i+1}</div><div class="swatch-values"><div class="swatch-value"><span class="label">HEX</span><span class="value">${c.hex.toUpperCase()}</span><button class="copy" data-hex="${c.hex}">Copy</button></div><div class="swatch-value"><span class="label">HSL</span><span class="value">${c.hue}° ${c.sat}% ${c.light}%</span></div><div class="swatch-value"><span class="label">RGB</span><span class="value">${parseInt(c.hex.slice(1,3),16)}, ${parseInt(c.hex.slice(3,5),16)}, ${parseInt(c.hex.slice(5,7),16)}</span></div></div></div>`;
    if(isCustom){const btn=document.createElement('button');btn.textContent='Remove';btn.style.cssText='margin-top:.5rem;padding:.25rem .5rem;font-size:.6rem;background:transparent;border:1px solid var(--accent4);color:var(--accent4);cursor:pointer';btn.onclick=()=>{customColors.splice(customColors.indexOf(c),1);render();};swatch.querySelector('.swatch-info').appendChild(btn);}
    grid.appendChild(swatch);
  });
  document.querySelectorAll('.copy').forEach(b=>b.onclick=e=>{navigator.clipboard.writeText(e.target.dataset.hex);const o=e.target.textContent;e.target.textContent='Copied!';setTimeout(()=>e.target.textContent=o,1000);});
  renderHarmony();
}
function renderHarmony(){
  harmony.innerHTML='';
  const schemeColors=generateScheme(baseHue,scheme,5);
  schemeColors.forEach(c=>{const s=document.createElement('div');s.className='harmony-swatch';s.style.background=c.hex;s.dataset.hex=c.hex.toUpperCase();harmony.appendChild(s);});
  customColors.slice(0,5).forEach(c=>{const s=document.createElement('div');s.className='harmony-swatch';s.style.background=c.hex;s.dataset.hex=c.hex.toUpperCase();harmony.appendChild(s);});
}
document.getElementById('baseHue').addEventListener('input',e=>{baseHue=+e.target.value;document.getElementById('baseHueVal').textContent=baseHue+'°';render();});
document.getElementById('scheme').addEventListener('change',e=>{scheme=e.target.value;render();});
document.getElementById('steps').addEventListener('input',e=>{steps=+e.target.value;document.getElementById('stepsVal').textContent=steps;render();});
document.getElementById('randomize').onclick=()=>{baseHue=Math.random()*360;scheme=['mono','analogous','complement','triadic','tetradic','split'][Math.floor(Math.random()*6)];steps=5+Math.floor(Math.random()*8);document.getElementById('baseHue').value=baseHue;document.getElementById('baseHueVal').textContent=Math.round(baseHue)+'°';document.getElementById('scheme').value=scheme;document.getElementById('steps').value=steps;document.getElementById('stepsVal').textContent=steps;render();};
document.getElementById('addColor').onclick=()=>{const hex='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');const hsl=hexToHsl(hex);customColors.push({...hsl,hex});render();};
document.getElementById('savePalette').onclick=()=>{const data=JSON.stringify({baseHue,scheme,steps,customColors});const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='palette.json';a.click();};
document.getElementById('loadPalette').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];const r=new FileReader();r.onload=()=>{const d=JSON.parse(r.result);baseHue=d.baseHue;scheme=d.scheme;steps=d.steps;customColors=d.customColors||[];document.getElementById('baseHue').value=baseHue;document.getElementById('baseHueVal').textContent=baseHue+'°';document.getElementById('scheme').value=scheme;document.getElementById('steps').value=steps;document.getElementById('stepsVal').textContent=steps;render();};r.readAsText(f);};i.click();};
document.getElementById('clearPalette').onclick=()=>{customColors=[];render();};
document.getElementById('exportCSS').onclick=()=>{const all=[...generateScheme(baseHue,scheme,steps),...customColors];let css=':root{\n';all.forEach((c,i)=>{css+=`  --color-${i+1}: ${c.hex};\n`;});css+='}';navigator.clipboard.writeText(css);const btn=document.getElementById('exportCSS');const o=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=o,1000);};
render();
</script>
</body>
</html>
