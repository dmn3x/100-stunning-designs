> **A living document** describing the visual language, components, and principles behind the 100 HTML designs in this collection.

---

## Design Principles

### 1. Zero Repetition
Every design is unique. No two files share the same visual DNA. This forces creative exploration and prevents template thinking.

### 2. Native First
Zero dependencies. Vanilla HTML, CSS, and JavaScript only. Browser APIs are our framework.

### 3. Performance as Aesthetic
60fps is not optional. Animations use `requestAnimationFrame`, transforms, and opacity. No layout thrashing.

### 4. Accessibility Built-in
Semantic HTML, ARIA labels, keyboard navigation, reduced motion support, and WCAG AA contrast ratios.

### 5. Dark Mode Native
Every design respects `prefers-color-scheme`. No flash of wrong theme.

---

## Color Philosophy

Colors are not decorative—they communicate state, hierarchy, and brand.

| Role | Light | Dark | Usage |
|------|-------|------|-------|
| Background | `#ffffff` | `#0d1117` | Page canvas |
| Foreground | `#1a1a1a` | `#e6edf3` | Primary text |
| Muted | `#666666` | `#8b949e` | Secondary text |
| Accent | `#0066cc` | `#58a6ff` | Links, focus, primary actions |
| Success | `#22863a` | `#3fb950` | Confirmations |
| Warning | `#bf8700` | `#d29922` | Caution states |
| Danger | `#cb2431` | `#f85149` | Errors, destructive actions |

## Animation Guidelines

- **Duration**: 150ms (fast), 250ms (normal), 350ms (slow)
- **Easing**: `cubic-bezier(0.16, 1, 0.3, 1)` (material)
- **Reduced Motion**: Always respect `prefers-reduced-motion`

```css
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
```

---

## Grid System

12-column fluid grid with CSS Grid:

```css
.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--space-4);
}
@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
}
```

---

## File Naming Convention

```
NN-descriptive-name.html
```

- `NN`: Zero-padded number (01-100)
- `descriptive-name`: Kebab-case, lowercase
- Examples: `01-neural-bloom.html`, `27-swiss-grid-poster.html`

---

## Quality Checklist

Before committing any design:

- [ ] Unique visual identity (no reuse of patterns)
- [ ] Works at 320px, 768px, 1024px, 1440px+
- [ ] Dark mode tested
- [ ] Keyboard navigable
- [ ] Screen reader friendly
- [ ] 60fps animations
- [ ] No console errors
- [ ] Valid HTML5
- [ ] Self-contained (no external deps except Google Fonts)

<script>
const editor=document.getElementById('editor');
const preview=document.getElementById('preview');
const wordCount=document.getElementById('wordCount');
function render(){
  const text=editor.value;
  preview.innerHTML=marked.parse(text);
  const words=text.trim().split(/\s+/).filter(w=>w.length>0).length;
  wordCount.textContent=`${words} words`;
}
function insertText(s){
  const start=editor.selectionStart,end=editor.selectionEnd;
  const text=editor.value;
  editor.value=text.slice(0,start)+s+text.slice(end);
  editor.selectionStart=editor.selectionEnd=start+s.length;
  editor.focus();
  render();
}
editor.addEventListener('input',render);
if(typeof marked==='undefined'){
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/marked/marked.min.js';
  s.onload=render;
  document.head.appendChild(s);
}else{appendChild(s);}
else{render();}
</script>
