<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>35 — ASCII Art Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--fg:#e8e8f0;--muted:#3a3a5a;--accent:#00d4ff}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 'JetBrains Mono','Fira Code',monospace;overflow:auto}
.controls{position:fixed;top:1rem;left:1rem;right:1rem;z-index:10;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:center;background:rgba(26,26,46,0.95);border:1px solid var(--muted);padding:1rem;border-radius:8px;font-size:.7rem}
.controls label{display:flex;align-items:center;gap:.3rem;cursor:pointer;color:var(--muted)}
.controls select,.controls input{background:transparent;border:1px solid var(--muted);color:var(--fg);padding:.3rem .5rem;font:inherit;font-size:.7rem}
.main{padding:5rem 2rem 3rem;max-width:1000px;margin:0 auto}
h1{font-size:clamp(1.5rem,4vw,3rem);font-weight:200;letter-spacing:-.02em;margin-bottom:2rem;text-align:center}
h1 span{font-weight:700;color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem}
.card{background:rgba(255,255,255,0.02);border:1px solid var(--muted);border-radius:8px;padding:1.5rem;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,212,255,0.1);border-color:var(--accent)}
.card::before{content:attr(data-title);position:absolute;top:.75rem;right:.75rem;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.6}
.card pre{font-family:'JetBrains Mono','Fira Code',monospace;font-size:.65rem;line-height:1.2;white-space:pre;overflow:auto;max-height:400px;color:var(--accent);text-shadow:0 0 10px var(--accent)}
.card .meta{display:flex;justify-content:space-between;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--muted);font-size:.6rem;color:var(--muted)}
.footer{text-align:center;padding:2rem;border-top:1px solid var(--muted);color:var(--muted);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
@media (max-width:600px){
  .controls{left:.5rem;right:.5rem;top:.5rem;padding:.75rem;font-size:.65rem}
  .main{padding:4rem 1rem 2rem}
  .gallery{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="controls">
<label>Category <select id="category"><option value="all">All</option><option value="animals">Animals</option><option value="faces">Faces</option><option value="objects">Objects</option><option value="scenes">Scenes</option><option value="text">Typography</option></select></label>
<label>Style <select id="style"><option value="classic">Classic</option><option value="block">Block</option><option value="line">Line Art</option><option value="shaded">Shaded</option></select></label>
<label>Size <input type="range" id="size" min="8" max="24" value="12"><span id="sizeVal">12px</span></label>
<label><input type="checkbox" id="animate" checked> Animate</label>
</div>
<main class="main">
<h1>ASCII <span>Art Gallery</span></h1>
<div class="gallery" id="gallery"></div>
<div class="footer">Nemotron 3 Ultra · 035 / 100 · Text-mode aesthetics</div>
</main>
<script>
const asciiArt={
  animals:{
    classic:[
      {title:"Cat",art:`      |\\      _,,,---,,_
ZZZzz /,`.-'`'    -.  ;-;;,_
     |,4-  ) )-,_.\\ (  \\\'-'
    '---''(_/--'  \\\_\\`'`},
      {title:"Dog",art:`       __      _
      o'')}____//
       \`_      )
        (_(_/-(_/`},
      {title:"Bird",art:`         \\
         (o>
       //\\
      v_/_`}
    ],
    block:[
      {title:"Elephant",art:`████████████████
████████████████
████      ██████
████  ██  ██████
████████████████
████████████████
    ████████    `},
      {title:"Whale",art:`        ████████
      ████████████
    ████████████████
  ████████████████████
  ████████████████████
    ████████████████
        ████████`}
    ],
    faces:[
      {title:"Happy",art:`  .--.
 / \\/ \\
|  @ @  |
|       |
 \\  \\_/  /
  '.___.'`},
      {title:"Sunglasses",art:`  .--.
 / \\/ \\
| (o)(o) |
|  __    |
 \\ \\__/ /
  '.___.'`}
    ],
    shaded:[
      {title:"Dragon",art:`                    ░░
                  ░░░░░░
                ░░░░░░░░
              ░░░░░░░░░░
            ░░░░░░░░░░░░
          ░░░░░░░░░░░░░░
        ░░░░░░░░░░░░░░░░
      ░░░░░░░░░░░░░░░░░░
    ░░░░░░░░░░░░░░░░░░░░
  ░░░░░░░░░░░░░░░░░░░░░░
░░░░░░░░░░░░░░░░░░░░░░░░░`}
    ]
  }
};
const allArt={};
Object.keys(asciiArt).forEach(cat=>{
  Object.keys(asciiArt[cat]).forEach(style=>{
    asciiArt[cat][style].forEach(a=>{if(!allArt[cat])allArt[cat]=[];allArt[cat].push({...a,style});});
  });
});
let currentCat='all',currentStyle='classic',fontSize=12,animate=true;
function render(){
  const gallery=document.getElementById('gallery');
  gallery.innerHTML='';
  let arts=[];
  if(currentCat==='all'){
    Object.values(allArt).flat().forEach(a=>arts.push(a));
  }else if(allArt[currentCat]){
    arts=allArt[currentCat].filter(a=>currentStyle==='all'||a.style===currentStyle);
  }
  arts.forEach((art,i)=>{
    const card=document.createElement('div');
    card.className='card';
    card.dataset.title=art.title;
    card.style.transitionDelay=`${i*50}ms`;
    const pre=document.createElement('pre');
    pre.textContent=art.art;
    pre.style.fontSize=fontSize+'px';
    const meta=document.createElement('div');
    meta.className='meta';
    meta.innerHTML=`<span>${art.title}</span><span>${art.style}</span>`;
    card.appendChild(pre);
    card.appendChild(meta);
    gallery.appendChild(card);
    if(animate){
      card.style.opacity='0';
      card.style.transform='translateY(20px)';
      setTimeout(()=>{card.style.transition='all .5s cubic-bezier(.16,1,.3,1)';card.style.opacity='1';card.style.transform='translateY(0)';},i*80);
    }
  });
}
document.getElementById('category').addEventListener('change',e=>{currentCat=e.target.value;render();});
document.getElementById('style').addEventListener('change',e=>{currentStyle=e.target.value;render();});
document.getElementById('size').addEventListener('input',e=>{fontSize=+e.target.value;document.getElementById('sizeVal').textContent=fontSize+'px';document.querySelectorAll('.card pre').forEach(p=>p.style.fontSize=fontSize+'px');});
document.getElementById('animate').addEventListener('change',e=>animate=e.target.checked);
render();
</script>
</body>
</html>
