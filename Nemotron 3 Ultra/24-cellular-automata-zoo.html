<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 — Cellular Automata Zoo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a1a;--fg:#f0f0f0;--muted:#4a4a4a;--accent:#00ff88}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'JetBrains Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.08em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.controls{bottom:1.5rem;left:1.5rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.ctrl{display:flex;align-items:center;gap:.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctrl input[type=range]{width:100px;accent-color:var(--accent)}
.ctrl select{background:transparent;border:1px solid var(--muted);color:var(--fg);padding:.2rem .5rem;font:inherit;font-size:.6rem}
.stat{color:var(--accent);font-weight:500;font-size:.75rem}
.mode{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;text-align:right}
.mode kbd{background:rgba(255,255,255,0.06);padding:.15rem .4rem;border-radius:3px;font-family:inherit;font-size:.75em;margin:0 .2rem}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .controls{bottom:1rem;left:1rem;gap:.5rem}
  .ctrl input[type=range]{width:70px}
  .mode{bottom:1rem;right:1rem;font-size:.55rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Cellular Automata Zoo</div>
<div class="ui subtitle">life · wireworld · langton · brain · custom</div>
<div class="ui controls">
<label class="ctrl">Rule <select id="rule"><option value="life">Game of Life</option><option value="wireworld">WireWorld</option><option value="langton">Langton's Ant</option><option value="brain">Brian's Brain</option><option value="daynight">Day & Night</option><option value="highlife">HighLife</option><option value="seeds">Seeds</option><option value="custom">Custom</option></select></label>
<label class="ctrl">Speed <input type="range" id="speed" min="1" max="60" step="1" value="30"><span class="stat" id="speedVal">30</span></label>
<label class="ctrl">Zoom <input type="range" id="zoom" min="1" max="8" step="1" value="3"><span class="stat" id="zoomVal">3</span></label>
<label class="ctrl"><input type="checkbox" id="grid" checked> Grid</label>
<label class="ctrl"><input type="checkbox" id="wrap" checked> Wrap</label>
<label class="ctrl"><input type="checkbox" id="pause"> Pause</label>
</div>
<div class="ui mode">click/drag to draw · <kbd>Space</kbd> pause · <kbd>C</kbd> clear · <kbd>R</kbd> random</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
let rule='life',speed=30,zoom=3,showGrid=true,wrap=true,paused=false;
let grid=[],nextGrid=[],cols=0,rows=0,frame=0,lastStep=0;
let mouse={x:0,y:0,down:false};
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
  cols=Math.floor(W/DPR/zoom);rows=Math.floor(H/DPR/zoom);
  grid=new Uint8Array(cols*rows);
  nextGrid=new Uint8Array(cols*rows);
}
function idx(x,y){return (y*cols+x)%(cols*rows)}
function get(x,y){if(wrap){x=(x+cols)%cols;y=(y+rows)%rows;}else{if(x<0||x>=cols||y<0||y>=rows)return 0}return grid[idx(x,y)]}
function set(x,y,v){if(x>=0&&x<cols&&y>=0&&y<rows)nextGrid[idx(x,y)]=v}
function neighbors(x,y){
  let n=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=get(x+dx,y+dy);
  return n;
}
function stepLife(){
  nextGrid.fill(0);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const n=neighbors(x,y),c=get(x,y);
    if(c){if(n===2||n===3)set(x,y,1);}else{if(n===3)set(x,y,1);}
  }
  [grid,nextGrid]=[nextGrid,grid];
}
function stepWireWorld(){
  nextGrid.fill(0);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=get(x,y);
    if(c===0)set(x,y,0);
    else if(c===1)set(x,y,2);
    else if(c===2)set(x,y,3);
    else if(c===3){
      let heads=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)if(get(x+dx,y+dy)===1)heads++;
      set(x,y,heads===1||heads===2?1:3);
    }
  }
  [grid,nextGrid]=[nextGrid,grid];
}
function stepLangton(){
  nextGrid.fill(0);
  if(!window.ant)window.ant={x:Math.floor(cols/2),y:Math.floor(rows/2),dir:0};
  const a=window.ant;
  const c=get(a.x,a.y);
  if(c===0){a.dir=(a.dir+1)%4;set(a.x,a.y,1);}
  else{a.dir=(a.dir+3)%4;set(a.x,a.y,0);}
  const dx=[1,0,-1,0],dy=[0,1,0,-1];
  a.x=(a.x+dx[a.dir]+cols)%cols;
  a.y=(a.y+dy[a.dir]+rows)%rows;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(get(x,y))set(x,y,1);
  [grid,nextGrid]=[nextGrid,grid];
}
function stepBrain(){
  nextGrid.fill(0);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=get(x,y),n=neighbors(x,y);
    if(c===0){if(n===2)set(x,y,1);}
    else if(c===1)set(x,y,2);
    else set(x,y,0);
  }
  [grid,nextGrid]=[nextGrid,grid];
}
function stepDayNight(){
  nextGrid.fill(0);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=get(x,y),n=neighbors(x,y);
    if(c){if(n===3||n===4||n===6||n===7||n===8)set(x,y,1);}
    else{if(n===3||n===6||n===7||n===8)set(x,y,1);}
  }
  [grid,nextGrid]=[nextGrid,grid];
}
function stepHighLife(){
  nextGrid.fill(0);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=get(x,y),n=neighbors(x,y);
    if(c){if(n===2||n===3)set(x,y,1);}
    else{if(n===3||n===6)set(x,y,1);}
  }
  [grid,nextGrid]=[nextGrid,grid];
}
function stepSeeds(){
  nextGrid.fill(0);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=get(x,y),n=neighbors(x,y);
    if(!c&&n===2)set(x,y,1);
  }
  [grid,nextGrid]=[nextGrid,grid];
}
const steps={life:stepLife,wireworld:stepWireWorld,langton:stepLangton,brain:stepBrain,daynight:stepDayNight,highlife:stepHighLife,seeds:stepSeeds};
function draw(){
  const cw=W/DPR,ch=H/DPR;
  ctx.fillStyle='#1a1a1a';
  ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle='#00ff88';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[idx(x,y)])ctx.fillRect(x*zoom,y*zoom,zoom,zoom);
  if(showGrid){
    ctx.strokeStyle='rgba(255,255,255,0.02)';
    ctx.lineWidth=1;
    for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*zoom,0);ctx.lineTo(x*zoom,ch);ctx.stroke();}
    for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*zoom);ctx.lineTo(cw,y*zoom);ctx.stroke();}
  }
}
function drawCell(x,y){
  const cw=W/DPR,ch=H/DPR;
  const gx=Math.floor(x/zoom),gy=Math.floor(y/zoom);
  if(gx>=0&&gx<cols&&gy>=0&&gy<rows){
    grid[idx(gx,gy)]=(rule==='wireworld'||rule==='langton')?1:1;
  }
}
document.getElementById('rule').addEventListener('change',e=>{rule=e.target.value;if(rule==='langton')window.ant=null;});
document.getElementById('speed').addEventListener('input',e=>{speed=+e.target.value;document.getElementById('speedVal').textContent=speed;});
document.getElementById('zoom').addEventListener('input',e=>{zoom=+e.target.value;document.getElementById('zoomVal').textContent=zoom;resize();});
document.getElementById('grid').addEventListener('change',e=>showGrid=e.target.checked);
document.getElementById('wrap').addEventListener('change',e=>wrap=e.target.checked);
document.getElementById('pause').addEventListener('change',e=>paused=e.target.checked);
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(mouse.down)drawCell(mouse.x,mouse.y);});
window.addEventListener('mousedown',e=>{mouse.down=true;drawCell(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>mouse.down=false);
window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;if(mouse.down)drawCell(mouse.x,mouse.y);},{passive:false});
window.addEventListener('touchstart',e=>{mouse.down=true;const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;drawCell(mouse.x,mouse.y);},{passive:false});
window.addEventListener('touchend',()=>mouse.down=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;document.getElementById('pause').checked=paused;e.preventDefault();}
  if(e.code==='KeyC'){grid.fill(0);window.ant=null;e.preventDefault();}
  if(e.code==='KeyR'){for(let i=0;i<grid.length;i++)grid[i]=Math.random()<0.3?1:0;e.preventDefault();}
});
function tick(now){
  frame++;
  if(!paused&&now-lastStep>1000/speed){steps[rule]();lastStep=now;}
  draw();
  requestAnimationFrame(tick);
}
resize();
requestAnimationFrame(tick);
</script>
</body>
</html>
