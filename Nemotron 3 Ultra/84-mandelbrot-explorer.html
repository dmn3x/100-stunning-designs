<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandelbrot Explorer — Nemotron 3 Ultra #84</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #030305; --fg: #f0ebe5; --accent: #00ffc8; --accent2: #ff3366; --accent3: #ffcc00; --card: #0a0c16; --border: #1a1f3a; --glow: rgba(0, 255, 200, 0.35); }
@media (prefers-color-scheme: light) { :root { --bg: #faf9f5; --fg: #1a1815; --accent: #00b88a; --accent2: #cc1a44; --accent3: #b8860b; --card: #ffffff; --border: #d0cec8; --glow: rgba(0, 184, 138, 0.3); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
@font-face { font-family: 'SpaceGrotesk'; src: local('Space Grotesk'), local('Inter'), local('system-ui'); font-display: swap; }
@font-face { font-family: 'JetBrainsMono'; src: local('JetBrains Mono'), local('Fira Code'), local('Monospace'); font-display: swap; }
body { font-family: 'SpaceGrotesk', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow: hidden; position: relative; }
#canvas { position: fixed; inset: 0; z-index: 0; display: block; }
.ui { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; pointer-events: none; }
.header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
.title-block h1 { font-family: 'SpaceGrotesk', system-ui; font-size: clamp(1.8rem, 5vw, 3.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.title-block .subtitle { font-family: 'JetBrainsMono', monospace; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); opacity: 0.8; margin-top: 0.25rem; }
.controls { display: flex; gap: 0.75rem; flex-wrap: wrap; pointer-events: auto; }
.btn { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.6rem 1.2rem; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; transition: all 0.15s ease; position: relative; overflow: hidden; }
.btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.15s ease; }
.btn:hover::before, .btn:focus::before { opacity: 1; }
.btn span { position: relative; z-index: 1; }
.btn.primary { border-color: var(--accent); }
.btn.primary:hover, .btn.primary:focus { border-color: var(--accent); box-shadow: 0 0 24px var(--glow); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
.info { font-family: 'JetBrainsMono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.4; }
.stats { display: flex; gap: 2rem; flex-wrap: wrap; }
.stat { text-align: right; }
.stat-value { font-family: 'SpaceGrotesk', system-ui; font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
.stat-label { font-family: 'JetBrainsMono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.5; margin-top: 0.15rem; }
.palette-selector { pointer-events: auto; }
.palette-selector select { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.5rem 1rem; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; appearance: none; }
.palette-selector select:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.coords { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.05em; color: var(--fg); opacity: 0.6; background: var(--card); padding: 0.4rem 0.8rem; border: 1px solid var(--border); border-radius: 4px; }
@media (max-width: 640px) { .header { flex-direction: column; align-items: flex-start; } .footer { flex-direction: column; align-items: flex-start; } .stats { gap: 1rem; } .controls { width: 100%; justify-content: stretch; } .palette-selector select { flex: 1; } }
</style>
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>
<div class="ui">
<header class="header">
<div class="title-block">
<h1>MANDELBROT EXPLORER</h1>
<p class="subtitle">Infinite Complexity</p>
</div>
<div class="controls">
<div class="palette-selector"><select id="paletteSelect" aria-label="Select color palette"></select></div>
<button class="btn primary" id="btnReset" aria-label="Reset view"><span>Reset</span></button>
<button class="btn" id="btnJulia" aria-label="Toggle Julia set"><span>Julia</span></button>
<button class="btn" id="btnAuto" aria-label="Auto zoom"><span>Auto Zoom</span></button>
<button class="btn" id="btnHq" aria-label="High quality"><span>HQ Render</span></button>
</div>
</header>
<footer class="footer">
<div class="coords" id="coords">Center: 0.0, 0.0 | Zoom: 1.0 | Iter: 100</div>
<div class="stats">
<div class="stat"><div class="stat-value" id="iterCount">100</div><div class="stat-label">Max Iterations</div></div>
<div class="stat"><div class="stat-value" id="zoomLevel">1.0</div><div class="stat-label">Zoom</div></div>
<div class="stat"><div class="stat-value" id="fps">60</div><div class="stat-label">FPS</div></div>
</div>
</footer>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = 0, height = 0, dpr = 1;
let centerX = -0.5, centerY = 0, zoom = 1, maxIter = 100;
let targetX = centerX, targetY = centerY, targetZoom = zoom;
let palette = 0, julia = false, juliaCx = -0.7, juliaCy = 0.27015, autoZoom = false, hq = false, running = true;
let lastTime = 0, frameCount = 0, fps = 60, fpsTime = 0, animationId = null;
const mouse = { x: 0, y: 0, down: false, lastX: 0, lastY: 0 };
const palettes = [
    (i, m) => { const t = i / m; return [Math.floor(255 * (1 - Math.cos(t * Math.PI))), Math.floor(255 * (1 - Math.cos(t * Math.PI * 2))), Math.floor(255 * (1 - Math.cos(t * Math.PI * 3)))]; },
    (i, m) => { const t = i / m; return [Math.floor(255 * t), Math.floor(255 * t * t), Math.floor(255 * Math.sqrt(t))]; },
    (i, m) => { const t = i / m; const h = (t * 360) % 360; const s = 100, l = 50; const c = (1 - Math.abs(2 * l / 100 - 1)) * s / 100; const x = c * (1 - Math.abs((h / 60) % 2 - 1)); const m2 = l / 100 - c / 2; let r, g, b; if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; } else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; } else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; } return [Math.floor((r + m2) * 255), Math.floor((g + m2) * 255), Math.floor((b + m2) * 255)]; },
    (i, m) => { const t = i / m; return [Math.floor(255 * Math.sin(t * Math.PI * 4)), Math.floor(255 * Math.sin(t * Math.PI * 4 + 2)), Math.floor(255 * Math.sin(t * Math.PI * 4 + 4))]; },
    (i, m) => { const t = i / m; return [Math.floor(255 * (1 - t)), Math.floor(255 * t), Math.floor(128 + 127 * Math.sin(t * Math.PI * 8))]; },
    (i, m) => { const t = i / m; return [Math.floor(255 * Math.pow(t, 0.3)), Math.floor(255 * Math.pow(t, 0.5)), Math.floor(255 * Math.pow(t, 2))]; },
    (i, m) => { const t = i / m; const r = Math.floor(255 * (0.5 + 0.5 * Math.sin(t * 20))); const g = Math.floor(255 * (0.5 + 0.5 * Math.sin(t * 20 + 2))); const b = Math.floor(255 * (0.5 + 0.5 * Math.sin(t * 20 + 4))); return [r, g, b]; },
    (i, m) => { const t = i / m; if (t < 0.16) return [Math.floor(255 * t / 0.16), 0, 0]; if (t < 0.33) return [255, Math.floor(255 * (t - 0.16) / 0.17), 0]; if (t < 0.5) return [255, 255, Math.floor(255 * (t - 0.33) / 0.17)]; if (t < 0.66) return [Math.floor(255 * (1 - (t - 0.5) / 0.16)), 255, 255]; if (t < 0.83) return [0, Math.floor(255 * (1 - (t - 0.66) / 0.17)), 255]; return [0, 0, Math.floor(255 * (1 - (t - 0.83) / 0.17))]; },
];
const select = document.getElementById('paletteSelect');
palettes.forEach((_, i) => { const opt = document.createElement('option'); opt.value = i; opt.textContent = `Palette ${i + 1}`; select.appendChild(opt); });
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); width = canvas.width = Math.floor(window.innerWidth * dpr); height = canvas.height = Math.floor(window.innerHeight * dpr); ctx.scale(dpr, dpr); }
function mandelbrot(cx, cy) { let x = 0, y = 0, iter = 0; const max = hq ? maxIter * 2 : maxIter; while (x * x + y * y <= 4 && iter < max) { const xt = x * x - y * y + cx; y = 2 * x * y + cy; x = xt; iter++; } return iter; }
function juliaSet(x, y) { let iter = 0; const max = hq ? maxIter * 2 : maxIter; while (x * x + y * y <= 4 && iter < max) { const xt = x * x - y * y + juliaCx; y = 2 * x * y + juliaCy; x = xt; iter++; } return iter; }
function render() { const w = width / dpr, h = height / dpr; const scale = 3 / zoom; const imageData = ctx.createImageData(w, h); const data = imageData.data; const getColor = palettes[palette]; for (let py = 0; py < h; py++) { for (let px = 0; px < w; px++) { const x = (px - w / 2) * scale / w + centerX; const y = (py - h / 2) * scale / h + centerY; let iter; if (julia) { iter = juliaSet(x, y); } else { iter = mandelbrot(x, y); } const idx = (py * w + px) * 4; if (iter === (hq ? maxIter * 2 : maxIter)) { data[idx] = data[idx + 1] = data[idx + 2] = 0; } else { const [r, g, b] = getColor(iter, hq ? maxIter * 2 : maxIter); data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; } data[idx + 3] = 255; } } ctx.putImageData(imageData, 0, 0); }
function loop(time) { if (!running) { animationId = requestAnimationFrame(loop); return; } const dt = (time - lastTime) / 1000; lastTime = time; frameCount++; if (time - fpsTime > 1000) { fps = Math.round(frameCount * 1000 / (time - fpsTime)); frameCount = 0; fpsTime = time; document.getElementById('fps').textContent = fps; } centerX += (targetX - centerX) * 0.1; centerY += (targetY - centerY) * 0.1; zoom += (targetZoom - zoom) * 0.1; if (autoZoom) { targetZoom *= 1.005; if (targetZoom > 1e12) { targetZoom = 1; targetX = -0.5; targetY = 0; } } render(); document.getElementById('coords').textContent = `Center: ${centerX.toFixed(6)}, ${centerY.toFixed(6)} | Zoom: ${zoom.toFixed(2)} | Iter: ${maxIter}`; document.getElementById('iterCount').textContent = maxIter; document.getElementById('zoomLevel').textContent = zoom.toFixed(2); animationId = requestAnimationFrame(loop); }
function init() { resize(); lastTime = performance.now(); fpsTime = performance.now(); loop(lastTime); }
function screenToComplex(sx, sy) { const w = width / dpr, h = height / dpr; const scale = 3 / zoom; return { x: (sx - w / 2) * scale / w + centerX, y: (sy - h / 2) * scale / h + centerY }; }
window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.lastX = e.clientX; mouse.lastY = e.clientY; canvas.style.cursor = 'grabbing'; });
window.addEventListener('mousemove', e => { if (mouse.down) { const c1 = screenToComplex(mouse.lastX, mouse.lastY); const c2 = screenToComplex(e.clientX, e.clientY); targetX -= (c2.x - c1.x); targetY -= (c2.y - c1.y); mouse.lastX = e.clientX; mouse.lastY = e.clientY; } });
window.addEventListener('mouseup', () => { mouse.down = false; canvas.style.cursor = 'grab'; });
canvas.addEventListener('wheel', e => { e.preventDefault(); const c = screenToComplex(e.clientX, e.clientY); const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9; targetZoom *= zoomFactor; targetX = c.x + (targetX - c.x) * zoomFactor; targetY = c.y + (targetY - c.y) * zoomFactor; }, { passive: false });
canvas.addEventListener('dblclick', e => { const c = screenToComplex(e.clientX, e.clientY); targetX = c.x; targetY = c.y; targetZoom *= 4; });
select.addEventListener('change', e => { palette = parseInt(e.target.value); });
document.getElementById('btnReset').addEventListener('click', () => { targetX = -0.5; targetY = 0; targetZoom = 1; });
document.getElementById('btnJulia').addEventListener('click', () => { julia = !julia; document.getElementById('btnJulia').classList.toggle('primary', julia); });
document.getElementById('btnAuto').addEventListener('click', () => { autoZoom = !autoZoom; document.getElementById('btnAuto').classList.toggle('primary', autoZoom); });
document.getElementById('btnHq').addEventListener('click', () => { hq = !hq; document.getElementById('btnHq').classList.toggle('primary', hq); });
document.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') { targetX = -0.5; targetY = 0; targetZoom = 1; } else if (e.key === 'j' || e.key === 'J') { julia = !julia; document.getElementById('btnJulia').classList.toggle('primary', julia); } else if (e.key === 'a' || e.key === 'A') { autoZoom = !autoZoom; document.getElementById('btnAuto').classList.toggle('primary', autoZoom); } else if (e.key === 'h' || e.key === 'H') { hq = !hq; document.getElementById('btnHq').classList.toggle('primary', hq); } else if (e.key >= '1' && e.key <= '8') { palette = parseInt(e.key) - 1; select.value = palette; } else if (e.key === 'ArrowUp') { targetY -= 0.1 / zoom; } else if (e.key === 'ArrowDown') { targetY += 0.1 / zoom; } else if (e.key === 'ArrowLeft') { targetX -= 0.1 / zoom; } else if (e.key === 'ArrowRight') { targetX += 0.1 / zoom; } else if (e.key === '+' || e.key === '=') { targetZoom *= 2; } else if (e.key === '-' || e.key === '_') { targetZoom *= 0.5; } });
init();
</script>
</body>
</html>
