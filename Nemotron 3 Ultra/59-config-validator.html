<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>59 — Config Validator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--fg:#e6edf3;--muted:#484f58;--accent:#58a6ff;--accent2:#3fb950;--accent3:#d29922;--accent4:#f85149;--card:#161b22;--border:#30363d}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.6 'JetBrains Mono','SF Mono',monospace;overflow:auto}
.layout{display:grid;grid-template-columns:1fr 400px;height:100%}
@media (max-width:1000px){.layout{grid-template-columns:1fr;grid-template-rows:1fr auto}}
.editor{padding:1.5rem;overflow:auto}
.editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.editor-header h2{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.editor-actions{display:flex;gap:.5rem}
.btn{padding:.5rem 1rem;border:1px solid var(--border);background:var(--card);color:var(--fg);font:inherit;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--fg);font:inherit;padding:1rem;border-radius:4px;font-size:.8rem;min-height:60vh;resize:vertical;font-family:'JetBrains Mono',monospace;line-height:1.7}
.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)33}
.results{background:var(--card);border-left:1px solid var(--border);padding:1.5rem;overflow:auto}
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.results-header h3{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.issue-count{display:flex;gap:1rem;font-size:.75rem}
.issue-count .error{color:var(--accent4)}
.issue-count .warning{color:var(--accent3)}
.issue-count .info{color:var(--accent)}
.issue-list{max-height:70vh;overflow:auto}
.issue{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1rem;margin-bottom:.75rem}
.issue-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.issue-type{font-size:.55rem;padding:.15rem .4rem;border-radius:3px;font-weight:700;text-transform:uppercase}
.issue-type.error{background:rgba(248,81,73,.2);color:var(--accent4)}
.issue-type.warning{background:rgba(210,153,34,.2);color:var(--accent3)}
.issue-type.info{background:rgba(88,166,255,.2);color:var(--accent)}
.issue-path{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted)}
.issue-message{color:var(--fg);font-size:.8rem;line-height:1.6}
.issue-suggestion{margin-top:.5rem;padding:.5rem;background:rgba(88,166,255,.1);border-radius:3px;font-size:.7rem;color:var(--accent)}
.schema-selector{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:.75rem;margin-bottom:1rem}
.schema-selector label{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:.5rem}
.schema-selector select{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:.35rem .5rem;border-radius:3px;font:inherit}
.footer{grid-column:1/-1;text-align:center;padding:2rem;border-top:1px solid var(--border);color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div class="layout">
<div class="editor">
<div class="editor-header"><h2>Configuration</h2><div class="editor-actions"><button class="btn" id="validateBtn">Validate</button><button class="btn primary" id="formatBtn">Format</button><button class="btn" id="loadSample">Load Sample</button></div></div>
<div class="schema-selector"><label>Schema</label><select id="schemaSelect"><option value="json">JSON Schema</option><option value="yaml">YAML</option><option value="toml">TOML</option><option value="docker">Docker Compose</option><option value="k8s">Kubernetes</option><option value="env">Environment</option></select></div>
<textarea class="textarea" id="editor" spellcheck="false" placeholder="Paste your configuration here..."></textarea>
</div>
<div class="results">
<div class="results-header"><h3>Validation Results</h3><div class="issue-count"><span class="error" id="errCount">0 Errors</span><span class="warning" id="warnCount">0 Warnings</span><span class="info" id="infoCount">0 Info</span></div></div>
<div class="issue-list" id="issueList"><div style="color:var(--muted);text-align:center;padding:2rem">No validation run yet</div></div>
</div>
</div>
<footer class="footer">Nemotron 3 Ultra · 059 / 100 · Config Validator</footer>
<script>
const editor=document.getElementById('editor');
const issueList=document.getElementById('issueList');
const errCount=document.getElementById('errCount');
const warnCount=document.getElementById('warnCount');
const infoCount=document.getElementById('infoCount');
const schemas={
  json:`{
  "name": "my-app",
  "version": "1.0.0",
  "description": "Sample JSON config",
  "main": "index.js",
  "scripts": {
    "start": "node index.js",
    "test": "jest"
  },
  "dependencies": {
    "express": "^4.18.0",
    "lodash": "^4.17.21"
  },
  "engines": {
    "node": ">=18.0.0"
  }
}`,
  yaml:`version: '3.8'
services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html
    environment:
      - NODE_ENV=production
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:`,
  toml:`[package]
name = "my-app"
version = "1.0.0"
authors = ["Dhafin Dzimar"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1`,
  docker:`version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/app
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 1G
  db:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
volumes:
  db_data:`,
  k8s:`apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: app
        image: my-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"`,
  env:`# Application
APP_NAME=my-app
APP_ENV=production
APP_DEBUG=false
APP_URL=https://app.example.com

# Database
DB_CONNECTION=pgsql
DB_HOST=db.example.com
DB_PORT=5432
DB_DATABASE=myapp
DB_USERNAME=user
DB_PASSWORD=secret

# Redis
REDIS_HOST=redis.example.com
REDIS_PORT=6379
REDIS_PASSWORD=

# Mail
MAIL_MAILER=smtp
MAIL_HOST=smtp.example.com
MAIL_PORT=587
MAIL_USERNAME=noreply@example.com
MAIL_PASSWORD=secret
MAIL_ENCRYPTION=tls`
};
editor.value=schemas.json;
function validate(){
  const content=editor.value;
  const type=document.getElementById('schemaSelect').value;
  const issues=[];
  const lines=content.split('\n');
  // Basic syntax checks
  try{
    if(type==='json'){JSON.parse(content);}
    else if(type==='yaml'||type==='docker'||type==='k8s'){
      // Simple YAML checks
      lines.forEach((line,i)=>{
        if(line.trim()&&!line.startsWith('#')&&!line.startsWith(' ')&&!line.startsWith('\t')&&line.includes(':')&&!line.match(/^\s*\w+:/)){
          issues.push({type:'warning',path:`Line ${i+1}`,message:'Possible YAML indentation issue',suggestion:'Ensure consistent indentation (2 spaces)'});
        }
        if(line.match(/:\s*$/)){issues.push({type:'info',path:`Line ${i+1}`,message:'Empty value',suggestion:'Add value or remove key'});}
      });
    }else if(type==='toml'){
      lines.forEach((line,i)=>{
        if(line.includes('=')&&!line.match(/^\s*[\w-]+\s*=/)){issues.push({type:'warning',path:`Line ${i+1}`,message:'Possible TOML syntax issue'});}
      });
    }else if(type==='env'){
      lines.forEach((line,i)=>{
        if(line.trim()&&!line.startsWith('#')&&!line.includes('=')){issues.push({type:'error',path:`Line ${i+1}`,message:'Missing "=" separator',suggestion:'Use KEY=VALUE format'});}
        if(line.match(/^\s*[A-Z_]+=\s*$/)){issues.push({type:'warning',path:`Line ${i+1}`,message:'Empty value',suggestion:'Consider if this is intentional'});}
      });
    }
  }catch(e){
    issues.push({type:'error',path:'Parse',message:e.message,suggestion:'Check syntax near reported position'});
  }
  // Common checks
  lines.forEach((line,i)=>{
    if(line.length>120){issues.push({type:'warning',path:`Line ${i+1}`,message:'Line exceeds 120 characters',suggestion:'Consider breaking into multiple lines'});}
    if(line.match(/password|secret|key|token/gi)&&line.includes('=')&&!line.includes('${')&&!line.includes('$')){issues.push({type:'warning',path:`Line ${i+1}`,message:'Possible hardcoded secret',suggestion:'Use environment variables or secret management'});}
  });
  renderIssues(issues);
}
function renderIssues(issues){
  const errors=issues.filter(i=>i.type==='error').length;
  const warns=issues.filter(i=>i.type==='warning').length;
  const infos=issues.filter(i=>i.type==='info').length;
  errCount.textContent=`${errors} Error${errors!==1?'s':''}`;
  warnCount.textContent=`${warns} Warning${warns!==1?'s':''}`;
  infoCount.textContent=`${infos} Info`;
  if(issues.length===0){
    issueList.innerHTML='<div style="color:var(--accent2);text-align:center;padding:2rem">✓ No issues found</div>';
    return;
  }
  issueList.innerHTML=issues.map(i=>`<div class="issue"><div class="issue-header"><span class="issue-type ${i.type}">${i.type}</span><span class="issue-path">${i.path}</span></div><div class="issue-message">${i.message}</div>${i.suggestion?`<div class="issue-suggestion">${i.suggestion}</div>`:''}</div>`).join('');
}
document.getElementById('validateBtn').onclick=validate;
document.getElementById('formatBtn').onclick=()=>{
  const type=document.getElementById('schemaSelect').value;
  try{
    if(type==='json'){editor.value=JSON.stringify(JSON.parse(editor.value),null,2);}
    else{alert('Formatting only available for JSON in this demo');}
  }catch(e){alert('Invalid JSON: '+e.message);}
};
document.getElementById('loadSample').onclick=()=>{
  const type=document.getElementById('schemaSelect').value;
  editor.value=schemas[type];
  validate();
};
document.getElementById('schemaSelect').onchange=()=>{
  editor.value=schemas[document.getElementById('schemaSelect').value];
  validate();
};
validate();
</script>
</body>
</html>
