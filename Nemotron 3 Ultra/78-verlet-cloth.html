<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verlet Cloth — Nemotron 3 Ultra #78</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #050508; --fg: #f0ebe5; --accent: #00ffc8; --accent2: #ff3366; --accent3: #ffcc00; --card: #0d0f1a; --border: #1a1f3a; --glow: rgba(0, 255, 200, 0.35); }
@media (prefers-color-scheme: light) { :root { --bg: #faf9f5; --fg: #1a1815; --accent: #00b88a; --accent2: #cc1a44; --accent3: #b8860b; --card: #ffffff; --border: #d0cec8; --glow: rgba(0, 184, 138, 0.3); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
@font-face { font-family: 'SpaceGrotesk'; src: local('Space Grotesk'), local('Inter'), local('system-ui'); font-display: swap; }
@font-face { font-family: 'JetBrainsMono'; src: local('JetBrains Mono'), local('Fira Code'), local('Monospace'); font-display: swap; }
body { font-family: 'SpaceGrotesk', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow: hidden; position: relative; }
#canvas { position: fixed; inset: 0; z-index: 0; display: block; }
.ui { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; pointer-events: none; }
.header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
.title-block h1 { font-family: 'SpaceGrotesk', system-ui; font-size: clamp(1.8rem, 5vw, 3.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.title-block .subtitle { font-family: 'JetBrainsMono', monospace; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); opacity: 0.8; margin-top: 0.25rem; }
.controls { display: flex; gap: 0.75rem; flex-wrap: wrap; pointer-events: auto; }
.btn { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.6rem 1.2rem; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; transition: all 0.15s ease; position: relative; overflow: hidden; }
.btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.15s ease; }
.btn:hover::before, .btn:focus::before { opacity: 1; }
.btn span { position: relative; z-index: 1; }
.btn.primary { border-color: var(--accent); }
.btn.primary:hover, .btn.primary:focus { border-color: var(--accent); box-shadow: 0 0 24px var(--glow); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
.info { font-family: 'JetBrainsMono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.4; }
.stats { display: flex; gap: 2rem; flex-wrap: wrap; }
.stat { text-align: right; }
.stat-value { font-family: 'SpaceGrotesk', system-ui; font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
.stat-label { font-family: 'JetBrainsMono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.5; margin-top: 0.15rem; }
@media (max-width: 640px) { .header { flex-direction: column; align-items: flex-start; } .footer { flex-direction: column; align-items: flex-start; } .stats { gap: 1rem; } }
</style>
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>
<div class="ui">
<header class="header">
<div class="title-block">
<h1>VERLET CLOTH</h1>
<p class="subtitle">Constraint-Based Simulation</p>
</div>
<div class="controls">
<button class="btn primary" id="btnReset" aria-label="Reset cloth"><span>Reset</span></button>
<button class="btn" id="btnPause" aria-label="Toggle simulation"><span>Pause</span></button>
<button class="btn" id="btnTear" aria-label="Toggle tear mode"><span>Tear Mode</span></button>
<button class="btn" id="btnWind" aria-label="Toggle wind"><span>Wind</span></button>
<button class="btn" id="btnPins" aria-label="Toggle pins"><span>Pins</span></button>
</div>
</header>
<footer class="footer">
<p class="info" id="infoText">Drag to tear cloth • Scroll to zoom • Keys: Space pause • R reset • T tear • W wind • P pins</p>
<div class="stats">
<div class="stat"><div class="stat-value" id="pointCount">0</div><div class="stat-label">Points</div></div>
<div class="stat"><div class="stat-value" id="constraintCount">0</div><div class="stat-label">Constraints</div></div>
<div class="stat"><div class="stat-value" id="fps">60</div><div class="stat-label">FPS</div></div>
</div>
</footer>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = 0, height = 0, dpr = 1;
const gravity = 0.5;
const stiffness = 0.99;
const iterations = 5;
const spacing = 12;
let points = [], constraints = [], pins = new Set(), tearMode = false, wind = false, paused = false, running = true;
let lastTime = 0, frameCount = 0, fps = 60, fpsTime = 0, animationId = null;
const mouse = { x: 0, y: 0, down: false, lastX: 0, lastY: 0, worldX: 0, worldY: 0 };
const camera = { x: 0, y: 0, scale: 1, targetX: 0, targetY: 0, targetScale: 1 };
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); width = canvas.width = Math.floor(window.innerWidth * dpr); height = canvas.height = Math.floor(window.innerHeight * dpr); ctx.scale(dpr, dpr); camera.targetX = width / dpr / 2; camera.targetY = height / dpr / 2; createCloth(); }
function createCloth() { const cols = Math.floor((width / dpr - 100) / spacing); const rows = Math.floor((height / dpr - 100) / spacing); points = []; constraints = []; pins.clear(); const startX = (width / dpr - cols * spacing) / 2; const startY = (height / dpr - rows * spacing) / 2; for (let y = 0; y < rows; y++) { for (let x = 0; x < cols; x++) { const i = points.length; points.push({ x: startX + x * spacing, y: startY + y * spacing, px: startX + x * spacing, py: startY + y * spacing, vx: 0, vy: 0, pinned: y === 0 && (x % 3 === 0 || x === 0 || x === cols - 1) }); if (points[i].pinned) pins.add(i); } } for (let y = 0; y < rows; y++) { for (let x = 0; x < cols; x++) { const i = y * cols + x; if (x < cols - 1) constraints.push({ a: i, b: i + 1, length: spacing }); if (y < rows - 1) constraints.push({ a: i, b: i + cols, length: spacing }); if (x < cols - 1 && y < rows - 1) { constraints.push({ a: i, b: i + cols + 1, length: spacing * Math.SQRT2 }); constraints.push({ a: i + 1, b: i + cols, length: spacing * Math.SQRT2 }); } } } document.getElementById('pointCount').textContent = points.length.toLocaleString(); document.getElementById('constraintCount').textContent = constraints.length.toLocaleString(); }
function physics(dt) { if (paused) return; const subSteps = 3; const subDt = dt / subSteps; for (let s = 0; s < subSteps; s++) { points.forEach(p => { if (p.pinned) return; p.vy += gravity * subDt; if (wind) { p.vx += Math.sin(Date.now() * 0.001 + p.y * 0.01) * 0.3 * subDt; p.vx += Math.cos(Date.now() * 0.0007 + p.x * 0.01) * 0.2 * subDt; } p.x += p.vx * subDt; p.y += p.vy * subDt; }); for (let i = 0; i < iterations; i++) { constraints.forEach(c => { const a = points[c.a], b = points[c.b]; const dx = b.x - a.x, dy = b.y - a.y; const dist = Math.sqrt(dx * dx + dy * dy) || 1; const diff = (dist - c.length) / dist; const moveX = dx * diff * 0.5 * stiffness; const moveY = dy * diff * 0.5 * stiffness; if (!a.pinned) { a.x += moveX; a.y += moveY; } if (!b.pinned) { b.x -= moveX; b.y -= moveY; } }); } points.forEach(p => { if (p.pinned) { p.x = p.px; p.y = p.py; return; } p.vx = (p.x - p.px) * 0.99; p.vy = (p.y - p.py) * 0.99; p.px = p.x; p.py = p.y; const r = 2; if (p.x < r) p.x = r; if (p.x > width / dpr - r) p.x = width / dpr - r; if (p.y < r) p.y = r; if (p.y > height / dpr - r) p.y = height / dpr - r; }); if (tearMode && mouse.down) { const mx = mouse.worldX, my = mouse.worldY; constraints = constraints.filter(c => { const a = points[c.a], b = points[c.b]; const dx1 = a.x - mx, dy1 = a.y - my; const dx2 = b.x - mx, dy2 = b.y - my; return dx1 * dx1 + dy1 * dy1 > 900 || dx2 * dx2 + dy2 * dy2 > 900; }); } } }
function render() { ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, width / dpr, height / dpr); ctx.save(); ctx.translate(width / dpr / 2 - camera.x * camera.scale, height / dpr / 2 - camera.y * camera.scale); ctx.scale(camera.scale, camera.scale); ctx.strokeStyle = 'rgba(0, 255, 200, 0.15)'; ctx.lineWidth = 1 / camera.scale; ctx.beginPath(); constraints.forEach(c => { const a = points[c.a], b = points[c.b]; ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }); ctx.stroke(); points.forEach((p, i) => { if (p.pinned) { ctx.fillStyle = '#ff3366'; ctx.beginPath(); ctx.arc(p.x, p.y, 3 / camera.scale, 0, Math.PI * 2); ctx.fill(); } }); ctx.restore(); }
function loop(time) { if (!running) { animationId = requestAnimationFrame(loop); return; } const dt = Math.min((time - lastTime) / 16.67, 3); lastTime = time; frameCount++; if (time - fpsTime > 1000) { fps = Math.round(frameCount * 1000 / (time - fpsTime)); frameCount = 0; fpsTime = time; document.getElementById('fps').textContent = fps; } camera.x += (camera.targetX - camera.x) * 0.08; camera.y += (camera.targetY - camera.y) * 0.08; camera.scale += (camera.targetScale - camera.scale) * 0.08; physics(dt); render(); animationId = requestAnimationFrame(loop); }
function init() { resize(); lastTime = performance.now(); fpsTime = performance.now(); loop(lastTime); }
function screenToWorld(sx, sy) { return { x: (sx - width / dpr / 2 + camera.x * camera.scale) / camera.scale, y: (sy - height / dpr / 2 + camera.y * camera.scale) / camera.scale }; }
window.addEventListener('resize', () => { const oldW = width / dpr, oldH = height / dpr; resize(); camera.targetX *= (width / dpr) / oldW; camera.targetY *= (height / dpr) / oldH; });
canvas.addEventListener('mousedown', e => { mouse.down = true; mouse.lastX = e.clientX; mouse.lastY = e.clientY; const w = screenToWorld(e.clientX, e.clientY); mouse.worldX = w.x; mouse.worldY = w.y; canvas.style.cursor = tearMode ? 'crosshair' : 'grabbing'; });
window.addEventListener('mousemove', e => { const w = screenToWorld(e.clientX, e.clientY); mouse.worldX = w.x; mouse.worldY = w.y; if (mouse.down) { if (tearMode) { } else { const dx = (e.clientX - mouse.lastX) / camera.scale; const dy = (e.clientY - mouse.lastY) / camera.scale; camera.targetX -= dx; camera.targetY -= dy; mouse.lastX = e.clientX; mouse.lastY = e.clientY; } } });
window.addEventListener('mouseup', () => { mouse.down = false; canvas.style.cursor = 'grab'; });
canvas.addEventListener('wheel', e => { e.preventDefault(); const zoom = e.deltaY > 0 ? 0.9 : 1.1; camera.targetScale = Math.max(0.3, Math.min(3, camera.targetScale * zoom)); }, { passive: false });
document.getElementById('btnReset').addEventListener('click', createCloth);
document.getElementById('btnPause').addEventListener('click', () => { paused = !paused; running = !paused; document.getElementById('btnPause').querySelector('span').textContent = paused ? 'Resume' : 'Pause'; if (running) { lastTime = performance.now(); loop(lastTime); } });
document.getElementById('btnTear').addEventListener('click', () => { tearMode = !tearMode; document.getElementById('btnTear').classList.toggle('primary', tearMode); });
document.getElementById('btnWind').addEventListener('click', () => { wind = !wind; document.getElementById('btnWind').classList.toggle('primary', wind); });
document.getElementById('btnPins').addEventListener('click', () => { points.forEach((p, i) => { if (i % Math.floor(points.length / 10) === 0) { p.pinned = !p.pinned; if (p.pinned) { p.px = p.x; p.py = p.y; pins.add(i); } else { pins.delete(i); } } }); document.getElementById('btnPins').classList.toggle('primary', pins.size > 0); });
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); paused = !paused; running = !paused; document.getElementById('btnPause').querySelector('span').textContent = paused ? 'Resume' : 'Pause'; if (running) { lastTime = performance.now(); loop(lastTime); } } else if (e.key === 'r' || e.key === 'R') { createCloth(); } else if (e.key === 't' || e.key === 'T') { tearMode = !tearMode; document.getElementById('btnTear').classList.toggle('primary', tearMode); } else if (e.key === 'w' || e.key === 'W') { wind = !wind; document.getElementById('btnWind').classList.toggle('primary', wind); } else if (e.key === 'p' || e.key === 'P') { points.forEach((p, i) => { if (i % Math.floor(points.length / 10) === 0) { p.pinned = !p.pinned; if (p.pinned) { p.px = p.x; p.py = p.y; pins.add(i); } else { pins.delete(i); } } }); document.getElementById('btnPins').classList.toggle('primary', pins.size > 0); } });
init();
</script>
</body>
</html>
