<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 — Quantum Foam</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#030305;--fg:#f0f0f5;--muted:#1a1a25;--accent:#00ffff;--accent2:#ff00ff}
html,body{height:100%;background:var(--bg);color:var(--fg);font:12px/1.5 'Space Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.08em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stats{bottom:1.5rem;left:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;line-height:1.8}
.hint{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.6;text-align:right}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .stats{bottom:1rem;left:1rem;font-size:.55rem}
  .hint{bottom:1rem;right:1rem;font-size:.55rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Quantum Foam</div>
<div class="ui subtitle">planck-scale fluctuations</div>
<div class="ui stats">
Fluctuations: <span id="count">0</span><br>
Lifetime: <span id="life">0</span>ms<br>
Energy: <span id="energy">0</span>
</div>
<div class="ui hint">click for energy burst<br><kbd>Space</kbd> reset · <kbd>C</kbd> color mode</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const particles=[],MAX=2000;
let frame=0,colorMode=0;
let mouse={x:0,y:0,down:false};
const palettes=[
  [[0,255,255],[255,0,255],[255,255,0],[0,255,136]],
  [[255,255,255],[200,200,255],[255,200,255],[255,255,200]],
  [[255,107,157],[0,229,255],[255,215,0],[144,238,144]]
];
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
}
class Fluctuation{
  constructor(x,y,energy=1,burst=false){
    this.x=x;this.y=y;
    this.vx=(Math.random()-0.5)*(burst?4:1);
    this.vy=(Math.random()-0.5)*(burst?4:1);
    this.life=1;
    this.decay=burst?0.02:0.003+Math.random()*0.005;
    this.size=burst?3+Math.random()*4:1+Math.random()*2;
    this.energy=energy;
    this.color=palettes[colorMode][Math.floor(Math.random()*palettes[colorMode].length)];
    this.trail=[];
    this.maxTrail=burst?6:15;
  }
  update(){
    this.trail.unshift({x:this.x,y:this.y});
    if(this.trail.length>this.maxTrail)this.trail.pop();
    this.vx*=0.995;this.vy*=0.995;
    this.x+=this.vx;this.y+=this.vy;
    this.life-=this.decay;
    if(this.x<0||this.x>W/DPR||this.y<0||this.y>H/DPR){
      this.x=Math.max(0,Math.min(W/DPR,this.x));
      this.y=Math.max(0,Math.min(H/DPR,this.y));
      this.vx*=-0.3;this.vy*=-0.3;
    }
  }
  draw(){
    if(this.trail.length<2)return;
    const [r,g,b]=this.color;
    ctx.beginPath();
    ctx.moveTo(this.trail[0].x,this.trail[0].y);
    for(let i=1;i<this.trail.length;i++){
      const t=this.trail[i],a=(1-i/this.trail.length)*this.life*0.5;
      ctx.lineTo(t.x,t.y);
      ctx.strokeStyle=`rgba(${r},${g},${b},${a})`;
      ctx.lineWidth=this.size*(1-i/this.trail.length)*0.6;
      ctx.stroke();
      ctx.beginPath();ctx.moveTo(t.x,t.y);
    }
    ctx.beginPath();
    ctx.arc(this.x,this.y,Math.max(0.5,this.size*this.life),0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${this.life*0.8})`;
    ctx.fill();
  }
}
function spawnBurst(x,y,count=50){
  for(let i=0;i<count&&particles.length<MAX;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=1+Math.random()*5;
    const p=new Fluctuation(x,y,2,true);
    p.vx=Math.cos(angle)*speed;
    p.vy=Math.sin(angle)*speed;
    p.size=2+Math.random()*3;
    p.decay=0.015+Math.random()*0.02;
    particles.push(p);
  }
}
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('mousedown',e=>{mouse.down=true;spawnBurst(e.clientX,e.clientY,30);});
window.addEventListener('mouseup',()=>mouse.down=false);
window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;if(mouse.down)spawnBurst(t.clientX,t.clientY,5);},{passive:false});
window.addEventListener('touchstart',e=>{mouse.down=true;const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;spawnBurst(t.clientX,t.clientY,30);},{passive:false});
window.addEventListener('touchend',()=>mouse.down=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){particles.length=0;frame=0;e.preventDefault();}
  if(e.code==='KeyC'){colorMode=(colorMode+1)%palettes.length;}
});
function tick(){
  frame++;
  ctx.fillStyle='rgba(3,3,5,0.12)';
  ctx.fillRect(0,0,W/DPR,H/DPR);
  if(mouse.down&&Math.random()<0.3)spawnBurst(mouse.x,mouse.y,1);
  if(particles.length<50&&Math.random()<0.02){
    particles.push(new Fluctuation(Math.random()*W/DPR,Math.random()*H/DPR));
  }
  let totalEnergy=0;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.update();p.draw();
    totalEnergy+=p.energy*p.life;
    if(p.life<=0)particles.splice(i,1);
  }
  document.getElementById('count').textContent=particles.length;
  document.getElementById('life').textContent=(particles.reduce((a,p)=>a+p.life,0)/Math.max(1,particles.length)*1000).toFixed(0);
  document.getElementById('energy').textContent=totalEnergy.toFixed(1);
  requestAnimationFrame(tick);
}
resize();
for(let i=0;i<80;i++)particles.push(new Fluctuation(Math.random()*W/DPR,Math.random()*H/DPR));
tick();
</script>
</body>
</html>
