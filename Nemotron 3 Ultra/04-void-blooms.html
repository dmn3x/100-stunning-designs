<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 — Void Blooms</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#030305;--fg:#e8e8f0;--muted:#3a3a4a;--accent:#ff6b9d;--accent2:#00e5ff}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'JetBrains Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.08em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stats{bottom:1.5rem;left:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;line-height:1.8}
.controls{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.6;text-align:right}
.mode-btn{background:transparent;border:1px solid var(--muted);color:var(--fg);padding:.3rem .6rem;margin:.15rem;font-size:.55rem;cursor:pointer;transition:.15s}
.mode-btn:hover,.mode-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(255,107,157,0.1)}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .stats{bottom:1rem;left:1rem;font-size:.55rem}
  .controls{bottom:1rem;right:1rem;font-size:.55rem}
  .mode-btn{padding:.2rem .4rem;font-size:.5rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Void Blooms</div>
<div class="ui subtitle">diffusion-limited aggregation</div>
<div class="ui stats">
Particles: <span id="count">0</span><br>
Clusters: <span id="clusters">0</span><br>
Iteration: <span id="iter">0</span>
</div>
<div class="ui controls">
<div id="modeBtns"></div>
<kbd>Space</kbd> reset · <kbd>C</kbd> clear trails
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const MAX=3000;
let particles=[],clusters=[],frame=0,mode=0,trails=true;
const modes=['DLA','Ballistic','Guided','Magnetic'];
const colors=[[255,107,157],[0,229,255],[255,215,0],[144,238,144],[255,140,0],[186,85,211]];
let mouse={x:0,y:0,down:false};
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
}
class Particle{
  constructor(x,y,isSeed=false){
    this.x=x;this.y=y;
    this.vx=(Math.random()-0.5)*1.5;
    this.vy=(Math.random()-0.5)*1.5;
    this.life=1;
    this.isSeed=isSeed;
    this.color=isSeed?colors[Math.floor(Math.random()*colors.length)]:[200,200,210];
    this.size=isSeed?3:1.5;
    this.trail=[];
    this.maxTrail=20;
    this.attached=false;
    this.clusterId=-1;
  }
  update(){
    if(this.attached)return;
    this.trail.unshift({x:this.x,y:this.y});
    if(this.trail.length>this.maxTrail)this.trail.pop();
    if(mode===1){
      this.vx=(Math.random()-0.5)*2;
      this.vy=(Math.random()-0.5)*2;
    }else if(mode===2&&mouse.down){
      const dx=mouse.x-this.x,dy=mouse.y-this.y,dist=Math.hypot(dx,dy)||1;
      this.vx+=dx/dist*0.02;this.vy+=dy/dist*0.02;
    }else if(mode===3){
      const dx=mouse.x-this.x,dy=mouse.y-this.y,dist=Math.hypot(dx,dy)||1;
      const angle=Math.atan2(dy,dx)+Math.PI/2;
      this.vx+=Math.cos(angle)*0.01;this.vy+=Math.sin(angle)*0.01;
    }
    this.vx*=0.98;this.vy*=0.98;
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<0||this.x>W/DPR||this.y<0||this.y>H/DPR){
      this.x=Math.max(0,Math.min(W/DPR,this.x));
      this.y=Math.max(0,Math.min(H/DPR,this.y));
      this.vx*=-0.5;this.vy*=-0.5;
    }
    for(const c of clusters){
      if(Math.hypot(this.x-c.x,this.y-c.y)<c.radius+5){
        this.attach(c);break;
      }
    }
  }
  attach(cluster){
    this.attached=true;
    this.clusterId=cluster.id;
    cluster.particles.push(this);
    cluster.radius=Math.max(cluster.radius,Math.hypot(this.x-cluster.x,this.y-cluster.y)+2);
  }
  draw(){
    if(trails&&this.trail.length>1){
      const [r,g,b]=this.color;
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x,this.trail[0].y);
      for(let i=1;i<this.trail.length;i++){
        const t=this.trail[i],a=(1-i/this.trail.length)*0.4;
        ctx.lineTo(t.x,t.y);
        ctx.strokeStyle=`rgba(${r},${g},${b},${a})`;
        ctx.lineWidth=this.size*(1-i/this.trail.length)*0.8;
        ctx.stroke();
        ctx.beginPath();ctx.moveTo(t.x,t.y);
      }
    }
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=this.isSeed?`rgb(${this.color.join(',')})`:'#c8c8d0';
    ctx.fill();
  }
}
class Cluster{
  constructor(x,y){
    this.x=x;this.y=y;
    this.particles=[];
    this.radius=8;
    this.id=Date.now()+Math.random();
    this.color=colors[Math.floor(Math.random()*colors.length)];
  }
  draw(){
    const [r,g,b]=this.color;
    for(const p of this.particles){
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(1,p.size*0.8),0,Math.PI*2);
      ctx.fillStyle=`rgba(${r},${g},${b},0.9)`;
      ctx.fill();
    }
  }
}
function seed(x,y,count=1){
  for(let i=0;i<count&&particles.length<MAX;i++){
    particles.push(new Particle(x+(Math.random()-0.5)*20,y+(Math.random()-0.5)*20));
  }
}
function spawnSeed(){
  const x=Math.random()*W/DPR,y=Math.random()*H/DPR;
  const c=new Cluster(x,y);
  c.particles.push(new Particle(x,y,true));
  clusters.push(c);
}
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('mousedown',e=>{mouse.down=true;seed(e.clientX,e.clientY,8);});
window.addEventListener('mouseup',()=>mouse.down=false);
window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;if(mouse.down)seed(t.clientX,t.clientY,2);},{passive:false});
window.addEventListener('touchstart',e=>{mouse.down=true;const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;seed(t.clientX,t.clientY,8);},{passive:false});
window.addEventListener('touchend',()=>mouse.down=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){particles=[];clusters=[];frame=0;for(let i=0;i<5;i++)spawnSeed();e.preventDefault();}
  if(e.code==='KeyC'){trails=!trails;}
  if(e.code==='Digit1'){mode=0;updateModeBtns();}
  if(e.code==='Digit2'){mode=1;updateModeBtns();}
  if(e.code==='Digit3'){mode=2;updateModeBtns();}
  if(e.code==='Digit4'){mode=3;updateModeBtns();}
});
const modeBtns=document.getElementById('modeBtns');
modes.forEach((m,i)=>{
  const btn=document.createElement('button');
  btn.className='mode-btn'+(i===0?' active':'');
  btn.textContent=m;
  btn.onclick=()=>{mode=i;updateModeBtns();};
  modeBtns.appendChild(btn);
});
function updateModeBtns(){
  modeBtns.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===mode));
}
function tick(){
  frame++;
  ctx.fillStyle='rgba(3,3,5,0.08)';
  ctx.fillRect(0,0,W/DPR,H/DPR);
  if(clusters.length===0)spawnSeed();
  for(const p of particles)p.update();
  for(const p of particles)p.draw();
  for(const c of clusters)c.draw();
  const free=particles.filter(p=>!p.attached);
  document.getElementById('count').textContent=free.length;
  document.getElementById('clusters').textContent=clusters.length;
  document.getElementById('iter').textContent=frame;
  if(free.length<20&&Math.random()<0.005)spawnSeed();
  if(particles.length>MAX*0.9){
    particles=particles.filter(p=>!p.attached||Math.random()<0.3);
  }
  requestAnimationFrame(tick);
}
resize();
for(let i=0;i<3;i++)spawnSeed();
tick();
</script>
</body>
</html>
