<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voronoi Mosaic — Nemotron 3 Ultra #99</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #030305; --fg: #f0ebe5; --accent: #00ffc8; --accent2: #ff3366; --accent3: #ffcc00; --card: #0a0c16; --border: #1a1f3a; --glow: rgba(0, 255, 200, 0.35); }
@media (prefers-color-scheme: light) { :root { --bg: #faf9f5; --fg: #1a1815; --accent: #00b88a; --accent2: #cc1a44; --accent3: #b8860b; --card: #ffffff; --border: #d0cec8; --glow: rgba(0, 184, 138, 0.3); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
@font-face { font-family: 'SpaceGrotesk'; src: local('Space Grotesk'), local('Inter'), local('system-ui'); font-display: swap; }
@font-face { font-family: 'JetBrainsMono'; src: local('JetBrains Mono'), local('Fira Code'), local('Monospace'); font-display: swap; }
body { font-family: 'SpaceGrotesk', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow: hidden; position: relative; }
#canvas { position: fixed; inset: 0; z-index: 0; display: block; }
.ui { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; pointer-events: none; }
.header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
.title-block h1 { font-family: 'SpaceGrotesk', system-ui; font-size: clamp(1.8rem, 5vw, 3.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--accent2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.title-block .subtitle { font-family: 'JetBrainsMono', monospace; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); opacity: 0.8; margin-top: 0.25rem; }
.controls { display: flex; gap: 0.75rem; flex-wrap: wrap; pointer-events: auto; }
.btn { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.6rem 1.2rem; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; transition: all 0.15s ease; position: relative; overflow: hidden; }
.btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.15s ease; }
.btn:hover::before, .btn:focus::before { opacity: 1; }
.btn span { position: relative; z-index: 1; }
.btn.primary { border-color: var(--accent); }
.btn.primary:hover, .btn.primary:focus { border-color: var(--accent); box-shadow: 0 0 24px var(--glow); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
.info { font-family: 'JetBrainsMono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.4; }
.stats { display: flex; gap: 2rem; flex-wrap: wrap; }
.stat { text-align: right; }
.stat-value { font-family: 'SpaceGrotesk', system-ui; font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
.stat-label { font-family: 'JetBrainsMono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg); opacity: 0.5; margin-top: 0.15rem; }
.voronoi-selector { pointer-events: auto; }
.voronoi-selector select { font-family: 'JetBrainsMono', monospace; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.5rem 1rem; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; appearance: none; }
.voronoi-selector select:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.slider-group { pointer-events: auto; display: flex; flex-direction: column; gap: 0.3rem; min-width: 100px; }
.slider-group label { font-family: 'JetBrainsMono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); opacity: 0.6; }
.slider-group input { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--border); outline: none; }
.slider-group input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
@media (max-width: 640px) { .header { flex-direction: column; align-items: flex-start; } .footer { flex-direction: column; align-items: flex-start; } .stats { gap: 1rem; } .controls { flex-direction: column; } .slider-group { width: 100%; } }
</style>
</head>
<body>
<canvas id="canvas" aria-hidden="true"></canvas>
<div class="ui">
<header class="header">
<div class="title-block">
<h1>VORONOI MOSAIC</h1>
<p class="subtitle">Animated Cell Diagrams</p>
</div>
<div class="controls">
<div class="voronoi-selector"><select id="modeSelect" aria-label="Select mosaic mode"></select></div>
<div class="slider-group"><label>Sites</label><input type="range" id="sitesSlider" min="10" max="200" step="10" value="60"></div>
<div class="slider-group"><label>Speed</label><input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1"></div>
<button class="btn primary" id="btnRegenerate" aria-label="Regenerate sites"><span>Regenerate</span></button>
<button class="btn" id="btnPause" aria-label="Toggle animation"><span>Pause</span></button>
<button class="btn" id="btnEdges" aria-label="Toggle edges"><span>Edges: On</span></button>
<button class="btn" id="btnSites" aria-label="Toggle sites"><span>Sites: On</span></button>
</div>
</header>
<footer class="footer">
<p class="info" id="infoText">Click to add site • Keys: Space pause • R regenerate • E edges • S sites • 1-5 modes</p>
<div class="stats">
<div class="stat"><div class="stat-value" id="sitesCount">60</div><div class="stat-label">Sites</div></div>
<div class="stat"><div class="stat-value" id="fps">60</div><div class="stat-label">FPS</div></div>
</div>
</footer>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = 0, height = 0, dpr = 1;
const modes = [
    { name: 'Euclidean', dist: (dx, dy) => Math.sqrt(dx*dx + dy*dy) },
    { name: 'Manhattan', dist: (dx, dy) => Math.abs(dx) + Math.abs(dy) },
    { name: 'Chebyshev', dist: (dx, dy) => Math.max(Math.abs(dx), Math.abs(dy)) },
    { name: 'Minkowski', dist: (dx, dy) => Math.pow(Math.pow(Math.abs(dx), 3) + Math.pow(Math.abs(dy), 3), 1/3) },
    { name: 'Weighted', dist: (dx, dy, w) => Math.sqrt(dx*dx + dy*dy) * (w || 1) },
];
let modeIdx = 0, numSites = 60, speed = 1, paused = false, running = true, showEdges = true, showSites = true, time = 0;
let sites = [], lastTime = 0, frameCount = 0, fps = 60, fpsTime = 0, animationId = null;
const mouse = { x: 0, y: 0 };
const select = document.getElementById('modeSelect');
modes.forEach((m, i) => { const opt = document.createElement('option'); opt.value = i; opt.textContent = `${i+1} ${m.name}`; select.appendChild(opt); });
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); width = canvas.width = Math.floor(window.innerWidth * dpr); height = canvas.height = Math.floor(window.innerHeight * dpr); ctx.scale(dpr, dpr); generateSites(); }
function generateSites() { sites = []; const w = width / dpr, h = height / dpr; for (let i = 0; i < numSites; i++) { sites.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, weight: 0.5 + Math.random() * 1.5, hue: Math.random() * 360, r: 3 + Math.random() * 4 }); } document.getElementById('sitesCount').textContent = sites.length; }
function step() { const w = width / dpr, h = height / dpr; for (const s of sites) { s.x += s.vx * speed; s.y += s.vy * speed; if (s.x < 0 || s.x > w) s.vx *= -1; if (s.y < 0 || s.y > h) s.vy *= -1; s.x = Math.max(0, Math.min(w, s.x)); s.y = Math.max(0, Math.min(h, s.y)); } }
function distanceToSite(px, py, site) { const dx = px - site.x, dy = py - site.y; if (modeIdx === 4) return modes[modeIdx].dist(dx, dy, site.weight); return modes[modeIdx].dist(dx, dy); }
function render() { const w = width / dpr, h = height / dpr; ctx.fillStyle = '#030305'; ctx.fillRect(0, 0, w, h); const gridSize = 4; for (let y = 0; y < h; y += gridSize) { for (let x = 0; x < w; x += gridSize) { let minDist = Infinity, closest = -1; for (let i = 0; i < sites.length; i++) { const d = distanceToSite(x, y, sites[i]); if (d < minDist) { minDist = d; closest = i; } } if (closest >= 0) { const site = sites[closest]; const intensity = 1 - Math.min(1, minDist / 200); ctx.fillStyle = `hsla(${site.hue}, 70%, ${30 + intensity * 40}%, ${0.15 + intensity * 0.3})`; ctx.fillRect(x, y, gridSize, gridSize); } } } if (showEdges) { ctx.strokeStyle = 'rgba(0, 255, 200, 0.15)'; ctx.lineWidth = 0.5; for (let i = 0; i < sites.length; i++) { for (let j = i + 1; j < sites.length; j++) { const dx = sites[j].x - sites[i].x, dy = sites[j].y - sites[i].y; const dist = Math.sqrt(dx*dx + dy*dy); if (dist < 100) { ctx.beginPath(); ctx.moveTo(sites[i].x, sites[i].y); ctx.lineTo(sites[j].x, sites[j].y); ctx.stroke(); } } } } if (showSites) { for (const s of sites) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fillStyle = `hsla(${s.hue}, 80%, 60%, 0.9)`; ctx.shadowColor = `hsla(${s.hue}, 80%, 60%, 0.8)`; ctx.shadowBlur = 6; ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = '#030305'; ctx.lineWidth = 2; ctx.stroke(); } } }
function loop(t) { if (!running) { animationId = requestAnimationFrame(loop); return; } const dt = (t - lastTime) / 1000; lastTime = t; frameCount++; if (t - fpsTime > 1000) { fps = Math.round(frameCount * 1000 / (t - fpsTime)); frameCount = 0; fpsTime = t; document.getElementById('fps').textContent = fps; } if (!paused) step(); render(); animationId = requestAnimationFrame(loop); }
function init() { resize(); document.getElementById('sitesSlider').addEventListener('input', e => { numSites = parseInt(e.target.value); generateSites(); }); document.getElementById('speedSlider').addEventListener('input', e => speed = parseFloat(e.target.value)); lastTime = performance.now(); fpsTime = performance.now(); loop(lastTime); }
window.addEventListener('resize', resize);
canvas.addEventListener('click', e => { if (sites.length < 200) { const w = width / dpr, h = height / dpr; const x = e.clientX, y = e.clientY; if (x >= 0 && x <= w && y >= 0 && y <= h) { sites.push({ x, y, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, weight: 0.5 + Math.random() * 1.5, hue: Math.random() * 360, r: 3 + Math.random() * 4 }); document.getElementById('sitesCount').textContent = sites.length; document.getElementById('sitesSlider').value = sites.length; } } });
select.addEventListener('change', e => modeIdx = parseInt(e.target.value));
document.getElementById('btnRegenerate').addEventListener('click', generateSites);
document.getElementById('btnPause').addEventListener('click', () => { paused = !paused; running = !paused; document.getElementById('btnPause').querySelector('span').textContent = paused ? 'Resume' : 'Pause'; if (running) { lastTime = performance.now(); loop(lastTime); } });
document.getElementById('btnEdges').addEventListener('click', () => { showEdges = !showEdges; document.getElementById('btnEdges').classList.toggle('primary', showEdges); });
document.getElementById('btnSites').addEventListener('click', () => { showSites = !showSites; document.getElementById('btnSites').classList.toggle('primary', showSites); });
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); paused = !paused; running = !paused; document.getElementById('btnPause').querySelector('span').textContent = paused ? 'Resume' : 'Pause'; if (running) { lastTime = performance.now(); loop(lastTime); } } else if (e.key === 'r' || e.key === 'R') generateSites(); else if (e.key === 'e' || e.key === 'E') { showEdges = !showEdges; document.getElementById('btnEdges').classList.toggle('primary', showEdges); } else if (e.key === 's' || e.key === 'S') { showSites = !showSites; document.getElementById('btnSites').classList.toggle('primary', showSites); } else if (e.key >= '1' && e.key <= '5') { modeIdx = parseInt(e.key) - 1; select.value = modeIdx; } });
init();
</script>
</body>
</html>
