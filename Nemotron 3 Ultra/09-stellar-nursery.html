<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09 — Stellar Nursery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020015;--fg:#ffffff;--muted:#3a3a5a;--accent:#ff69b4;--accent2:#00ffff}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'JetBrains Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.08em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stats{bottom:1.5rem;left:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;line-height:1.8}
.hint{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.6;text-align:right}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .stats{bottom:1rem;left:1rem;font-size:.55rem}
  .hint{bottom:1rem;right:1rem;font-size:.55rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Stellar Nursery</div>
<div class="ui subtitle">gravitational star formation</div>
<div class="ui stats">
Stars: <span id="stars">0</span><br>
Gas Clouds: <span id="clouds">0</span><br>
Supernovae: <span id="sn">0</span>
</div>
<div class="ui hint">click to trigger collapse<br>drag to stir nebula<br><kbd>Space</kbd> reset · <kbd>G</kbd> gravity</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const stars=[],clouds=[],MAX_STARS=500,MAX_CLOUDS=150;
let gravity=true,mouse={x:0,y:0,down:false},frame=0,snCount=0;
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
}
class Star{
  constructor(x,y,mass,generation=0){
    this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.mass=mass;this.radius=Math.max(2,Math.pow(mass,1/3)*1.5);
    this.life=1;this.decay=generation>0?0.0001:0;
    this.color=this.pickColor(mass);
    this.generation=generation;
    this.trail=[],this.maxTrail=30;
  }
  pickColor(m){
    if(m>150)return [255,255,255];
    if(m>80)return [255,220,180];
    if(m>40)return [255,180,120];
    if(m>20)return [255,140,80];
    return [255,105,180];
  }
  update(){
    this.trail.unshift({x:this.x,y:this.y});
    if(this.trail.length>this.maxTrail)this.trail.pop();
    if(gravity){
      for(const s of stars){
        if(s===this)continue;
        const dx=s.x-this.x,dy=s.y-this.y,dist2=dx*dx+dy*dy+100;
        const force=s.mass/dist2*0.5;
        this.vx+=dx/Math.sqrt(dist2)*force;
        this.vy+=dy/Math.sqrt(dist2)*force;
      }
    }
    this.vx*=0.999;this.vy*=0.999;
    this.x+=this.vx;this.y+=this.vy;
    this.life-=this.decay;
    if(this.x<0||this.x>W/DPR||this.y<0||this.y>H/DPR){
      this.x=Math.max(0,Math.min(W/DPR,this.x));
      this.y=Math.max(0,Math.min(H/DPR,this.y));
      this.vx*=-0.5;this.vy*=-0.5;
    }
  }
  draw(){
    if(this.trail.length>1){
      const [r,g,b]=this.color;
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x,this.trail[0].y);
      for(let i=1;i<this.trail.length;i++){
        const t=this.trail[i],a=(1-i/this.trail.length)*this.life*0.3;
        ctx.lineTo(t.x,t.y);
        ctx.strokeStyle=`rgba(${r},${g},${b},${a})`;
        ctx.lineWidth=this.radius*(1-i/this.trail.length)*0.5;
        ctx.stroke();
        ctx.beginPath();ctx.moveTo(t.x,t.y);
      }
    }
    const [r,g,b]=this.color;
    const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.radius*3);
    grad.addColorStop(0,`rgba(${r},${g},${b},1)`);
    grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius*3,0,Math.PI*2);
    ctx.fillStyle=grad;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fill();
  }
}
class Cloud{
  constructor(x,y){
    this.x=x;this.y=y;this.vx=(Math.random()-0.5)*0.3;this.vy=(Math.random()-0.5)*0.3;
    this.mass=5+Math.random()*30;this.radius=Math.sqrt(this.mass)*3;
    this.life=1;this.decay=0.00005;
    this.hue=280+Math.random()*60;
  }
  update(){
    if(gravity){
      for(const s of stars){
        const dx=s.x-this.x,dy=s.y-this.y,dist2=dx*dx+dy*dy+50;
        const force=s.mass/dist2*0.2;
        this.vx+=dx/Math.sqrt(dist2)*force;
        this.vy+=dy/Math.sqrt(dist2)*force;
      }
    }
    this.vx*=0.995;this.vy*=0.995;
    this.x+=this.vx;this.y+=this.vy;
    this.life-=this.decay;
    for(const s of stars){
      const dx=s.x-this.x,dy=s.y-this.y,dist=Math.hypot(dx,dy);
      if(dist<this.radius+s.radius){
        s.mass+=this.mass*0.1;
        this.mass*=0.9;
        this.radius=Math.sqrt(this.mass)*3;
      }
    }
  }
  draw(){
    const grad=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.radius);
    grad.addColorStop(0,`hsla(${this.hue},80%,60%,${this.life*0.3})`);
    grad.addColorStop(0.5,`hsla(${this.hue},70%,40%,${this.life*0.15})`);
    grad.addColorStop(1,`hsla(${this.hue},60%,20%,0)`);
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.fillStyle=grad;
    ctx.fill();
  }
}
function collapse(x,y){
  for(let i=0;i<5;i++){
    const angle=Math.random()*Math.PI*2,dist=20+Math.random()*60;
    const cx=x+Math.cos(angle)*dist,cy=y+Math.sin(angle)*dist;
    const mass=10+Math.random()*50;
    stars.push(new Star(cx,cy,mass));
    if(stars.length>MAX_STARS)stars.shift();
  }
  for(let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2,dist=40+Math.random()*100;
    clouds.push(new Cloud(x+Math.cos(angle)*dist,y+Math.sin(angle)*dist));
    if(clouds.length>MAX_CLOUDS)clouds.shift();
  }
  snCount++;
}
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('mousedown',e=>{mouse.down=true;collapse(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>mouse.down=false);
window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;if(mouse.down&&Math.random()<0.3)collapse(t.clientX,t.clientY);},{passive:false});
window.addEventListener('touchstart',e=>{mouse.down=true;const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;collapse(t.clientX,t.clientY);},{passive:false});
window.addEventListener('touchend',()=>mouse.down=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){stars.length=0;clouds.length=0;snCount=0;frame=0;e.preventDefault();}
  if(e.code==='KeyG')gravity=!gravity;
});
function tick(){
  frame++;
  ctx.fillStyle='rgba(2,0,21,0.12)';
  ctx.fillRect(0,0,W/DPR,H/DPR);
  if(mouse.down&&Math.random()<0.15){
    for(const c of clouds){
      const dx=mouse.x-c.x,dy=mouse.y-c.y,dist=Math.hypot(dx,dy);
      if(dist<150){
        c.vx+=dx/dist*0.05;c.vy+=dy/dist*0.05;
      }
    }
  }
  if(stars.length<10&&Math.random()<0.01){
    stars.push(new Star(Math.random()*W/DPR,Math.random()*H/DPR,5+Math.random()*20));
  }
  if(clouds.length<5&&Math.random()<0.005){
    clouds.push(new Cloud(Math.random()*W/DPR,Math.random()*H/DPR));
  }
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];s.update();s.draw();
    if(s.life<=0||s.mass>500){
      if(s.mass>500){
        for(let j=0;j<20;j++){
          const angle=Math.random()*Math.PI*2,speed=2+Math.random()*5;
          stars.push(new Star(s.x,s.y,s.mass/30,s.generation+1));
          stars[stars.length-1].vx=Math.cos(angle)*speed;
          stars[stars.length-1].vy=Math.sin(angle)*speed;
        }
        snCount++;
      }
      stars.splice(i,1);
    }
  }
  for(let i=clouds.length-1;i>=0;i--){
    const c=clouds[i];c.update();c.draw();
    if(c.life<=0||c.mass<0.5)clouds.splice(i,1);
  }
  document.getElementById('stars').textContent=stars.length;
  document.getElementById('clouds').textContent=clouds.length;
  document.getElementById('sn').textContent=snCount;
  requestAnimationFrame(tick);
}
resize();
for(let i=0;i<8;i++)stars.push(new Star(Math.random()*W/DPR,Math.random()*H/DPR,20+Math.random()*80));
for(let i=0;i<15;i++)clouds.push(new Cloud(Math.random()*W/DPR,Math.random()*H/DPR));
tick();
</script>
</body>
</html>
