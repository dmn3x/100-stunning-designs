<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 — Mycelium Network</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a12;--fg:#e8e8e0;--muted:#3a3a2a;--accent:#ff6b35;--accent2:#e8e8e0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'JetBrains Mono','SF Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;z-index:0}
.ui{position:fixed;z-index:10;pointer-events:none}
.ui *{pointer-events:auto}
.title{top:1.5rem;left:1.5rem;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:200;letter-spacing:.06em}
.subtitle{top:3rem;left:1.5rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stats{bottom:1.5rem;left:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.7;line-height:1.8}
.hint{bottom:1.5rem;right:1.5rem;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.6;text-align:right}
@media (max-width:600px){
  .title{top:1rem;left:1rem;font-size:1rem}
  .subtitle{top:2.5rem;left:1rem}
  .stats{bottom:1rem;left:1rem;font-size:.55rem}
  .hint{bottom:1rem;right:1rem;font-size:.55rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui title">Mycelium Network</div>
<div class="ui subtitle">hyphal growth simulation</div>
<div class="ui stats">
Nodes: <span id="nodes">0</span><br>
Hyphae: <span id="hyphae">0</span><br>
Age: <span id="age">0</span>
</div>
<div class="ui hint">click to seed growth<br><kbd>Space</kbd> clear · <kbd>P</kbd> pause</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
const nodes=[],hyphae=[],spores=[];
let frame=0,paused=false;
let mouse={x:0,y:0,down:false};
function resize(){
  W=canvas.width=innerWidth*DPR;H=canvas.height=innerHeight*DPR;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.scale(DPR,DPR);
}
class Node{
  constructor(x,y,parent=null,angle=null){
    this.x=x;this.y=y;
    this.parent=parent;
    this.angle=angle||Math.random()*Math.PI*2;
    this.energy=100;
    this.age=0;
    this.branches=0;
    this.maxBranches=3;
    this.color=[232,232,224];
    if(parent){
      this.color=[...parent.color];
      this.color[0]=Math.min(255,this.color[0]+Math.random()*10-5);
      this.color[1]=Math.min(255,this.color[1]+Math.random()*10-5);
      this.color[2]=Math.min(255,this.color[2]+Math.random()*10-5);
    }
  }
  update(){
    this.age++;
    this.energy-=0.15;
    if(this.energy<=0||this.branches>=this.maxBranches)return;
    if(Math.random()<0.02+this.energy/5000){
      this.branch();
    }
  }
  branch(){
    if(this.branches>=this.maxBranches)return;
    const variance=(Math.random()-0.5)*Math.PI*0.6;
    const newAngle=this.angle+variance;
    const dist=15+Math.random()*20;
    const nx=this.x+Math.cos(newAngle)*dist;
    const ny=this.y+Math.sin(newAngle)*dist;
    if(nx<0||nx>W/DPR||ny<0||ny>H/DPR)return;
    const child=new Node(nx,ny,this,newAngle);
    child.energy=this.energy*0.7;
    nodes.push(child);
    hyphae.push({from:this,to:child,age:0});
    this.branches++;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,Math.max(1,2-this.age*0.001),0,Math.PI*2);
    ctx.fillStyle=`rgb(${this.color.join(',')})`;
    ctx.fill();
  }
}
class Hypha{
  constructor(from,to){
    this.from=from;this.to=to;this.age=0;this.growth=0;
  }
  update(){this.age++;this.growth=Math.min(1,this.growth+0.02);}
  draw(){
    if(this.growth<=0)return;
    const fx=this.from.x,fy=this.from.y;
    const tx=this.to.x,ty=this.to.y;
    const dx=tx-fx,dy=ty-fy,dist=Math.hypot(dx,dy);
    const gx=fx+dx*this.growth,gy=fy+dy*this.growth;
    ctx.beginPath();
    ctx.moveTo(fx,fy);
    ctx.lineTo(gx,gy);
    const [r,g,b]=this.from.color;
    const alpha=0.4*this.growth;
    ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth=1.2;
    ctx.stroke();
  }
}
function seed(x,y){
  const n=new Node(x,y);
  nodes.push(n);
}
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('mousedown',e=>{mouse.down=true;seed(e.clientX,e.clientY);});
window.addEventListener('mouseup',()=>mouse.down=false);
window.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;if(mouse.down&&Math.random()<0.3)seed(t.clientX,t.clientY);},{passive:false});
window.addEventListener('touchstart',e=>{mouse.down=true;const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;seed(t.clientX,t.clientY);},{passive:false});
window.addEventListener('touchend',()=>mouse.down=false);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){nodes.length=0;hyphae.length=0;spores.length=0;frame=0;e.preventDefault();}
  if(e.code==='KeyP')paused=!paused;
});
function tick(){
  if(!paused){
    frame++;
    ctx.fillStyle='rgba(26,26,18,0.08)';
    ctx.fillRect(0,0,W/DPR,H/DPR);
    for(let i=nodes.length-1;i>=0;i--){
      const n=nodes[i];
      n.update();
      n.draw();
      if(n.energy<=0)nodes.splice(i,1);
    }
    for(let i=hyphae.length-1;i>=0;i--){
      const h=hyphae[i];
      h.update();
      h.draw();
      if(h.growth>=1&&h.age>200)hyphae.splice(i,1);
    }
    if(mouse.down&&Math.random()<0.15)seed(mouse.x,mouse.y);
    if(nodes.length<3&&Math.random()<0.01)seed(Math.random()*W/DPR,Math.random()*H/DPR);
  }
  document.getElementById('nodes').textContent=nodes.length;
  document.getElementById('hyphae').textContent=hyphae.length;
  document.getElementById('age').textContent=frame;
  requestAnimationFrame(tick);
}
resize();
for(let i=0;i<3;i++)seed(Math.random()*W/DPR,Math.random()*H/DPR);
tick();
</script>
</body>
</html>
