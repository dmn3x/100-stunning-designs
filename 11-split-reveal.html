<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Split Reveal</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;overflow-x:hidden}
.panel{display:flex;min-height:100vh}
.left{flex:1;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;padding:4rem;clip-path:polygon(0 0,85% 0,100% 100%,0 100%)}
.right{flex:1;background:#fafafa;color:#111;display:flex;align-items:center;justify-content:center;padding:4rem;margin-left:-10%}
.content{max-width:400px}h1{font-size:clamp(2rem,5vw,4rem);font-weight:900;margin-bottom:1rem;line-height:1.1}p{font-size:1.1rem;line-height:1.7;opacity:.8}
.tag{display:inline-block;border:2px solid currentColor;padding:.5rem 1.5rem;border-radius:2rem;margin-top:2rem;font-weight:600;transition:all .3s;cursor:pointer}.tag:hover{background:currentColor}.left .tag:hover{color:#111}.right .tag:hover{color:#fff}
@media(max-width:768px){.panel{flex-direction:column}.left{clip-path:none}.right{margin-left:0}}
</style></head>
<body><div class="panel">
<div class="left"><div class="content"><h1>Build the<br>impossible.</h1><p>Every great product started as a sketch on a napkin.</p><span class="tag">GET STARTED</span></div></div>
<div class="right"><div class="content"><h1>Ship with<br>velocity.</h1><p>Ideas are cheap. Execution is everything.</p><span class="tag">LEARN MORE</span></div></div>
</div></body></html>
