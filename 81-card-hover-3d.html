<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>81 Card Hover 3D.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><div class="card" style="width:300px;height:400px;border-radius:1.5rem;background:linear-gradient(135deg,#667eea,#764ba2);padding:2rem;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 20px 60px rgba(102,126,234,.4);cursor:pointer;transition:transform .3s" onmousemove="const r=this.getBoundingClientRect();const x=e.clientX-r.left-r.width/2;const y=e.clientY-r.top-r.height/2;this.style.transform=`perspective(1000px) rotateY(${x*.05}deg) rotateX(${-y*.05}deg) translateZ(20px)`" onmouseleave="this.style.transform='perspective(1000px) rotateY(0) rotateX(0) translateZ(0)'"><h2 style="font-size:1.8rem;font-weight:800">3D Card</h2><p style="opacity:.8">Move your mouse to tilt this card in 3D space.</p></div></body></html>
