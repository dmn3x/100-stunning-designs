<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>55 Distorted Grid.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d1117;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){ctx.fillStyle="rgba(13,17,23,.1)";ctx.fillRect(0,0,w,h);t+=.003;const g=40;for(let x=0;x<w;x+=g)for(let y=0;y<h;y+=g){const dx=Math.sin(y*.02+t)*20+Math.cos(x*.015+t*.7)*15;const dy=Math.cos(x*.02+t)*20+Math.sin(y*.015+t*.7)*15;ctx.beginPath();ctx.arc(x+dx,y+dy,2,0,Math.PI*2);ctx.fillStyle="rgba(150,200,255,.6)";ctx.fill()}requestAnimationFrame(draw)}draw();</script></body></html>
