<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>65 Cookie Banner.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><div style="background:#1a1a1a;color:#fff;padding:1rem 2rem;border-radius:1rem;display:flex;align-items:center;gap:1.5rem;box-shadow:0 8px 40px rgba(0,0,0,.3);max-width:600px"><p style="font-size:.9rem;opacity:.8">🍪 We use cookies to improve your experience. By continuing, you agree to our privacy policy.</p><div style="display:flex;gap:.5rem"><button style="padding:.5rem 1.5rem;background:#4f46e5;color:#fff;border:none;border-radius:.5rem;cursor:pointer;font-weight:600;white-space:nowrap">Accept</button><button style="padding:.5rem 1.5rem;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:.5rem;cursor:pointer;white-space:nowrap">Decline</button></div></div></body></html>
