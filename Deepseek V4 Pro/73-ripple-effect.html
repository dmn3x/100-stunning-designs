<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>73 Ripple Effect.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,R=[];function Rz(){w=c.width=innerWidth;h=c.height=innerHeight}Rz();onresize=Rz();c.addEventListener("click",e=>{R.push({x:e.clientX,y:e.clientY,r:0,m:60})});function draw(){ctx.fillStyle="rgba(0,0,0,.05)";ctx.fillRect(0,0,w,h);R=R.filter(r=>{r.r+=2;const a=1-r.r/r.m;if(a<=0)return 0;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.strokeStyle="rgba(100,200,255,"+a+")";ctx.lineWidth=2;ctx.stroke();return 1});requestAnimationFrame(draw)}draw();</script></body></html>
