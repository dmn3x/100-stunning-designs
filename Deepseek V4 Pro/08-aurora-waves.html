<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Aurora Waves</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a1a;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,t=0;
function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;
function draw(){
t+=0.008;
for(let y=0;y<h;y+=2){
ctx.fillStyle=`hsla(${(t*60+y*0.5)%360},80%,60%,${0.3+Math.sin(y*0.02+t)*0.3})`;
ctx.fillRect(0,y,w,2);
}
for(let i=0;i<5;i++){
ctx.beginPath();
for(let x=0;x<w;x+=5){
const y=h/2+Math.sin(x*0.008+t+i)*80+Math.sin(x*0.02+t*0.5+i*2)*40+Math.sin(x*0.003+t*1.5)*120;
x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
}
ctx.strokeStyle=`hsla(${(i*72)%360},80%,70%,0.6)`;ctx.lineWidth=2;ctx.stroke();
}
requestAnimationFrame(draw)}
draw();
</script></body></html>
