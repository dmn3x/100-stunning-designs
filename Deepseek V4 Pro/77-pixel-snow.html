<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>77 Pixel Snow.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a1e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,F=[];function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;for(let i=0;i<300;i++)F.push({x:Math.random()*w,y:Math.random()*h,s:1+Math.random()*3,w:Math.random()*1.5});function draw(){ctx.fillStyle="rgba(10,10,30,.1)";ctx.fillRect(0,0,w,h);F.forEach(f=>{f.y+=f.s;f.x+=Math.sin(f.y*.01)*f.w;if(f.y>h){f.y=0;f.x=Math.random()*w}ctx.fillStyle="rgba(255,255,255,.8)";ctx.fillRect(f.x,f.y,2,2)});requestAnimationFrame(draw)}draw();</script></body></html>
