<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Neon Sign</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Courier New',monospace}
.sign{position:relative;padding:3rem 5rem;border:4px solid #ff2d55;border-radius:1rem;box-shadow:0 0 20px #ff2d55,0 0 60px #ff2d55,0 0 100px #ff2d55,inset 0 0 20px rgba(255,45,85,.3);animation:flicker 3s infinite}
.sign h1{font-size:clamp(2rem,8vw,6rem);color:#ff2d55;text-shadow:0 0 10px #ff2d55,0 0 30px #ff2d55,0 0 60px #ff2d55;letter-spacing:.15em;animation:tf 2s infinite}
@keyframes flicker{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}20%,24%,55%{opacity:.8}}
@keyframes tf{0%,18%,22%,25%,53%,57%,100%{text-shadow:0 0 10px #ff2d55,0 0 30px #ff2d55,0 0 60px #ff2d55}20%,24%,55%{text-shadow:0 0 5px #ff2d55,0 0 15px #ff2d55,0 0 30px #ff2d55}}
</style></head><body><div class="sign"><h1>OPEN</h1></div></body></html>
