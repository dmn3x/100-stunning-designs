<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>47 Cursor Trail.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}*{cursor:none}</style></head><body><div style="text-align:center;color:rgba(255,255,255,.7)"><h1 style="font-size:clamp(2rem,6vw,5rem);font-weight:400;letter-spacing:.15em">FOLLOW</h1><p style="opacity:.4;margin-top:1rem">move your cursor</p></div><script>const T=[];let mx=0,my=0;for(let i=0;i<20;i++){const t=document.createElement("div");t.style.cssText="position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:9999;opacity:"+(1-i*.05)+";transform:scale("+(1-i*.04)+")";document.body.appendChild(t);T.push({el:t,x:0,y:0})}document.addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY});function a(){let px=mx,py=my;T.forEach((t,i)=>{t.x+=(px-t.x)*.3;t.y+=(py-t.y)*.3;t.el.style.left=t.x+"px";t.el.style.top=t.y+"px";t.el.style.background="hsl("+((Date.now()*.05+i*18)%360)+",80%,70%)";px=t.x;py=t.y});requestAnimationFrame(a)}a();</script></body></html>
