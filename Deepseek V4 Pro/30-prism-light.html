<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Prism Light</title>
<style>*{margin:0;padding:0}body{background:#0a0a0f;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.scene{position:relative;width:400px;height:400px}
.prism{position:absolute;top:50%;left:50%;width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:120px solid rgba(255,255,255,.15);transform:translate(-50%,-50%)}
.beam{position:absolute;width:3px;height:200px;top:20%;left:50%;transform-origin:bottom center;animation:r 8s linear infinite}
.beam:nth-child(2){animation-delay:-2.67s}.beam:nth-child(3){animation-delay:-5.33s}
.beam::after{content:'';position:absolute;bottom:0;width:100%;height:100%;border-radius:50%}
.b1::after{background:linear-gradient(to top,transparent,#f36)}.b2::after{background:linear-gradient(to top,transparent,#3f6)}.b3::after{background:linear-gradient(to top,transparent,#36f)}
@keyframes r{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}
.ti{position:absolute;bottom:3rem;color:rgba(255,255,255,.5);font-family:Georgia,serif;font-size:1.5rem;letter-spacing:.3em}
</style></head><body><div class="scene"><div class="prism"></div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div></div><div class="ti">SPECTRUM</div></body></html>
