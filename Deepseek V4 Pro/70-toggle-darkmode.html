<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>70 Toggle Darkmode.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f8f9fc;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><div style="text-align:center;color:#1a1a1a"><h2 style="margin-bottom:1.5rem;font-size:1.3rem">Dark Mode</h2><label style="display:inline-block;width:64px;height:32px;background:#e0e0e0;border-radius:16px;position:relative;cursor:pointer"><input type="checkbox" style="display:none" onchange="document.querySelector('.kn70').style.transform=this.checked?'translateX(32px)':'translateX(0)';document.querySelector('.tr70').style.background=this.checked?'#4f46e5':'#e0e0e0'"><span class="tr70" style="position:absolute;inset:0;border-radius:16px;transition:background .3s;background:#e0e0e0"></span><span class="kn70" style="position:absolute;width:28px;height:28px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .3s;box-shadow:0 2px 4px rgba(0,0,0,.2)"></span></label></div></body></html>
