<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>95 Solar System.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){ctx.fillStyle="rgba(0,0,0,.1)";ctx.fillRect(0,0,w,h);t+=.005;const cx=w/2,cy=h/2;const sg=ctx.createRadialGradient(cx,cy,0,cx,cy,40);sg.addColorStop(0,"#fff");sg.addColorStop(.3,"#ffdd00");sg.addColorStop(1,"rgba(255,200,0,0)");ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,30,0,Math.PI*2);ctx.fill();const planets=[{d:70,s:.02,c:"#888",r:6},{d:110,s:.015,c:"#f90",r:8},{d:160,s:.01,c:"#48f",r:12},{d:220,s:.007,c:"#f44",r:7},{d:290,s:.005,c:"#f90",r:20}];planets.forEach(p=>{const a=t*p.s,x=cx+Math.cos(a)*p.d,y=cy+Math.sin(a)*p.d;ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();ctx.beginPath();ctx.arc(cx,cy,p.d,0,Math.PI*2);ctx.strokeStyle="rgba(255,255,255,.05)";ctx.lineWidth=.5;ctx.stroke()});requestAnimationFrame(draw)}draw();</script></body></html>
