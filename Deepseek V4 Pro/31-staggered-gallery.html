<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Staggered Gallery</title>
<style>*{margin:0;padding:0}body{background:#f8f8f5;font-family:system-ui;padding:4rem 2rem}
h1{text-align:center;font-size:3rem;font-weight:900;margin-bottom:3rem;letter-spacing:-.02em}
.g{columns:3 300px;column-gap:1.5rem;max-width:1200px;margin:0 auto}
.c{break-inside:avoid;margin-bottom:1.5rem;border-radius:1rem;overflow:hidden;position:relative;cursor:pointer}
.c .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 40%);display:flex;align-items:flex-end;padding:1.5rem;opacity:0;transition:opacity .3s;color:#fff}.c:hover .ov{opacity:1}
</style></head>
<body><h1>Curated Moments</h1><div class="g">
<div class="c"><div style="height:400px;background:linear-gradient(135deg,#667eea,#764ba2)"></div><div class="ov"><h3>Aurora</h3></div></div>
<div class="c"><div style="height:250px;background:linear-gradient(135deg,#f093fb,#f5576c)"></div><div class="ov"><h3>Sakura</h3></div></div>
<div class="c"><div style="height:350px;background:linear-gradient(135deg,#4facfe,#00f2fe)"></div><div class="ov"><h3>Ice Caves</h3></div></div>
<div class="c"><div style="height:300px;background:linear-gradient(135deg,#fa709a,#fee140)"></div><div class="ov"><h3>Dunes</h3></div></div>
<div class="c"><div style="height:380px;background:linear-gradient(135deg,#a8edea,#fed6e3)"></div><div class="ov"><h3>Forest</h3></div></div>
<div class="c"><div style="height:280px;background:linear-gradient(135deg,#d299c2,#fef9d7)"></div><div class="ov"><h3>Terraces</h3></div></div>
</div></body></html>
