<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Constellation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;overflow:hidden;cursor:crosshair}
canvas{display:block}
.overlay{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-family:'Georgia',serif;font-size:0.85rem;letter-spacing:0.3em;pointer-events:none;z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">✦ MOVE YOUR CURSOR ✦</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,particles=[],mouse={x:-9999,y:-9999};
function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
class Particle{constructor(){this.reset()}reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-0.5)*0.8;this.vy=(Math.random()-0.5)*0.8;this.r=Math.random()*2+1;this.hue=Math.random()*360;this.life=Math.random()*300+200}
update(){this.x+=this.vx;this.y+=this.vy;this.life--;const dx=mouse.x-this.x,dy=mouse.y-this.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<200){const f=(200-dist)/200;this.vx-=dx*f*0.002;this.vy-=dy*f*0.002}this.vx*=0.999;this.vy*=0.999;if(this.x<-50||this.x>w+50||this.y<-50||this.y>h+50||this.life<0)this.reset()}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`hsl(${this.hue},80%,70%)`;ctx.fill()}}
for(let i=0;i<200;i++)particles.push(new Particle());
function animate(){
ctx.fillStyle='rgba(10,10,15,0.15)';ctx.fillRect(0,0,w,h);
for(let i=0;i<particles.length;i++){particles[i].update();particles[i].draw()}
for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,dist=dx*dx+dy*dy;if(dist<10000){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(255,255,255,${0.08*(1-dist/10000)})`;ctx.lineWidth=0.5;ctx.stroke()}}}
requestAnimationFrame(animate)}
animate();
document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
document.addEventListener('touchmove',e=>{mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY},{passive:true});
</script>
</body>
</html>
