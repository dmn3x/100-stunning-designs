<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f1117;color:#e0e0e0;font-family:system-ui;padding:2rem;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}h1{font-size:1.5rem;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}
.card{background:#171923;border:1px solid #2d2f3a;border-radius:1rem;padding:1.5rem}.card:hover{border-color:#4a4d5c}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.ch span{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:#6b6f82}
.badge{padding:.25rem .75rem;border-radius:1rem;font-size:.75rem}.up{background:rgba(0,200,100,.15);color:#00c864}.down{background:rgba(255,80,80,.15);color:#f55}
.value{font-size:2.5rem;font-weight:700;margin-bottom:.5rem}.sub{font-size:.85rem;color:#6b6f82}
.bar{height:4px;background:#2d2f3a;border-radius:2px;margin-top:1rem;overflow:hidden}.fill{height:100%;border-radius:2px}
</style></head>
<body><header><h1>📊 Analytics</h1><span style="color:#6b6f82">Last 30 days</span></header>
<div class="grid">
<div class="card"><div class="ch"><span>Revenue</span><span class="badge up">▲ 12.4%</span></div><div class="value">$48,293</div><div class="sub">vs $42,961</div><div class="bar"><div class="fill" style="width:78%;background:linear-gradient(90deg,#00c864,#00e676)"></div></div></div>
<div class="card"><div class="ch"><span>Users</span><span class="badge up">▲ 8.1%</span></div><div class="value">12,847</div><div class="sub">+963 this month</div><div class="bar"><div class="fill" style="width:65%;background:linear-gradient(90deg,#48f,#82b1ff)"></div></div></div>
<div class="card"><div class="ch"><span>Conversion</span><span class="badge down">▼ 1.2%</span></div><div class="value">3.24%</div><div class="sub">-0.04% from last week</div><div class="bar"><div class="fill" style="width:42%;background:linear-gradient(90deg,#7c4dff,#b388ff)"></div></div></div>
<div class="card"><div class="ch"><span>Session</span><span class="badge up">▲ 5.8%</span></div><div class="value">4m 32s</div><div class="sub">+15s engagement</div><div class="bar"><div class="fill" style="width:88%;background:linear-gradient(90deg,#f90,#ffc400)"></div></div></div>
</div></body></html>
