<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Terminal Portfolio</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1e1e2e;color:#cdd6f4;font-family:'Courier New',monospace;padding:2rem;min-height:100vh}.window{max-width:900px;margin:0 auto;border:1px solid #45475a;border-radius:8px;overflow:hidden}.titlebar{background:#181825;padding:.75rem 1rem;display:flex;gap:.5rem;align-items:center}.dot{width:12px;height:12px;border-radius:50%}.d1{background:#f38ba8}.d2{background:#fab387}.d3{background:#a6e3a1}.title{flex:1;text-align:center;font-size:.85rem;color:#6c7086}.terminal{padding:1.5rem}.line{margin-bottom:.75rem}.prompt{color:#a6e3a1}.cmd{color:#89b4fa}.output{color:#cdd6f4;margin:.25rem 0 0 1rem}.hl{color:#f9e2af}.cursor{display:inline-block;width:8px;height:16px;background:#f5c2e7;animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}</style></head>
<body><div class="window"><div class="titlebar"><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><span class="title">guest@portfolio — bash</span></div>
<div class="terminal">
<div class="line"><span class="prompt">$ </span><span class="cmd">whoami</span></div><div class="output">designer & developer</div>
<div class="line"><span class="prompt">$ </span><span class="cmd">cat skills.txt</span></div><div class="output"><span class="hl">TypeScript</span> · <span class="hl">React</span> · <span class="hl">Python</span> · <span class="hl">Figma</span></div>
<div class="line"><span class="prompt">$ </span><span class="cmd">./philosophy.sh</span></div><div class="output">Build things that matter. Ship code that lasts.</div>
<div class="line"><span class="prompt">$ </span><span class="cursor"></span></div>
</div></div></body></html>
