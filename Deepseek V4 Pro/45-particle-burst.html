<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>45 Particle Burst.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d1117;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}</style></head><body><button id="pb" style="position:relative;padding:1.2rem 3rem;font-size:1.3rem;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:3rem;cursor:pointer;font-weight:600;overflow:hidden">✨ LAUNCH</button><script>document.getElementById("pb").onclick=function(e){const r=this.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;for(let i=0;i<20;i++){const p=document.createElement("div");p.style.cssText="position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;left:"+cx+"px;top:"+cy+"px;background:hsl("+(Math.random()*360)+",80%,65%);--tx:"+((Math.random()-.5)*200)+"px;--ty:"+((Math.random()-.5)*200)+"px;animation:burst .6s ease-out forwards";this.appendChild(p);setTimeout(()=>p.remove(),600)}}</script></body></html>
