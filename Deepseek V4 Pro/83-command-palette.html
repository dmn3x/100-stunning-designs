<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>83 Command Palette.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><div style="background:rgba(30,30,40,.95);backdrop-filter:blur(20px);border-radius:1rem;padding:1rem;width:450px;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.5)"><div style="display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:rgba(255,255,255,.05);border-radius:.5rem;margin-bottom:.5rem"><span>🔍</span><input placeholder="Type a command..." style="flex:1;background:transparent;border:none;color:#fff;font-size:1rem;outline:none"><span style="color:#666;font-size:.8rem">⌘K</span></div><div style="color:rgba(255,255,255,.4);font-size:.8rem;padding:.5rem 1rem">Suggestions</div><div style="padding:.75rem 1rem;border-radius:.5rem;cursor:pointer;display:flex;align-items:center;gap:.75rem;color:#fff" onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background='transparent'"><span>📄</span><span>New File</span><span style="margin-left:auto;color:#666;font-size:.8rem">⌘N</span></div><div style="padding:.75rem 1rem;border-radius:.5rem;cursor:pointer;display:flex;align-items:center;gap:.75rem;color:#fff" onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background='transparent'"><span>📁</span><span>Open Folder</span><span style="margin-left:auto;color:#666;font-size:.8rem">⌘O</span></div><div style="padding:.75rem 1rem;border-radius:.5rem;cursor:pointer;display:flex;align-items:center;gap:.75rem;color:#fff" onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background='transparent'"><span>🔍</span><span>Find in Files</span><span style="margin-left:auto;color:#666;font-size:.8rem">⌘⇧F</span></div><div style="padding:.75rem 1rem;border-radius:.5rem;cursor:pointer;display:flex;align-items:center;gap:.75rem;color:#fff" onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background='transparent'"><span>⚙️</span><span>Settings</span><span style="margin-left:auto;color:#666;font-size:.8rem">⌘,</span></div></div></body></html>
