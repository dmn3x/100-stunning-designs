<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scribble Canvas</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#faf8f0;overflow:hidden;cursor:crosshair}canvas{display:block}
.toolbar{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;gap:.5rem;background:#fff;padding:.75rem 1.5rem;border-radius:3rem;box-shadow:0 4px 24px rgba(0,0,0,.1);z-index:10}
.tool{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer}.tool:hover{border-color:#ccc}.active{border-color:#1a1a1a!important}
.hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Georgia,serif;font-size:2rem;color:rgba(0,0,0,.15);pointer-events:none}
</style></head>
<body><canvas id="c"></canvas><div class="hint" id="hint">draw here</div>
<div class="toolbar">
<div class="tool active" style="background:#1a1a1a" data-color="#1a1a1a"></div>
<div class="tool" style="background:#e74c3c" data-color="#e74c3c"></div>
<div class="tool" style="background:#3498db" data-color="#3498db"></div>
<div class="tool" style="background:#2ecc71" data-color="#2ecc71"></div>
<div class="tool" style="background:#f39c12" data-color="#f39c12"></div>
<div class="tool" style="background:#9b59b6" data-color="#9b59b6"></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,D=!1,color='#1a1a1a',lx,ly;
function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;
c.onmousedown=e=>{D=!0;lx=e.clientX;ly=e.clientY;document.getElementById('hint').style.display='none'};
c.onmousemove=e=>{if(!D)return;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(e.clientX,e.clientY);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();lx=e.clientX;ly=e.clientY};
c.onmouseup=c.onmouseleave=()=>D=!1;
document.querySelectorAll('.tool').forEach(t=>t.onclick=()=>{document.querySelector('.active').classList.remove('active');t.classList.add('active');color=t.dataset.color});
</script></body></html>
