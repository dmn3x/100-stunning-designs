<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Brutalist Grid</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f0f0;font-family:system-ui;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));min-height:100vh}
.block{padding:2rem;border:3px solid #111;display:flex;flex-direction:column;justify-content:space-between}
.block h2{font-size:2rem;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}.num{font-size:5rem;font-weight:900;opacity:.15;align-self:flex-end;line-height:1}
</style></head>
<body><div class="grid">
<div class="block" style="background:#ffeb3b"><div><h2>Design</h2><p>Form follows function.</p></div><span class="num">01</span></div>
<div class="block" style="background:#fff"><div><h2>Build</h2><p>Code is poetry that works.</p></div><span class="num">02</span></div>
<div class="block" style="background:#111;color:#fff"><div><h2>Ship</h2><p>Done beats perfect.</p></div><span class="num">03</span></div>
<div class="block" style="background:#ff5252;color:#fff"><div><h2>Iterate</h2><p>Every version a draft.</p></div><span class="num">04</span></div>
<div class="block" style="background:#2196f3;color:#fff"><div><h2>Observe</h2><p>Users teach you.</p></div><span class="num">05</span></div>
<div class="block" style="background:#fff"><div><h2>Refine</h2><p>Polish until it gleams.</p></div><span class="num">06</span></div>
<div class="block" style="background:#111;color:#fff"><div><h2>Scale</h2><p>Plan for millions.</p></div><span class="num">07</span></div>
<div class="block" style="background:#4caf50;color:#fff"><div><h2>Repeat</h2><p>The cycle never ends.</p></div><span class="num">08</span></div>
</div></body></html>
