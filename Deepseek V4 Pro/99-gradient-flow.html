<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>99 Gradient Flow.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){t+=.005;for(let y=0;y<h;y+=4){const g=ctx.createLinearGradient(0,y,0,y+4);g.addColorStop(0,"hsl("+((t*30+y*.2)%360)+",80%,60%)");g.addColorStop(1,"hsl("+((t*30+y*.2+60)%360)+",80%,60%)");ctx.fillStyle=g;ctx.fillRect(0,y,w,4)}requestAnimationFrame(draw)}draw();</script></body></html>
