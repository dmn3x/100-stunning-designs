<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gravity Orbits</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050510;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let w,h,orbs=[];
function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;
const cx=w/2,cy=h/2;
for(let i=0;i<50;i++){const a=Math.random()*Math.PI*2,d=80+Math.random()*300;orbs.push({a,d,s:.003+Math.random()*.02,z:2+Math.random()*4,h:Math.random()*360,T:[]})}
function draw(){
ctx.fillStyle='rgba(5,5,16,.15)';ctx.fillRect(0,0,w,h);
orbs.forEach(o=>{o.a+=o.s;const x=cx+Math.cos(o.a)*o.d,y=cy+Math.sin(o.a)*o.d*.6;o.T.push({x,y,l:1});if(o.T.length>60)o.T.shift();
o.T.forEach(p=>{p.l-=.015;ctx.beginPath();ctx.arc(p.x,p.y,o.z*p.l,0,Math.PI*2);ctx.fillStyle=`hsla(${o.h},80%,60%,${p.l*.5})`;ctx.fill()});
ctx.beginPath();ctx.arc(x,y,o.z,0,Math.PI*2);ctx.fillStyle=`hsl(${o.h},80%,70%)`;ctx.fill();ctx.shadowColor=`hsl(${o.h},80%,70%)`;ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0});
ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.shadowColor='#fff';ctx.shadowBlur=30;ctx.fill();ctx.shadowBlur=0;
requestAnimationFrame(draw)}draw();
</script></body></html>
