<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>80 Hex Grid.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d1117;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0;function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function draw(){ctx.fillStyle="rgba(13,17,23,.15)";ctx.fillRect(0,0,w,h);t+=.003;const size=25;for(let row=0;row<h/size+2;row++)for(let col=0;col<w/(size*1.5)+2;col++){const x=col*size*1.5+(row%2)*size*.75,y=row*size*Math.sqrt(3)/2;const d=Math.sqrt((x-w/2)**2+(y-h/2)**2)/Math.max(w,h);const alpha=.2+Math.sin(d*8+t*3)*.3;ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;const px=x+size*.85*Math.cos(a),py=y+size*.85*Math.sin(a);i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.closePath();ctx.fillStyle="hsla("+((Date.now()*.01)%360)+",70%,60%,"+alpha+")";ctx.fill();ctx.strokeStyle="rgba(255,255,255,.1)";ctx.lineWidth=.5;ctx.stroke()}requestAnimationFrame(draw)}draw();</script></body></html>
