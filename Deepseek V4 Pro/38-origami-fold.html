<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>38 Origami Fold.Html</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}@keyframes fold{0%{transform:rotateX(30deg) rotateY(0)}100%{transform:rotateX(50deg) rotateY(45deg)}}</style></head>
<body><div style="perspective:800px"><div style="position:relative;width:200px;height:200px;transform-style:preserve-3d;animation:fold 4s ease-in-out infinite alternate"><div style="position:absolute;width:100px;height:100px;top:50px;left:50px;background:linear-gradient(135deg,rgba(255,107,157,.6),rgba(255,140,100,.6));border:1px solid rgba(255,255,255,.2);transform:rotateY(0)"></div><div style="position:absolute;width:100px;height:100px;top:50px;left:50px;background:linear-gradient(135deg,rgba(255,140,100,.6),rgba(255,107,157,.6));border:1px solid rgba(255,255,255,.2);transform:rotateY(90deg);transform-origin:left"></div><div style="position:absolute;width:100px;height:100px;top:50px;left:50px;background:linear-gradient(135deg,rgba(200,100,255,.6),rgba(255,107,157,.6));border:1px solid rgba(255,255,255,.2);transform:rotateX(-90deg);transform-origin:top"></div><div style="position:absolute;width:100px;height:100px;top:50px;left:150px;background:linear-gradient(135deg,rgba(255,107,157,.6),rgba(200,100,255,.6));border:1px solid rgba(255,255,255,.2);transform:rotateY(-90deg);transform-origin:left"></div></div></div></body></html>
