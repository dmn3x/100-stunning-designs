<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>90 Tooltip Showcase.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}.tool:hover+.tip{opacity:1!important}</style></head><body><div style="display:flex;gap:3rem;flex-wrap:wrap;justify-content:center;padding:3rem"><div style="position:relative"><span class="tool" style="background:#4f46e5;color:#fff;padding:.75rem 1.5rem;border-radius:.5rem;cursor:pointer;font-weight:600">Hover me</span><div style="position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:.5rem 1rem;border-radius:.5rem;font-size:.85rem;white-space:nowrap;opacity:0;pointer-events:none" class="tip">Tooltip text here!</div></div><div style="position:relative"><button class="tool" style="background:#22c55e;color:#fff;border:none;padding:.75rem 1.5rem;border-radius:.5rem;cursor:pointer;font-weight:600">Save</button><div style="position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:.5rem 1rem;border-radius:.5rem;font-size:.85rem;white-space:nowrap;opacity:0;pointer-events:none" class="tip">Click to save changes</div></div></div></body></html>
