<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>53 Spotlight.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><div id="s" style="position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);pointer-events:none;transform:translate(-50%,-50%);z-index:0"></div><h1 style="position:relative;z-index:1;font-size:clamp(2rem,6vw,5rem);color:rgba(255,255,255,.8);font-weight:300;letter-spacing:.1em">SPOTLIGHT</h1><script>document.addEventListener("mousemove",e=>{const s=document.getElementById("s");s.style.left=e.clientX+"px";s.style.top=e.clientY+"px"})</script></body></html>
