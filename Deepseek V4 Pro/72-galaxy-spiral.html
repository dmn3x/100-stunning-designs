<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>72 Galaxy Spiral.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050514;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,t=0,S=[];function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;for(let i=0;i<800;i++){const a=Math.random()*Math.PI*2,d=Math.random()*Math.min(w,h)*.45;S.push({a,d,s:Math.random()*3+1,o:Math.random()})}function draw(){ctx.fillStyle="rgba(5,5,20,.1)";ctx.fillRect(0,0,w,h);t+=.002;S.forEach(s=>{const a=s.a+t*(1-s.d*0.001),x=w/2+Math.cos(a)*s.d,y=h/2+Math.sin(a)*s.d*.6;ctx.beginPath();ctx.arc(x,y,s.s,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,"+(.5+Math.sin(s.o*99)*.5)+")";ctx.fill()});requestAnimationFrame(draw)}draw();</script></body></html>
