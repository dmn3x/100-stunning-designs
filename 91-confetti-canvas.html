<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>91 Confetti Canvas.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let w,h,confetti=[];function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;function spawn(){for(let i=0;i<5;i++)confetti.push({x:Math.random()*w,y:-10,w:8+Math.random()*8,h:4+Math.random()*6,vy:2+Math.random()*4,vx:(Math.random()-.5)*3,rot:Math.random()*360,rv:(Math.random()-.5)*10,hue:Math.random()*360})}setInterval(spawn,200);function draw(){ctx.clearRect(0,0,w,h);confetti=confetti.filter(c=>{c.y+=c.vy;c.x+=c.vx;c.rot+=c.rv;c.vy+=.05;if(c.y>h+20)return 0;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot*Math.PI/180);ctx.fillStyle="hsl("+c.hue+",80%,65%)";ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();return 1});requestAnimationFrame(draw)}draw();</script></body></html>
