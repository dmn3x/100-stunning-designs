<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>87 Password Strength.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f8f9fc;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><div style="width:380px;padding:2rem;color:#1a1a1a"><h2 style="font-weight:700;margin-bottom:1.5rem">Create Password</h2><input type="password" id="pw87" placeholder="Enter password" style="width:100%;padding:1rem;border:2px solid #e0e0e0;border-radius:.75rem;font-size:1rem;outline:none;margin-bottom:1rem" oninput="const v=this.value;const s=Math.min(v.length*10+(/[A-Z]/.test(v)?20:0)+(/[0-9]/.test(v)?20:0)+(/[^A-Za-z0-9]/.test(v)?20:0),100);const b=document.getElementById('st87');b.style.width=s+'%';b.style.background=s<40?'#ef4444':s<70?'#f59e0b':'#22c55e'"><div style="height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin-bottom:.5rem"><div id="st87" style="height:100%;border-radius:3px;transition:all .3s;width:0"></div></div><div style="display:flex;justify-content:space-between;font-size:.8rem;color:#888"><span>Weak</span><span>Strong</span></div></div></body></html>
