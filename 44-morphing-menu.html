<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>44 Morphing Menu.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><button style="width:60px;height:60px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:30px;border:none;cursor:pointer;color:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(102,126,234,.4);transition:all .4s" onclick="const b=this;b.style.width=b.style.width=='60px'?'300px':'60px';b.style.borderRadius=b.style.width=='300px'?'40px':'30px';b.style.justifyContent=b.style.width=='300px'?'space-evenly':'center';document.querySelector('.mi').style.display=b.style.width=='300px'?'none':'block';document.querySelector('.ms').style.display=b.style.width=='300px'?'flex':'none'"><span class="mi">+</span><span class="ms" style="display:none;gap:.5rem"><span>🏠</span><span>🔍</span><span>⚙️</span><span>👤</span></span></button></body></html>
