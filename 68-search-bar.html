<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>68 Search Bar.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f8f9fc;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><div style="max-width:500px;width:100%;padding:2rem"><div style="display:flex;background:#fff;border-radius:3rem;box-shadow:0 4px 24px rgba(0,0,0,.08);overflow:hidden;border:2px solid transparent;transition:border-color .3s" onmouseover="this.style.borderColor='#4f46e5'" onmouseout="this.style.borderColor='transparent'"><span style="padding:1rem 0 1rem 1.5rem;font-size:1.2rem">🔍</span><input placeholder="Search anything..." style="flex:1;padding:1rem;border:none;font-size:1.1rem;outline:none;background:transparent"><button style="padding:1rem 2rem;background:#4f46e5;color:#fff;border:none;font-weight:600;cursor:pointer;border-radius:3rem;margin:.25rem">Search</button></div></div></body></html>
