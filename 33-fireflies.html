<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fireflies</title>
<style>*{margin:0;padding:0}body{background:#0a1628;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
let w,h,F=[];
function R(){w=c.width=innerWidth;h=c.height=innerHeight}R();onresize=R;
for(let i=0;i<80;i++)F.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,g:Math.random()*Math.PI*2,s:.02+Math.random()*.03});
function draw(){
ctx.fillStyle="rgba(10,22,40,.1)";ctx.fillRect(0,0,w,h);
F.forEach(f=>{f.g+=f.s;f.x+=f.vx;f.y+=f.vy;if(f.x<0)f.x=w;if(f.x>w)f.x=0;if(f.y<0)f.y=h;if(f.y>h)f.y=0;
const a=.3+Math.sin(f.g)*.5;const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,30);
g.addColorStop(0,"rgba(255,255,150,"+a+")");g.addColorStop(.3,"rgba(255,200,50,"+(a*.5)+")");g.addColorStop(1,"rgba(255,200,50,0)");
ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,30,0,Math.PI*2);ctx.fill()});
requestAnimationFrame(draw)}draw();
</script></body></html>
