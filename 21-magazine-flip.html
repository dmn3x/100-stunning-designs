<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Magazine</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a1a;font-family:Georgia,serif;display:flex;min-height:100vh}
.spread{display:flex;flex:1}.page{flex:1;padding:4rem;display:flex;flex-direction:column;justify-content:center}
.left{background:#f5f0e8;color:#1a1a1a}.right{background:#fff;color:#1a1a1a}
.mag-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.3em;margin-bottom:3rem;opacity:.5}
.left h1{font-size:clamp(2.5rem,6vw,5rem);font-weight:900;line-height:1;margin-bottom:2rem}
.subtitle{font-size:1.2rem;font-style:italic;opacity:.6}
.right h2{font-size:1.8rem;font-weight:700;margin-bottom:1.5rem;line-height:1.3}
.right p{font-size:1.1rem;line-height:1.9;margin-bottom:1.5rem;opacity:.8}
.pullquote{font-size:1.6rem;font-style:italic;border-left:3px solid #1a1a1a;padding-left:1.5rem;margin:2rem 0}
@media(max-width:768px){.spread{flex-direction:column}}
</style></head>
<body><div class="spread">
<div class="page left"><span class="mag-title">Volume VII · Summer 2026</span><h1>The Art of<br>Slowing Down</h1><p class="subtitle">In a world obsessed with speed, the greatest luxury is stillness.</p></div>
<div class="page right"><h2>Why Patience Matters</h2><p>The great secret that nobody tells you: the best ideas come deeper, not faster.</p><div class="pullquote">"The slower you go, the further you'll get."</div></div>
</div></body></html>
