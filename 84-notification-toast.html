<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>84 Notification Toast.Html</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;}</style></head><body><div style="display:flex;flex-direction:column;gap:1rem;width:380px"><div style="background:#fff;border-radius:1rem;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;box-shadow:0 8px 32px rgba(0,0,0,.1);border-left:4px solid #22c55e"><span style="font-size:1.5rem">✅</span><div style="flex:1"><div style="font-weight:600;margin-bottom:.15rem;color:#1a1a1a">Success</div><div style="color:#888;font-size:.85rem">Changes saved successfully</div></div><button style="background:none;border:none;cursor:pointer;color:#ccc;font-size:1.2rem">✕</button></div><div style="background:#fff;border-radius:1rem;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;box-shadow:0 8px 32px rgba(0,0,0,.1);border-left:4px solid #f59e0b"><span style="font-size:1.5rem">⚠️</span><div style="flex:1"><div style="font-weight:600;margin-bottom:.15rem;color:#1a1a1a">Warning</div><div style="color:#888;font-size:.85rem">Disk space running low</div></div><button style="background:none;border:none;cursor:pointer;color:#ccc;font-size:1.2rem">✕</button></div><div style="background:#fff;border-radius:1rem;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;box-shadow:0 8px 32px rgba(0,0,0,.1);border-left:4px solid #ef4444"><span style="font-size:1.5rem">❌</span><div style="flex:1"><div style="font-weight:600;margin-bottom:.15rem;color:#1a1a1a">Error</div><div style="color:#888;font-size:.85rem">Failed to connect</div></div><button style="background:none;border:none;cursor:pointer;color:#ccc;font-size:1.2rem">✕</button></div><div style="background:#fff;border-radius:1rem;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;box-shadow:0 8px 32px rgba(0,0,0,.1);border-left:4px solid #3b82f6"><span style="font-size:1.5rem">ℹ️</span><div style="flex:1"><div style="font-weight:600;margin-bottom:.15rem;color:#1a1a1a">Info</div><div style="color:#888;font-size:.85rem">New update available</div></div><button style="background:none;border:none;cursor:pointer;color:#ccc;font-size:1.2rem">✕</button></div></div></body></html>
